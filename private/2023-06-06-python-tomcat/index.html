n\u003e\u003cspan class=\"bash\"\u003ePython 설정 추가\u003c/span\u003e \nalias python=\"python3\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-shell\"\u003epip install flask\n\u003cspan class=\"hljs-meta prompt_\"\u003e\n# \u003c/span\u003e\u003cspan class=\"bash\"\u003e기타 필요한 모듈 설치\u003c/span\u003e\npip install requests\npip install bs4\n\u003cspan class=\"hljs-meta prompt_\"\u003e\n# \u003c/span\u003e\u003cspan class=\"bash\"\u003eapp.py  실행!\u003c/span\u003e\npython app.py\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e톰캣 설치 및 실행하기\u003c/h2\u003e\n\u003ch3\u003e🤔 의문의 에러 발생??\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"https://user-images.githubusercontent.com/93169519/223099688-c5eef764-9529-429e-bd6e-e234f496026c.png\" alt=\"image\"\u003e\u003c/p\u003e\n\u003cp\u003e이게 뭔가 싶어 검색해봤지만 별다른 정보도 없었고, \u003ccode\u003ebrew list\u003c/code\u003e 명령어 입력을 해보니 pcre2 는 이미 설치된 상태였기에 원인을 파악할 수가 없었습니다.\n\u003cbr\u003e\n그래서 다시 설치해보니 문제 없이 설치되었다! 😓\u003c/p\u003e\n\u003ch3\u003e톰캣 실행\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-shell\"\u003e\u003cspan class=\"hljs-meta prompt_\"\u003e# \u003c/span\u003e\u003cspan class=\"bash\"\u003e톰캣 설치된 디렉토리로 이동\u003c/span\u003e\ncd /opt/homebrew/Cellar/tomcat/10.1.7/bin/\n\u003cspan class=\"hljs-meta prompt_\"\u003e\n# \u003c/span\u003e\u003cspan class=\"bash\"\u003e실행!\u003c/span\u003e\n./catalina start\n\u003cspan class=\"hljs-meta prompt_\"\u003e\n# \u003c/span\u003e\u003cspan class=\"bash\"\u003e종료!\u003c/span\u003e\n./catalina stop\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003eOpen SSL 설치 및 적용하기\u003c/h2\u003e\n\u003ch3\u003eOpen SSL 설치\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-shell\"\u003egenrsa -des3 -out [키이름] 2048 \ngenrsa -des3 -out private.pem 2048\n\ngenrsa -out [키이름] 2048\ngenrsa -out private.key 2048\n\nrsa -in [개인키] -pubout -out [공개키] rsa -in priavte.key -pubout -out public.key\n\nreq -new -key [키] -out [CSR이름.csr]\nreq -new -key private.key -out private.csr\n\u003cspan class=\"hljs-meta prompt_\"\u003e\n# \u003c/span\u003e\u003cspan class=\"bash\"\u003e안되면\u003c/span\u003e\n\nreq -new -config ./openssl.cnf -key private.key -out private.csr\n\ngenrsa [암호화 알고리즘] -out [키이름] 2048\ngenrsa -aes256 -out rootCA.key 2048\n\nreq -x509 -new -nodes -key rootCA.key -days 3650 -out rootCA.pem\n\u003cspan class=\"hljs-meta prompt_\"\u003e\n# \u003c/span\u003e\u003cspan class=\"bash\"\u003e안되면\u003c/span\u003e\n\nreq -config ./openssl.cnf -x509 -new -nodes -key rootCA.key -days 3650 -out rootCA.pem\n\nx509 -req -in private.csr -CA rootCA.pem -CAkey rootCA.key -CAcreateserial -out private.crt -days 3650\n\n//안되면\nx509 -req -config ./openssl.cnf -in private.csr -CA rootCA.pem -CAkey rootCA.key -CAcreateserial -out private.crt -days 3650\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-xml\"\u003e\u003cspan class=\"hljs-tag\"\u003e\u0026#x3C;\u003cspan class=\"hljs-name\"\u003eConnector\u003c/span\u003e \n          \u003cspan class=\"hljs-attr\"\u003eport\u003c/span\u003e=\u003cspan class=\"hljs-string\"\u003e\"8443\"\u003c/span\u003e \n          \u003cspan class=\"hljs-attr\"\u003eprotocol\u003c/span\u003e=\u003cspan class=\"hljs-string\"\u003e\"org.apache.coyote.http11.Http11NioProtocol\"\u003c/span\u003e\n          \u003cspan class=\"hljs-attr\"\u003emaxThreads\u003c/span\u003e=\u003cspan class=\"hljs-string\"\u003e\"150\"\u003c/span\u003e \n          \u003cspan class=\"hljs-attr\"\u003eSSLEnabled\u003c/span\u003e=\u003cspan class=\"hljs-string\"\u003e\"true\"\u003c/span\u003e \n          \u003cspan class=\"hljs-attr\"\u003escheme\u003c/span\u003e=\u003cspan class=\"hljs-string\"\u003e\"https\"\u003c/span\u003e \n          \u003cspan class=\"hljs-attr\"\u003esecure\u003c/span\u003e=\u003cspan class=\"hljs-string\"\u003e\"true\"\u003c/span\u003e\n          \u003cspan class=\"hljs-attr\"\u003ekeystoreFile\u003c/span\u003e=\u003cspan class=\"hljs-string\"\u003e\"/Users/midas/Downloads/ssl
