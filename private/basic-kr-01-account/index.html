 증권계좌가 뭔가요?\u003c/h2\u003e\n\u003cp\u003e은행 계좌로는 주식을 살 수 없어요. \u003cstrong\u003e증권사\u003c/strong\u003e(키움증권, 삼성증권, 미래에셋, 토스증권 등)에서 별도의 \u003cstrong\u003e증권 위탁계좌\u003c/strong\u003e를 개설해야 합니다.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e계좌 종류\u003c/th\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e위탁계좌\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e일반 주식 매매 (가장 기본)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eCMA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e매매 + 매일 이자 (자금 파킹)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eISA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e비과세 한도 운용 (연 200/400만원)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e연금저축·IRP\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e세액공제 + 노후\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"처음엔 \u003cstrong\u003e위탁계좌\u003c/strong\u003e 하나면 충분하다. 절세는 나중에 ISA를 공부하면 돼.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 비대면 계좌 개설 (5분)\u003c/h2\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"은행 가야 돼요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"아니다. 요즘은 \u003cstrong\u003e앱으로 비대면 개설\u003c/strong\u003e이 된단다. 신분증과 본인 명의 은행계좌만 있으면 돼.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e증권사 앱 설치 (키움 영웅문S#, 삼성 mPOP, 토스증권 등)\u003c/li\u003e\n\u003cli\u003e비대면 계좌개설 메뉴 → 신분증 촬영\u003c/li\u003e\n\u003cli\u003e본인 명의 은행계좌 인증 (1원 송금 확인)\u003c/li\u003e\n\u003cli\u003e거래 비밀번호 설정 → 개설 완료\u003c/li\u003e\n\u003cli\u003e은행 계좌에서 증권계좌로 \u003cstrong\u003e입금(이체)\u003c/strong\u003e 후 매매 시작\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 호가창 읽는 법\u003c/h2\u003e\n\u003cp\u003e계좌를 만들었으면 종목 화면의 \u003cstrong\u003e호가창\u003c/strong\u003e을 볼 줄 알아야 해요.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e       매도호가   잔량\r\n        \u003cspan class=\"hljs-number\"\u003e50\u003c/span\u003e,\u003cspan class=\"hljs-number\"\u003e300\u003c/span\u003e    \u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e,\u003cspan class=\"hljs-number\"\u003e200\u003c/span\u003e   ← 팔겠다는 주문(위로 갈수록 비쌈)\r\n        \u003cspan class=\"hljs-number\"\u003e50\u003c/span\u003e,\u003cspan class=\"hljs-number\"\u003e200\u003c/span\u003e      \u003cspan class=\"hljs-number\"\u003e800\u003c/span\u003e\r\n        \u003cspan class=\"hljs-number\"\u003e50\u003c/span\u003e,\u003cspan class=\"hljs-number\"\u003e100\u003c/span\u003e      \u003cspan class=\"hljs-number\"\u003e500\u003c/span\u003e   ← 최우선 매도호가\r\n      ─────────────────\r\n        \u003cspan class=\"hljs-number\"\u003e50\u003c/span\u003e,\u003cspan class=\"hljs-number\"\u003e000\u003c/span\u003e      \u003cspan class=\"hljs-number\"\u003e600\u003c/span\u003e   ← 최우선 매수호가\r\n        \u003cspan class=\"hljs-number\"\u003e49\u003c/span\u003e,\u003cspan class=\"hljs-number\"\u003e900\u003c/span\u003e    \u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e,\u003cspan class=\"hljs-number\"\u003e100\u003c/span\u003e\r\n        \u003cspan class=\"hljs-number\"\u003e49\u003c/span\u003e,\u003cspan class=\"hljs-number\"\u003e800\u003c/span\u003e    \u003cspan class=\"hljs-number\"\u003e2\u003c/span\u003e,\u003cspan class=\"hljs-number\"\u003e000\u003c/span\u003e   ← 사겠다는 주문(아래로 갈수록 쌈)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그럼 제가 지금 당장 사려면 50,100원에 사지는 거예요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇지! \u003cstrong\u003e시장가로 매수\u003c/strong\u003e하면 가장 싼 매도호가(50,100원)부터 채워진단다. 똑똑하구나.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나 (실전 사이트 가이드)\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메뉴 경로\u003c/th\u003e\n\u003cth\u003e무엇을 확인\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 앱\u003c/strong\u003e (키움/삼성/토스)\u003c/td\u003e\n\u003ctd\u003e계좌개설 메뉴\u003c/td\u003e\n\u003ctd\u003e비대면 개설, 수수료 우대 이벤트\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e금융투자협회\u003c/strong\u003e (kofia.or.kr)\u003c/td\u003e\n\u003ctd\u003e전자공시서비스 \u003e 금융투자회사 수수료 비교\u003c/td\u003e\n\u003ctd\u003e증권사별 매매 수수료율\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권\u003c/strong\u003e (finance.naver.com)\u003c/td\u003e\n\u003ctd\u003e종목 검색 \u003e 종합정보\u003c/td\u003e\n\u003ctd\u003e호가창·차트·뉴스 한눈에\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e💡 증권사마다 \u003cstrong\u003e신규 개설 수수료 평생 우대\u003c/strong\u003e 이벤트를 자주 합니다. 개설 전 비교하세요.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 주식을 사려면 어떤 계좌가 필요한가?\r\n→ 증권사의 \u003cstrong\u003e위탁계좌\u003c/strong\u003e (은행 계좌로는 불가)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 시장가로 매수하면 호가창의 어느 가격부터 체결되나?\r\n→ \u003cstrong\u003e최우선 매도호가\u003c/strong\u003e(가장 싼 매도 주문)부터\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 증권사별 수수료는 어디서 비교하나?\r\n→ \u003cstrong\u003e금융투자협회\u003c/strong\u003e(kofia.or.kr) 수수료 비교\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 에피소드\u003c/strong\u003e: 호두가 드디어 첫 주문을 넣는다. 그런데 \"시장가\"로 샀다가 예상보다 비싸게 체결되는데...?\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 내용은 2026년 상반기 기준입니다. 수수료·세금·제도는 변경될 수 있으니 거래 전 증권사·공식 사이트를 확인하세요.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm t
