ng.png\" alt=\"거사부\"\u003e 🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"허허… 그게 바로 \u003cstrong\u003e시장가의 함정\u003c/strong\u003e이란다. 차근차근 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 지정가 vs 시장가\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e주문\u003c/th\u003e\n\u003cth\u003e동작\u003c/th\u003e\n\u003cth\u003e장점\u003c/th\u003e\n\u003cth\u003e위험\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e지정가\u003c/strong\u003e(Limit)\u003c/td\u003e\n\u003ctd\u003e내가 정한 가격에만 체결\u003c/td\u003e\n\u003ctd\u003e원하는 가격 보장\u003c/td\u003e\n\u003ctd\u003e체결 안 될 수 있음\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e시장가\u003c/strong\u003e(Market)\u003c/td\u003e\n\u003ctd\u003e즉시 현재 호가로 체결\u003c/td\u003e\n\u003ctd\u003e즉시 체결\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e비싸게 살 수 있음(슬리피지)\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"네가 시장가로 주문한 순간, 매도호가 50,100원 → 50,200원 → … 위로 채워가며 체결된 거야. 매도 물량이 적으면 한참 위까지 올라가지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 슬리피지(Slippage)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e슬리피지\u003c/strong\u003e = 예상 체결가와 실제 체결가의 차이.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e거래량 많은 대형주(삼성전자 등): 슬리피지 거의 없음\u003c/li\u003e\n\u003cli\u003e거래량 적은 종목: 시장가 주문 시 크게 손해\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그럼 어떻게 해야 돼요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e지정가\u003c/strong\u003e를 써라. '50,100원에 사겠다'고 지정하면 그 가격 이하에서만 체결된단다. 급하지 않으면 항상 지정가가 안전해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 특수 주문\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e주문\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eIOC\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e즉시 체결 + 남은 잔량 자동 취소\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eFOK\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e전량 즉시 체결 or 전량 취소\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e조건부지정가\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e장중 지정가, 마감 동시호가에 시장가 전환\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 체결 우선순위\u003c/h2\u003e\n\u003cp\u003e같은 종목에 주문이 몰리면 이 순서로 체결돼요:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e① 가격 우선\u003c/strong\u003e (더 좋은 가격) → \u003cstrong\u003e② 시간 우선\u003c/strong\u003e (먼저 낸 주문) → \u003cstrong\u003e③ 수량 우선\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그러니 좋은 가격에 빨리 주문을 넣는 게 유리하지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메뉴 경로\u003c/th\u003e\n\u003cth\u003e무엇을 확인\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 앱\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e주식 주문 화면\u003c/td\u003e\n\u003ctd\u003e지정가/시장가/IOC/FOK 선택\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권\u003c/strong\u003e (finance.naver.com)\u003c/td\u003e\n\u003ctd\u003e종목 \u003e 호가\u003c/td\u003e\n\u003ctd\u003e호가 잔량으로 슬리피지 가늠\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX\u003c/strong\u003e (krx.co.kr)\u003c/td\u003e\n\u003ctd\u003e시장정보 \u003e 거래 안내\u003c/td\u003e\n\u003ctd\u003e호가 단위·체결 규칙\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e💡 \u003cstrong\u003e호가 단위\u003c/strong\u003e는 가격대별로 다릅니다. 예: 5만원대 주식은 50원 단위, 1만원대는 10원 단위.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 원하는 가격을 보장하려면 어떤 주문?\r\n→ \u003cstrong\u003e지정가\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 거래량 적은 종목에 시장가 주문 시 위험은?\r\n→ \u003cstrong\u003e슬리피지\u003c/strong\u003e(예상보다 비싸게 체결)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 체결 우선순위 1순위는?\r\n→ \u003cstrong\u003e가격 우선\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 에피소드\u003c/strong\u003e: 호두가 첫 수익을 봤다! 그런데 막상 팔고 나니 생각보다 손에 쥔 돈이 적은데... 세금과 거래시간 이야기.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 2026년 상반기 기준. 거래 규칙·호가 단위는 변경될 수 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-06-09\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🇰🇷 [국장 기초 2] 호두의 첫 주문 — 시장가의 함정\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0
