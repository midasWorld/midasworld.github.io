003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"한국 주식은 \u003cstrong\u003e팔 때만\u003c/strong\u003e 거래세를 낸다. 살 때는 안 내.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e시장\u003c/th\u003e\n\u003cth\u003e거래세 (2026년 기준)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKOSPI\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e거래세 0.05% + 농특세 0.15% = \u003cstrong\u003e0.20%\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKOSDAQ\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e0.20% (농특세 없음)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📌 2026년부터 금융투자소득세 폐지에 맞춰 거래세가 2023년 수준으로 환원·인상됐다(KOSPI·KOSDAQ 모두 0.20%). 2024년의 0.18%보다 올랐으니 옛 수치와 헷갈리지 말 것.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e예: 5만 5천원에 1주 매도(KOSPI) → 약 55,000 × 0.0020 = \u003cstrong\u003e110원\u003c/strong\u003e 세금.\u003c/p\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"헉, 작아 보여도 자주 사고팔면 쌓이겠네요.\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇지. 그래서 잦은 매매(단타)는 세금·수수료가 수익을 갉아먹는단다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 매매차익은 비과세 (개인 일반 투자자)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"다행히 \u003cstrong\u003e개인 일반 투자자의 상장주식 매매차익은 비과세\u003c/strong\u003e다. 미국과 큰 차이지.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ 단, \u003cstrong\u003e대주주\u003c/strong\u003e(종목당 50억원 이상 등)는 양도세 22~33%. 일반 개미는 해당 없음. (제도는 변동 가능)\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 배당소득세\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"배당을 받으면 **15.4%**를 원천징수한단다 (소득세 14% + 지방세 1.4%).\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e연간 금융소득(이자+배당)이 \u003cstrong\u003e2,000만원 초과\u003c/strong\u003e하면 종합과세 대상\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 거래시간 — 정규장 + 시간외(장외) 거래\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"국장은 정규장만 있는 게 아니다. **장 시작 전·후에도 거래되는 '시간외 거래'**가 있어. 밤에 미장이 호재로 끝났을 때 다음날 시초가 전에 미리 사고팔 수도 있지.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e구분\u003c/th\u003e\n\u003cth\u003e시간\u003c/th\u003e\n\u003cth\u003e체결 방식\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e장전 동시호가\u003c/td\u003e\n\u003ctd\u003e08:30 ~ 09:00\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e시가(시작가) 결정\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e장전 시간외 종가\u003c/td\u003e\n\u003ctd\u003e08:30 ~ 08:40\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e전일 종가\u003c/strong\u003e로 거래\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e정규장\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e09:00 ~ 15:30\u003c/td\u003e\n\u003ctd\u003e실시간 매매 (점심시간 없음)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e장 마감 동시호가\u003c/td\u003e\n\u003ctd\u003e15:20 ~ 15:30\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e종가 결정\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e장후 시간외 종가\u003c/td\u003e\n\u003ctd\u003e15:40 ~ 16:00\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e당일 종가\u003c/strong\u003e로 거래\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e시간외 단일가\u003c/td\u003e\n\u003ctd\u003e16:00 ~ 18:00\u003c/td\u003e\n\u003ctd\u003e10분 단위 체결, \u003cstrong\u003e당일 종가 ±10%\u003c/strong\u003e(상·하한가 내)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"오, 그럼 밤에 호재 떠도 시간외로 살 수 있네요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"가능은 하다. 단 \u003cstrong\u003e세 가지 주의\u003c/strong\u003e가 있어.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e거래량이 적어\u003c/strong\u003e 원하는 가격·수량에 체결이 안 될 수 있다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e시간외 종가 매매\u003c/strong\u003e는 말 그대로 '종가 고정' — 가격은 안 변하고 \u003cstrong\u003e수량만\u003c/strong\u003e 거래된다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e시간외 단일가\u003c/strong\u003e는 당일 종가 **±10%**까지만 움직여. 미국 프리/애프터마켓(가격제한 없음)과는 성격이 완전히 달라.\"\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"미장이랑 헷갈리지 마! 미장 장외(프리·애프터)는 \u003cstrong\u003e가격 제한이 없어서\u003c/strong\u003e 실적 발표에 ±20%씩 튀어. 국장 시간외는 \u003cstrong\u003e±10% 안에서 얌전한\u003c/strong\u003e 편이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 배당락 — 공짜 점심은 없다\u003c/h2\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"배당 받으려면 아무 때나 사면 돼요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"아니다. \u003cstrong\u003e배당기준일\u003c/strong\u003e까지 보유해야 배당을 받아. 그리고 \u003cstrong\u003e배당락일\u003c/strong\u003e엔 배당금만큼 주가가 빠진단다. 공짜 점심은 없어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메뉴 경로\u003c/th\u003e\n\u003cth\u003e무엇을 확인\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권\u003c/strong\u003e (finance.naver.com)\u003c/td\u003e\n\u003ctd\u003e종목 \u003e 종목분석 \u003e 배당\u003c/td\u003e\n\u003ctd\u003e배당기준일·배당수익률\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX\u003c/strong\u003e (krx.co.kr)\u003c/td\u003e\n\u003ctd\u003e시장정보 \u003e 통계\u003c/td\u003e\n\u003ctd\u003e거래세율·거래시간 공식 안내\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e홈택스\u003c/strong\u003e (hometax.go.kr)\u003c/td\u003e\n\u003ctd\u003e금융소득 조회\u003c/td\u003e\n\u003ctd\u003e연간 배당소득 합계(종합과세 판단)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 앱\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e거래내역 \u003e 세금/수수료\u003c/td\u003e\n\u003ctd\u003e실제 차감 내역 확인\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 거래세는 언제 부과되나?\r\n→ \u003cstrong\u003e매도 시만\u003c/strong\u003e (2026년 기준 KOSPI·KOSDAQ 모두 0.20%. KOSPI는 거래세 0.05%+농특세 0.15%)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 개인 일반 투자자의 상장주식 매매차익은?\r\n→ \u003cstrong\u003e비과세\u003c/strong\u003e (대주주 제외)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 배당 원천징수 세율은?\r\n→ \u003cstrong\u003e15.4%\u003c/strong\u003e, 연 2,000만원 초과 시 종합과세\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ4.\u003c/strong\u003e 국장 시간외 단일가의 가격 변동 범위는?\r\n→ 당일 종가 \u003cstrong\u003e±10%\u003c/strong\u003e 이내 (16:00~18:00, 10분 단위). 미장 장외와 달리 가격제한이 있음.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 에피소드\u003c/strong\u003e: 호두가 \"그럼 좋은 종목은 어디서 찾아요?\"라고 묻는다. 거사부가 DART와 네이버 증권 화면을 펼친다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 2026년 상반기 기준. 세율·과세 제도는 매년 개정될 수 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-06-08\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🇰🇷 [국장 기초 3] 호두가 몰랐던 세금과 시간\"}]]}],[\"$\",\"article\",nu
