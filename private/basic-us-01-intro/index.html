chr\u003e\n\u003ch2\u003e1. 미장이 국장과 다른 점 (한눈에)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e항목\u003c/th\u003e\n\u003cth\u003e🇰🇷 국장\u003c/th\u003e\n\u003cth\u003e🇺🇸 미장\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e매매차익 세금\u003c/td\u003e\n\u003ctd\u003e비과세(일반)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e양도세 22%\u003c/strong\u003e (250만원 공제)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e거래 통화\u003c/td\u003e\n\u003ctd\u003e원화\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e달러 (환전 필요)\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e거래시간(한국시각)\u003c/td\u003e\n\u003ctd\u003e09:00~15:30\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e밤 11:30~익일 06:00\u003c/strong\u003e (서머타임 시 10:30~05:00)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e가격제한폭\u003c/td\u003e\n\u003ctd\u003e±30%\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e없음\u003c/strong\u003e (하루 +50%도 가능)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e상한가/하한가\u003c/td\u003e\n\u003ctd\u003e있음\u003c/td\u003e\n\u003ctd\u003e없음 (서킷브레이커만)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"특히 \u003cstrong\u003e세금\u003c/strong\u003e이랑 \u003cstrong\u003e환율\u003c/strong\u003e! 이거 모르고 들어오면 수익 나도 손에 쥐는 게 줄어든다고.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 미국 주식 계좌 + 환전\u003c/h2\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"새 계좌를 또 만들어야 돼요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"대부분 증권사는 \u003cstrong\u003e기존 계좌에서 해외주식 거래 신청\u003c/strong\u003e만 하면 돼. 그리고 \u003cstrong\u003e환전\u003c/strong\u003e이 필요하지.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e증권사 앱 → 해외주식 거래 신청 (약관 동의)\u003c/li\u003e\n\u003cli\u003e원화를 \u003cstrong\u003e달러로 환전\u003c/strong\u003e (또는 '원화주문 서비스'로 자동 환전)\u003c/li\u003e\n\u003cli\u003e종목 검색은 **티커(Ticker)**로: 애플=AAPL, 엔비디아=NVDA, 테슬라=TSLA\u003c/li\u003e\n\u003cli\u003e매수/매도 (지정가·시장가 동일 개념)\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"환전 수수료도 비용이야. 증권사마다 \u003cstrong\u003e환율 우대\u003c/strong\u003e가 다르니 체크해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 어느 거래소?\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e거래소\u003c/th\u003e\n\u003cth\u003e특징\u003c/th\u003e\n\u003cth\u003e대표 종목\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNYSE\u003c/strong\u003e (뉴욕증권거래소)\u003c/td\u003e\n\u003ctd\u003e전통 대형주\u003c/td\u003e\n\u003ctd\u003e코카콜라(KO), JP모건(JPM)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNASDAQ\u003c/strong\u003e (나스닥)\u003c/td\u003e\n\u003ctd\u003e기술주 중심\u003c/td\u003e\n\u003ctd\u003e애플(AAPL), 마이크로소프트(MSFT)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 환율 = 숨은 변수\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"미장에선 \u003cstrong\u003e주가 + 환율\u003c/strong\u003e 둘 다 손익에 영향을 줘.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e주가 +10% \u0026#x26; 원/달러 환율 +5% → 원화 환산 수익 약 +15%\u003c/li\u003e\n\u003cli\u003e주가 +10% \u0026#x26; 환율 −5% → 원화 환산 수익 약 +5%\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"헉, 주가가 올라도 환율 떨어지면 손해 볼 수도 있네요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"Exactly. 그래서 미장은 환율 흐름도 같이 봐야 해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 시작하나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트/앱\u003c/th\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e경로\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 앱\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e해외주식 신청·환전·매매\u003c/td\u003e\n\u003ctd\u003e해외주식 \u003e 거래신청 / 환전\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eYahoo Finance\u003c/strong\u003e (finance.yahoo.com)\u003c/td\u003e\n\u003ctd\u003e티커 검색·시세·차트\u003c/td\u003e\n\u003ctd\u003e티커 입력 (예: AAPL)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eInvesting.com\u003c/strong\u003e (kr.investing.com)\u003c/td\u003e\n\u003ctd\u003e환율·지수·경제지표\u003c/td\u003e\n\u003ctd\u003e통화 \u003e USD/KRW\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 미국 주식 매매차익 세금은?\r\n→ \u003cstrong\u003e양도세 22%\u003c/strong\u003e (연 250만원 공제, 국장과 정반대)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 애플의 티커는?\r\n→ \u003cstrong\u003eAAPL\u003c/strong\u003e (종목명이 아닌 티커로 검색)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 미장에서 주가 외에 손익에 영향을 주는 변수는?\r\n→ \u003cstrong\u003e환율\u003c/strong\u003e(원/달러)\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 에피소드\u003c/strong\u003e: 잭이글이 \"미장은 밤에 열린다\"며 거래시간과 프리/애프터마켓을 설명한다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 2026년 상반기 기준. 세율·환전 제도는 변경될 수 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"classN
