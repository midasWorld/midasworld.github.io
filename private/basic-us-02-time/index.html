국 시각)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e기간\u003c/th\u003e\n\u003cth\u003e미국 동부시각\u003c/th\u003e\n\u003cth\u003e한국 시각\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e서머타임\u003c/strong\u003e (3~11월)\u003c/td\u003e\n\u003ctd\u003e09:30~16:00 ET\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e밤 10:30 ~ 익일 05:00\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e표준시\u003c/strong\u003e (11~3월)\u003c/td\u003e\n\u003ctd\u003e09:30~16:00 ET\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e밤 11:30 ~ 익일 06:00\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"\u003cstrong\u003e서머타임\u003c/strong\u003e(Daylight Saving) 때문에 1시간씩 당겨져. 3월·11월에 바뀌니 헷갈리지 마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 프리마켓 / 애프터마켓\u003c/h2\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"정규장 전후에도 거래되던데요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"맞아. **프리마켓(장전)**과 **애프터마켓(장후)**이 있어. 실적 발표가 보통 이때 나와서 주가가 크게 움직여.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e구분\u003c/th\u003e\n\u003cth\u003e미국 동부시각\u003c/th\u003e\n\u003cth\u003e특징\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e프리마켓\u003c/td\u003e\n\u003ctd\u003e04:00~09:30 ET\u003c/td\u003e\n\u003ctd\u003e실적·뉴스 선반영, 변동성 큼\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e정규장\u003c/td\u003e\n\u003ctd\u003e09:30~16:00 ET\u003c/td\u003e\n\u003ctd\u003e유동성 가장 풍부\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e애프터마켓\u003c/td\u003e\n\u003ctd\u003e16:00~20:00 ET\u003c/td\u003e\n\u003ctd\u003e실적 발표 직후 급변\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ 프리/애프터마켓은 거래량이 적어 \u003cstrong\u003e호가 스프레드가 크고 슬리피지 위험\u003c/strong\u003e이 높아요.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 가격제한폭이 없다\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"국장은 ±30% 상한가/하한가가 있지? \u003cstrong\u003e미장은 그게 없어.\u003c/strong\u003e 하루에 +50%도, -40%도 가능해.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e폭락 방지 장치: \u003cstrong\u003e서킷브레이커\u003c/strong\u003e(시장 전체 7%/13%/20% 급락 시 일시 정지)\u003c/li\u003e\n\u003cli\u003e개별 종목: \u003cstrong\u003eLULD\u003c/strong\u003e(변동성 완화, 거래 일시정지)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"와… 그럼 더 무섭네요. 한 방에 훅 갈 수도 있고.\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"그래서 미장은 \u003cstrong\u003e분산투자\u003c/strong\u003e랑 \u003cstrong\u003e손절 원칙\u003c/strong\u003e이 더 중요해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 티커(Ticker)로 거래\u003c/h2\u003e\n\u003cp\u003e미국은 종목을 \u003cstrong\u003e티커 심볼\u003c/strong\u003e로 식별해요.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e회사\u003c/th\u003e\n\u003cth\u003e티커\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e애플\u003c/td\u003e\n\u003ctd\u003eAAPL\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e마이크로소프트\u003c/td\u003e\n\u003ctd\u003eMSFT\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e엔비디아\u003c/td\u003e\n\u003ctd\u003eNVDA\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e테슬라\u003c/td\u003e\n\u003ctd\u003eTSLA\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eS\u0026#x26;P500 ETF\u003c/td\u003e\n\u003ctd\u003eSPY / VOO\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e나스닥100 ETF\u003c/td\u003e\n\u003ctd\u003eQQQ\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e경로\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eYahoo Finance\u003c/strong\u003e (finance.yahoo.com)\u003c/td\u003e\n\u003ctd\u003e거래시간·시세·실적일\u003c/td\u003e\n\u003ctd\u003e티커 \u003e Summary\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eInvesting.com\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e경제 캘린더(실적·지표 일정)\u003c/td\u003e\n\u003ctd\u003eTools \u003e Economic Calendar\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 앱\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e프리/애프터마켓 거래 설정\u003c/td\u003e\n\u003ctd\u003e해외주식 주문 설정\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e💡 미국 기업 **실적 발표일(Earnings Date)**은 Yahoo Finance 종목 페이지에서 확인. 실적 전후 변동성 주의.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 미국 정규장은 한국 시각으로 언제? (서머타임)\r\n→ \u003cstrong\u003e밤 10:30 ~ 익일 05:00\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 실적 발표가 자주 나오는 시간대는?\r\n→ \u003cstrong\u003e프리마켓/애프터마켓\u003c/strong\u003e (변동성 큼)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 미장에 상한가/하한가가 있나?\r\n→ \u003cstrong\u003e없음\u003c/strong\u003e (서킷브레이커·LULD만)\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 에피소드\u003c/strong\u003e: 잭이글이 가장 강조하는 것 — 세금. \"양도세 22% 모르고 들어오면 큰일난다!\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 2026년 상반기 기준. 서머타임 적용일은 매년 다릅니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hov
