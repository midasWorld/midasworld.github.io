1. SEC EDGAR — 미국 공식 공시 ⭐\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003esec.gov/edgar\u003c/strong\u003e — 미국 증권거래위원회(SEC) 공시 시스템. \u003cstrong\u003e무료\u003c/strong\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e보고서\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003cth\u003e국장 대응\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10-K\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e연간 사업보고서\u003c/td\u003e\n\u003ctd\u003e사업보고서\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10-Q\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e분기 보고서\u003c/td\u003e\n\u003ctd\u003e분기보고서\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e8-K\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e주요 사건 (수시)\u003c/td\u003e\n\u003ctd\u003e수시공시\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eDEF 14A\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e주주총회·임원 보수\u003c/td\u003e\n\u003ctd\u003e주총 소집\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"10-K의 **Risk Factors(위험요인)**랑 **MD\u0026#x26;A(경영진 분석)**만 읽어도 회사가 보여. 영어 어려우면 번역기 돌려.\"\u003c/p\u003e\n\u003cp\u003e경로: EDGAR \u003e Search \u003e 회사명/티커 입력 \u003e Filings \u003e 10-K 선택\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. Yahoo Finance — 빠른 종합 정보\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003efinance.yahoo.com\u003c/strong\u003e — 시세·차트·재무·실적일 한눈에. (국장 네이버증권 격)\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e무엇을 보나\u003c/th\u003e\n\u003cth\u003e탭\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e시세·차트\u003c/td\u003e\n\u003ctd\u003eSummary / Chart\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePER·시총·배당\u003c/td\u003e\n\u003ctd\u003eStatistics\u003c/td\u
