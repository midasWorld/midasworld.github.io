003e〔\u003c/code\u003e 로 검색해서 남은 것이 없는지 확인\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e요약\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e운영 중인 커머스·결제 시스템을 멈추지 않고 바꿔 온 5년 5개월차 서버 개발자입니다.\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e운영 중 시스템의 무중단 교체\u003c/strong\u003e\n외부 파트너가 호출하는 공개 API를 PHP에서 Kotlin/Spring으로 전환했습니다. 트래픽을 10%에서 100%까지 단계적으로 넘기다 오류를 감지해 0%로 되돌렸고, 원인을 수정한 뒤 전환을 끝냈습니다. 주요 API 응답시간은 \u003cstrong\u003e30% 단축\u003c/strong\u003e했습니다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e금액·정합성이 걸린 장애 해결\u003c/strong\u003e\n쿠폰 중복 사용(동시성) 문제와 배치·컨슈머 사이의 DB 데드락을 해결했습니다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e토스플레이스 사업 영역과 이어지는 도메인 경험\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e결제 : PG 앱 스킴, 네이버페이 주문형 SDK\u003c/li\u003e\n\u003cli\u003eCRM : 쿠폰, 마일리지\u003c/li\u003e\n\u003cli\u003eB2B : 파트너 공개 API, 크리마 연동\u003c/li\u003e\n\u003cli\u003e오프라인 : 제조 현장 키오스크 개발·운영\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e공고 요구사항\u003c/th\u003e\n\u003cth\u003e관련 사례\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e고가용성 시스템 운영 · 단계적 마이그레이션\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"#1-%EA%B3%B5%EA%B0%9C-api-%EB%AC%B4%EC%A4%91%EB%8B%A8-%EC%A0%84%ED%99%98--php--kotlin-spring\"\u003e1. 공개 API 무중단 전환\u003c/a\u003e, \u003ca href=\"#5-php-70--82-%EB%B2%84%EC%A0%84%EC%97%85--%EC%95%94%ED%98%B8%ED%99%94-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%A0%84%ED%99%98\"\u003e5. PHP 8.2 버전업\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e장애 경험과 문제 해결\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"#%ED%8A%B8%EB%9F%AC%EB%B8%94%EC%8A%88%ED%8C%85--%EC%A0%84%ED%99%98-%EC%A4%91-api-%EC%98%A4%EB%A5%98%EC%99%80-%EB%A1%A4%EB%B0%B1\"\u003e1. 전환 중 롤백\u003c/a\u003e, \u003ca href=\"#2-%EC%BF%A0%ED%8F%B0-%EC%A4%91%EB%B3%B5-%EC%82%AC%EC%9A%A9-%EB%8F%99%EC%8B%9C%EC%84%B1-%EC%9D%B4%EC%8A%88-%ED%95%B4%EA%B2%B0\"\u003e2. 쿠폰 동시성\u003c/a\u003e, \u003ca href=\"#3-%EB%B0%B0%EC%B9%98-cron--airflow-%EC%A0%84%ED%99%98--%EC%BB%A8%EC%8A%88%EB%A8%B8-%EB%8D%B0%EB%93%9C%EB%9D%BD-%ED%95%B4%EC%86%8C\"\u003e3. 데드락\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOOP · DDD\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"#1-%EA%B3%B5%EA%B0%9C-api-%EB%AC%B4%EC%A4%91%EB%8B%A8-%EC%A0%84%ED%99%98--php--kotlin-spring\"\u003e1. 도메인 단위 재구성\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCRM · B2B 연동\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"#2-%EC%BF%A0%ED%8F%B0-%EC%A4%91%EB%B3%B5-%EC%82%AC%EC%9A%A9-%EB%8F%99%EC%8B%9C%EC%84%B1-%EC%9D%B4%EC%8A%88-%ED%95%B4%EA%B2%B0\"\u003e2. 쿠폰\u003c/a\u003e, \u003ca href=\"#4-%ED%8C%8C%ED%8A%B8%EB%84%88-api-%ED%98%B8%EC%B6%9C%EB%9F%89-%EC%A0%9C%ED%95%9C%EB%B2%84%EC%A0%80%EB%8B%9D%EA%B5%AC%EB%B2%84%EC%A0%84-%EC%A2%85%EB%A3%8C\"\u003e4. 파트너 API 운영\u003c/a\u003e, \u003ca href=\"#%EA%B7%B8-%EC%99%B8-%EC%A3%BC%EC%9A%94-%EC%97%85%EB%AC%B4\"\u003e그 외 주요 업무\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePOS \u0026#x26; KIOSK\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"#%EC%9C%84%EC%A0%80%EB%93%9C%EC%A0%95%EB%B3%B4%EC%8B%9C%EC%8A%A4%ED%85%9C--20190820220420%EB%85%84-8%EA%B0%9C%EC%9B%94\"\u003e위저드정보시스템 · 현장 키오스크\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e경력\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e회사\u003c/th\u003e\n\u003cth\u003e기간\u003c/th\u003e\n\u003cth\u003e직위 · 역할\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNHN커머스\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e2023.07 ~ 2026.04 (2년 9개월)\u003c/td\u003e\n\u003ctd\u003e대리 · 고도몰 중개서버(API · Consumer · Airflow) 및 솔루션 개발/운영\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e위저드정보시스템\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e2019.08 ~ 2022.04 (2년 8개월)\u003c/td\u003e\n\u003ctd\u003e대리 · 제조업 MES/WMS 개발/운영\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch1\u003eNHN커머스 · 2023.07 ~ 2026.04\u003c/h1\u003e\n\u003cp\u003e고도몰(NHN커머스의 쇼핑몰 솔루션, 상점 〔N〕개)과 외부 파트너 앱·서비스를 잇는 \u003cstrong\u003e중개서버\u003c/strong\u003e(API · 메시지 컨슈머 · 배치)를 개발하고 운영했습니다.\u003c/p\u003e\n\u003ch2\u003e1. 공개 API 무중단 전환 : PHP → Kotlin, Spring\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003e〔기간〕\u003c/code\u003e · \u003ccode\u003e역할 : 〔주도 / 참여, 팀 N명〕\u003c/code\u003e\n\u003ccode\u003eKotlin\u003c/code\u003e \u003ccode\u003eSpring Boot\u003c/code\u003e \u003ccode\u003e〔JPA 등 데이터 접근 기술〕\u003c/code\u003e \u003ccode\u003eMySQL\u003c/code\u003e \u003ccode\u003e〔캐시 저장소〕\u003c/code\u003e \u003ccode\u003eKotest\u003c/code\u003e \u003ccode\u003eTestcontainers\u003c/code\u003e \u003ccode\u003eSpring REST Docs\u003c/code\u003e \u003ccode\u003eSwagger\u003c/code\u003e \u003ccode\u003eGSLB\u003c/code\u003e \u003ccode\u003eOpenSearch\u003c/code\u003e\u003c/p\u003e\n\u003ch3\u003e해결한 문제\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e외부 파트너 앱이 상점의 상품·게시판 데이터를 다루는 \u003cstrong\u003e공개 Open-API가 PHP 레거시\u003c/strong\u003e였습니다.\u003c/li\u003e\n\u003cli\u003e운영하는 동안 같은 종류의 결함이 반복됐습니다.\n\u003cul\u003e\n\u003cli\u003e주문 조회 API의 스펙 누락, 응답 누락, 오류\u003c/li\u003e\n\u003cli\u003e상품 등록 시 입력값 검증 누락\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e연관 데이터를 반복해서 조회하는 \u003cstrong\u003eN+1 쿼리 구조\u003c/strong\u003e 때문에 응답이 느렸습니다.\u003c/li\u003e\n\u003cli\u003e코드가 중복되고 계층 간 책임이 모호해서, 기능을 하나 추가해도 고칠 곳이 많았습니다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e중요성과 제약\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e파트너가 \u003cstrong\u003e운영 중에 호출하는 API\u003c/strong\u003e라서, 서비스가 멈추거나 응답 형식이 바뀌면 곧바로 파트너 서비스 장애로 이어집니다.\u003c/li\u003e\n\u003cli\u003e규모 : 연동 앱 〔N〕개, 일 호출량 〔N〕건\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e의사결정\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e결정\u003c/th\u003e\n\u003cth\u003e이유\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eN+1 쿼리 → 단일 쿼리로 통합\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e캐시만 추가하면 캐시가 비었을 때 여전히 N번 조회하므로, 쿼리 구조 자체를 고침 〔확인〕\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e호출이 많고 연산 비용이 큰 조회에만 캐싱\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e〔캐시 대상 · TTL · 데이터 변경 시 캐시 처리 방식〕\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eDDD 기반 도메인 단위 재구성\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e코드 중복과 계층 간 책임 모호성을 해소하고, 변경 범위를 도메인 안으로 좁힘\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eREST Docs + Swagger로 문서화\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eREST Docs는 테스트를 통과해야 문서가 생성되므로 외부 공개 문서와 실제 구현이 어긋나지 않음 〔확인〕\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKotest + Testcontainers로 테스트\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e운영과 같은 MySQL 엔진에서 쿼리 결과를 검증 〔확인〕\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e단계적 트래픽 전환\u003c/strong\u003e (DevOps팀이 구축한 GSLB 활용)\u003c/td\u003e\n\u003ctd\u003e신·구 서버가 같은 DB를 쓰는 상태에서 트래픽을 **10% → 30% → 50% → 70% → 100%**로 넘기고, 문제가 생기면 되돌릴 수 있게 함\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e수행 내용\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e기존 상품·게시판 댓글 API 전환, 신규 v2 API 개발(상품 혜택 조회, 게시글 댓글·답글)\u003c/li\u003e\n\u003cli\u003eDevOps 파트와 협업해 CI/CD 파이프라인 구축, 중개서버 \u003cstrong\u003e빌드 캐싱\u003c/strong\u003e으로 배포 시간 단축\u003c/li\u003e\n\u003cli\u003e전환 검증 : 테스트 코드 작성, QA를 통해 \u003cstrong\u003e신·구 API에 실제 요청을 보내 응답 비교\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e전환 진행 판단 : 단계마다 \u003cstrong\u003e에러율과 파트너 문의를 모니터링\u003c/strong\u003e하며 다음 단계 진행 여부 결정\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e트러블슈팅 — 전환 중 API 오류와 롤백\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e상황\u003c/strong\u003e : 트래픽 〔N〕% 단계에서 새 서버의 〔API명〕에서 〔오류 내용〕 발생\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e감지\u003c/strong\u003e : 〔에러율 / 파트너 문의 / OpenSearch 로그〕\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e대응\u003c/strong\u003e : 가중치를 \u003cstrong\u003e0%로 되돌려\u003c/strong\u003e 모든 트래픽을 기존 서버로 복귀시킴\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e원인과 수정\u003c/strong\u003e : 〔원인〕 → 〔수정 내용〕\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e재전환\u003c/strong\u003e : 〔재발 방지 조치〕 후 다시 단계적으로 올려 100% 전환 완료\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e결과\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003eBefore\u003c/th\u003e\n\u003cth\u003eAfter\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e주요 API 응답시간 (OpenSearch 로그, 〔평균 / p95〕)\u003c/td\u003e\n\u003ctd\u003e〔N〕ms\u003c/td\u003e\n\u003ctd\u003e〔M〕ms (\u003cstrong\u003e-30%\u003c/strong\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e요청당 DB 조회 횟수\u003c/td\u003e\n\u003ctd\u003e〔N〕회\u003c/td\u003e\n\u003ctd\u003e〔M〕회\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e배포 소요 시간\u003c/td\u003e\n\u003ctd\u003e〔N〕분\u003c/td\u003e\n\u003ctd\u003e〔M〕분\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e전환 중 롤백\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e1회 (오류 감지 → 0% 복귀 → 수정 후 전환 완료)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e기능을 추가할 때 수정 범위가 좁아져 개발 공수가 줄었음 (〔가능하면 수치 : 신규 API 개발 기간 N일 → M일〕)\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 쿠폰 중복 사용 동시성 이슈 해결\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003e〔기간〕\u003c/code\u003e · \u003ccode\u003e역할 : 〔주도 / 참여〕\u003c/code\u003e · \u003ccode\u003ePHP\u003c/code\u003e \u003ccode\u003eMySQL\u003c/code\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003e해결 방식이 기억나지 않으면 이 항목은 \"그 외 주요 업무\"로 내리고 한 줄만 남기세요.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3\u003e해결한 문제\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e1회만 쓸 수 있는 쿠폰이 \u003cstrong\u003e동시에 들어온 요청으로 중복 사용\u003c/strong\u003e되었습니다.\n\u003cul\u003e\n\u003cli\u003e발생 상황 : 〔더블클릭 / 여러 탭 / 앱·웹 동시 주문 등〕\u003c/li\u003e\n\u003cli\u003e발생 규모 : 〔N건〕\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e중요성\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e할인 금액은 곧 상점의 손실로 이어지는 \u003cstrong\u003e금액 관련 결함\u003c/strong\u003e입니다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e원인\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e〔원인 : 예) \"쿠폰 사용 가능 여부 조회\"와 \"사용 처리\" 사이에 틈이 있어, 두 요청이 모두 '미사용' 상태를 읽고 둘 다 사용 처리함〕\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e의사결정\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e검토한 방식 : 〔실제로 검토한 것만 : 비관적 락(SELECT … FOR UPDATE) / 조건부 UPDATE + 영향받은 행 수 확인 / Redis 분산 락 / 유니크 제약 등〕\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e선택\u003c/strong\u003e : 〔선택한 방식〕\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e이유\u003c/strong\u003e : 〔선택 이유〕\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e결과\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e적용 후 중복 사용 〔0건〕\u003c/li\u003e\n\u003cli\u003e〔검증 방법 : 동시 요청 재현 테스트 등〕\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 배치 cron → Airflow 전환 \u0026#x26; 컨슈머 데드락 해소\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003e〔2025.01 ~ 2025.07〕 〔확인 : 원본 history.md에는 2026년으로 적혀 있음〕\u003c/code\u003e · \u003ccode\u003e역할 : 〔주도 / 참여〕\u003c/code\u003e · \u003ccode\u003ePython\u003c/code\u003e \u003ccode\u003eAirflow\u003c/code\u003e \u003ccode\u003eMySQL\u003c/code\u003e\u003c/p\u003e\n\u003ch3\u003e해결한 문제\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ecron + PHP로 돌던 스케줄러 5종을 Airflow로 전환했습니다.\n\u003cul\u003e\n\u003cli\u003e대상 : 상품 통계 분석, 상품 페이지뷰 분석, 크리마 리뷰 동기화, 크리마 장바구니, 크리마 플러스 리뷰\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e기존 운영 로그를 분석해 \u003cstrong\u003e병목 구간과 반복되는 실패 패턴\u003c/strong\u003e을 찾았습니다.\n\u003cul\u003e\n\u003cli\u003e기능을 그대로 옮기지 않고, 이 구조 문제를 함께 해결하도록 처리 흐름을 개선했습니다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e상품 페이지뷰 분석 스케줄러의 처리 흐름을 바꿔, \u003cstrong\u003e고도몰 컨슈머가 처리하던 토픽에서 발생하던 DB 데드락\u003c/strong\u003e을 해소했습니다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e의사결정\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAirflow를 선택한 이유\u003c/strong\u003e : 〔예 : 재시도 · 실행 이력 확인 · 실패한 태스크만 재실행 등 실제로 필요했던 이유〕\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e외부 연동\u003c/strong\u003e : 크리마 API 스펙과 변경 이력을 검토하고, 문서만으로 불명확한 부분은 \u003cstrong\u003e제휴사와 직접 확인\u003c/strong\u003e해 동기화 로직을 확정했습니다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e트러블슈팅 — 컨슈머 데드락\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003e직접 원인을 분석하지 않았다면 아래 세부 내용은 지우고, 위 \"해결한 문제\"의 한 줄만 남기세요.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e증상\u003c/strong\u003e : 〔에러 로그 / 발생 빈도〕\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e원인\u003c/strong\u003e : 〔어떤 작업들이 어떤 테이블의 행을 어떤 순서로 잠갔는지〕\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e해결\u003c/strong\u003e : 〔락 순서 통일 / 작업 단위 분할 / 쓰기 주체 분리 / 실행 시간대 분리 등 실제 조치〕\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e결과\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003eBefore\u003c/th\u003e\n\u003cth\u003eAfter\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e컨슈머 데드락\u003c/td\u003e\n\u003ctd\u003e〔주 N회〕\u003c/td\u003e\n\u003ctd\u003e〔0회〕\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e배치 실패율 또는 수동 재실행 횟수\u003c/td\u003e\n\u003ctd\u003e〔N〕\u003c/td\u003e\n\u003ctd\u003e〔M〕\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e처리 시간\u003c/td\u003e\n\u003ctd\u003e〔N분〕\u003c/td\u003e\n\u003ctd\u003e〔M분〕\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 파트너 API 호출량 제한·버저닝·구버전 종료\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003e2025\u003c/code\u003e · \u003ccode\u003e역할 : 〔주도 / 참여〕\u003c/code\u003e · \u003ccode\u003eKotlin\u003c/code\u003e \u003ccode\u003eSpring Boot\u003c/code\u003e\u003c/p\u003e\n\u003ch3\u003e해결한 문제\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eAPI \u003cstrong\u003e호출량 제한\u003c/strong\u003e을 도입해야 했지만, 앱별 호출 현황이 파악되어 있지 않았습니다.\u003c/li\u003e\n\u003cli\u003e요청·응답 필드명을 정리하기 위해 \u003cstrong\u003eAPI 버전을 새로 만들어야\u003c/strong\u003e 했습니다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e중요성과 제약\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e구버전을 쓰는 앱을 한꺼번에 차단하면 그 앱의 \u003cstrong\u003e실제 서비스가 장애\u003c/strong\u003e를 겪습니다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e의사결정\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e계측 먼저, 제한은 그다음\u003c/strong\u003e : 앱별 호출량을 파악한 뒤 제한 기준을 정하고 개발자 가이드를 업데이트했습니다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e구버전 종료 순서\u003c/strong\u003e : 신·구 버전 함께 운영 → 종료 일자 공지 → 앱별 구버전 호출량 추적 → 종료 일자에 맞춰 차단\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e결과\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e대상 앱 〔N〕개, 종료일 기준 구버전 호출 앱 〔N〕개\u003c/li\u003e\n\u003cli\u003e차단 후 장애·문의 〔N건〕\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e5. PHP 7.0 → 8.2 버전업 \u0026#x26; 암호화 데이터 전환\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003e〔기간〕\u003c/code\u003e · \u003ccode\u003e역할 : 〔주도 / 참여〕\u003c/code\u003e · \u003ccode\u003ePHP 8.2\u003c/code\u003e \u003ccode\u003eOpenSSL\u003c/code\u003e\u003c/p\u003e\n\u003ch3\u003e해결한 문제\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e솔루션이 보안 지원이 끝난 \u003cstrong\u003ePHP 7.0\u003c/strong\u003e에서 운영되고 있었습니다.\u003c/li\u003e\n\u003cli\u003e기존 암호화에 쓰던 \u003cstrong\u003e\u003ccode\u003emcrypt\u003c/code\u003e 확장은 PHP 7.2부터 제거\u003c/strong\u003e되어, 버전을 올리려면 암호화 방식부터 바꿔야 했습니다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e중요성과 제약\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e이미 암호화되어 저장된 데이터(〔데이터 종류〕)를 \u003cstrong\u003e손실 없이\u003c/strong\u003e 새 방식으로 옮겨야 했습니다.\u003c/li\u003e\n\u003cli\u003e대상 규모 : 〔상점 N개 / 데이터 N건〕\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e의사결정\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003emcrypt\u003c/code\u003e → \u003ccode\u003eopenssl\u003c/code\u003e로 교체하고 기존 데이터를 마이그레이션\u003c/strong\u003e했습니다.\n\u003cul\u003e\n\u003cli\u003e〔호환성 검증 방법 : 알고리즘·모드·패딩 확인 등〕\u003c/li\u003e\n\u003cli\u003e〔겪은 문제가 있다면 : 예) 패딩 방식 차이로 복호화 결과가 달라진 문제〕\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e버전업 자동화\u003c/strong\u003e : 〔무엇을 자동화했는지 : 상점별 반복 작업 스크립트화 등〕\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e결과\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e〔N〕개 상점 전환 완료, 데이터 불일치 〔0건〕\u003c/li\u003e\n\u003cli\u003e상점당 작업 시간 〔N → M〕\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e그 외 주요 업무\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e앱 인증·결제 연동\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e마이앱 로그인을 위한 회원 인증 · 토큰 API 개발\u003c/li\u003e\n\u003cli\u003e소셜 로그인 확장 : 애플 로그인 설정, 구글 로그인, 카카오 싱크 회원가입 정책\u003c/li\u003e\n\u003cli\u003e보안 : 비밀번호 변경 시 앱도 로그아웃되도록 개선, 회원가입 완료 시 기존 생체 인증·토큰 정보 초기화\u003c/li\u003e\n\u003cli\u003e결제 : 앱 내 PG 결제를 위한 앱 스킴 처리, \u003cstrong\u003e네이버페이 주문형 SDK V2\u003c/strong\u003e 연동\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCRM·외부 연동 API\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003eCRM 연계용 잔여·소멸예정 마일리지 API\u003c/li\u003e\n\u003cli\u003e상품 혜택 조회 API (신상품 할인 응답 추가)\u003c/li\u003e\n\u003cli\u003e크리마 플러스 리뷰 사용 여부 조회 API, 외부 스크립트 생성 API\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e카페24 → 고도몰 데이터 이전 툴 재구축\u003c/strong\u003e (2024.05 ~ 2024.08)\n\u003cul\u003e\n\u003cli\u003e기존 PHP 툴을 Python · Flask로 재구축하고 주문·상품 데이터 추출·변환 기능 개발\u003c/li\u003e\n\u003cli\u003e데이터 이전 오류율 감소 (〔N% → M%〕)\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e로컬 디스크 → Object Storage 전환\u003c/strong\u003e (2024.01 ~ 2024.09)\n\u003cul\u003e\n\u003cli\u003e쿠폰 이미지, 공급사 게시판 첨부파일, 설문조사, 에디터, Open-API 상품 이미지 업로드\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e중개서버 Redis → Valkey 전환\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch1\u003e위저드정보시스템 · 2019.08 ~ 2022.04 (2년 8개월)\u003c/h1\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e현장 생산관리 키오스크 시스템 개발 · 배포 · 운영\u003c/strong\u003e\n생산 현장 작업자가 쓰는 키오스크 시스템을 개발부터 운영까지 담당했습니다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e귀뚜라미 창고관리시스템(WMS) 구축\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e입출고 및 랙(Rack)별 재고 관리 시스템 구축\u003c/li\u003e\n\u003cli\u003e입출고 프로시저 \u003cstrong\u003eSQL 튜닝으로 처리 속도 개선\u003c/strong\u003e : 〔N초 → M초〕 (기존 기록 : \"150% 개선\")\u003c/li\u003e\n\u003cli\u003ePM 역할을 함께 맡아 일정 관리와 유관 부서 커뮤니케이션 담당\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMES(생산·기초정보·자재 관리) 및 전자결재 시스템 구축\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e메모리 최적화를 위한 레거시 코드 리팩토링으로 시스템 속도 개선 : 〔N초 → M초〕 (기존 기록 : \"130% 개선\")\u003c/li\u003e\n\u003cli\u003e코딩 컨벤션 정립\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e기술 스택\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e분야\u003c/th\u003e\n\u003cth\u003e기술\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eLanguage / Framework\u003c/td\u003e\n\u003ctd\u003eKotlin, Spring Boot, 〔JPA 등〕, PHP, Python, Flask\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eData / Cache / Messaging\u003c/td\u003e\n\u003ctd\u003eMySQL, Redis, Valkey, 〔메시지 브로커 : Kafka 등〕\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBatch\u003c/td\u003e\n\u003ctd\u003eApache Airflow\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTest / Docs\u003c/td\u003e\n\u003ctd\u003eKotest, Testcontainers, Spring REST Docs, Swagger\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInfra / Monitoring\u003c/td\u003e\n\u003ctd\u003eGSLB, NHN Cloud Object Storage, OpenSearch, CI/CD 〔도구명〕\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2\u003e자격 · 교육\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e정보처리기사 (2019.08)\u003c/li\u003e\n\u003cli\u003eSQL개발자 SQLD (2026.04)\u003c/li\u003e\n\u003cli\u003e프로그래머스 데브코스 : 클라우드 기반 백엔드 엔지니어링 (530시간 · Java, Spring Boot, MySQL, AWS)\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003chr\u003e\n\u003ch2\u003e✂️ 채울 항목 체크리스트 (제출 시 이 섹션 삭제)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e최우선 (합격 가능성을 가르는 항목)\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e[1] 전환 중 오류 : 몇 % 단계였는지, 어떤 API의 어떤 오류였는지, 원인과 수정 내용\u003c/li\u003e\n\u003cli\u003e[2] 쿠폰 중복 사용을 \u003cstrong\u003e실제로 해결한 방식\u003c/strong\u003e → 기억나지 않으면 \"그 외 주요 업무\"로 내리기\u003c/li\u003e\n\u003cli\u003e[3] 데드락 : 직접 분석했는지, 원인과 해결 방법 → 직접 한 게 아니면 트러블슈팅 세부 내용 삭제\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e중요\u003c/strong\u003e\n4. [1] 응답시간 30% 단축의 전후 ms 값과 기준(평균 / p95), 연동 앱 수, 일 호출량\n5. [공통] 프로젝트별 \u003cstrong\u003e본인 역할(주도 / 참여)과 기간\u003c/strong\u003e\n6. [5] 대상 상점 수와 데이터 규모, 자동화한 작업 내용\n7. [위저드] \"150% / 130% 개선\"을 \u003cstrong\u003eN초 → M초\u003c/strong\u003e 형태로 바꾸기\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e있으면 좋음\u003c/strong\u003e\n8. [1] 캐시 대상·TTL·저장소, 빌드 캐싱 전후 배포 시간, 데이터 접근 기술(JPA 여부)\n9. [3] Airflow를 선택한 실제 이유, 배치 실패율이나 처리 시간 변화\n10. [4] 대상 앱 수, 차단 후 문의 건수\n11. [기술 스택] 메시지 브로커 종류, CI/CD 도구명\u003c/p\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center
