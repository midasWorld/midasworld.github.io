🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"차트로 미래를 맞히는 거 아니었어요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇게 믿으면 망한다. \u003cstrong\u003e'추세를 읽고 확률 높은 편에 서는 것'\u003c/strong\u003e — 그게 전부야. 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 추세 — 시장의 큰 방향\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"가격은 \u003cstrong\u003e세 방향\u003c/strong\u003e 중 하나로 흐른다. \u003cstrong\u003e'추세는 친구다(The trend is your friend)'\u003c/strong\u003e — 거스르지 마라.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e추세\u003c/th\u003e\n\u003cth\u003e모양\u003c/th\u003e\n\u003cth\u003e대응 통념\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e상승추세\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e고점·저점이 점점↑\u003c/td\u003e\n\u003ctd\u003e눌림목 매수 관점\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e하락추세\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e고점·저점이 점점↓\u003c/td\u003e\n\u003ctd\u003e섣부른 저점매수 위험\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e횡보(박스)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e일정 범위 등락\u003c/td\u003e\n\u003ctd\u003e박스 하단 매수·상단 매도\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"초보는 \u003cstrong\u003e하락추세에서 '싸졌다'며 계속 사다가\u003c/strong\u003e 물린다('떨어지는 칼날 잡기'). 추세가 꺾였는지부터 확인하는 게 먼저야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 지지선과 저항선 — 심리의 벽\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e지지선\u003c/strong\u003e: 가격이 내려오다 \u003cstrong\u003e반등하는\u003c/strong\u003e 바닥 (사려는 힘)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e저항선\u003c/strong\u003e: 가격이 오르다 \u003cstrong\u003e막히는\u003c/strong\u003e 천장 (팔려는 힘)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e돌파\u003c/strong\u003e: 저항을 뚫으면 그 저항이 \u003cstrong\u003e지지로 전환\u003c/strong\u003e(역할 반전)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"지지·저항은 \u003cstrong\u003e사람들의 기억\u003c/strong\u003e이다. '저기서 막혔었지' 하는 심리가 벽을 만들어. 그래서 \u003cstrong\u003e많이 부딪힌 자리일수록\u003c/strong\u003e 강한 벽이지. 돌파엔 보통 \u003cstrong\u003e거래량\u003c/strong\u003e이 따라야 진짜다(다음 편).\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 이동평균선(MA) — 추세를 눈에 보이게\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e이동평균 = 최근 N일 종가의 평균을 이은 선\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMA\u003c/th\u003e\n\u003cth\u003e성격\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e단기(5·20일)\u003c/td\u003e\n\u003ctd\u003e민감, 최근 흐름\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e중기(60일)\u003c/td\u003e\n\u003ctd\u003e수급선\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e장기(120·200일)\u003c/td\u003e\n\u003ctd\u003e큰 추세·경기선\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"주가가 \u003cstrong\u003e이평선 위\u003c/strong\u003e에 있으면 그 기간 산 사람들이 평균적으로 이익(상승 기운), \u003cstrong\u003e아래\u003c/strong\u003e면 손실(하락 기운)이다. 특히 \u003cstrong\u003e200일선\u003c/strong\u003e은 장기 추세의 분기점으로 세계가 본다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 정배열·역배열 \u0026#x26; 골든/데드크로스\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이평선들의 \u003cstrong\u003e줄 서기\u003c/strong\u003e가 추세를 말한다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e배열\u003c/th\u003e\n\u003cth\u003e모양\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e정배열\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e단기\u003e중기\u003e장기 (위→아래)\u003c/td\u003e\n\u003ctd\u003e건강한 상승추세\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e역배열\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e단기\u0026#x3C;중기\u0026#x3C;장기\u003c/td\u003e\n\u003ctd\u003e하락추세\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e골든크로스\u003c/strong\u003e: 단기선이 장기선을 \u003cstrong\u003e아래→위로 돌파\u003c/strong\u003e → 상승전환 신호(통념)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e데드크로스\u003c/strong\u003e: 단기선이 장기선을 \u003cstrong\u003e위→아래로 이탈\u003c/strong\u003e → 하락전환 신호\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"골든크로스 뜨면 사면 되는 거예요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e그렇게 단순하면 다 부자 됐지.\u003c/strong\u003e 이평선은 \u003cstrong\u003e후행지표\u003c/strong\u003e다 — 평균이라 한 박자 늦어. 골든크로스가 '뜬 걸 확인'했을 땐 이미 오른 뒤일 때가 많아. \u003cstrong\u003e신호이자 확인\u003c/strong\u003e일 뿐, 매매 자판기가 아니야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 실전 — 이동평균 활용\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs\"\u003e① 큰 추세 확인: 주가가 200일선 위인가 아래인가 (편들기)\r\n② 배열 확인: 정배열(상승)인가 역배열(하락)인가\r\n③ 눌림목: 상승추세에서 20·60일선까지 눌릴 때 관심\r\n④ 이탈 경계: 중요한 이평선(예 60·200일)을 거래량 동반해 깨면 추세 훼손\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이평선은 \u003cstrong\u003e'지금 추세의 편'을 정하는\u003c/strong\u003e 나침반이다. 매수·매도 정밀 타이밍보다 **'상승 편이냐 하락 편이냐'**를 가르는 데 써라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"하락추세인데 싸졌으니 매수\"\u003c/strong\u003e ❌ → \u003cstrong\u003e떨어지는 칼날.\u003c/strong\u003e 추세 전환 확인이 먼저.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"골든크로스=매수 자판기\"\u003c/strong\u003e ❌ → 이평선은 \u003cstrong\u003e후행\u003c/strong\u003e. 속임수(가짜 신호)도 잦다. 거래량·추세와 같이.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"기술적 분석으로 미래를 맞힌다\"\u003c/strong\u003e ❌ → 확률 도구. \u003cstrong\u003e재무·가치(기본적 분석)와 함께\u003c/strong\u003e 써야 강하다.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e차트·이평선\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권 / TradingView\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e5·20·60·120·200일 설정\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e미국 차트\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eTradingView / finviz\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e50일·200일 MA\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e \"추세는 친구다\"가 뜻하는 매매 태도는?\r\n→ \u003cstrong\u003e추세를 거스르지 말 것.\u003c/strong\u003e 특히 하락추세 종목의 섣부른 저점매수(칼날 잡기)를 경계.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 골든크로스를 '매수 자판기'로 쓰면 안 되는 이유는?\r\n→ 이동평균은 \u003cstrong\u003e후행지표\u003c/strong\u003e라 신호가 늦고 \u003cstrong\u003e가짜 신호\u003c/strong\u003e도 잦음. 거래량·추세와 병행 확인.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 200일 이동평균선이 중요하게 여겨지는 이유는?\r\n→ \u003cstrong\u003e장기 추세의 분기점\u003c/strong\u003e으로 전 세계가 참고 → 그 위/아래가 큰 방향의 기준.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [기술심화 2] 거래량 — 가격은 거짓말해도 거래량은 못 한다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목 추천이 아닙니다. 기술적 신호는 확률이지 보장이 아닙니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children
