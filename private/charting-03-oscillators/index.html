두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"지표가 많던데 다 써야 해요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"아니다. \u003cstrong\u003e두세 개만 제대로\u003c/strong\u003e 쓰면 충분해. 성격이 겹치는 걸 잔뜩 깔면 오히려 헷갈려. 핵심만 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 보조지표의 두 종류\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종류\u003c/th\u003e\n\u003cth\u003e무엇\u003c/th\u003e\n\u003cth\u003e대표\u003c/th\u003e\n\u003cth\u003e잘 듣는 장세\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e추세지표\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e추세 방향·강도\u003c/td\u003e\n\u003ctd\u003eMACD, 이동평균\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e추세장\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e모멘텀(오실레이터)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e과열·침체\u003c/td\u003e\n\u003ctd\u003eRSI, 스토캐스틱\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e횡보장\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이게 핵심이다. \u003cstrong\u003e추세장에선 추세지표, 횡보장에선 오실레이터\u003c/strong\u003e가 잘 듣는다. 장세에 안 맞는 지표를 쓰면 계속 틀려. 도구를 장세에 맞춰라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. RSI — 과매수·과매도\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eRSI\u003c/strong\u003e: 0~100. 최근 상승/하락 강도. 통념상 \u003cstrong\u003e70↑ 과매수, 30↓ 과매도\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e70 이상 = 너무 올랐다(조정 가능성), 30 이하 = 너무 빠졌다(반등 가능성)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e⚠️ 함정\u003c/strong\u003e: 강한 추세장에선 RSI가 \u003cstrong\u003e70 위에 오래 머물며 계속 상승\u003c/strong\u003e한다. \"과매수니 팔자\"가 큰 실수가 돼\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"RSI 70이면 무조건 파는 거 아니에요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그게 초보의 무덤이다. \u003cstrong\u003e강세장에선 과매수가 계속된다.\u003c/strong\u003e RSI는 \u003cstrong\u003e횡보장\u003c/strong\u003e에서 30/70 되돌림이 잘 듣고, \u003cstrong\u003e추세장에선 신호가 무력\u003c/strong\u003e해져. 단독으로 쓰지 마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. MACD — 추세 전환과 모멘텀\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eMACD = 단기 이평 − 장기 이평\u003c/strong\u003e, 그리고 그 \u003cstrong\u003e시그널선\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003eMACD가 시그널선을 \u003cstrong\u003e위로 교차\u003c/strong\u003e → 상승 모멘텀(매수 관점)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e아래로 교차\u003c/strong\u003e → 하락 모멘텀\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e0선 위/아래\u003c/strong\u003e = 큰 추세의 방향\u003c/li\u003e\n\u003cli\u003e추세장에서 특히 유용 (추세지표)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"MACD는 이동평균을 가공한 거라 역시 \u003cstrong\u003e후행\u003c/strong\u003e 성격이 있다. 하지만 추세의 \u003cstrong\u003e힘이 붙는지 꺾이는지\u003c/strong\u003e를 보는 덴 좋아. 교차만 보지 말고 \u003cstrong\u003e0선 기준 위치\u003c/strong\u003e도 같이 봐라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 볼린저밴드 — 변동성의 띠\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e이동평균(중심선) ± 표준편차 2배로 만든 \u003cstrong\u003e위·아래 밴드\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e주가가 밴드 \u003cstrong\u003e상단 터치\u003c/strong\u003e = 단기 과열, \u003cstrong\u003e하단 터치\u003c/strong\u003e = 단기 침체(횡보장 기준)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e밴드 수축(스퀴즈)\u003c/strong\u003e = 변동성 축소 → \u003cstrong\u003e큰 변동 임박\u003c/strong\u003e 신호(방향은 미정)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e밴드 확장\u003c/strong\u003e = 변동성 폭발(추세 진행 중)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"볼린저의 진짜 묘미는 **'스퀴즈'**다. 밴드가 좁아지면 \u003cstrong\u003e폭풍 전 고요\u003c/strong\u003e — 곧 크게 움직인다(방향은 거래량·돌파로 판단). 단, '하단 터치=매수'는 \u003cstrong\u003e하락추세에선 계속 하단을 타고 내려가니\u003c/strong\u003e 조심.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. ⭐ 다이버전스 — 지표가 가격과 엇갈릴 때\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"보조지표의 백미는 **다이버전스(괴리)**다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e하락 다이버전스\u003c/strong\u003e: 주가는 \u003cstrong\u003e신고점\u003c/strong\u003e인데 RSI/MACD는 \u003cstrong\u003e고점이 낮아짐\u003c/strong\u003e → 상승 힘 약화(천장 경계)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e상승 다이버전스\u003c/strong\u003e: 주가는 \u003cstrong\u003e신저점\u003c/strong\u003e인데 지표는 \u003cstrong\u003e저점이 높아짐\u003c/strong\u003e → 하락 힘 소진(바닥 가능성)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"가격은 오르는데 지표는 힘이 빠지면 미리 경고가 되는 거군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇지. 다이버전스는 \u003cstrong\u003e추세 전환의 조기 경보\u003c/strong\u003e다. 단, 조기 경보지 \u003cstrong\u003e타이머가 아니라\u003c/strong\u003e 한참 더 갈 수도 있어. 확인 신호로 써라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정 — 보조지표 3대 실수\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"RSI 70=매도, 30=매수\"\u003c/strong\u003e 기계적 적용 ❌ → \u003cstrong\u003e추세장에선 무력.\u003c/strong\u003e 장세 구분이 먼저.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e지표 떡칠\u003c/strong\u003e ❌ → 성격 겹치는 지표 5개 깔아도 노이즈만↑. \u003cstrong\u003e2~3개\u003c/strong\u003e면 충분.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"보조지표로 매매 결정\"\u003c/strong\u003e ❌ → 보조는 \u003cstrong\u003e각주\u003c/strong\u003e. 가격·추세·거래량(본문)을 \u003cstrong\u003e보조·확인\u003c/strong\u003e하는 용도.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eRSI·MACD·볼린저\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eTradingView / 네이버 차트\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e지표 추가 메뉴\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e다이버전스\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eTradingView\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e가격 vs RSI/MACD 비교\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e RSI 70(과매수)에서 기계적으로 매도하면 위험한 장세는?\r\n→ \u003cstrong\u003e강한 추세장(상승장)\u003c/strong\u003e. RSI가 70 위에 오래 머물며 계속 오를 수 있음.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 볼린저밴드 '스퀴즈(수축)'가 시사하는 것은?\r\n→ 변동성 축소 → \u003cstrong\u003e큰 변동 임박\u003c/strong\u003e(방향은 미정, 돌파·거래량으로 판단).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e '하락 다이버전스'란?\r\n→ 주가는 \u003cstrong\u003e신고점\u003c/strong\u003e인데 RSI/MACD 고점은 \u003cstrong\u003e낮아짐\u003c/strong\u003e → 상승 동력 약화(천장 경보).\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [기술심화 4] 차트 패턴 — 헤드앤숄더·삼각수렴, 그리고 패턴의 함정.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목 추천이 아닙니다. 보조지표는 확률적 참고 도구입니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"t
