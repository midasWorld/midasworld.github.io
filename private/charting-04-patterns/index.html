나오면 그대로 움직여요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e자주 그렇지만 항상은 아니다.\u003c/strong\u003e 확률이야. 게다가 패턴은 \u003cstrong\u003e사후엔 다 보이지만 실시간엔 애매\u003c/strong\u003e해. 그 한계를 알고 써야 한다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 반전 패턴 — 추세가 뒤집힐 때\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e패턴\u003c/th\u003e\n\u003cth\u003e모양\u003c/th\u003e\n\u003cth\u003e신호\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e헤드앤숄더\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e봉우리 3개(가운데 최고)\u003c/td\u003e\n\u003ctd\u003e상승→하락 반전(천장)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e역헤드앤숄더\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e골짜기 3개(가운데 최저)\u003c/td\u003e\n\u003ctd\u003e하락→상승 반전(바닥)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e이중천정(M)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e고점 두 번 막힘\u003c/td\u003e\n\u003ctd\u003e천장\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e이중바닥(W)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e저점 두 번 지지\u003c/td\u003e\n\u003ctd\u003e바닥\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"공통 원리는 **'넥라인(목선) 돌파'**다. 헤드앤숄더는 목선을 \u003cstrong\u003e아래로\u003c/strong\u003e 깨야 완성이고, 이중바닥은 가운데 고점을 \u003cstrong\u003e위로\u003c/strong\u003e 넘어야 완성이지. \u003cstrong\u003e완성 전엔 패턴이 아니다\u003c/strong\u003e — 그리다 만 그림일 뿐이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 지속 패턴 — 추세가 쉬어갈 때\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e패턴\u003c/th\u003e\n\u003cth\u003e모양\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e삼각수렴\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e고점↓ 저점↑ 좁아짐\u003c/td\u003e\n\u003ctd\u003e에너지 응축 → 돌파 방향으로\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e깃발/페넌트\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e급등 후 짧은 눌림\u003c/td\u003e\n\u003ctd\u003e추세 지속 가능성\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e박스(직사각형)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e수평 횡보\u003c/td\u003e\n\u003ctd\u003e돌파 방향 추종\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"지속 패턴은 **'추세 중간의 휴식'**이다. 보통 \u003cstrong\u003e기존 추세 방향으로 돌파\u003c/strong\u003e할 확률이 높지. 단, 어디까지나 확률 — **거래량 동반 돌파(2편)**로 인증돼야 믿는다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 추세선 — 직접 긋는 지지·저항\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e추세선\u003c/strong\u003e은 저점들(상승추세) 또는 고점들(하락추세)을 이은 선이다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e상승추세선: 저점 두 개 이상을 이은 우상향 선 → \u003cstrong\u003e지지\u003c/strong\u003e 역할\u003c/li\u003e\n\u003cli\u003e추세선 \u003cstrong\u003e이탈\u003c/strong\u003e(깨짐) = 추세 훼손 신호 → 경계\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e여러 번 닿고도 안 깨진\u003c/strong\u003e 추세선일수록 강하다\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"추세선은 \u003cstrong\u003e객관적이지 않다\u003c/strong\u003e — 긋는 사람마다 달라. 그래서 '내 맘대로 그어 맞다고 우기는' 함정에 빠지기 쉽다. \u003cstrong\u003e명백한 점들\u003c/strong\u003e만 잇고, 억지로 만들지 마라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. ⚠️ 패턴의 함정 — 가장 중요한 장\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"패턴을 배웠으니 이제 \u003cstrong\u003e왜 패턴만 믿으면 안 되는지\u003c/strong\u003e를 못 박자.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e사후확증 편향\u003c/strong\u003e: 지나고 보면 패턴이 다 보인다. \u003cstrong\u003e실시간엔 애매\u003c/strong\u003e하고, 'A인 줄 알았는데 아니었던' 게 수두룩.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e가짜 돌파(속임수)\u003c/strong\u003e: 패턴 완성처럼 보이다 \u003cstrong\u003e반대로 튀는\u003c/strong\u003e 페이크가 흔하다(거래량으로 거름).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e자기실현 vs 역이용\u003c/strong\u003e: 패턴이 유명해 다들 같은 자리서 매매 → \u003cstrong\u003e세력이 그걸 역이용\u003c/strong\u003e해 털기도.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e표본 편향\u003c/strong\u003e: 맞은 패턴만 기억하고 틀린 건 잊는다 → '패턴은 잘 맞는다'는 착각.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그럼 패턴은 안 보는 게 나아요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"아니. \u003cstrong\u003e참고는 하되 맹신하지 마라\u003c/strong\u003e가 답이다. 패턴 + \u003cstrong\u003e거래량 인증\u003c/strong\u003e + \u003cstrong\u003e추세\u003c/strong\u003e + **기본적 분석(가치)**을 겹칠 때 비로소 쓸 만해. 패턴 하나로 베팅하면 도박이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 실전 — 기술적 분석 통합 체크\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"기술심화 1~4편을 한 장으로 묶는다.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-swift\"\u003e① 추세(\u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e편): 큰 방향은 상승\u003cspan class=\"hljs-regexp\"\u003e/하락/\u003c/span\u003e횡보 중 무엇인가\r\n② 거래량(\u003cspan class=\"hljs-number\"\u003e2\u003c/span\u003e편): 움직임이 거래량으로 인증됐나\r\n③ 보조지표(\u003cspan class=\"hljs-number\"\u003e3\u003c/span\u003e편): 장세에 맞는 지표로 과열\u003cspan class=\"hljs-regexp\"\u003e/모멘텀/\u003c/span\u003e다이버전스 확인\r\n④ 패턴(\u003cspan class=\"hljs-number\"\u003e4\u003c/span\u003e편): 완성됐나(미완성은 무시), 거래량 동반했나\r\n⑤ 가치(기본적 분석): 재무·해자가 받쳐주나 \u003cspan class=\"hljs-operator\"\u003e←\u003c/span\u003e 기술만으론 부족\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"다섯 겹이 \u003cstrong\u003e같은 방향\u003c/strong\u003e을 가리킬 때 확률이 가장 높다. \u003cstrong\u003e기술적 분석은 타이밍, 기본적 분석은 종목\u003c/strong\u003e — 둘은 적이 아니라 짝이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정 정리\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"패턴 나왔으니 그대로 간다\"\u003c/strong\u003e ❌ → \u003cstrong\u003e완성·거래량 인증\u003c/strong\u003e 전엔 미완성. 페이크 잦음.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"추세선 내 맘대로 긋기\"\u003c/strong\u003e ❌ → 명백한 점만. 억지 추세선은 자기기만.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"기술적 분석만으로 충분\"\u003c/strong\u003e ❌ → \u003cstrong\u003e타이밍 도구\u003c/strong\u003e일 뿐. 가치(재무)와 함께 써야 산다.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e패턴·추세선\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eTradingView\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e작도 도구·패턴 인식\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e국내 차트\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e추세선·패턴\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 헤드앤숄더 패턴이 '완성'됐다고 보려면?\r\n→ \u003cstrong\u003e넥라인(목선)을 아래로 돌파\u003c/strong\u003e해야 함(완성 전엔 미완성 그림).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 차트 패턴을 맹신하면 안 되는 이유 두 가지는?\r\n→ \u003cstrong\u003e사후확증 편향\u003c/strong\u003e(실시간엔 애매)과 \u003cstrong\u003e가짜 돌파(페이크)·세력 역이용\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e \"기술적 분석은 타이밍, 기본적 분석은 종목\"의 의미는?\r\n→ 차트로는 \u003cstrong\u003e언제 살지\u003c/strong\u003e를, 재무·가치로는 \u003cstrong\u003e무엇을 살지\u003c/strong\u003e를 본다 → 둘을 겹쳐야 강함.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🎓 기술 심화 트랙 졸업\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"추세·거래량·보조지표·패턴까지 왔다. 이제 너는 차트를 **'예언서'가 아니라 '확률 도구'**로 본다. 그게 진짜 실력이야. 다음은 이 모든 분석(경제·재무·기술)을 하나로 묶는 \u003cstrong\u003e파생 심화\u003c/strong\u003e와 \u003cstrong\u003e대가들의 철학·실무\u003c/strong\u003e다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목 추천이 아닙니다. 차트 패턴은 확률적 참고이며 보장이 아닙니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-30\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"📈 [기술심화 4] 차트 패턴 — 반복되는 그림, 그리고 함정\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"📈 [기술심화 4] 차트 패턴 — 반복되는 그림, 그리고 함정 | midasworld (Private)\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"서버 개발 학습 블로그\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"si
