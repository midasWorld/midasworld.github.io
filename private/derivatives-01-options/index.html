3e\n\u003cp\u003e⚠️ 파생상품은 레버리지가 커서 원금 전액 손실도 가능합니다. 본 내용은 개념 학습용이며 매매 권유가 아닙니다.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 선물(Futures) — 미래 가격을 지금 약속\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e선물 = 미래 정해진 날, 정해진 가격에 사고팔기로 한 계약\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e증거금(보통 거래대금의 10~20%)만으로 거래 → \u003cstrong\u003e레버리지\u003c/strong\u003e 큼\u003c/li\u003e\n\u003cli\u003e가격이 예상과 반대로 가면 \u003cstrong\u003e증거금 이상 손실\u003c/strong\u003e(추가 납입=마진콜) 가능\u003c/li\u003e\n\u003cli\u003e예: KOSPI200 선물, 개별주식 선물\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"10% 증거금이면 가격이 10%만 반대로 가도 원금이 날아간다. 초보가 함부로 손대면 안 되는 이유다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 옵션(Options) — 권리를 사고판다\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e옵션 = 미래에 특정 가격(행사가)으로 사거나 팔 '권리'\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종류\u003c/th\u003e\n\u003cth\u003e권리\u003c/th\u003e\n\u003cth\u003e언제 이익?\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e콜(Call) 매수\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e살 권리\u003c/td\u003e\n\u003ctd\u003e가격이 \u003cstrong\u003e오를 때\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e풋(Put) 매수\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e팔 권리\u003c/td\u003e\n\u003ctd\u003e가격이 \u003cstrong\u003e내릴 때\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e핵심: \u003cstrong\u003e매수자는 권리만 있고 의무는 없다.\u003c/strong\u003e 불리하면 권리를 포기(프리미엄만 손실).\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/option_payoff.png\" alt=\"옵션 손익 구조\"\u003e\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"위 그래프를 봐라. \u003cstrong\u003e콜 매수\u003c/strong\u003e(왼쪽)는 오를수록 이익이 무한대로 커지지만, 떨어져도 손실은 \u003cstrong\u003e프리미엄(8)에서 멈춘다.\u003c/strong\u003e 손실이 제한되고 이익은 크다는 게 옵션 매수의 매력이지.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"풋 매수(오른쪽)는 떨어질수록 이익이네요? 그럼 하락 보험이군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다. 주식을 보유한 채 풋을 사두면, 폭락해도 손실을 막을 수 있어. 그래서 \u003cstrong\u003e풋옵션 = 보험\u003c/strong\u003e이라 부른다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 프리미엄 = 내재가치 + 시간가치\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e옵션 프리미엄(가격) = 내재가치 + 시간가치\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e내재가치\u003c/strong\u003e: 지금 당장 행사하면 얻는 이익 (콜이면 현재가 − 행사가, 음수면 0)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e시간가치\u003c/strong\u003e: 만기까지 남은 시간의 가능성 → \u003cstrong\u003e만기가 다가올수록 0으로 소멸\u003c/strong\u003e(쎄타)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"옵션 매수는 시간이 적이다. 가만있으면 시간가치가 매일 녹아내려. 이게 초보가 옵션에서 돈을 잃는 가장 흔한 이유지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 그릭스(Greeks) — 옵션 가격의 민감도\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e그릭\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e델타(Δ)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e기초자산 1 변할 때 옵션 가격 변화\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e감마(Γ)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e델타의 변화율\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e쎄타(Θ)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시간 경과에 따른 가치 감소 (매수자에 불리)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e베가(ν)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e변동성 변할 때 가격 변화\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"처음엔 \u003cstrong\u003e델타와 쎄타\u003c/strong\u003e 둘만 알아도 충분하다. 방향(델타)과 시간(쎄타).\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 미장 vs 국장 파생\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/jake_explaining.png\" alt=\"잭이글\"\u003e 🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"미국 옵션 시장은 한국보다 훨씬 크고 활발해. 0DTE(당일 만기) 같은 초단기 옵션도 인기지. 근데 그만큼 \u003cstrong\u003e변동성도 살벌\u003c/strong\u003e해. 한국은 KOSPI200 옵션이 중심이고.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003e🇰🇷 국장\u003c/th\u003e\n\u003cth\u003e🇺🇸 미장\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e대표\u003c/td\u003e\n\u003ctd\u003eKOSPI200 선물·옵션\u003c/td\u003e\n\u003ctd\u003e개별주 옵션 매우 활발\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e세금\u003c/td\u003e\n\u003ctd\u003e양도세 11% (250만원 공제)\u003c/td\u003e\n\u003ctd\u003e양도세 22% (해외)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 거사부의 경고\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"파생은 '제로섬'에 가깝다. 누군가 벌면 누군가 잃어. 초보는:\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e옵션 매도(셀)는 절대 금지\u003c/strong\u003e — 손실이 무한대가 될 수 있다\u003c/li\u003e\n\u003cli\u003e처음엔 **풋 매수(보험)**로만 경험\u003c/li\u003e\n\u003cli\u003e잃어도 되는 돈으로만, 전체 자산의 극히 일부만\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"콜은 상승 베팅, 풋은 하락 보험, 시간가치는 녹는다 — 일단 이것만 기억할게요!\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e한국거래소 KRX\u003c/strong\u003e (krx.co.kr)\u003c/td\u003e\n\u003ctd\u003e국내 선물·옵션 시세·증거금\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 앱(파생 전용)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e옵션 체인·그릭스\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eCBOE\u003c/strong\u003e (cboe.com)\u003c/td\u003e\n\u003ctd\u003e미국 옵션 시장 정보\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eOptionStrat\u003c/strong\u003e (optionstrat.com)\u003c/td\u003e\n\u003ctd\u003e옵션 전략 손익 시각화\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 주가 하락에 대비한 '보험'으로 쓰는 옵션은?\r\n→ \u003cstrong\u003e풋(Put) 매수\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 콜옵션 매수자의 최대 손실은?\r\n→ \u003cstrong\u003e지불한 프리미엄\u003c/strong\u003e까지만 (이익은 무한, 손실은 제한)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 옵션 매수자에게 시간 경과가 불리한 이유는?\r\n→ **시간가치(쎄타)**가 만기로 갈수록 0으로 소멸하기 때문\u003c/p\u003e\n\u003chr\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ 파생상품은 고위험입니다. 옵션 매도·선물은 원금 초과 손실이 가능합니다. 본 내용은 교육용이며 매매 권유가 아닙니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-29\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"📈 [파생 1] 선물·옵션 기초 — 손익 그래프로 이해하기\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"📈 [파생 1] 선물·옵션 기초 — 손익 그래프로 이해하기 | midasworld (Private)\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"서버 개발 학습 블로그\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L16\",\"3\",{}]]\n"])</script></body></html>
