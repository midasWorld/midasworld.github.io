u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그렇게 위험해요? 그럼 왜 배워요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e적(위험)을 알아야 안 당한다.\u003c/strong\u003e 그리고 선물의 일부 개념(헤지)은 방어에도 쓰여. 원리를 알자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 선물 = 미래에 사고팔 가격을 '지금' 약속\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e선물\u003c/strong\u003e = 정해진 \u003cstrong\u003e미래 시점\u003c/strong\u003e에, \u003cstrong\u003e정해진 가격\u003c/strong\u003e으로 자산을 사고팔기로 한 \u003cstrong\u003e계약\u003c/strong\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e원래 목적은 \u003cstrong\u003e헤지(위험회피)\u003c/strong\u003e: 농부가 추수 전 곡물값을 미리 고정 → 가격 폭락 대비\u003c/li\u003e\n\u003cli\u003e지금은 대부분 \u003cstrong\u003e투기·레버리지\u003c/strong\u003e 수단으로 거래\u003c/li\u003e\n\u003cli\u003e한국 대표: \u003cstrong\u003e코스피200 선물\u003c/strong\u003e, 미국: \u003cstrong\u003e나스닥·S\u0026#x26;P 선물, 원유·금 선물\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"선물 자체는 죄가 없다. \u003cstrong\u003e헤지 도구\u003c/strong\u003e로 태어났어. 문제는 사람들이 \u003cstrong\u003e레버리지 도박\u003c/strong\u003e으로 쓴다는 거지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. ⚠️ 레버리지 — 증거금과 마진콜\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"선물의 핵심이자 독은 \u003cstrong\u003e레버리지\u003c/strong\u003e다. \u003cstrong\u003e증거금\u003c/strong\u003e이라는 일부 금액만 맡기고 \u003cstrong\u003e큰 금액을 거래\u003c/strong\u003e한다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e예: 증거금률 10% → \u003cstrong\u003e10배 레버리지\u003c/strong\u003e. 1,000만원으로 1억 포지션\u003c/li\u003e\n\u003cli\u003e가격이 \u003cstrong\u003e내 방향으로 1%\u003c/strong\u003e = 원금 대비 \u003cstrong\u003e10% 수익\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e가격이 \u003cstrong\u003e반대로 1%\u003c/strong\u003e = 원금 대비 \u003cstrong\u003e10% 손실\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e마진콜\u003c/strong\u003e: 손실로 증거금이 부족해지면 \u003cstrong\u003e추가 입금 요구\u003c/strong\u003e, 못 하면 \u003cstrong\u003e강제청산(반대매매)\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"반대로 10% 가면 원금이 다 날아가요?!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래. \u003cstrong\u003e주식은 회사가 안 망하면 기다리면 되지만, 선물은 마진콜에 강제청산되면 끝\u003c/strong\u003e이다. '버티기'가 안 돼. 게다가 **원금 이상 손실(빚)**도 가능해. 이게 주식과 근본적으로 다른 점이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 선물의 두 얼굴 — 헤지 vs 투기\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e목적\u003c/th\u003e\n\u003cth\u003e누가\u003c/th\u003e\n\u003cth\u003e예\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e헤지(방어)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e보유자산 위험을 상쇄\u003c/td\u003e\n\u003ctd\u003e주식 보유자가 하락 대비 \u003cstrong\u003e선물 매도\u003c/strong\u003e로 보험\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e투기(베팅)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e방향에 레버리지 베팅\u003c/td\u003e\n\u003ctd\u003e지수 오를 것 같아 \u003cstrong\u003e선물 매수\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"기관이 선물을 쓰는 큰 이유는 \u003cstrong\u003e헤지\u003c/strong\u003e다. 주식 100억을 들고 있는데 단기 하락이 걱정되면, 다 팔지 않고 \u003cstrong\u003e선물 매도\u003c/strong\u003e로 위험만 상쇄해. 개인이 따라 하기엔 정교함·증거금 관리가 어렵지만, **'선물은 보험으로도 쓴다'**는 건 알아둬라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 베이시스·롤오버 — 숨은 비용\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"선물엔 \u003cstrong\u003e만기\u003c/strong\u003e가 있다. 그래서 주식과 다른 비용이 숨어 있어.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e베이시스\u003c/strong\u003e: 선물가격 − 현물가격. 만기로 갈수록 좁혀짐\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e롤오버\u003c/strong\u003e: 만기 전 다음 월물로 갈아타기 → \u003cstrong\u003e비용 발생\u003c/strong\u003e(상품 ETF가 장기 손실 나던 이유, 상품 4편)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e콘탱고/백워데이션\u003c/strong\u003e: 선물이 현물보다 비싸냐(콘탱고)/싸냐(백워데이션)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 \u003cstrong\u003e선물·선물형 ETF의 장기 보유는 롤오버 비용으로 샌다.\u003c/strong\u003e 원자재 편에서 경고한 그거다. 단기 트레이딩 도구지 장기 자산이 아니야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 함정 — 개인이 선물에서 잃는 이유\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e과도한 레버리지\u003c/strong\u003e: 10~20배로 베팅 → 작은 역행에 청산. \u003cstrong\u003e변동성에 그냥 쓸려나감.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e마진콜 공포매매\u003c/strong\u003e: 강제청산 압박에 최악의 자리서 손절.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e방향만 맞으면 된다는 착각\u003c/strong\u003e: 방향 맞아도 \u003cstrong\u003e타이밍·변동성\u003c/strong\u003e에 청산당하면 끝.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e원금 이상 손실\u003c/strong\u003e: 주식과 달리 \u003cstrong\u003e빚을 질 수\u003c/strong\u003e 있다.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"통계적으로 \u003cstrong\u003e개인 파생 투자자 대다수가 장기적으로 잃는다.\u003c/strong\u003e 초보라면 \u003cstrong\u003e선물은 '안 하는 것'이 최선의 전략\u003c/strong\u003e일 때가 많아. 하더라도 \u003cstrong\u003e잃어도 되는 소액 + 엄격한 손절\u003c/strong\u003e로 시작하고, 레버리지를 낮춰라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 핵심 정리\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e선물 = \u003cstrong\u003e레버리지 계약\u003c/strong\u003e. 수익도 손실도 배로. \u003cstrong\u003e마진콜·강제청산·원금 이상 손실\u003c/strong\u003e 존재.\u003c/li\u003e\n\u003cli\u003e원래 목적은 \u003cstrong\u003e헤지(보험)\u003c/strong\u003e. 투기로 쓰면 고위험.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e롤오버 비용\u003c/strong\u003e으로 장기 보유 부적합.\u003c/li\u003e\n\u003cli\u003e초보는 \u003cstrong\u003e신중·소액·저레버리지·손절 필수\u003c/strong\u003e, 또는 \u003cstrong\u003e안 하기\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e선물 시세·증거금\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 파생 HTS\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e증거금률·청산기준\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e베이시스·미결제\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX 파생상품\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e콘탱고/백워데이션\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 선물이 주식과 근본적으로 다른 위험 두 가지는?\r\n→ \u003cstrong\u003e마진콜에 의한 강제청산\u003c/strong\u003e(버티기 불가)과 \u003cstrong\u003e원금 이상 손실(빚)\u003c/strong\u003e 가능성.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 선물의 원래(본래) 목적은?\r\n→ \u003cstrong\u003e헤지(위험회피)\u003c/strong\u003e. 미래 가격을 고정해 가격변동 위험을 줄이는 보험.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 선물·선물형 ETF가 장기 보유에 부적합한 이유는?\r\n→ 만기마다 \u003cstrong\u003e롤오버 비용\u003c/strong\u003e이 발생해 장기적으로 가치가 샘.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [파생 3] 옵션 그릭스 — 옵션 가격을 움직이는 숨은 힘들.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 파생상품은 원금 이상 손실이 가능한 고위험 상품입니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:t
