stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"방향이 맞는데 손해를 봐요? 콜 샀고 주가 올랐는데도요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇다. \u003cstrong\u003e시간\u003c/strong\u003e과 \u003cstrong\u003e변동성\u003c/strong\u003e 때문이지. 그게 그릭스다. 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 옵션값 = 내재가치 + 시간가치\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"옵션 프리미엄(가격)은 두 조각이다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e내재가치\u003c/strong\u003e: 지금 당장 행사하면 버는 값 (실제 이득분)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e시간가치\u003c/strong\u003e: '만기까지 더 유리해질 가능성'에 붙는 값 → \u003cstrong\u003e만기로 갈수록 0으로 소멸\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"핵심은 \u003cstrong\u003e시간가치가 녹는다\u003c/strong\u003e는 거다. 가만히 있어도 옵션은 매일 조금씩 가치가 빠져. 그래서 '방향 맞아도 시간에 잃는' 일이 생겨.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 4대 그릭스\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e그릭스\u003c/th\u003e\n\u003cth\u003e무엇에 대한 민감도\u003c/th\u003e\n\u003cth\u003e한 줄\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e델타(Δ)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e기초자산 가격\u003c/td\u003e\n\u003ctd\u003e주가 1 변할 때 옵션값 변화(방향 노출)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e세타(Θ)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시간\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e시간이 갈수록 빠지는 값(시간가치 소멸)\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e베가(ν)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e변동성\u003c/td\u003e\n\u003ctd\u003e변동성 1%p 변할 때 옵션값 변화\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e감마(Γ)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e델타의 변화\u003c/td\u003e\n\u003ctd\u003e주가 변할 때 델타가 얼마나 빨리 변하나\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"전부 외울 필욘 없다. \u003cstrong\u003e델타(방향)·세타(시간)·베가(변동성)\u003c/strong\u003e 셋만 잡아라. 옵션은 이 \u003cstrong\u003e세 가지에 동시에\u003c/strong\u003e 노출돼.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. ⚠️ 세타 — 옵션 매수자의 적\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"옵션을 \u003cstrong\u003e사면(매수)\u003c/strong\u003e 가장 무서운 게 \u003cstrong\u003e세타\u003c/strong\u003e다. \u003cstrong\u003e매일 시간가치가 녹아내려.\u003c/strong\u003e 주가가 안 움직이고 횡보만 해도 옵션 산 사람은 \u003cstrong\u003e계속 손해\u003c/strong\u003e야.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그래서 콜 샀는데 주가가 제자리면 돈이 줄어드는 거군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래. 더구나 \u003cstrong\u003e만기 임박\u003c/strong\u003e할수록 세타가 가속돼 빠르게 녹아. 그래서 옵션 매수는 **'방향 + 타이밍 + 속도'**가 다 맞아야 벌어. 셋 중 하나만 어긋나도 시간에 잃지. \u003cstrong\u003e옵션 매수자 대부분이 만기에 휴지가 되는\u003c/strong\u003e 이유다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 베가 — 변동성이 값을 흔든다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"옵션값은 **변동성(VIX 같은)**에 민감하다(베가).\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e변동성↑ → 옵션값↑ (더 크게 움직일 가능성에 프리미엄)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e이벤트(실적·FOMC) 전\u003c/strong\u003e 변동성이 부풀었다가, 이벤트 후 급락(\u003cstrong\u003eIV crush\u003c/strong\u003e) → 옵션 매수자가 \u003cstrong\u003e방향 맞아도\u003c/strong\u003e 변동성 붕괴로 손해\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"초보가 실적 발표 노리고 옵션 샀다가, \u003cstrong\u003e결과는 맞았는데 변동성 꺼지며 손해\u003c/strong\u003e 보는 게 이거다. 옵션은 **'비싸게 사면(고변동성) 불리'**하다는 걸 기억해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 매수 vs 매도 — 위험의 비대칭\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e포지션\u003c/th\u003e\n\u003cth\u003e최대 손실\u003c/th\u003e\n\u003cth\u003e최대 이익\u003c/th\u003e\n\u003cth\u003e시간가치(세타)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e옵션 \u003cstrong\u003e매수\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e프리미엄 한정\u003c/td\u003e\n\u003ctd\u003e(콜)무한대\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e불리\u003c/strong\u003e(녹음)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e옵션 \u003cstrong\u003e매도\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e무한대 가능\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e프리미엄 한정\u003c/td\u003e\n\u003ctd\u003e유리(받음)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"옵션 **매도(발행)**는 시간가치를 받아먹어 유리해 보이지만, \u003cstrong\u003e손실이 무한대\u003c/strong\u003e가 될 수 있다. '꾸준히 푼돈 벌다 한 방에 파산'하는 전형이지. \u003cstrong\u003e매수는 한정손실·시간불리, 매도는 시간유리·무한손실\u003c/strong\u003e — 이 비대칭을 모르면 큰일 난다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"방향만 맞으면 옵션은 번다\"\u003c/strong\u003e ❌ → **세타(시간)·베가(변동성)**에 동시 노출. 방향 맞아도 잃을 수 있음.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"이벤트 전 옵션 매수\"\u003c/strong\u003e ❌ → 변동성이 부푼 비싼 값 → 이벤트 후 \u003cstrong\u003eIV crush\u003c/strong\u003e로 손해.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"옵션 매도는 꾸준히 버니 안전\"\u003c/strong\u003e ❌ → \u003cstrong\u003e손실 무한대.\u003c/strong\u003e 한 번의 급변에 계좌가 날아갈 수 있음.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e옵션 시세·그릭스\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 파생 HTS\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e델타·세타·내재변동성(IV)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e변동성(VIX)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003einvesting.com\u003c/strong\u003e(경제 7편)\u003c/td\u003e\n\u003ctd\u003e시장 변동성 분위기\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 콜옵션을 샀고 주가도 올랐는데 손해 볼 수 있는 두 가지 이유는?\r\n→ **세타(시간가치 소멸)**와 \u003cstrong\u003e베가(변동성 하락, IV crush)\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 옵션 매수자에게 '세타'가 적인 이유는?\r\n→ 시간이 갈수록 \u003cstrong\u003e시간가치가 녹아\u003c/strong\u003e 가만있어도 가치가 줄기 때문(만기 임박 시 가속).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 옵션 매도(발행)의 위험 구조는?\r\n→ 이익은 \u003cstrong\u003e프리미엄 한정\u003c/strong\u003e인데 손실은 \u003cstrong\u003e무한대 가능\u003c/strong\u003e — 비대칭 위험.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [파생 4] 옵션 전략 — 커버드콜·보호적 풋, 헤지로서의 파생.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 옵션은 원금 전액·이상 손실이 가능한 고위험 상품입니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-27\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"⚡ [파생 3
