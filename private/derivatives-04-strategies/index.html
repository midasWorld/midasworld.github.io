ock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"파생으로 방어를 한다고요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래. 보험처럼 쓰는 거지. 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 보호적 풋(Protective Put) — 주식에 보험 들기\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e주식을 보유\u003c/strong\u003e한 채, \u003cstrong\u003e풋옵션(하락 시 이득)을 사서\u003c/strong\u003e 하락을 방어하는 전략이다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e주식 보유 + 풋 매수 → 주가 급락해도 풋이 손실을 \u003cstrong\u003e상쇄\u003c/strong\u003e(보험금)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e비용\u003c/strong\u003e = 풋 프리미엄(보험료). 주가가 안 빠지면 보험료만 날림\u003c/li\u003e\n\u003cli\u003e큰 하락이 두렵지만 \u003cstrong\u003e팔긴 싫은\u003c/strong\u003e 보유자에게\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"자동차 보험과 똑같다. 사고(폭락) 안 나면 보험료가 아깝지만, 나면 살린다. \u003cstrong\u003e폭락장이 걱정되는 장기 보유자\u003c/strong\u003e가 단기 방어용으로 쓰지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 커버드콜(Covered Call) — 보유주로 월세 받기\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e주식을 보유\u003c/strong\u003e한 채, 그 주식의 \u003cstrong\u003e콜옵션을 매도\u003c/strong\u003e해 프리미엄(수입)을 챙기는 전략이다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e주식 보유 + 콜 매도 → \u003cstrong\u003e프리미엄 수입\u003c/strong\u003e(추가 현금흐름)\u003c/li\u003e\n\u003cli\u003e주가가 크게 오르면 \u003cstrong\u003e상승분을 일정 위(행사가)에서 양보\u003c/strong\u003e해야 함(이익 제한)\u003c/li\u003e\n\u003cli\u003e횡보·완만 상승장에서 \u003cstrong\u003e추가 수익\u003c/strong\u003e을 노림\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"주식 들고 있으면서 콜을 팔아 월세처럼 받는 거네요? 근데 많이 오르면 손해?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다. \u003cstrong\u003e'크게 오를 일 없다 싶을 때' 추가 수입\u003c/strong\u003e을 얻는 거지. 대신 \u003cstrong\u003e대박 상승은 포기\u003c/strong\u003e한다. 그래서 '커버드콜 ETF'가 고배당처럼 보이지만 — \u003cstrong\u003e급등장에선 지수보다 뒤처진다\u003c/strong\u003e는 걸 알아야 해. 공짜 점심은 없어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 스프레드 — 위험을 제한한 베팅 (개념만)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"옵션 두 개를 조합해 \u003cstrong\u003e손익을 제한\u003c/strong\u003e하는 게 스프레드다. 깊이 들어가진 않고 개념만.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e전략\u003c/th\u003e\n\u003cth\u003e개념\u003c/th\u003e\n\u003cth\u003e성격\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e불 콜 스프레드\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e콜 매수 + 더 높은 콜 매도\u003c/td\u003e\n\u003ctd\u003e제한적 상승 베팅, 비용↓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e베어 풋 스프레드\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e풋 매수 + 더 낮은 풋 매도\u003c/td\u003e\n\u003ctd\u003e제한적 하락 베팅\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"스프레드는 \u003cstrong\u003e최대손실·최대이익을 미리 고정\u003c/strong\u003e해 무한손실을 피한다. 단순 매도(무한손실, 파생 3편)보다 안전하지만, 여전히 옵션이라 \u003cstrong\u003e세타·복잡성\u003c/strong\u003e이 있어. 초보 단계를 넘어선 뒤의 영역이다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 전략 비교 한눈에\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e전략\u003c/th\u003e\n\u003cth\u003e언제\u003c/th\u003e\n\u003cth\u003e얻는 것\u003c/th\u003e\n\u003cth\u003e포기/비용\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e보호적 풋\u003c/td\u003e\n\u003ctd\u003e폭락 걱정·보유 유지\u003c/td\u003e\n\u003ctd\u003e하락 방어\u003c/td\u003e\n\u003ctd\u003e보험료(프리미엄)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e커버드콜\u003c/td\u003e\n\u003ctd\u003e횡보·완만 상승 예상\u003c/td\u003e\n\u003ctd\u003e프리미엄 수입\u003c/td\u003e\n\u003ctd\u003e큰 상승분 양보\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e스프레드\u003c/td\u003e\n\u003ctd\u003e방향 제한 베팅\u003c/td\u003e\n\u003ctd\u003e위험 제한\u003c/td\u003e\n\u003ctd\u003e이익도 제한·복잡\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"공통점이 보이나? 이것들은 \u003cstrong\u003e'한 방 대박'이 아니라 '위험 관리·현금흐름'\u003c/strong\u003e 목적이다. \u003cstrong\u003e파생의 점잖은 사용법\u003c/strong\u003e이지. 투기로 쓰는 단순 매수·고배수 선물과는 결이 달라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. ⚠️ 그래도 명심할 것\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"방어 전략이라도 옵션은 옵션이다.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e복잡성\u003c/strong\u003e: 그릭스(3편)·만기·행사가를 모르면 의도와 다른 결과.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e비용\u003c/strong\u003e: 수수료·세금·시간가치. 잦은 거래는 비용이 갉아먹음.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e'안전해 보이는 함정'\u003c/strong\u003e: 커버드콜은 \u003cstrong\u003e급락은 그대로 다 맞으면서\u003c/strong\u003e 상승만 제한 → 만능 아님.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e우선순위\u003c/strong\u003e: 대부분의 개인은 \u003cstrong\u003e현물 분산·장기투자\u003c/strong\u003e가 먼저. 파생은 그 다음, \u003cstrong\u003e소액·방어\u003c/strong\u003e 한정.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"파생은 '대박 도구'가 아니라 '위험 관리 도구'로 보는 거군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그 한마디면 파생 트랙 졸업이다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"커버드콜 ETF는 고배당이라 무조건 좋다\"\u003c/strong\u003e ❌ → \u003cstrong\u003e급등장에선 지수에 크게 뒤처짐\u003c/strong\u003e, 급락은 그대로.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"보호적 풋 = 공짜 보험\"\u003c/strong\u003e ❌ → \u003cstrong\u003e보험료(프리미엄)\u003c/strong\u003e 비용. 자주 들면 수익 갉아먹음.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"방어 전략이니 막 써도 안전\"\u003c/strong\u003e ❌ → 옵션 특유의 \u003cstrong\u003e복잡성·비용\u003c/strong\u003e 존재. 이해 후 소액부터.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e옵션 전략 시뮬\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 파생 HTS\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e손익도(payoff) 그래프\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e커버드콜 ETF\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX / etf.com\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e분배율·기초지수\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 보호적 풋은 무엇에 비유되며 비용은?\r\n→ 주식에 드는 \u003cstrong\u003e보험\u003c/strong\u003e. 비용은 \u003cstrong\u003e풋 프리미엄(보험료)\u003c/strong\u003e — 안 빠지면 날림.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 커버드콜이 급등장에서 불리한 이유는?\r\n→ 콜을 매도해 \u003cstrong\u003e행사가 위 상승분을 양보\u003c/strong\u003e → 큰 상승을 못 따라감.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 보호적 풋·커버드콜·스프레드의 공통 목적은?\r\n→ '한 방'이 아니라 \u003cstrong\u003e위험 관리·현금흐름\u003c/strong\u003e(파생의 점잖은 사용).\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🎓 파생 트랙 졸업\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"선물·옵션 그릭스·전략까지, \u003cstrong\u003e위험을 충분히 경고하며\u003c/strong\u003e 마쳤다. 핵심은 하나 — \u003cstrong\u003e파생은 대박 도구가 아니라 위험 관리 도구\u003c/strong\u003e, 초보는 \u003cstrong\u003e소액·방어·이해 후\u003c/strong\u003e다. 이제 마지막 단계, \u003cstrong\u003e대가들의 철학과 실무\u003c/strong\u003e로 모든 걸 묶자.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 파생상품은 고위험으로 원금 이상 손실이 가능합니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"
