003cstrong\u003e호두\u003c/strong\u003e: \"주식 들고만 있어도 돈을 줘요? 공짜로요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"공짜는 아니다. 회사가 번 이익을 주주에게 나눠주는 거지. 근데 그 '나눠주는 방식'에 규칙이 있어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 배당이란 — 이익을 주주에게 나눔\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e배당\u003c/strong\u003e = 기업이 번 이익의 일부를 \u003cstrong\u003e주주에게 현금(또는 주식)으로 분배\u003c/strong\u003e하는 것.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e회사는 이익을 ① \u003cstrong\u003e재투자\u003c/strong\u003e(성장)하거나 ② \u003cstrong\u003e배당\u003c/strong\u003e(환원)한다\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e성장기업\u003c/strong\u003e은 재투자 위주(배당 적거나 0) — 예: 많은 기술 성장주\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e성숙기업\u003c/strong\u003e은 배당 위주(안정 현금흐름) — 예: 통신·유틸리티·은행\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 \u003cstrong\u003e배당이 적다고 나쁜 게 아니다.\u003c/strong\u003e 성장기업은 그 돈으로 더 키우는 거고, 성숙기업은 나눠주는 거지. **회사의 단계(산업 4편 라이프사이클)**에 달렸어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 배당 핵심 지표 2개\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e계산\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e배당수익률\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e연간 배당금 ÷ 주가\u003c/td\u003e\n\u003ctd\u003e주가 대비 몇 % 받나 (월세 수익률)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e배당성향\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e배당금 ÷ 순이익\u003c/td\u003e\n\u003ctd\u003e이익의 몇 %를 나눠주나 (지속가능성)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"둘을 \u003cstrong\u003e같이\u003c/strong\u003e 봐야 한다. 배당수익률만 높고 \u003cstrong\u003e배당성향이 100% 넘으면\u003c/strong\u003e — 번 돈보다 더 주는 거라 \u003cstrong\u003e지속 불가능\u003c/strong\u003e이야. 곧 배당이 깎일 신호지.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"배당수익률 8%! 하고 좋아했는데, 성향이 120%면 위험한 거군요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"바로 그거다. \u003cstrong\u003e'높은 배당엔 이유가 있다'\u003c/strong\u003e — 다음 편에서 이 함정을 깊이 판다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 배당 일정 — '언제 가지고 있어야' 받나\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"배당은 아무 때나 사면 받는 게 아니다. \u003cstrong\u003e기준일에 주주명부에 있어야\u003c/strong\u003e 한다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용어\u003c/th\u003e\n\u003cth\u003e뜻\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e배당기준일\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e이 날 주주여야 배당 받을 권리\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e배당락일\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e기준일 다음 거래일. 권리 사라져 주가가 배당만큼 빠짐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e지급일\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e실제 현금이 들어오는 날 (보통 한두 달 뒤)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e한국: 보통 \u003cstrong\u003e연말(12월) 결산배당\u003c/strong\u003e이 많음(+중간배당 하는 곳도)\u003c/li\u003e\n\u003cli\u003e미국: \u003cstrong\u003e분기 배당\u003c/strong\u003e이 일반적 (잭이글: \"미국은 3개월마다 따박따박!\")\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"주의! \u003cstrong\u003e배당락일엔 주가가 배당금만큼 자동으로 떨어진다.\u003c/strong\u003e 그래서 '배당 받으려 기준일 직전에 샀다가 배당락에 주가가 빠져서 본전'인 경우가 많아. \u003cstrong\u003e배당은 공짜 점심이 아니다.\u003c/strong\u003e\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. ⚠️ 배당락 — 배당은 '내 돈이 잠깐 나갔다 오는 것'에 가깝다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"초보가 꼭 오해하는 거다. 배당 1,000원을 받으면 — 그날 \u003cstrong\u003e주가도 약 1,000원 빠진다.\u003c/strong\u003e 즉 단기적으론 \u003cstrong\u003e내 자산 총액은 그대로\u003c/strong\u003e(주가↓ + 현금↑).\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"엥? 그럼 배당은 의미가 없는 거예요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"단기 차익노림엔 그렇게 보이지. 하지만 \u003cstrong\u003e장기 투자자\u003c/strong\u003e에겐 다르다. ①꾸준한 \u003cstrong\u003e현금흐름\u003c/strong\u003e(재투자·생활비)을 주고 ②\u003cstrong\u003e좋은 배당기업은 시간이 지나며 배당을 늘려\u003c/strong\u003e 주가도 회복·상승해. \u003cstrong\u003e배당의 진짜 힘은 단기가 아니라 장기·복리에 있다\u003c/strong\u003e(배당 3편).\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 배당주가 어울리는 사람\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"배당 투자가 특히 맞는 경우다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e변동성보다 \u003cstrong\u003e안정적 현금흐름\u003c/strong\u003e을 원하는 사람\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e노후·은퇴\u003c/strong\u003e 자금(따박따박 인출)\u003c/li\u003e\n\u003cli\u003e장기 \u003cstrong\u003e복리 재투자\u003c/strong\u003e로 굴리려는 사람\u003c/li\u003e\n\u003cli\u003e하락장에서 \u003cstrong\u003e버틸 심리적 쿠션\u003c/strong\u003e(배당 받으며 존버)이 필요한 사람\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"단, 고성장을 원하면 배당주만으론 아쉽다. \u003cstrong\u003e성장주와 배당주를 섞는 것\u003c/strong\u003e(포트폴리오)이 보통의 답이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"배당수익률 높으면 좋다\"\u003c/strong\u003e ❌ → \u003cstrong\u003e배당성향·이익 지속성\u003c/strong\u003e을 같이 봐야. 고배당이 곧 위험신호일 수도.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"기준일 직전에 사면 공짜 배당\"\u003c/strong\u003e ❌ → \u003cstrong\u003e배당락\u003c/strong\u003e으로 주가가 그만큼 빠짐. 단기엔 본전.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"배당 적은 회사는 나쁘다\"\u003c/strong\u003e ❌ → 성장기업은 \u003cstrong\u003e재투자\u003c/strong\u003e가 정답일 수 있음. 라이프사이클로 판단.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e배당수익률·이력\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권 종목 '배당'\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e수익률·성향·지급이력\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e배당기준일·락일\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 HTS / KIND\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e배당 공시\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e미국 배당\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eSeeking Alpha / 발행사\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e분기배당·연속증액\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 배당수익률이 높은데도 위험할 수 있는 이유는?\r\n→ **배당성향이 과도(100%↑)**하면 번 것보다 더 주는 것 → 지속 불가, 곧 삭감 위험.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 배당락일에 주가가 빠지는 이유는?\r\n→ 배당받을 \u003cstrong\u003e권리가 사라져\u003c/strong\u003e 주가가 배당금만큼 자동 조정. 단기엔 자산 총액 비슷.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 배당이 적은 성장기업을 무조건 나쁘다고 못 하는 이유는?\r\n→ 이익을 \u003cstrong\u003e재투자\u003c/strong\u003e해 더 키우는 단계일 수 있음(라이프사이클).\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [배당 2] 배당성장주 vs 고배당 함정 — 진짜 배당주를 가르는 법.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목 추천이 아닙니다. 배당은 회사 사정에 따라 삭감될 수 있습니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\
