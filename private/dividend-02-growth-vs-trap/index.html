u_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"배당 8%면 무조건 좋은 거 아니에요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그 8%가 어떻게 8%가 됐는지를 봐야 해. 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. ⚠️ 배당수익률 함정 — 8%의 두 가지 정체\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e배당수익률 = 배당금 ÷ \u003cstrong\u003e주가\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"분모가 \u003cstrong\u003e주가\u003c/strong\u003e다. 즉 \u003cstrong\u003e주가가 폭락하면 배당수익률은 저절로 치솟아.\u003c/strong\u003e 회사가 좋아진 게 아니야.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e같은 '배당수익률 8%'의 두 얼굴\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e경우\u003c/th\u003e\n\u003cth\u003e어떻게 8%가 됐나\u003c/th\u003e\n\u003cth\u003e정체\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟢 건강한 고배당\u003c/td\u003e\n\u003ctd\u003e이익 안정 + 배당 꾸준\u003c/td\u003e\n\u003ctd\u003e진짜\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🔴 함정(가치덫)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e주가 반토막\u003c/strong\u003e → 수익률만 착시로↑\u003c/td\u003e\n\u003ctd\u003e곧 배당 삭감\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"아! 주가가 망해서 8%로 보이는 거랑, 진짜 잘 줘서 8%인 거랑 다르군요.\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇다. \u003cstrong\u003e주가가 빠져서 생긴 고배당\u003c/strong\u003e은 십중팔구 '곧 배당 삭감' 신호다. 시장은 바보가 아니야 — 배당을 못 믿으니 주가를 떨어뜨린 거지. **재무편 '싼 데는 이유가 있다'**가 배당에도 똑같이 적용된다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 함정을 거르는 4가지 체크\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"고배당이 진짜인지 이렇게 검증해라.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e배당성향\u003c/strong\u003e 과도하지 않나 (이익의 80% 넘으면 경계, 100%↑면 위험)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e이익·현금흐름\u003c/strong\u003e이 안정적인가 (배당의 원천. 적자인데 배당? 위험)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e부채비율\u003c/strong\u003e이 과하지 않나 (빚내서 배당 주는 건 시한폭탄)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e배당 이력\u003c/strong\u003e — 과거에 삭감·중단한 적 있나\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"특히 ②번. \u003cstrong\u003e배당은 '이익'에서 나온다.\u003c/strong\u003e 이익이 흔들리면 배당도 흔들려. 배당수익률보다 \u003cstrong\u003e이익의 질\u003c/strong\u003e을 먼저 봐라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 배당성장주 — 매년 늘려주는 진짜\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"고배당보다 더 강한 게 \u003cstrong\u003e배당성장주\u003c/strong\u003e다. 지금 수익률은 2~3%로 낮아 보여도, \u003cstrong\u003e매년 배당을 꾸준히 늘리는\u003c/strong\u003e 회사야.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e배당귀족(Dividend Aristocrats)\u003c/strong\u003e: 미국에서 \u003cstrong\u003e25년 이상 연속 배당 증액\u003c/strong\u003e한 기업들\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e배당왕(Dividend Kings)\u003c/strong\u003e: \u003cstrong\u003e50년 이상\u003c/strong\u003e 연속 증액 (코카콜라·P\u0026#x26;G 등)\u003c/li\u003e\n\u003cli\u003e매년 늘어나는 배당 → 시간이 지나면 **'내 매입가 대비 수익률(YOC)'**이 폭등\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e예시: 매입가 10,000원, 첫 배당 3%(300원), 매년 배당 10%씩 증액\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e연차\u003c/th\u003e\n\u003cth\u003e연 배당\u003c/th\u003e\n\u003cth\u003e매입가 대비 수익률(YOC)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e1년\u003c/td\u003e\n\u003ctd\u003e300원\u003c/td\u003e\n\u003ctd\u003e3.0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10년\u003c/td\u003e\n\u003ctd\u003e약 708원\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e7.1%\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e20년\u003c/td\u003e\n\u003ctd\u003e약 1,837원\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e18.4%\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"처음엔 3%였는데 20년 뒤엔 **내 산 가격 기준 18%**를 받는다고요?!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그게 배당성장의 마법이다. 주가도 보통 배당 따라 오르지. **'지금 수익률'이 아니라 '늘어나는 힘'**을 보는 게 고수야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 고배당 vs 배당성장 — 목적에 맞게\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e유형\u003c/th\u003e\n\u003cth\u003e특징\u003c/th\u003e\n\u003cth\u003e어울리는 목적\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e고배당\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e지금 수익률 높음, 성장 느림\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e당장 현금흐름\u003c/strong\u003e(은퇴·생활비)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e배당성장\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e지금 낮지만 매년↑\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e장기 적립·복리\u003c/strong\u003e(젊은 투자자)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"은퇴자면 고배당(지금 많이), 30대면 배당성장(미래에 폭증) — \u003cstrong\u003e목적에 맞게\u003c/strong\u003e 고르는 거다. 둘 다 '건강한지' 검증은 필수고.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 함정 정리\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"배당수익률 높은 순으로 사자\"\u003c/strong\u003e ❌ → 상위권엔 \u003cstrong\u003e주가 폭락발 함정\u003c/strong\u003e이 수두룩. 이익·성향 검증.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"배당성장주는 수익률 낮아 별로\"\u003c/strong\u003e ❌ → \u003cstrong\u003eYOC가 시간이 갈수록 폭증\u003c/strong\u003e. 장기엔 더 강함.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"적자기업도 배당 주면 OK\"\u003c/strong\u003e ❌ → 빚·자본 까서 주는 배당은 \u003cstrong\u003e곧 삭감\u003c/strong\u003e. 이익이 원천.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e배당성향·이력\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권 / FnGuide\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e성향·연속배당\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e배당귀족/왕\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e미국 Dividend Aristocrats 리스트\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e25년/50년 증액\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e배당 ETF\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX / etf.com\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e배당성장 ETF로 분산\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 배당수익률 8%가 '함정'일 수 있는 메커니즘은?\r\n→ 수익률 = 배당÷\u003cstrong\u003e주가\u003c/strong\u003e라, \u003cstrong\u003e주가 폭락\u003c/strong\u003e이 수익률을 착시로 끌어올림 → 곧 배당 삭감 신호.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 'YOC(매입가 대비 수익률)'가 배당성장주에서 폭증하는 이유는?\r\n→ 매입가는 고정인데 \u003cstrong\u003e배당이 매년 늘어\u003c/strong\u003e 분자가 커지므로.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 고배당과 배당성장 중 은퇴자에게 더 맞는 쪽과 이유는?\r\n→ \u003cstrong\u003e고배당\u003c/strong\u003e. 지금 당장 \u003cstrong\u003e현금흐름\u003c/strong\u003e이 크기 때문(배당성장은 미래에 강함).\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [배당 3] 복리 재투자(DRIP) — 배당을 다시 심어 눈덩이를 굴리는 법.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목 추천이 아닙니다. 배당은 삭감될 수 있고 과거 이력이 미래를 보장하지 않습니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"classNa
