주식 사는 데 쓴다는 거죠? 그게 그렇게 대단해요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"숫자로 보면 입이 벌어질 거다. 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. DRIP — 배당 재투자의 원리\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eDRIP(Dividend Reinvestment Plan)\u003c/strong\u003e = 받은 배당으로 \u003cstrong\u003e그 주식을 또 사는\u003c/strong\u003e 것.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-markdown\"\u003e배당 받음 → 그 돈으로 주식 추가 매수 → 주식 수↑\r\n\u003cspan class=\"hljs-code\"\u003e        → 다음 배당 더 많이 받음 → 또 재투자 → 주식 수 더↑ → ...\n\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"눈덩이를 굴리는 거다. 주식 수가 늘면 배당이 늘고, 늘어난 배당으로 또 주식을 사고... \u003cstrong\u003e눈덩이가 스스로 커지는\u003c/strong\u003e 구조지. 이게 복리야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 숫자로 보는 복리의 힘\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"같은 주식, 같은 기간. \u003cstrong\u003e배당을 쓰느냐 vs 재투자하느냐\u003c/strong\u003e의 차이를 봐라.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e가정: 1,000만원 투자, 연 수익 7%(주가4% + 배당3%), 30년\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e방식\u003c/th\u003e\n\u003cth\u003e30년 후(개념적 비교)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e배당 받아서 \u003cstrong\u003e소비\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e주가성장만 → 약 3,200만원 + 그동안 쓴 배당\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e배당 \u003cstrong\u003e재투자(DRIP)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e전체 7% 복리 → \u003cstrong\u003e약 7,600만원\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"재투자가 \u003cstrong\u003e2배 이상\u003c/strong\u003e으로 벌어진다. 배당 3%가 사소해 보여도, \u003cstrong\u003e30년 복리로 굴리면\u003c/strong\u003e 결과를 뒤집어. 시간이 길수록 격차는 더 벌어지지.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"겨우 3% 배당인데 재투자하면 결과가 2배 넘게 차이나요?!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 \u003cstrong\u003e젊을수록 재투자\u003c/strong\u003e다. 시간이 네 편이거든. 복리는 \u003cstrong\u003e시간을 먹고 자라.\u003c/strong\u003e\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 복리를 키우는 3가지 조건\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"복리 엔진을 최대로 돌리는 조건이다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e조건\u003c/th\u003e\n\u003cth\u003e왜\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e시간\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e길수록 기하급수적. 가장 강력한 변수\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e재투자\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e배당·이익을 빼 쓰지 말고 다시 심기\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e비용·세금 최소화\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e새는 돈이 복리를 갉아먹음\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"특히 \u003cstrong\u003e세금\u003c/strong\u003e. 배당받을 때마다 세금 떼이면 재투자 원금이 줄어 복리가 둔해져. 그래서 **절세계좌(상품 4편)**가 여기서 빛난다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. ⭐ 절세계좌 + 배당재투자 = 최강 조합\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"상품 4편의 절세계좌를 기억하지? 배당투자와 만나면 최고의 시너지다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e일반계좌\u003c/strong\u003e: 배당받을 때마다 \u003cstrong\u003e배당소득세 15.4%\u003c/strong\u003e → 재투자 원금 감소\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e연금저축·IRP\u003c/strong\u003e: 배당에 \u003cstrong\u003e즉시 과세 안 함(과세이연)\u003c/strong\u003e → \u003cstrong\u003e온전히 재투자\u003c/strong\u003e → 복리 가속\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eISA\u003c/strong\u003e: 비과세 한도 내에서 배당 굴림\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"세금을 안 떼고 재투자하니까 눈덩이가 더 빨리 커지는 거네요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다. **'어떤 그릇(계좌)에서 배당을 굴리느냐'**가 30년 뒤 수천만원을 가른다. 장기 배당재투자는 \u003cstrong\u003e반드시 절세계좌\u003c/strong\u003e에서 — 이게 부자들의 기본기야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. TR ETF — 자동 복리 장치\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"일일이 재투자하기 귀찮으면? \u003cstrong\u003eTR(Total Return) ETF\u003c/strong\u003e(상품 1편)를 떠올려라. 분배금을 \u003cstrong\u003e자동 재투자\u003c/strong\u003e해줘서, 신경 안 써도 복리가 돌아간다. 장기 적립엔 'TR형 + 절세계좌' 조합이 깔끔하지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"배당은 받아서 쓰는 맛\"\u003c/strong\u003e ❌ → 장기 자산형성엔 \u003cstrong\u003e재투자\u003c/strong\u003e가 정답. 소비는 복리를 끊는다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"세금은 어차피 조금\"\u003c/strong\u003e ❌ → 30년 복리에선 \u003cstrong\u003e15.4%가 결과를 크게 가른다.\u003c/strong\u003e 절세계좌 활용.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"복리는 금방 효과\"\u003c/strong\u003e ❌ → 복리는 \u003cstrong\u003e후반부에 폭발\u003c/strong\u003e한다. 짧게 굴리면 위력이 안 나옴 → 시간이 핵심.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e복리 계산\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e각종 복리계산기 / 엑셀\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e재투자 시나리오 비교\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTR ETF\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX / 발행사\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e이름에 'TR'\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e절세계좌\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 연금·ISA\u003c/strong\u003e(상품 4편)\u003c/td\u003e\n\u003ctd\u003e과세이연·세액공제\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 배당 재투자(DRIP)가 복리를 만드는 메커니즘은?\r\n→ 배당으로 \u003cstrong\u003e주식 수↑ → 다음 배당↑ → 또 재투자\u003c/strong\u003e의 눈덩이 순환.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 장기 배당재투자를 절세계좌에서 하면 유리한 이유는?\r\n→ 배당에 \u003cstrong\u003e과세이연/비과세\u003c/strong\u003e로 세금이 안 빠져 \u003cstrong\u003e온전히 재투자\u003c/strong\u003e → 복리 가속.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e \"복리는 시간을 먹고 자란다\"의 의미는?\r\n→ 복리 효과는 \u003cstrong\u003e후반부에 기하급수적으로 폭발\u003c/strong\u003e → 일찍·오래 굴릴수록 위력.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🎓 배당 트랙 졸업\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"배당 기초·함정·복리재투자까지 왔다. 이제 너는 \u003cstrong\u003e'월세 주는 주식'을 고르고, 그 월세를 다시 심어 눈덩이를 굴리는\u003c/strong\u003e 법을 안다. 다음은 이 모든 걸 담는 그릇 — \u003cstrong\u003e재무제표 심화\u003c/strong\u003e와 \u003cstrong\u003e포트폴리오·리스크 관리\u003c/strong\u003e다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목·계좌 추천이 아닙니다. 수치는 이해를 돕기 위한 단순 가정이며 실제 수익을 보장하지 않습니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\"
