e호두\u003c/strong\u003e: \"금리가 오르면 왜 주식이 빠져요? 둘이 무슨 상관이에요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"오늘 그 '상관'을 뿌리부터 잡아주마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 금리는 '돈의 값'이다\u003c/h2\u003e\n\u003cp\u003e금리 = \u003cstrong\u003e돈을 빌리는 값(이자율)\u003c/strong\u003e. 돈도 수요·공급으로 값이 매겨진다.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e금리↑ = 돈이 비싸다 → 기업은 투자·대출 줄이고, 개인은 저축이 유리\u003c/li\u003e\n\u003cli\u003e금리↓ = 돈이 싸다 → 빚내서 투자·소비 늘고, 위험자산(주식)으로 돈이 몰림\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 금리는 \u003cstrong\u003e경기의 액셀과 브레이크\u003c/strong\u003e다. 중앙은행이 이 페달을 밟는다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 기준금리 vs 시장금리 — 헷갈리지 마라\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e구분\u003c/th\u003e\n\u003cth\u003e누가 정하나\u003c/th\u003e\n\u003cth\u003e무엇인가\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e기준금리\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e중앙은행 (Fed·한은)\u003c/td\u003e\n\u003ctd\u003e정책적으로 '결정'하는 금리. 출발점\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e시장금리\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시장 (채권 거래)\u003c/td\u003e\n\u003ctd\u003e국채·회사채 수익률. 매일 '변동'\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e미국 기준금리 = \u003cstrong\u003eFFR\u003c/strong\u003e(연방기금금리), 결정기구 = \u003cstrong\u003eFOMC\u003c/strong\u003e(연 8회)\u003c/li\u003e\n\u003cli\u003e한국 기준금리 = 한국은행 \u003cstrong\u003e금융통화위원회\u003c/strong\u003e(연 8회)\u003c/li\u003e\n\u003cli\u003e대표 시장금리 = \u003cstrong\u003e미국 10년물 국채금리\u003c/strong\u003e → 오늘 \u003cstrong\u003e4.54%\u003c/strong\u003e (2026-06-06 기준)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"뉴스에서 '금리 동결/인상/인하'는 \u003cstrong\u003e기준금리\u003c/strong\u003e 얘기다. 하지만 주가에 직접 작용하는 건 **시장금리(특히 미 10년물)**야. 둘은 연결돼 있지만 따로 움직일 때도 있어 — 이게 고급 포인트다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 왜 금리가 오르면 성장주가 더 빠지나 (핵심)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"주식의 가치는 \u003cstrong\u003e'미래에 벌 돈'을 현재로 당겨온 값\u003c/strong\u003e이다. 당겨올 때 \u003cstrong\u003e금리로 할인\u003c/strong\u003e한다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e현재가치 = 미래의 돈 ÷ (1 + 금리)^연수\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e금리↑ → 분모↑ → 미래 이익의 \u003cstrong\u003e현재가치↓\u003c/strong\u003e → 주가↓\u003c/li\u003e\n\u003cli\u003e특히 \u003cstrong\u003e성장주\u003c/strong\u003e는 돈을 \u003cstrong\u003e먼 미래\u003c/strong\u003e에 번다 → 할인을 세게 먹음 → \u003cstrong\u003e더 크게 하락\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e가치주·배당주\u003c/strong\u003e는 지금 당장 벌고 나눠줌 → 상대적으로 덜 타격\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"아! 그래서 금리 오른 날 나스닥(기술주)이 다우보다 더 빠지는 거군요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다. 2026-06-06 오늘도 10년물이 4.54%로 높은 가운데 **나스닥 −4.18% vs 다우 −1.35%**였지. 같은 시장이라도 금리에 맞는 종목군이 다른 거다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 통화정책 — 긴축과 완화\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e국면\u003c/th\u003e\n\u003cth\u003e중앙은행 행동\u003c/th\u003e\n\u003cth\u003e의도\u003c/th\u003e\n\u003cth\u003e주식 영향(일반적)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e긴축(tightening)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e금리 인상 · QT(양적긴축)\u003c/td\u003e\n\u003ctd\u003e과열·인플레 잡기\u003c/td\u003e\n\u003ctd\u003e역풍 (특히 성장주)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e완화(easing)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e금리 인하 · QE(양적완화)\u003c/td\u003e\n\u003ctd\u003e경기 부양\u003c/td\u003e\n\u003ctd\u003e순풍 (위험자산 선호)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eQE\u003c/strong\u003e(양적완화): 중앙은행이 채권을 사서 시중에 돈을 푸는 것\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eQT\u003c/strong\u003e(양적긴축): 반대로 돈을 거두는 것\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e점도표(dot plot)\u003c/strong\u003e: Fed 위원들이 예상하는 향후 금리 경로 → 시장이 주목\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"명심해라. 시장은 **'지금 금리'보다 '앞으로 금리가 어디로 갈지'**에 더 반응한다. 인하가 시작되기 '전에' 주가가 먼저 오르기도 해. 그래서 \u003cstrong\u003e방향과 속도\u003c/strong\u003e를 읽는 거다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 함정 — 흔한 오해들\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"초보가 꼭 빠지는 함정 셋이다.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"금리 인하 = 무조건 주가 상승\"\u003c/strong\u003e ❌\r\n→ 경기침체 때문에 어쩔 수 없이 내리는 인하라면, 오히려 폭락 신호일 수 있다. \u003cstrong\u003e왜 내리는지\u003c/strong\u003e가 중요.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"기준금리만 보면 된다\"\u003c/strong\u003e ❌\r\n→ 주가엔 **시장금리(10년물)**가 더 직접적. 기준금리 동결인데 시장금리는 급등할 수 있다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"금리는 한 나라만 보면 된다\"\u003c/strong\u003e ❌\r\n→ 한국 주식도 **미국 금리(달러 자금)**에 크게 휘둘린다. 미 10년물은 사실상 글로벌 기준.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 실전 — 금리로 시황 읽는 3단계\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"복잡하게 갈 것 없다. 이 순서면 충분해.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-markdown\"\u003e① 방향: 기준금리 인상/동결/인하 사이클 어디인가?\r\n② 레벨: 미 10년물 몇 %? (4% 넘으면 성장주 부담 구간)\r\n③ 대응: 고금리 국면 → 현금흐름 좋은 가치·배당주 비중↑\r\n\u003cspan class=\"hljs-code\"\u003e        저금리 전환 → 성장주·중소형주 비중 검토\n\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e경로\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e미 기준금리·FOMC\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eCME FedWatch\u003c/strong\u003e / Fed 홈페이지\u003c/td\u003e\n\u003ctd\u003e금리 인상확률·점도표\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e미 10년물 금리\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003einvesting.com\u003c/strong\u003e / TradingView\u003c/td\u003e\n\u003ctd\u003e\"US 10Y\" 검색\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국 기준금리\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e한국은행(bok.or.kr)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e통화정책 \u003e 기준금리\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국 시장금리\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e금융투자협회 채권정보(kofiabond)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e국고채 금리\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 금리가 오를 때 성장주가 가치주보다 더 빠지는 근본 이유는?\r\n→ 주가는 미래 이익의 \u003cstrong\u003e현재가치\u003c/strong\u003e인데, 성장주는 이익이 \u003cstrong\u003e먼 미래\u003c/strong\u003e라 \u003cstrong\u003e할인(금리)\u003c/strong\u003e 영향을 더 크게 받음.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e \"금리 인하 = 무조건 호재\"가 틀릴 수 있는 경우는?\r\n→ \u003cstrong\u003e경기침체\u003c/strong\u003e 때문에 어쩔 수 없이 내리는 인하면 폭락 신호일 수 있음. \u003cstrong\u003e인하의 이유\u003c/strong\u003e를 봐야 함.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 한국 주식인데 왜 미국 금리를 봐야 하나?\r\n→ 글로벌 달러 자금이 \u003cstrong\u003e미 10년물\u003c/strong\u003e을 기준으로 움직이며 외국인 수급·환율에 직결되기 때문.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [경제 2] 인플레이션 — 물가가 오르면 왜 중앙은행이 금리를 올릴까? CPI·PCE 읽는 법.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 금리·지수 수치는 2026-06-06 기준이며 매일 변하니 직접 확인하세요. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"
