..\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그 연결고리를 오늘 끝까지 이어주마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 인플레이션 = 돈의 가치가 떨어지는 것\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e인플레이션\u003c/strong\u003e = 물가가 지속적으로 오르는 것 = \u003cstrong\u003e돈의 구매력 하락\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e작년 1,000원 빵 → 올해 1,050원 = 물가 5%↑ = 내 돈 가치 5%↓\u003c/li\u003e\n\u003cli\u003e적당한 인플레(연 2% 안팎)는 \u003cstrong\u003e건강한 경제\u003c/strong\u003e의 신호\u003c/li\u003e\n\u003cli\u003e문제는 \u003cstrong\u003e너무 빠른\u003c/strong\u003e 인플레 → 중앙은행이 \u003cstrong\u003e금리 인상\u003c/strong\u003e으로 잡으러 옴 → 주식 역풍\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 대부분 중앙은행의 목표가 **인플레 2%**다. 이 숫자를 기억해라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 물가 지표 — CPI와 PCE\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e정식명\u003c/th\u003e\n\u003cth\u003e누가 발표\u003c/th\u003e\n\u003cth\u003e특징\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eCPI\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e소비자물가지수\u003c/td\u003e\n\u003ctd\u003e미 노동부(BLS) / 통계청\u003c/td\u003e\n\u003ctd\u003e시장이 가장 즉각 반응. 매월\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePCE\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e개인소비지출 물가\u003c/td\u003e\n\u003ctd\u003e미 상무부(BEA)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFed가 실제로 보는\u003c/strong\u003e 지표\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e근원(Core)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e식품·에너지 제외\u003c/td\u003e\n\u003ctd\u003e〃\u003c/td\u003e\n\u003ctd\u003e변동성 큰 항목 빼고 \u003cstrong\u003e추세\u003c/strong\u003e 파악\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"둘 다 **근원(Core)**을 함께 본다. 유가·농산물은 들쭉날쭉하거든. 헤드라인(전체)보다 \u003cstrong\u003e근원물가의 추세\u003c/strong\u003e가 통화정책을 결정한다.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"CPI는 시장이 보고, PCE는 Fed가 본다... 둘 다 챙겨야겠네요.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 발표 한 줄 읽는 법 — '예상치 대비'\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"초보는 'CPI 3% 나왔네' 하고 끝낸다. 고수는 \u003cstrong\u003e예상치(컨센서스)와 비교\u003c/strong\u003e한다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e발표 결과\u003c/th\u003e\n\u003cth\u003e시장 해석\u003c/th\u003e\n\u003cth\u003e흔한 반응\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e예상보다 \u003cstrong\u003e높음\u003c/strong\u003e (서프라이즈↑)\u003c/td\u003e\n\u003ctd\u003e인플레 안 잡힘 → 금리 더 오래/높게\u003c/td\u003e\n\u003ctd\u003e주가↓ 금리↑\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e예상에 \u003cstrong\u003e부합\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e불확실성 해소\u003c/td\u003e\n\u003ctd\u003e차분\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e예상보다 \u003cstrong\u003e낮음\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e인플레 둔화 → 금리 인하 기대\u003c/td\u003e\n\u003ctd\u003e주가↑ 금리↓\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"숫자 자체가 아니라 **'예상과의 차이(서프라이즈)'**가 가격을 움직인다. 이건 모든 경제지표에 통하는 원칙이야 — 4편 고용지표에서도 똑같다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 인플레 → 금리 → 주가, 전체 사슬\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-markdown\"\u003e물가 급등 → 중앙은행 금리 인상 → 시장금리(10년물)↑\r\n\u003cspan class=\"hljs-code\"\u003e        → 미래이익 할인↑ → 성장주↓ + 대출 늘린 기업 이자부담↑\r\n인플레 둔화 → 금리 인하 기대 → 할인↓ → 위험자산 선호 → 성장주↑\n\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"1편의 '금리→주가'에 \u003cstrong\u003e물가\u003c/strong\u003e를 앞에 붙인 거다. 이 사슬이 매크로의 80%야. 외워라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 인플레에 강한 자산 / 약한 자산\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e인플레에 강함 (헤지)\u003c/th\u003e\n\u003cth\u003e인플레에 약함\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e원자재·에너지·금\u003c/td\u003e\n\u003ctd\u003e장기채권\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e가격전가력 있는 기업(브랜드·필수재)\u003c/td\u003e\n\u003ctd\u003e빚 많은 성장주\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e리츠(임대료 인상) · 배당성장주\u003c/td\u003e\n\u003ctd\u003e현금(구매력 하락)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"여기서 핵심은 \u003cstrong\u003e가격전가력\u003c/strong\u003e이다. 원가가 올라도 소비자에게 \u003cstrong\u003e값을 올려 떠넘길 수 있는 기업\u003c/strong\u003e(코카콜라·애플 같은 브랜드)은 인플레를 견딘다. 떠넘기지 못하는 기업은 마진이 깎여.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정 — 디플레이션과 스태그플레이션\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"인플레만 무서운 게 아니다. 반대와 변종도 알아둬라.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e디플레이션\u003c/strong\u003e: 물가가 \u003cem\u003e지속 하락\u003c/em\u003e → 소비 미룸 → 경기 위축의 악순환(일본 '잃어버린 30년'). 인플레보다 \u003cstrong\u003e더 무서울 수\u003c/strong\u003e 있다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e스태그플레이션\u003c/strong\u003e: \u003cem\u003e경기 침체(stagnation) + 물가 상승(inflation)\u003c/em\u003e 동시 발생 → 중앙은행이 \u003cstrong\u003e금리를 올리지도 내리지도 못하는\u003c/strong\u003e 최악. 1970년대 오일쇼크가 대표.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"물가가 내려도 나쁠 수 있다니... 결국 \u003cstrong\u003e2% 안팎의 적당한 인플레\u003c/strong\u003e가 제일 건강하군요.\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이제 좀 보이는구나.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e미 CPI/PCE\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003einvesting.com 경제캘린더\u003c/strong\u003e / BLS·BEA\u003c/td\u003e\n\u003ctd\u003e발표일·예상치·실제 한눈에\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e미국 물가 데이터\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFRED\u003c/strong\u003e(fred.stlouisfed.org)\u003c/td\u003e\n\u003ctd\u003e\"CPI\", \"PCE\" 검색, 장기 그래프\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국 소비자물가\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e통계청 KOSIS\u003c/strong\u003e / 한국은행 ECOS\u003c/td\u003e\n\u003ctd\u003e월별 CPI·근원물가\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e Fed가 통화정책에서 CPI보다 더 중시하는 물가 지표는?\r\n→ \u003cstrong\u003ePCE\u003c/strong\u003e(특히 근원 PCE). CPI는 시장이 즉각 반응하는 지표.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e CPI가 3%로 나왔는데 주가가 급등했다. 어떻게 가능한가?\r\n→ \u003cstrong\u003e예상치(컨센서스)보다 낮게\u003c/strong\u003e 나왔다면 인플레 둔화로 해석돼 호재. 숫자가 아니라 \u003cstrong\u003e예상 대비\u003c/strong\u003e가 핵심.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 스태그플레이션이 최악인 이유는?\r\n→ 침체엔 금리를 내려야 하고 인플레엔 올려야 하는데 \u003cstrong\u003e둘이 동시\u003c/strong\u003e라 중앙은행이 손발이 묶임.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [경제 3] 경기순환 \u0026#x26; 성장지표 — GDP·경기선행지수로 지금이 사계절 중 어디인지 읽기.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 물가·금리는 매월 변하니 발표 일정과 실제 수치를 직접 확인하세요. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\
