걸 \u003cstrong\u003e숫자로\u003c/strong\u003e 어떻게 알아요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"오늘 그 계기판을 읽는 법을 알려주마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 경기의 사계절\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e        회복(봄)  →  확장(여름)  →  둔화(가을)  →  침체(겨울)  →  다시 회복\n\u003c/code\u003e\u003c/pre\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e국면\u003c/th\u003e\n\u003cth\u003e특징\u003c/th\u003e\n\u003cth\u003e금리·물가\u003c/th\u003e\n\u003cth\u003e강한 자산(일반적)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e회복(봄)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e바닥 찍고 반등\u003c/td\u003e\n\u003ctd\u003e저금리·저물가\u003c/td\u003e\n\u003ctd\u003e경기민감주·중소형주·기술주\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e확장(여름)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e성장 가속\u003c/td\u003e\n\u003ctd\u003e금리·물가 상승\u003c/td\u003e\n\u003ctd\u003e원자재·에너지·산업재\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e둔화(가을)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e과열 후 식음\u003c/td\u003e\n\u003ctd\u003e고금리·고물가\u003c/td\u003e\n\u003ctd\u003e필수소비재·헬스케어(방어)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e침체(겨울)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e역성장·실업↑\u003c/td\u003e\n\u003ctd\u003e금리 인하 시작\u003c/td\u003e\n\u003ctd\u003e국채·현금·배당주\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이게 \u003cstrong\u003e섹터 로테이션\u003c/strong\u003e의 뼈대다. 같은 돈도 계절 따라 다른 섹터로 흐른다. 자세한 건 나중에 산업·섹터 편에서 깊이 판다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. GDP — 경제의 키와 몸무게\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eGDP(국내총생산)\u003c/strong\u003e = 한 나라가 일정 기간 만든 부가가치의 총합 = 경제 규모\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e성장률\u003c/strong\u003e로 본다: 전분기/전년 대비 몇 % 성장?\u003c/li\u003e\n\u003cli\u003e**경기침체(Recession)**의 통념적 정의 = GDP가 \u003cstrong\u003e2개 분기 연속 마이너스\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e단, GDP는 \u003cstrong\u003e과거\u003c/strong\u003e 데이터(이미 지난 분기) → \u003cstrong\u003e후행지표\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"GDP는 '이미 끝난 시험 성적'이야. 중요하지만 \u003cstrong\u003e늦다.\u003c/strong\u003e 그래서 투자자는 **앞을 보는 지표(선행지표)**를 더 챙긴다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 선행 · 동행 · 후행지표\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"지표는 \u003cstrong\u003e시점\u003c/strong\u003e으로 나뉜다. 이걸 구분 못 하면 백미러 보며 운전하는 거다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종류\u003c/th\u003e\n\u003cth\u003e미래/현재/과거\u003c/th\u003e\n\u003cth\u003e예시\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e선행지표\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e앞을 예고\u003c/td\u003e\n\u003ctd\u003e장단기 금리차, \u003cstrong\u003ePMI(구매관리자지수)\u003c/strong\u003e, 신규주문, 주가 자체, 건축허가\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e동행지표\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e지금 상태\u003c/td\u003e\n\u003ctd\u003e산업생산, 소매판매, 고용\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e후행지표\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e뒤늦게 확인\u003c/td\u003e\n\u003ctd\u003eGDP, 실업률, CPI\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePMI\u003c/strong\u003e: 기업 구매담당자 설문. \u003cstrong\u003e50 기준\u003c/strong\u003e → 넘으면 확장, 밑이면 위축. 가장 인기 있는 선행지표\u003c/li\u003e\n\u003cli\u003e주식시장 자체가 대표적 \u003cstrong\u003e선행지표\u003c/strong\u003e → 경기 바닥보다 주가가 먼저 돈다\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그래서 '뉴스는 최악인데 주가는 오르네?' 같은 일이 생기는 거군요. 주가가 \u003cstrong\u003e먼저\u003c/strong\u003e 움직여서!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다. 시장은 6개월~1년 앞을 미리 반영해. \u003cstrong\u003e현재가 나쁘다고 주식이 계속 빠지는 게 아니다.\u003c/strong\u003e\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 시황을 한 장으로 — 오늘(2026-06-06) 예시\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"1~3편을 합쳐 오늘을 읽어보자. 실데이터다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e신호\u003c/th\u003e\n\u003cth\u003e값\u003c/th\u003e\n\u003cth\u003e읽기\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e미 10년물\u003c/td\u003e\n\u003ctd\u003e4.54% (고금리)\u003c/td\u003e\n\u003ctd\u003e둔화/긴축 색채\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVIX(공포)\u003c/td\u003e\n\u003ctd\u003e21.5 (+40%)\u003c/td\u003e\n\u003ctd\u003e불안 확대\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e나스닥 vs 다우\u003c/td\u003e\n\u003ctd\u003e−4.2% vs −1.4%\u003c/td\u003e\n\u003ctd\u003e성장주 집중 매도\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"고금리 + 공포 확대 + 성장주 약세 → \u003cstrong\u003e'가을(둔화)'의 색\u003c/strong\u003e이 짙은 날이다. 이럴 땐 ②검증을 거쳐 \u003cstrong\u003e방어적 비중\u003c/strong\u003e을 점검하는 거지. 단, 하루치로 계절을 단정하면 안 돼 — \u003cstrong\u003e추세\u003c/strong\u003e로 봐야 한다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 함정 — 경기와 주가를 헷갈리지 마라\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"초보가 꼭 틀리는 것들.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"경기 좋아질 때까지 기다렸다 사자\"\u003c/strong\u003e ❌ → 주가는 \u003cstrong\u003e선행\u003c/strong\u003e. 좋아진 게 확인되면 이미 많이 올라 있다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"GDP 좋게 나왔으니 지금 사자\"\u003c/strong\u003e ❌ → GDP는 \u003cstrong\u003e후행\u003c/strong\u003e. 시장은 이미 반영했을 수 있다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"리세션 = 무조건 주식 끝\"\u003c/strong\u003e ❌ → 침체 \u003cstrong\u003e막바지\u003c/strong\u003e에 주가는 바닥을 다지고 \u003cstrong\u003e먼저 반등\u003c/strong\u003e하기도.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e미 GDP·PMI\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003einvesting.com 경제캘린더\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eISM 제조업/서비스 PMI\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e장단기 금리차\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFRED\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\"10Y-2Y\" (5편에서 상세)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국 경기지표\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e통계청 KOSIS / 한국은행 ECOS\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e경기선행지수, 산업생산\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e글로벌 경기\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eOECD 경기선행지수(CLI)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e국가별 비교\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e GDP가 선행지표가 아니라 후행지표인 이유는?\r\n→ 이미 \u003cstrong\u003e지난 분기\u003c/strong\u003e의 결과라 시장은 그전에 반영함. 앞을 보려면 PMI·금리차 등 \u003cstrong\u003e선행지표\u003c/strong\u003e를 봐야 함.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e PMI 48이 나왔다. 무슨 뜻인가?\r\n→ \u003cstrong\u003e50 미만 = 경기 위축\u003c/strong\u003e 신호 (구매관리자들이 활동 축소).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e \"뉴스는 최악인데 주가가 오른다\"가 가능한 이유는?\r\n→ 주식시장은 \u003cstrong\u003e선행지표\u003c/strong\u003e라 6개월~1년 앞의 회복을 미리 반영하기 때문.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [경제 4] 고용지표 — 실업률·비농업고용(NFP)에 왜 시장이 출렁이나.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 경기 국면은 추세로 판단해야 하며 단일 수치로 단정할 수 없습니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-20\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🌍 [경제 3] 경기순환 — 지금은 사계절 중 어디인가\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"🌍 [경제 3] 경기순환 — 지금은 사계절 중 어디인가 | midasworld (Private)\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"서버 개발 학습 블로그\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href
