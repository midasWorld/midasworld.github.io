\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"상식적으론 그렇지. 근데 시장은 한 발 더 간다. 오늘 그 논리를 잡아주마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 왜 주식쟁이가 고용을 보나 — Fed의 '이중책무'\u003c/h2\u003e\n\u003cp\u003e미국 중앙은행(Fed)은 법으로 \u003cstrong\u003e두 가지 목표\u003c/strong\u003e를 진다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e① 물가 안정 (2%)  +  ② 최대 고용\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e그래서 Fed는 \u003cstrong\u003e고용지표\u003c/strong\u003e를 보고 금리를 정한다 → 고용이 금리를 움직이고, 금리가 주가를 움직인다(1편)\u003c/li\u003e\n\u003cli\u003e즉 고용지표는 **'금리의 선행 단서'**다. 그래서 주식쟁이가 본다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"1·2편의 사슬을 기억하지? \u003cstrong\u003e고용 → Fed 판단 → 금리 → 주가.\u003c/strong\u003e 고용은 이 사슬의 앞단이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 핵심 고용지표 3종\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e무엇\u003c/th\u003e\n\u003cth\u003e발표\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e비농업고용(NFP)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e농업 뺀 신규 일자리 수\u003c/td\u003e\n\u003ctd\u003e매월 첫 금요일\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e시장 최대어\u003c/strong\u003e. 월 20만↑면 견조\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e실업률\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e실업자 ÷ 경제활동인구\u003c/td\u003e\n\u003ctd\u003e〃\u003c/td\u003e\n\u003ctd\u003e낮을수록 과열, 단 \u003cstrong\u003e후행\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e시간당 임금\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e임금 상승률\u003c/td\u003e\n\u003ctd\u003e〃\u003c/td\u003e\n\u003ctd\u003e임금↑ → 인플레 압력 → 금리↑\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"특히 \u003cstrong\u003e시간당 임금\u003c/strong\u003e을 놓치지 마라. 임금이 빨리 오르면 → 기업 비용↑ + 소비여력↑ → \u003cstrong\u003e인플레\u003c/strong\u003e 자극 → Fed가 금리를 못 내린다. 고용 숫자만큼 \u003cstrong\u003e임금\u003c/strong\u003e이 중요해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 'Good news is bad news' — 청개구리 장세\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이제 첫 질문의 답이다. \u003cstrong\u003e고금리 국면\u003c/strong\u003e에선 이런 일이 벌어진다.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-arduino\"\u003e고용 너무 강함 → 경기 과열·임금↑ → Fed가 금리 인하 미룸/인상\r\n            → 시장금리↑ → 주가↓   (\u003cspan class=\"hljs-string\"\u003e'좋은 뉴스가 나쁜 뉴스'\u003c/span\u003e)\r\n\r\n고용 식음     → 경기 둔화 우려 but 금리 인하 기대↑\r\n            → 때로 주가↑          (\u003cspan class=\"hljs-string\"\u003e'나쁜 뉴스가 좋은 뉴스'\u003c/span\u003e)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"아! \u003cstrong\u003e금리 인하를 기다리는 장\u003c/strong\u003e에선, 고용이 너무 좋으면 '인하가 늦어지겠네' 해서 실망하는 거군요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다. 단 \u003cstrong\u003e항상\u003c/strong\u003e 그런 건 아니야. \u003cstrong\u003e침체 공포가 큰 국면\u003c/strong\u003e에선 반대로 '고용 좋다=경기 튼튼'으로 환영받는다. \u003cstrong\u003e그 시점에 시장이 뭘 더 무서워하는가\u003c/strong\u003e(인플레냐 침체냐)에 따라 해석이 뒤집혀. 이게 고급 포인트다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 원칙은 똑같다 — '예상치 대비'\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"2편에서 배운 그 원칙, 고용에도 그대로다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eNFP 발표\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003cth\u003e고금리 국면 반응(일반)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e예상 \u003cstrong\u003e크게 상회\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e경기 과열·금리 부담\u003c/td\u003e\n\u003ctd\u003e주가↓ 금리↑\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e예상 부합\u003c/td\u003e\n\u003ctd\u003e무난\u003c/td\u003e\n\u003ctd\u003e차분\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e예상 \u003cstrong\u003e크게 하회\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e둔화 신호\u003c/td\u003e\n\u003ctd\u003e인하기대 vs 침체공포 \u003cstrong\u003e양면\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"숫자 자체가 아니라 **'예상과의 차이'**가 가격을 흔든다. 금리·물가·고용 — 모든 지표의 공통 법칙이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 함정 — 실업률의 두 얼굴\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"초보가 헷갈리는 것들.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"실업률 낮으면 무조건 좋다\"\u003c/strong\u003e ❌ → 너무 낮으면 \u003cstrong\u003e과열·임금인플레\u003c/strong\u003e 신호로 읽혀 금리 부담. 또 실업률은 \u003cstrong\u003e후행지표\u003c/strong\u003e라 침체를 미리 못 잡는다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"실업률만 보면 된다\"\u003c/strong\u003e ❌ → \u003cstrong\u003e경제활동참가율\u003c/strong\u003e이 떨어져서(구직 포기) 실업률이 '착시'로 낮아질 수 있다. 숫자 뒤를 봐라.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"고용=항상 호재/악재\"\u003c/strong\u003e ❌ → 같은 숫자도 **국면(인플레 걱정 vs 침체 걱정)**에 따라 해석이 정반대.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e미 NFP·실업률·임금\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003einvesting.com 경제캘린더\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e매월 첫 금요일, 예상치·실제\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e미 고용 상세\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eBLS\u003c/strong\u003e(bls.gov)\u003c/td\u003e\n\u003ctd\u003e고용보고서 원문\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국 고용동향\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e통계청 KOSIS\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e매월 취업자 증감·실업률\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFed의 시각\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFOMC 성명·기자회견\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e'고용시장 평가' 문구\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 주식 투자자가 고용지표를 챙기는 근본 이유는?\r\n→ Fed가 **고용(이중책무)**을 보고 \u003cstrong\u003e금리\u003c/strong\u003e를 정하고, 금리가 주가를 움직이기 때문. 고용은 금리의 선행 단서.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 금리 인하를 기다리는 장에서 NFP가 예상보다 너무 강하면 왜 악재가 되나?\r\n→ 경기 과열·임금↑로 \u003cstrong\u003e인하가 미뤄질\u003c/strong\u003e 거란 우려 → 'good news is bad news'.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 실업률이 낮아졌는데 마냥 좋다고 못 하는 이유 하나는?\r\n→ **구직 포기(참가율 하락)**로 인한 착시일 수 있고, 과열 시 임금인플레 신호이며, 애초에 \u003cstrong\u003e후행지표\u003c/strong\u003e라 침체를 못 잡음.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [경제 5] 채권·수익률곡선 — 장단기 금리차가 역전되면 왜 '침체 경보'인가.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 지표 해석은 시장 국면에 따라 달라지며 단일 수치로 단정할 수 없습니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-19\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🌍 [경제 4] 고용지표 — 왜 '고용이 좋은데' 주가가 빠지나\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"🌍 [경제 4] 고용지표 — 왜 '고용이 좋은데' 주가가 빠지나 | midasworld (Private)\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"서버 개발 학습 블로그\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L16\",\"3\",{}]]\n"])</script></body></html>
