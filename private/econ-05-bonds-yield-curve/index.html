c/strong\u003e: \"채권은 그냥 안전한 거 아니에요? 그게 주식이랑 무슨 상관이...\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그 '안전한 것'이 주식의 \u003cstrong\u003e기준점\u003c/strong\u003e이자 \u003cstrong\u003e경쟁자\u003c/strong\u003e다. 차근차근 가자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 채권 기본 — 가격과 금리는 반대로 움직인다\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e채권\u003c/strong\u003e = 돈을 빌려주고 받는 차용증. 만기에 원금 + 정해진 이자.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📌 \u003cstrong\u003e채권 가격 ↑ = 채권 금리(수익률) ↓\u003c/strong\u003e (반대 방향!)\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e왜? 이미 발행된 '연 3% 채권'이 있는데 신규 채권이 '연 5%'로 나오면 → 3%짜리는 인기 없어 \u003cstrong\u003e값이 떨어진다\u003c/strong\u003e → 떨어진 값에 사면 수익률이 5%에 맞춰짐\u003c/li\u003e\n\u003cli\u003e그래서 \u003cstrong\u003e\"금리가 올랐다\" = \"채권값이 떨어졌다\"\u003c/strong\u003e 는 같은 말\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이 역관계만 잡아도 뉴스가 달리 보인다. '국채금리 급등'은 '채권 투자자들이 채권을 팔았다'는 뜻이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 채권은 주식의 '중력의 기준점'\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"1편에서 금리를 '중력'이라 했지? 그 중력의 \u003cstrong\u003e기준이 국채금리\u003c/strong\u003e다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e미 10년물 국채 = 무위험 수익률의 대표\u003c/strong\u003e → 오늘 \u003cstrong\u003e4.54%\u003c/strong\u003e (2026-06-06)\u003c/li\u003e\n\u003cli\u003e주식의 기대수익률은 이 4.54%와 \u003cstrong\u003e경쟁\u003c/strong\u003e한다 → \"위험한 주식이 안전한 4.5%보다 나은가?\"\u003c/li\u003e\n\u003cli\u003e국채금리↑ → 안전자산 매력↑ → 위험자산(주식)에서 돈이 빠질 유인\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 10년물이 4%를 넘어서면 성장주가 특히 힘들어해. **'안전하게 4.5% 받지 왜 위험을 지냐'**는 압력이지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 수익률곡선 — 만기별 금리를 이은 선\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"국채는 만기가 다양하다(3개월·2년·10년·30년). 만기별 금리를 이으면 \u003cstrong\u003e수익률곡선\u003c/strong\u003e이 된다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e곡선 모양\u003c/th\u003e\n\u003cth\u003e무슨 뜻\u003c/th\u003e\n\u003cth\u003e경기 신호\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e우상향(정상)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e장기금리 \u003e 단기금리\u003c/td\u003e\n\u003ctd\u003e정상·완만한 성장 기대\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e평탄(flat)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e장단기 비슷\u003c/td\u003e\n\u003ctd\u003e전환기·불확실\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e역전(inverted)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e단기금리 \u003e 장기금리\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e⚠️ \u003cstrong\u003e침체 경보\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e보통은 돈을 오래 빌려주면 금리를 더 받는다(우상향) → 당연\u003c/li\u003e\n\u003cli\u003e그런데 **단기금리가 장기보다 높아지는 '역전'**은 비정상 신호\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 장단기 금리차 역전 = 침체 경보 (핵심)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"가장 유명한 게 \u003cstrong\u003e10년물 − 2년물\u003c/strong\u003e 금리차다. 이게 **마이너스(역전)**가 되면 역사적으로 1~2년 뒤 \u003cstrong\u003e경기침체\u003c/strong\u003e가 잦았어.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"왜 역전되면 침체가 와요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"직관은 이렇다. **'곧 경기가 나빠져 Fed가 금리를 내릴 것'**이라고 시장이 보면, 미래 금리를 반영하는 \u003cstrong\u003e장기금리가 먼저 내려가\u003c/strong\u003e → 단기보다 낮아져 역전된다. 즉 역전은 **'시장이 미리 침체를 베팅'**하는 거야.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ 단, 역전은 \u003cstrong\u003e'경보'지 '타이머'가 아니다.\u003c/strong\u003e 역전 후 침체까지 몇 달~2년 시차가 크고, 안 온 적도 있다. \u003cstrong\u003e만능 예언이 아니라 확률 높은 경고등\u003c/strong\u003e으로 봐라.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 신용 스프레드 — 또 하나의 경보기\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"하나 더. \u003cstrong\u003e회사채 금리 − 국채 금리 = 신용 스프레드\u003c/strong\u003e다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e스프레드 \u003cstrong\u003e확대\u003c/strong\u003e = 투자자가 부도 위험을 크게 본다 = 공포·경기불안\u003c/li\u003e\n\u003cli\u003e스프레드 \u003cstrong\u003e축소\u003c/strong\u003e = 안심·위험선호\u003c/li\u003e\n\u003cli\u003e특히 \u003cstrong\u003e하이일드(정크본드) 스프레드\u003c/strong\u003e가 급히 벌어지면 위기 신호\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"주가가 멀쩡해 보여도 \u003cstrong\u003e신용 스프레드가 슬금슬금 벌어지면\u003c/strong\u003e 채권시장이 먼저 겁먹은 거다. 주식보다 채권이 똑똑할 때가 많아.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"금리 오르면 채권은 안전하니 사자\"\u003c/strong\u003e ❌ → 금리 상승기엔 \u003cstrong\u003e채권 가격이 떨어진다.\u003c/strong\u003e 장기채일수록 더 크게 손실(듀레이션).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"역전됐으니 당장 다 팔자\"\u003c/strong\u003e ❌ → 역전 후에도 주가가 한참 오른 적 많다. \u003cstrong\u003e경보지 매도 타이머 아님.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"주식만 보면 된다\"\u003c/strong\u003e ❌ → \u003cstrong\u003e채권시장이 더 빨리\u003c/strong\u003e 위험을 반영한다. 국채금리·스프레드를 곁들여 봐라.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e미 국채금리(2Y·10Y)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003einvesting.com\u003c/strong\u003e / TradingView\u003c/td\u003e\n\u003ctd\u003e\"US 2Y\", \"US 10Y\"\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e장단기 금리차\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFRED\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\"T10Y2Y\" 검색, 0 밑이면 역전\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e신용 스프레드\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFRED\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\"BAMLH0A0HYM2\"(하이일드)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국 국고채\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e금융투자협회 채권정보\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e3Y·10Y 국고채\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e \"국채금리가 급등했다\"를 채권 가격으로 바꿔 말하면?\r\n→ \u003cstrong\u003e채권 가격이 급락했다\u003c/strong\u003e (금리와 가격은 반대).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 10년물−2년물이 마이너스(역전)면 무슨 신호이고, 왜 생기나?\r\n→ \u003cstrong\u003e침체 경보\u003c/strong\u003e. 시장이 미래 금리 인하(=경기 악화)를 예상해 \u003cstrong\u003e장기금리가 먼저 내려가\u003c/strong\u003e 단기보다 낮아짐.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 역전을 '타이머'로 쓰면 안 되는 이유는?\r\n→ 역전~침체까지 \u003cstrong\u003e시차가 크고 불규칙\u003c/strong\u003e하며 빗나간 적도 있음. 확률 높은 \u003cstrong\u003e경고등\u003c/strong\u003e일 뿐.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [경제 6] 환율 — 원/달러 1,559원, 외국인은 왜 환율에 따라 사고팔까.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 금리·스프레드는 매일 변하니 직접 확인하세요. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-g
