갈 때나 보는 거 아니에요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇게 생각하면 큰일 난다. 환율은 \u003cstrong\u003e돈의 국경을 넘는 흐름\u003c/strong\u003e이야. 외국인이 한국 주식을 사고파는 핵심 이유 중 하나지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 환율 = 두 나라 돈의 교환비\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e원/달러 환율 1,559\u003c/strong\u003e = 1달러를 사려면 1,559원 필요\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e표현\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003cth\u003e누가 유리\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e환율 \u003cstrong\u003e상승\u003c/strong\u003e(1,516→1,559)\u003c/td\u003e\n\u003ctd\u003e원화 \u003cstrong\u003e약세\u003c/strong\u003e(가치↓) / 달러 강세\u003c/td\u003e\n\u003ctd\u003e수출기업·달러 보유자\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e환율 \u003cstrong\u003e하락\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e원화 \u003cstrong\u003e강세\u003c/strong\u003e(가치↑) / 달러 약세\u003c/td\u003e\n\u003ctd\u003e수입기업·해외여행·미장 투자자\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"헷갈리지 마라. \u003cstrong\u003e환율 숫자가 오르면 원화는 약해진 거다.\u003c/strong\u003e '원화 약세 = 1달러 받는 데 원화가 더 든다'.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 환율은 무엇으로 정해지나 — 3대 힘\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"환율은 복잡하지만 큰 힘은 셋이다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e힘\u003c/th\u003e\n\u003cth\u003e원리\u003c/th\u003e\n\u003cth\u003e예\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e금리차\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e금리 높은 나라로 돈이 몰림\u003c/td\u003e\n\u003ctd\u003e미 금리↑ → 달러 강세 → 원화 약세\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e무역수지\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e수출 많으면 달러 유입 → 자국통화 강세\u003c/td\u003e\n\u003ctd\u003e한국 수출↑ → 원화 강세 요인\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e위험선호\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e불안하면 안전한 달러로 도피\u003c/td\u003e\n\u003ctd\u003e위기 → '달러 사재기' → 원화 약세\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"오늘을 보자. \u003cstrong\u003e미 금리 4.54%로 높고(금리차) + 글로벌 위험회피(VIX 급등)\u003c/strong\u003e → 둘 다 \u003cstrong\u003e달러 강세·원화 약세\u003c/strong\u003e 방향이야. 그래서 환율이 1,559까지 오른 거다. 환율 하나에 1·5편이 다 녹아 있지?\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 환율과 한국 증시 — 외국인의 '숨은 손익'\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"외국인이 한국 주식을 살 땐 \u003cstrong\u003e달러를 원화로 바꿔\u003c/strong\u003e 산다. 팔 땐 다시 달러로 바꿔 나가지. 그래서 외국인의 진짜 손익은 \u003cstrong\u003e주가 손익 + 환 손익\u003c/strong\u003e이야.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"아! 주가가 올라도 \u003cstrong\u003e원화가 약해지면\u003c/strong\u003e 달러로 바꿀 때 손해네요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"바로 그거다. 그래서 \u003cstrong\u003e원화 약세가 예상되면 외국인이 한국 주식을 판다\u003c/strong\u003e — 환차손을 피하려고. 환율↑ → 외국인 매도 → 국장 약세. 오늘이 딱 그 그림이지. **'환율과 코스피는 대체로 반대로 움직인다'**는 게 여기서 나와.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 환율과 종목 — 누가 웃고 누가 우나\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e원화 약세(환율↑) 수혜\u003c/th\u003e\n\u003cth\u003e원화 약세 피해\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e수출주\u003c/strong\u003e(자동차·반도체·조선) — 달러로 벌어 원화로 환산 시 이익↑\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e수입·내수\u003c/strong\u003e(항공·여행·정유 원료) — 원가↑\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e달러 매출 비중 큰 기업\u003c/td\u003e\n\u003ctd\u003e외화부채 많은 기업(상환 부담↑)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"단순히 '환율 오르면 수출주 사라'가 아니다. \u003cstrong\u003e그 수출주가 부품을 수입\u003c/strong\u003e하면 원가도 오른다. \u003cstrong\u003e순효과\u003c/strong\u003e를 봐야 해. 그래도 큰 그림은 '원화 약세 = 수출주 상대적 유리'다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 미장 투자자의 환율 — 잭이글의 한마디\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/jake_explaining.png\" alt=\"잭이글\"\u003e 🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"미장 하는 호두! 너한텐 환율이 \u003cstrong\u003e양날의 검\u003c/strong\u003e이야. 달러로 산 미국 주식은 — \u003cstrong\u003e원화 약세면 환차익\u003c/strong\u003e(달러자산 가치↑), \u003cstrong\u003e원화 강세면 환차손\u003c/strong\u003e. 그리고 살 때 1,559원에 환전하면 \u003cstrong\u003e비싸게 사는\u003c/strong\u003e 거지. 그래서 \u003cstrong\u003e분할 환전\u003c/strong\u003e으로 평균을 내는 거야. 미장 수익 = 주가 손익 + \u003cstrong\u003e환 손익\u003c/strong\u003e − 세금, 잊지 마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"환율 오르면 무조건 수출주 사자\"\u003c/strong\u003e ❌ → 수입 원가·외화부채도 봐야 함. \u003cstrong\u003e순효과\u003c/strong\u003e 확인.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"환율은 주식과 무관\"\u003c/strong\u003e ❌ → 외국인 수급의 핵심 변수. \u003cstrong\u003e환율↑ ≈ 코스피 약세\u003c/strong\u003e 경향.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"환율은 예측 가능\"\u003c/strong\u003e ❌ → 세계에서 가장 예측 어려운 변수 중 하나. \u003cstrong\u003e방향성과 수급 영향\u003c/strong\u003e만 읽고, 베팅 대상으로 삼지 마라.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e원/달러\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권 / investing.com\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\"USD/KRW\"\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e달러인덱스(DXY)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003einvesting.com\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e달러의 전반적 강약 (오늘 100.07)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e외국인 수급\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권 / KRX\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e외국인 순매수/순매도 일별\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e환율 변동요인\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e한국은행 ECOS\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e경상수지·외환보유액\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 원/달러 환율이 1,516→1,559로 올랐다. 원화는 강해졌나 약해졌나?\r\n→ \u003cstrong\u003e약해졌다\u003c/strong\u003e(원화 약세). 1달러 사는 데 원화가 더 들기 때문.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 원화 약세가 예상될 때 외국인이 한국 주식을 파는 이유는?\r\n→ 나중에 달러로 바꿀 때 \u003cstrong\u003e환차손\u003c/strong\u003e이 나므로. 그래서 환율↑ ≈ 코스피 약세.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 미장 투자자에게 원화 약세는 호재인가 악재인가?\r\n→ 보유 중이면 \u003cstrong\u003e환차익(호재)\u003c/strong\u003e, 새로 환전해 살 땐 \u003cstrong\u003e비싸게 사는 셈(불리)\u003c/strong\u003e. 그래서 분할 환전.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [경제 7] 원자재·유가·금 — 인플레 헤지와 경기의 바로미터.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 환율은 예측이 매우 어려우며 수치는 매일 변합니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"s
