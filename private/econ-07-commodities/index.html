03c/strong\u003e: \"기름값, 금값이 제 주식이랑 무슨 상관이에요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"엄청난 상관이 있다. 하나씩 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 유가(원유) — 인플레와 섹터의 스위치\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"원유는 \u003cstrong\u003e거의 모든 물건의 원가\u003c/strong\u003e에 들어간다. 운송·플라스틱·화학·난방... 그래서 유가는 \u003cstrong\u003e인플레의 주범\u003c/strong\u003e이자 \u003cstrong\u003e섹터 손익의 스위치\u003c/strong\u003e야.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e유가 상승\u003c/th\u003e\n\u003cth\u003e영향\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e인플레 압력↑\u003c/td\u003e\n\u003ctd\u003e→ 금리 인상 압력(1·2편으로 연결)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e수혜\u003c/strong\u003e: 정유·에너지·조선\u003c/td\u003e\n\u003ctd\u003e매출·마진↑\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e피해\u003c/strong\u003e: 항공·운송·화학\u003c/td\u003e\n\u003ctd\u003e연료·원료비↑ → 마진↓\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e대표 유종: \u003cstrong\u003eWTI\u003c/strong\u003e(미국), \u003cstrong\u003e브렌트\u003c/strong\u003e(유럽/글로벌)\u003c/li\u003e\n\u003cli\u003e유가 급등은 \u003cstrong\u003e스태그플레이션\u003c/strong\u003e(2편)의 단골 방아쇠 — 1970년대 오일쇼크\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 유가 차트는 에너지주 투자자만 보는 게 아니다. \u003cstrong\u003e인플레 → 금리\u003c/strong\u003e를 미리 가늠하는 선행 단서로 모두가 본다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 금(Gold) — 안전자산이자 실질금리의 거울\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"금은 이자도 배당도 없다. 그런데 왜 사느냐? \u003cstrong\u003e세 가지 얼굴\u003c/strong\u003e 때문이다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e금의 얼굴\u003c/th\u003e\n\u003cth\u003e언제 빛나나\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e안전자산\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e위기·전쟁·공포(VIX↑) 때 도피처\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e인플레 헤지\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e화폐가치 하락 시 실물로 보존\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e무이자 자산\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e실질금리(명목금리−물가)\u003c/strong\u003e 낮을수록 매력↑\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"금은 이자가 없는데, 금리가 높으면 왜 불리해요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"좋은 질문이다. 금리가 높으면 **'이자 주는 예금·채권'**이 매력적이지? 그럼 \u003cstrong\u003e이자 없는 금\u003c/strong\u003e은 상대적으로 손해야. 그래서 \u003cstrong\u003e실질금리↑ → 금 약세\u003c/strong\u003e, \u003cstrong\u003e실질금리↓ → 금 강세\u003c/strong\u003e 경향이 있다. 금값을 보면 거꾸로 실질금리 분위기를 읽을 수 있어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 구리(Dr. Copper) — 경기의 박사\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"구리는 별명이 **'닥터 코퍼(경제학 박사)'**다. 전선·건설·전자에 두루 쓰여서, \u003cstrong\u003e구리 수요 = 실물 경기\u003c/strong\u003e를 잘 비춰.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e구리값 \u003cstrong\u003e상승\u003c/strong\u003e → 제조·건설 활발 → 경기 확장 신호\u003c/li\u003e\n\u003cli\u003e구리값 \u003cstrong\u003e하락\u003c/strong\u003e → 수요 위축 → 경기 둔화 신호\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e구리/금 비율\u003c/strong\u003e도 유명: 위험선호(구리)↔안전(금)의 줄다리기\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"지표 발표를 기다릴 것 없이, 구리가 \u003cstrong\u003e먼저\u003c/strong\u003e 경기를 속삭여준다. 그래서 선행지표(3편)의 보조로 쓴다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 원자재로 시황 읽기 — 통합\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"1~7편을 원자재로 묶어보자.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e유가↑ → 인플레↑ → 금리↑ → 성장주↓ (+ 에너지주↑)\r\n구리↑ → 경기 확장 기대 → 경기민감주·소재주 유리\r\n금↑   → 공포·실질금리↓ → 위험회피 분위기\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"원자재는 **'경제 사슬의 맨 앞'**에 가깝다. 물가·금리·경기가 숫자로 발표되기 전에 \u003cstrong\u003e가격으로 먼저\u003c/strong\u003e 움직이거든.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 어떻게 투자하나 (개념만)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"개인이 원유·금을 실물로 들긴 어렵다. 보통 \u003cstrong\u003eETF\u003c/strong\u003e나 관련주로 접근해.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e금: 금 ETF(예: KRX금현물·해외 GLD), 금광주\u003c/li\u003e\n\u003cli\u003e원유: 원유 ETF/ETN(롤오버 비용 주의), 정유·에너지주\u003c/li\u003e\n\u003cli\u003e원자재 전반: 원자재 지수 ETF\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ 원자재 ETF/ETN은 \u003cstrong\u003e롤오버(선물 만기 교체) 비용\u003c/strong\u003e으로 장기 보유 시 손실이 누적될 수 있다. 상품 편(Stage 2)에서 더 다룬다.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"인플레엔 무조건 금\"\u003c/strong\u003e ❌ → \u003cstrong\u003e실질금리\u003c/strong\u003e가 더 중요. 고금리면 인플레여도 금이 눌릴 수 있다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"원유 ETF로 유가 따라가면 되지\"\u003c/strong\u003e ❌ → \u003cstrong\u003e롤오버 비용\u003c/strong\u003e으로 유가가 올라도 ETF는 덜 오르거나 빠질 수 있다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"원자재는 나랑 무관\"\u003c/strong\u003e ❌ → 유가=인플레, 구리=경기. \u003cstrong\u003e남의 주식도 원자재로 설명\u003c/strong\u003e된다.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e유가(WTI·브렌트)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003einvesting.com\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\"Crude Oil WTI\"\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e금·은\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003einvesting.com / KRX금시장\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\"Gold\"\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e구리·구리금비율\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eTradingView\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\"Copper\", \"Copper/Gold\"\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e원자재 전반\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFRED / 한국은행 ECOS\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e원자재 가격지수\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 유가 급등이 항공주엔 악재, 정유주엔 호재인 이유는?\r\n→ 항공은 **연료비(원가)↑**로 마진↓, 정유는 \u003cstrong\u003e제품 마진↑\u003c/strong\u003e. 유가는 섹터별 손익 스위치.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 금리가 높을 때 금이 상대적으로 불리한 이유는?\r\n→ 금은 \u003cstrong\u003e이자가 없어서\u003c/strong\u003e, 이자 주는 자산 대비 매력↓. \u003cstrong\u003e실질금리↑ → 금 약세\u003c/strong\u003e 경향.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 구리가 '경제학 박사'로 불리는 이유는?\r\n→ 산업 전반에 쓰여 \u003cstrong\u003e구리 수요가 실물 경기를 선행해 비추기\u003c/strong\u003e 때문.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [경제 8] 경제 캘린더 — FOMC·CPI·고용·실적시즌, 1년 이벤트를 읽는 법.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 원자재는 변동성이 크고 ETF는 롤오버 비용이 있습니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\
