3e: \"이익이 났는데 망해요? 그게 가능해요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"외상으로 많이 팔면 '이익'은 찍히지만 \u003cstrong\u003e현금이 안 들어와\u003c/strong\u003e 직원 월급을 못 줘 망한다. 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 현금흐름표 3가지 — 돈이 어디서 들고 나나\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e구분\u003c/th\u003e\n\u003cth\u003e무엇\u003c/th\u003e\n\u003cth\u003e건강한 모습\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e영업활동(CFO)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e본업으로 번 현금\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e(+) 크게\u003c/strong\u003e — 핵심!\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e투자활동(CFI)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e설비·자산 투자\u003c/td\u003e\n\u003ctd\u003e(−) (미래 위해 쓰는 중)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e재무활동(CFF)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e빚·증자·배당\u003c/td\u003e\n\u003ctd\u003e상황별\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"가장 중요한 건 **영업활동현금흐름(CFO)**이다. 본업에서 진짜 현금이 들어오나? **순이익은 (+)인데 CFO가 (−)**면 — 이익이 '장부상 숫자'일 뿐 현금이 안 들어온다는 적신호야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 흑자도산의 정체 — 이익 ≠ 현금\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"회계상 매출·이익은 \u003cstrong\u003e외상(미수금)도 포함\u003c/strong\u003e해서 잡힌다. 물건은 팔았는데 돈은 아직 못 받아도 '매출·이익'이 찍혀.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-markdown\"\u003e물건 100원어치 외상 판매 → 매출 100, 이익 20 (장부상)\r\n\u003cspan class=\"hljs-code\"\u003e                       → 그런데 현금은 0원 들어옴\r\n직원 월급·납품대금은 현금으로 나가야 함 → 현금 부족 → 흑자도산\n\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"아! 장부엔 이익인데 통장엔 돈이 없는 거군요.\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 \u003cstrong\u003e현금흐름표를 손익계산서와 같이\u003c/strong\u003e 봐야 한다. 이익이 늘어도 \u003cstrong\u003eCFO가 따라 늘지 않으면\u003c/strong\u003e 의심해라. 분식회계의 단골 수법이기도 하지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. FCF(잉여현금흐름) — 진짜 '남는 돈'\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"고수가 가장 중시하는 지표 중 하나가 **FCF(Free Cash Flow)**다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eFCF = 영업활동현금흐름(CFO) − 자본적지출(CAPEX)\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e본업으로 번 현금에서 \u003cstrong\u003e설비투자를 빼고 진짜 남는 돈\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e이 돈으로 \u003cstrong\u003e배당·자사주·빚 상환\u003c/strong\u003e을 한다 → 주주환원의 원천\u003c/li\u003e\n\u003cli\u003eFCF가 꾸준히 (+)이고 늘어나는 회사 = 진짜 우량\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"PER·이익이 좋아 보여도 \u003cstrong\u003eFCF가 마이너스\u003c/strong\u003e면, 그 회사는 벌어서 다 까먹거나 빚으로 버티는 거다. **배당의 지속가능성(배당편)**도 결국 FCF에서 나와.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 현금흐름 패턴으로 회사 읽기\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"세 현금흐름의 (+/−) 조합이 회사의 '상태'를 말해준다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eCFO\u003c/th\u003e\n\u003cth\u003eCFI\u003c/th\u003e\n\u003cth\u003eCFF\u003c/th\u003e\n\u003cth\u003e해석\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e+\u003c/td\u003e\n\u003ctd\u003e−\u003c/td\u003e\n\u003ctd\u003e−\u003c/td\u003e\n\u003ctd\u003e🟢 \u003cstrong\u003e우량 성숙기\u003c/strong\u003e: 벌어서 투자하고 빚갚고 배당\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e+\u003c/td\u003e\n\u003ctd\u003e−\u003c/td\u003e\n\u003ctd\u003e+\u003c/td\u003e\n\u003ctd\u003e🟡 \u003cstrong\u003e성장기\u003c/strong\u003e: 벌지만 더 투자하려 자금 조달\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e−\u003c/td\u003e\n\u003ctd\u003e−\u003c/td\u003e\n\u003ctd\u003e+\u003c/td\u003e\n\u003ctd\u003e🔴 \u003cstrong\u003e위험\u003c/strong\u003e: 본업서 못 버는데 빚으로 연명\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"맨 아래 줄(−,−,+)을 조심해라. \u003cstrong\u003e본업서 현금이 안 나오는데 계속 빚으로 메우는\u003c/strong\u003e 회사 — 폭탄 돌리기다. 적자 성장기업과 구분이 필요하지만, 오래 지속되면 위험 신호야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 실전 — 현금흐름 3줄 체크\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e① \u003cspan class=\"hljs-built_in\"\u003eCFO\u003c/span\u003e(영업현금흐름)가 (+)이고, 순이익과 방향이 같은가?\r\n② \u003cspan class=\"hljs-built_in\"\u003eFCF\u003c/span\u003e(=CFO−CAPEX)가 (+)이며 꾸준한가?\r\n③ 현금흐름 패턴이 '본업으로 벌어 굴리는' 모습인가? (−,−,+ 경계)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이 세 줄이면 '이익의 질'을 본다. \u003cstrong\u003e숫자로 분칠한 이익\u003c/strong\u003e과 \u003cstrong\u003e진짜 현금 버는 회사\u003c/strong\u003e를 가려낼 수 있어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"순이익 늘면 좋은 회사\"\u003c/strong\u003e ❌ → \u003cstrong\u003eCFO가 안 따라오면\u003c/strong\u003e 외상·분식 의심. 이익은 의견, 현금은 사실.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"PER 싸니 매수\"\u003c/strong\u003e ❌ → \u003cstrong\u003eFCF 마이너스\u003c/strong\u003e면 그 이익은 현금이 아닐 수 있음.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"현금흐름표는 어렵다고 패스\"\u003c/strong\u003e ❌ → 흑자도산·분식을 거르는 \u003cstrong\u003e가장 강력한 도구\u003c/strong\u003e. 최소 CFO·FCF는 봐라.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e항목\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e현금흐름표\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eDART 사업보고서 III.재무\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eCFO·CFI·CFF 원본\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFCF·CAPEX\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFnGuide / 증권사\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e잉여현금흐름\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e미국\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eSEC 10-K(Cash Flow)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eOperating/Investing/Financing\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e '흑자도산'이 가능한 이유는?\r\n→ 매출·이익엔 **외상(미수금)**이 포함돼, 장부는 흑자여도 \u003cstrong\u003e현금이 안 들어와\u003c/strong\u003e 지급불능에 빠질 수 있음.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e FCF(잉여현금흐름)는 어떻게 계산하고 왜 중요한가?\r\n→ \u003cstrong\u003eCFO − CAPEX\u003c/strong\u003e. 배당·자사주·빚상환의 \u003cstrong\u003e실제 재원\u003c/strong\u003e이라 주주환원·지속성의 핵심.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 현금흐름 패턴 (−,−,+)이 위험할 수 있는 이유는?\r\n→ **본업서 현금을 못 버는데(−) 빚으로 연명(+)**하는 구조일 수 있음.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [재무심화 2] 밸류에이션 멀티플 — PER을 넘어 EV/EBITDA·PSR·PEG로 보기.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목 추천이 아닙니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-
