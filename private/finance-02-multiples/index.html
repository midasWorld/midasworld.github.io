003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"PER 하나로 부족해요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"한 자로만 재면 틀린다. 상황마다 맞는 자가 달라. 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. PER의 약점 복습\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePER의 한계\u003c/th\u003e\n\u003cth\u003e무슨 문제\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e적자면 계산 불가\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e순이익이 (−)면 PER 의미 없음\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e부채 무시\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e빚 많은 회사·적은 회사를 같게 봄\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e회계이익 왜곡\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e일회성 손익·감가상각에 흔들림\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 보완할 잣대가 필요하다. 각각이 PER의 어떤 약점을 메우는지 보면 외우기 쉬워.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. EV/EBITDA — 빚까지 포함한 '진짜 인수가격'\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eEV(기업가치) = 시가총액 + 순부채\u003c/strong\u003e\r\n\u003cstrong\u003eEBITDA = 영업이익 + 감가상각비\u003c/strong\u003e (현금창출력 근사)\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"PER이 '주주 몫'만 본다면, \u003cstrong\u003eEV/EBITDA는 빚까지 포함\u003c/strong\u003e해 '이 회사를 통째로 사면 몇 년 만에 본전인가'를 본다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e부채 수준이 다른 기업 비교\u003c/strong\u003e에 유리 (PER의 약점 보완)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e감가상각 큰 산업\u003c/strong\u003e(제조·통신·장치)에서 특히 유용\u003c/li\u003e\n\u003cli\u003e낮을수록 저평가 경향 (업종별 기준 다름)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"빚이 많은 회사는 PER만 보면 싸 보여도, EV/EBITDA로는 안 싸 보일 수 있겠네요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다. \u003cstrong\u003e시총은 작아도 빚이 많으면 인수 시 그 빚도 떠안아.\u003c/strong\u003e EV/EBITDA가 그걸 잡아준다. M\u0026#x26;A·기업가치 평가의 단골 잣대지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. PSR — 적자기업·고성장주의 잣대\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003ePSR = 시가총액 ÷ 매출액\u003c/strong\u003e (주가매출비율)\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e아직 적자라 PER을 못 쓰는\u003c/strong\u003e 고성장 기업(초기 플랫폼·바이오)에 쓴다. 이익은 없어도 \u003cstrong\u003e매출\u003c/strong\u003e은 있으니까.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e적자 성장주의 상대적 비교에 유용\u003c/li\u003e\n\u003cli\u003e단, \u003cstrong\u003e매출은 있어도 이익이 안 나는 함정\u003c/strong\u003e 주의 (매출만 크고 영영 적자?)\u003c/li\u003e\n\u003cli\u003e같은 업종·비즈니스모델끼리만 비교\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"PSR은 '꿈을 먹는 잣대'다. 그래서 \u003cstrong\u003e위험도 크다.\u003c/strong\u003e 매출 성장이 언젠가 이익으로 전환될 근거가 있어야 의미가 있어. 묻지마 고PSR은 거품의 신호이기도 하지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. PEG — 성장을 반영한 PER\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003ePEG = PER ÷ 이익성장률(%)\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"PER이 높다고 무조건 비싼 게 아니다. \u003cstrong\u003e빨리 크는 회사는 높은 PER이 정당화\u003c/strong\u003e돼. 그걸 보정한 게 PEG다. 피터 린치가 사랑한 지표지.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePEG\u003c/th\u003e\n\u003cth\u003e해석(린치 기준 통념)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u0026#x3C; 1\u003c/td\u003e\n\u003ctd\u003e성장 대비 저평가 가능\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e≈ 1\u003c/td\u003e\n\u003ctd\u003e적정\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003e 1\u003c/td\u003e\n\u003ctd\u003e성장 대비 비쌀 수 있음\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e예: PER 30이어도 이익성장률 30%면 PEG=1 → '성장 감안하면 비싸지 않다'\u003c/li\u003e\n\u003cli\u003e단, \u003cstrong\u003e성장률 추정이 빗나가면\u003c/strong\u003e PEG도 무너짐 (미래 가정의 함정)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"PER만 보고 '30배? 비싸!'라고 단정하면 성장주를 놓친다. \u003cstrong\u003e성장 속도\u003c/strong\u003e를 함께 봐라. 단, 성장률은 '추정'이라 보수적으로.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 잣대 고르기 — 상황별 지도\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e상황\u003c/th\u003e\n\u003cth\u003e적합한 잣대\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e일반 흑자기업\u003c/td\u003e\n\u003ctd\u003ePER + ROE\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e부채 많음·장치산업\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eEV/EBITDA\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e적자 고성장주\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003ePSR\u003c/strong\u003e (조심)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e고성장 흑자주\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003ePEG\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e은행·보험\u003c/td\u003e\n\u003ctd\u003ePBR (자산 기반)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e자산주·부동산\u003c/td\u003e\n\u003ctd\u003ePBR·NAV\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"하나의 잣대를 신봉하지 마라. **여러 멀티플 + 동종업계 비교 + 재무 검증(현금흐름)**을 겹쳐야 입체적으로 보인다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"PER 낮으면 무조건 싸다\"\u003c/strong\u003e ❌ → 빚 많으면 \u003cstrong\u003eEV/EBITDA로는 안 쌀 수\u003c/strong\u003e 있음. 적자면 PER 무의미.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"PSR 낮으니 매수\"\u003c/strong\u003e ❌ → 매출만 크고 \u003cstrong\u003e영영 적자\u003c/strong\u003e인 함정. 이익전환 근거 필요.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"멀티플 하나로 업종 넘나들며 비교\"\u003c/strong\u003e ❌ → \u003cstrong\u003e같은 업종·모델끼리\u003c/strong\u003e 비교해야 의미.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eEV/EBITDA·PSR·PEG\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFnGuide / 증권사 HTS\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e종목분석 밸류에이션 탭\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e미국 멀티플\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eStock Analysis / Seeking Alpha\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEV/EBITDA, PEG\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e동종업계 비교\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 업종 비교\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e같은 섹터 멀티플\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 빚이 많은 회사를 비교할 때 PER보다 EV/EBITDA가 나은 이유는?\r\n→ EV는 \u003cstrong\u003e순부채를 포함\u003c/strong\u003e해 '인수 시 떠안을 빚'까지 반영하므로 부채 수준이 다른 기업 비교에 공정.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 적자 고성장주에 PSR을 쓰되 조심할 점은?\r\n→ 매출은 있어도 \u003cstrong\u003e이익으로 전환 못 하는 함정\u003c/strong\u003e. 고PSR은 거품일 수 있음.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e PER 30배가 항상 비싼 게 아닌 이유를 PEG로 설명하면?\r\n→ 이익성장률이 높으면(예 30%) \u003cstrong\u003ePEG≈1\u003c/strong\u003e로 성장 대비 적정일 수 있음.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [재무심화 3] DCF — 미래의 현금을 오늘 가치로, 내재가치 계산의 뼈대.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목 추천이 아닙니다. 멀티플은 가정·업종에 따라 달라집니다. 투자 책임은 본인에게 있습니다.\u003c/p
