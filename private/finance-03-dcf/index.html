[97367,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"MetadataBoundary\"]\n8:[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L6\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L7\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n9:[\"$\",\"$1\",\"c\",{\"children\":[\"$Lc\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/b6f08ff9efce5300.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$3\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@e\"}]}]]}]\na:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lf\",null,{\"children\":\"$L10\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L11\",null,{\"children\":[\"$\",\"$3\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L12\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n"])</script><script>self.__next_f.push([1,"13:I[12613,[\"/_next/static/chunks/6616542657a424b9.js\",\"/_next/static/chunks/b6f08ff9efce5300.js\"],\"PrivateGate\"]\n14:I[22016,[\"/_next/static/chunks/6616542657a424b9.js\",\"/_next/static/chunks/b6f08ff9efce5300.js\"],\"\"]\n15:T1e8e,"])</script><script>self.__next_f.push([1,"\u003ch1\u003e🧮 [재무심화 3] DCF — 미래의 현금을 오늘 가치로\u003c/h1\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/gosabu_explaining.png\" alt=\"거사부\"\u003e 🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"호두야, 멀티플(PER·EV/EBITDA)은 '남들과 비교'하는 \u003cstrong\u003e상대평가\u003c/strong\u003e였다. 이번엔 비교 없이 \u003cstrong\u003e이 회사 자체의 값\u003c/strong\u003e을 구하는 \u003cstrong\u003e절대평가\u003c/strong\u003e — **DCF(현금흐름할인)**다. 워런 버핏이 말하는 '내재가치'의 뼈대지. 계산이 아니라 \u003cstrong\u003e사고방식\u003c/strong\u003e을 가져가는 게 핵심이야.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"어렵겠는데요... 수학인가요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"원리는 한 줄이다. \u003cstrong\u003e'기업의 가치 = 그 기업이 미래에 벌 현금을, 오늘 가치로 할인해 모두 더한 것'\u003c/strong\u003e. 천천히 가자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 핵심 직관 — 미래의 1만원 \u0026#x3C; 오늘의 1만원\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"경제 1편에서 배운 \u003cstrong\u003e할인\u003c/strong\u003e 기억하지? 1년 뒤 1만원은 오늘 1만원보다 가치가 낮다. 금리(기회비용)만큼 깎이거든.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e오늘 가치 = 미래 현금 ÷ (1 + 할인율)^연수\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e할인율\u003c/strong\u003e: 보통 그 투자의 기대수익률·자본비용(WACC). 금리·위험이 높을수록 ↑\u003c/li\u003e\n\u003cli\u003e기업이 **앞으로 10년·영구히 벌 현금(FCF)**을 각각 오늘 가치로 깎아서 \u003cstrong\u003e전부 더하면\u003c/strong\u003e = 기업의 내재가치\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"즉 DCF는 **'이 회사가 평생 벌 현금을 지금 돈으로 환산'**하는 거다. 그 값이 시가총액보다 크면 저평가, 작으면 고평가로 보는 거지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. DCF 3단계 뼈대\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-arduino\"\u003e① 미래 FCF 추정: 향후 \u003cspan class=\"hljs-number\"\u003e5\u003c/span\u003e~\u003cspan class=\"hljs-number\"\u003e10\u003c/span\u003e년 잉여현금흐름(재무심화\u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e편)을 예상\r\n② 할인: 각 해 FCF를 할인율로 나눠 \u003cspan class=\"hljs-string\"\u003e'오늘 가치'\u003c/span\u003e로\r\n③ 영구가치(터미널밸류): \u003cspan class=\"hljs-number\"\u003e10\u003c/span\u003e년 이후는 \u003cspan class=\"hljs-string\"\u003e'일정 성장 영구'\u003c/span\u003e 가정해 한 덩어리로 더함\r\n→ ①~③ 합 = 기업가치 → 주당 내재가치와 현재 주가 비교\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"①에서 \u003cstrong\u003e현금흐름\u003c/strong\u003e, ②에서 \u003cstrong\u003e금리·할인\u003c/strong\u003e, ③에서 \u003cstrong\u003e성장\u003c/strong\u003e — 지금까지 배운 게 다 들어간다. DCF는 재무·경제 지식의 \u003cstrong\u003e종합판\u003c/strong\u003e이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. ⚠️ DCF의 진짜 교훈 — '쓰레기 넣으면 쓰레기 나온다'\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그럼 DCF로 계산하면 정확한 가격이 나오는 거예요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e절대 아니다.\u003c/strong\u003e 여기가 제일 중요해. DCF는 \u003cstrong\u003e가정(추정)에 극도로 민감\u003c/strong\u003e하다. \u003cstrong\u003eGIGO — Garbage In, Garbage Out.\u003c/strong\u003e\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e가정\u003c/th\u003e\n\u003cth\u003e조금만 바꿔도\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e미래 성장률\u003c/td\u003e\n\u003ctd\u003e10%→12%만 해도 가치 급변\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e할인율\u003c/td\u003e\n\u003ctd\u003e8%→9%만 해도 가치 크게↓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e영구성장률\u003c/td\u003e\n\u003ctd\u003e2%→3%면 터미널밸류 폭증\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 **'DCF로 12,345원이 나왔으니 정확히 그 값'**이라 믿으면 바보다. 애널리스트가 원하는 목표가에 맞춰 가정을 끼워넣는 일도 흔해. DCF는 **'정밀한 오답'**을 줄 수 있어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 그럼 DCF를 왜 배우나 — 사고방식과 민감도\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확한 값이 목적이 아니다. DCF가 주는 진짜 선물은 셋이다.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e사고의 틀\u003c/strong\u003e: 주가는 결국 **'미래 현금흐름의 현재가치'**라는 본질을 이해\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e민감도 분석\u003c/strong\u003e: 성장률·할인율을 \u003cstrong\u003e범위로\u003c/strong\u003e 넣어 **'가치의 범위'**를 본다 (점이 아니라 구간)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e역산(reverse DCF)\u003c/strong\u003e: 현재 주가가 \u003cstrong\u003e'어떤 성장률을 가정'하는지\u003c/strong\u003e 거꾸로 풀어, 그 기대가 현실적인지 점검\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"아! '이 주가가 맞으려면 앞으로 매년 20% 성장해야 하네 — 그게 가능한가?' 이렇게 쓰는 거군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"바로 그거다! \u003cstrong\u003e역DCF\u003c/strong\u003e가 실전에서 제일 유용해. '시장이 이 회사에 어떤 미래를 기대하나'를 읽고, 그 기대가 \u003cstrong\u003e과한지 보수적인지\u003c/strong\u003e 판단하는 거지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 실전 — 개인투자자의 현실적 사용법\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e① 정밀 DCF 숫자에 집착하지 말 것 (전문가도 빗나감)\r\n② 보수적 가정으로 '대략의 범위'만 잡기 (낙관/비관 시나리오)\r\n③ 역DCF로 '현재 주가가 요구하는 성장'이 현실적인지 점검\r\n④ 멀티플(\u003cspan class=\"hljs-number\"\u003e2\u003c/span\u003e편)·현금흐름(\u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e편)과 교차검증\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"DCF 한 방으로 결론내지 마라. \u003cstrong\u003e여러 방법을 겹쳐\u003c/strong\u003e '대략 싼가 비싼가'의 감을 잡는 도구일 뿐이야. 정밀함을 가장한 확신이 제일 위험해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"DCF가 내놓은 값 = 정확한 적정가\"\u003c/strong\u003e ❌ → 가정에 극도로 민감(GIGO). \u003cstrong\u003e범위\u003c/strong\u003e로 봐라.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"성장률 높게 넣으면 비싸도 정당화\"\u003c/strong\u003e ❌ → 낙관적 가정으로 \u003cstrong\u003e원하는 답 만들기\u003c/strong\u003e의 함정.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"DCF는 어려우니 안 봐도 됨\"\u003c/strong\u003e ❌ → 최소한 **'주가=미래현금 현재가치'**라는 본질과 \u003cstrong\u003e역DCF\u003c/strong\u003e 감각은 챙겨라.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eFCF·성장 데이터\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFnGuide / Stock Analysis\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eDCF 입력값\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e간이 DCF/역DCF\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e각종 DCF 계산기·엑셀\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시나리오 민감도\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWACC·할인율 개념\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 리서치\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e자본비용 추정\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e DCF가 말하는 '기업의 내재가치'를 한 줄로 정의하면?\r\n→ 그 기업이 \u003cstrong\u003e미래에 벌 현금(FCF)을 할인율로 깎아 현재가치로 모두 합한 것\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e DCF 결과를 '정확한 적정가'로 믿으면 안 되는 이유는?\r\n→ 성장률·할인율 등 \u003cstrong\u003e가정에 극도로 민감(GIGO)\u003c/strong\u003e → 작은 변화에 값이 크게 출렁임.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 역DCF(reverse DCF)는 무엇을 점검하는 도구인가?\r\n→ \u003cstrong\u003e현재 주가가 가정하는 성장률\u003c/strong\u003e을 거꾸로 구해, 그 기대가 현실적인지 평가.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [재무심화 4] 부채와 재무건전성 — 위기에 무너지지 않을 회사 고르기.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목 추천이 아닙니다. DCF는 가정에 의존하며 정확한 가치를 보장하지 않습니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px
