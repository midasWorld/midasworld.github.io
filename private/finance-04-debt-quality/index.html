003e: \"빚이 있으면 무조건 나쁜 거예요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"아니다. \u003cstrong\u003e적절한 빚은 약\u003c/strong\u003e이고 \u003cstrong\u003e과한 빚은 독\u003c/strong\u003e이지. 그 경계를 보는 지표들을 알려주마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 부채비율 — 빚이 자본의 몇 배인가\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e부채비율 = 부채총계 ÷ 자기자본 × 100\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e부채비율\u003c/th\u003e\n\u003cth\u003e통념적 해석\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e~100% 이하\u003c/td\u003e\n\u003ctd\u003e건전\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e100~200%\u003c/td\u003e\n\u003ctd\u003e보통 (업종별)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e200% 초과\u003c/td\u003e\n\u003ctd\u003e경계 (업종 따라)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"단, \u003cstrong\u003e업종마다 기준이 다르다.\u003c/strong\u003e 은행·금융은 원래 부채비율이 매우 높고(남의 돈으로 장사), 제조업은 낮아야 건전해. \u003cstrong\u003e같은 업종끼리\u003c/strong\u003e 비교해라(산업편).\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. ⭐ 이자보상배율 — 이자를 감당할 힘\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"부채비율보다 더 실전적인 게 \u003cstrong\u003e이자보상배율\u003c/strong\u003e이다. \u003cstrong\u003e번 돈으로 이자를 몇 번 갚을 수 있나\u003c/strong\u003e를 본다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e이자보상배율 = 영업이익 ÷ 이자비용\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e배율\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e1배 미만\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e🔴 영업이익으로 \u003cstrong\u003e이자도 못 냄\u003c/strong\u003e (좀비기업)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1~3배\u003c/td\u003e\n\u003ctd\u003e🟡 빠듯\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3배 이상\u003c/td\u003e\n\u003ctd\u003e🟢 여유\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"1배 미만이면 번 돈 전부를 이자로 내도 모자란 거네요?!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래. 그런 회사를 **'좀비기업'**이라 한다. 영업해서 이자도 못 갚고 빚으로 빚을 막아. \u003cstrong\u003e금리가 오르면(경제 1편) 제일 먼저 쓰러져.\u003c/strong\u003e 고금리 국면에 이자보상배율 1배 미만은 지뢰야. \u003cstrong\u003e반드시\u003c/strong\u003e 확인해라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 유동비율 — 당장의 지급능력\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e유동비율 = 유동자산 ÷ 유동부채 × 100\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e1년 안에 \u003cstrong\u003e현금화할 자산\u003c/strong\u003e으로 \u003cstrong\u003e1년 안에 갚을 빚\u003c/strong\u003e을 감당하나\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e100% 이상\u003c/strong\u003e이면 단기 지급능력 OK, 그 이하면 단기 유동성 주의\u003c/li\u003e\n\u003cli\u003e흑자도산(재무심화 1편)을 막는 단기 체력 지표\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"유동비율은 **'급할 때 막을 수 있나'**를 본다. 현금흐름표(1편)와 함께 보면 단기 위기 대응력이 보여.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 분식·위험의 냄새 — 숫자 뒤 신호\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"재무제표엔 '냄새'가 난다. 이런 조합을 경계해라.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e위험 신호\u003c/th\u003e\n\u003cth\u003e의심\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e영업이익 (+) ↑인데 \u003cstrong\u003e영업현금흐름 (−)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e외상매출·분식 (1편)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e매출채권·재고\u003c/strong\u003e가 매출보다 빨리 증가\u003c/td\u003e\n\u003ctd\u003e밀어내기·재고 부실\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e이자보상배율 \u003cstrong\u003e1배 미만\u003c/strong\u003e 지속\u003c/td\u003e\n\u003ctd\u003e좀비기업\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e부채 급증 + \u003cstrong\u003e유상증자 잦음\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e자금난\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e잦은 \u003cstrong\u003e회계기준 변경·감사의견 한정\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e적신호\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"하나만으론 단정 못 해도, \u003cstrong\u003e여러 개가 겹치면\u003c/strong\u003e 피하는 게 상책이다. 좋은 기회는 또 온다. \u003cstrong\u003e안 망할 회사\u003c/strong\u003e부터 거르는 게 수비의 핵심이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 실전 — 재무건전성 5초 체크\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e① 이자보상배율 ≥ \u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e배(가능하면 \u003cspan class=\"hljs-number\"\u003e3\u003c/span\u003e배+)? ← 고금리기 최우선\r\n② 부채비율이 동종업계 대비 과하지 않나?\r\n③ 유동비율 \u003cspan class=\"hljs-number\"\u003e100%\u003c/span\u003e 이상?\r\n④ 영업현금흐름(CFO) (+)이고 순이익과 같은 방향?\r\n⑤ 위험 신호(증자 남발·감사의견)가 겹치지 않나?\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"성장·밸류에이션을 따지기 \u003cstrong\u003e전에\u003c/strong\u003e 이 수비 체크부터다. \u003cstrong\u003e'잃지 않는 것'이 첫째\u003c/strong\u003e라던 버핏의 원칙이 여기 있어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"빚 있으면 무조건 나쁘다\"\u003c/strong\u003e ❌ → \u003cstrong\u003e적정 레버리지는 ROE를 키운다\u003c/strong\u003e(재무 기초 듀퐁). 과한 게 문제.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"부채비율만 보면 된다\"\u003c/strong\u003e ❌ → \u003cstrong\u003e이자보상배율\u003c/strong\u003e이 더 실전적. 고금리기엔 특히.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"성장만 좋으면 재무는 나중\"\u003c/strong\u003e ❌ → 위기에 \u003cstrong\u003e재무 약한 회사가 먼저 죽는다.\u003c/strong\u003e 수비가 먼저.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e부채비율·유동비율\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFnGuide / DART 재무비율\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e동종업계 비교\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e이자보상배율\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFnGuide / 증권사\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e영업이익÷이자비용\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e감사의견·증자\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eDART 공시\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e감사보고서·증자 공시\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 고금리 국면에서 가장 먼저 확인할 재무건전성 지표 하나는?\r\n→ \u003cstrong\u003e이자보상배율\u003c/strong\u003e(영업이익÷이자비용). 1배 미만이면 이자도 못 갚는 좀비기업.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 부채비율을 '같은 업종끼리' 비교해야 하는 이유는?\r\n→ 은행처럼 \u003cstrong\u003e구조적으로 부채가 높은 업종\u003c/strong\u003e이 있어 절대수치로 비교하면 왜곡.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e '영업이익은 느는데 영업현금흐름이 마이너스'가 위험 신호인 이유는?\r\n→ 외상매출 누적·\u003cstrong\u003e분식\u003c/strong\u003e 가능성(이익은 의견, 현금은 사실 — 1편).\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🎓 재무심화 트랙 졸업\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"현금흐름·멀티플·DCF·재무건전성까지 왔다. 이제 너는 \u003cstrong\u003e숫자로 회사의 진짜 체력과 가치를 입체적으로\u003c/strong\u003e 본다. PER 하나 보던 때와는 차원이 다르지. 다음은 이 모든 분석을 **차트(기술적 분석 심화)**와 \u003cstrong\u003e포트폴리오\u003c/strong\u003e로 실전화하는 단계다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목 추천이 아닙니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</scr
