c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📅 \u003cstrong\u003e기준일: 2026-06-02 종가\u003c/strong\u003e. 모든 수치는 매일 변하니, 학습할 때 네이버·FnGuide에서 \u003cstrong\u003e오늘 값\u003c/strong\u003e을 직접 확인하거라.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. PER 계산부터 — 숫자로 굴려보기\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003ePER = 주가 ÷ 주당순이익(EPS)\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e거꾸로 하면 \u003cstrong\u003e주가 = PER × EPS\u003c/strong\u003e. KB금융으로 검산해보자.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKB금융 EPS = \u003cstrong\u003e15,116원\u003c/strong\u003e, PER = \u003cstrong\u003e10.06배\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e→ 주가 ≈ 15,116 × 10.06 ≈ \u003cstrong\u003e152,000원\u003c/strong\u003e 수준\u003c/li\u003e\n\u003cli\u003e의미: \"이 회사가 지금 벌이를 유지하면 \u003cstrong\u003e약 10년치 순이익\u003c/strong\u003e으로 시가총액을 회수\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"PER 10배는 '10년이면 본전'이라는 직관이다. 낮을수록 이익 대비 싸다는 뜻이지. 그런데…\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 함정 — 업종이 다르면 비교 불가 (실제 비교)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003e업종\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003ePBR\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003e한 줄 해석\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKB금융\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e은행\u003c/td\u003e\n\u003ctd\u003e10.06\u003c/td\u003e\n\u003ctd\u003e0.92\u003c/td\u003e\n\u003ctd\u003e10.0%\u003c/td\u003e\n\u003ctd\u003e은행은 원래 저PER·저PBR\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e신한지주\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e은행\u003c/td\u003e\n\u003ctd\u003e9.18\u003c/td\u003e\n\u003ctd\u003e0.76\u003c/td\u003e\n\u003ctd\u003e8.6%\u003c/td\u003e\n\u003ctd\u003e마찬가지\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e삼성전자\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e반도체\u003c/td\u003e\n\u003ctd\u003e28.21\u003c/td\u003e\n\u003ctd\u003e4.85\u003c/td\u003e\n\u003ctd\u003e18.9%\u003c/td\u003e\n\u003ctd\u003e이익 회복 전이라 PER 높아 보임\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e카카오\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e인터넷\u003c/td\u003e\n\u003ctd\u003e38.43\u003c/td\u003e\n\u003ctd\u003e1.64\u003c/td\u003e\n\u003ctd\u003e3.9%\u003c/td\u003e\n\u003ctd\u003e성장 기대 선반영, ROE는 낮음\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/per_compare_kr.png\" alt=\"업종별 PER 비교 차트\"\u003e\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"봐라. KB금융(10배)과 삼성전자(28배)를 직접 비교하면 'KB가 싸다'가 되지만, \u003cstrong\u003e은행과 반도체는 PER 기준 자체가 다르다.\u003c/strong\u003e 차트에서 색이 같은 것끼리(은행은 은행끼리) 비교해야 한단다.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"어! 그럼 KB금융 PER 10배는 싼 게 아니라 \u003cstrong\u003e은행치곤 평범\u003c/strong\u003e한 거네요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다. 비교는 \u003cstrong\u003e같은 업종 안에서\u003c/strong\u003e 해야 해. KB금융(10.06) vs 신한지주(9.18)처럼.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 카카오의 역설 — 높은 PER, 낮은 ROE\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"카카오를 보거라. PER 38배인데 ROE는 3.9%밖에 안 된다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePER 38배 = 시장이 \u003cstrong\u003e미래 성장\u003c/strong\u003e을 크게 기대해 비싸게 사준 것\u003c/li\u003e\n\u003cli\u003e그런데 ROE 3.9% = 지금은 \u003cstrong\u003e자본을 효율적으로 못 굴리는 중\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e→ \"기대는 큰데 실적이 아직 못 따라온\" 전형적 성장주 고평가 구간\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"PER이 높으면 \u003cstrong\u003e그 기대만큼 실적이 따라오는지\u003c/strong\u003e 매 분기 확인해야 한다. 안 따라오면 PER은 한순간에 무너져.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. PBR — 청산가치와 코리아 디스카운트\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003ePBR = 주가 ÷ 주당순자산(BPS)\u003c/strong\u003e, 또는 \u003cstrong\u003ePBR = PER × (ROE ÷ 100)\u003c/strong\u003e 로도 연결된다.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e신한지주 PBR \u003cstrong\u003e0.76\u003c/strong\u003e → 순자산보다 24% 싸게 거래. 은행·지주는 PBR 1배 미만이 흔함 → \u003cstrong\u003e코리아 디스카운트\u003c/strong\u003e 논쟁의 핵심\u003c/li\u003e\n\u003cli\u003e삼성전자 PBR \u003cstrong\u003e4.85\u003c/strong\u003e → 순자산의 약 5배. 브랜드·기술 등 무형가치가 반영\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"PBR 0.76이라고 무조건 줍지 마라. \u003cstrong\u003e왜 시장이 순자산보다 싸게 보는지\u003c/strong\u003e(저성장·규제·배당 인색 등) 이유를 찾는 게 먼저다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 호두의 실습 — 지금 직접 해보기\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"내 숫자를 믿지 말고 \u003cstrong\u003e오늘 값\u003c/strong\u003e으로 직접 해봐라.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e네이버페이 증권\u003c/strong\u003e → '삼성전자' → 종목분석 \u003e 투자지표 → \u003cstrong\u003e오늘 PER·PBR\u003c/strong\u003e 확인\u003c/li\u003e\n\u003cli\u003e같은 화면 '동일업종' → 반도체 평균 PER과 비교 (업종 내 비교!)\u003c/li\u003e\n\u003cli\u003eKB금융도 → 은행 평균과 비교\u003c/li\u003e\n\u003cli\u003e판단표 만들기: \u003ccode\u003e종목 PER \u0026#x3C; 업종 평균?\u003c/code\u003e \u0026#x26; \u003ccode\u003eROE 꾸준한가?\u003c/code\u003e \u0026#x26; \u003ccode\u003ePBR이 싼 이유가 납득되나?\u003c/code\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"이제 'PER 낮으니 싸다'가 아니라, 업종 평균이랑 ROE까지 같이 보는 거군요!\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e경로\u003c/th\u003e\n\u003cth\u003e확인할 것\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e종목 \u003e 종목분석 \u003e 투자지표\u003c/td\u003e\n\u003ctd\u003e오늘 PER·PBR·EPS·동일업종\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eFnGuide\u003c/strong\u003e (comp.fnguide.com)\u003c/td\u003e\n\u003ctd\u003e종목 \u003e Snapshot\u003c/td\u003e\n\u003ctd\u003e5년 PER 밴드, 업종 비교\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eDART\u003c/strong\u003e (dart.fss.or.kr)\u003c/td\u003e\n\u003ctd\u003e사업보고서 \u003e III. 재무\u003c/td\u003e\n\u003ctd\u003eEPS·순자산 원본\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크 (계산해보기)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 어떤 종목의 EPS가 5,000원, PER이 8배다. 적정 주가는?\r\n→ 5,000 × 8 = \u003cstrong\u003e40,000원\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e KB금융(PER 10) vs 삼성전자(PER 28). KB금융이 무조건 싼가?\r\n→ \u003cstrong\u003e아니다\u003c/strong\u003e. 은행 vs 반도체는 업종이 달라 PER 기준이 다름. 업종 내 비교(KB vs 신한)가 맞다.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 카카오는 PER 38인데 ROE 3.9%다. 이게 위험한 이유는?\r\n→ 높은 \u003cstrong\u003e성장 기대\u003c/strong\u003e(PER)에 비해 실제 **자본 효율(ROE)**이 못 따라옴. 기대가 깨지면 급락 위험.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음\u003c/strong\u003e: 거사부가 \"ROE가 왜 PER·PBR을 연결하는 핵심인지\" 삼성전자·SK하이닉스 ROE로 파고든다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 종목은 개념 설명용 예시이며 매수 추천이 아닙니다. 수치는 2026-06-02 종가 기준이며 매일 변합니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8
