e📅 \u003cstrong\u003e기준일: 2026-06-02\u003c/strong\u003e. ROE는 분기마다 바뀌니 FnGuide에서 현재 값을 확인하세요.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. ROE = 자본을 굴리는 효율\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eROE = 당기순이익 ÷ 자기자본 × 100\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\"내 돈(자본) 100원으로 1년에 몇 원 벌었나\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003eROE (2026-06-02)\u003c/th\u003e\n\u003cth\u003e해석\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSK하이닉스\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e61.2%\u003c/td\u003e\n\u003ctd\u003e반도체 \u003cstrong\u003e초호황\u003c/strong\u003e — 이익 폭증 국면\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e삼성전자\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e18.9%\u003c/td\u003e\n\u003ctd\u003e우량하지만 하이닉스보단 낮음\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKB금융\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e10.0%\u003c/td\u003e\n\u003ctd\u003e은행 평균 수준\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e카카오\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e3.9%\u003c/td\u003e\n\u003ctd\u003e자본 대비 이익 부진\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/roe_compare_kr.png\" alt=\"ROE 비교 차트\"\u003e\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"단, SK하이닉스 61%는 \u003cstrong\u003e지속 가능한 숫자가 아니다.\u003c/strong\u003e 반도체 호황 때 잠깐 치솟은 거야. 그래서 ROE는 \u003cstrong\u003e한 해 숫자보다 5년 추이\u003c/strong\u003e가 중요하다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 함정 — ROE가 높은 게 항상 좋은 건 아니다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"ROE를 높이는 방법은 셋이다. \u003cstrong\u003e듀퐁 분석\u003c/strong\u003e으로 쪼개보자.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eROE = 순이익률 × 자산회전율 × 재무레버리지\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e요소\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003cth\u003e높이는 법\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e순이익률\u003c/td\u003e\n\u003ctd\u003e마진\u003c/td\u003e\n\u003ctd\u003e비싸게 팔거나 비용 절감\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e자산회전율\u003c/td\u003e\n\u003ctd\u003e자산 활용\u003c/td\u003e\n\u003ctd\u003e적은 자산으로 많이 팔기\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e재무레버리지\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e부채 사용\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e빚을 늘리면 ROE도 오름 ⚠️\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"문제는 세 번째다. \u003cstrong\u003e빚을 잔뜩 끌어다 만든 ROE\u003c/strong\u003e는 호황 땐 좋아 보이지만 불황엔 회사를 무너뜨려. 그래서 ROE를 볼 땐 \u003cstrong\u003e부채비율\u003c/strong\u003e을 꼭 같이 본다.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"같은 ROE 15%라도 마진으로 만든 거랑 빚으로 만든 건 다르다는 거죠?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"바로 그거다. 질(質)이 다르지. 숫자로 보자.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e듀퐁 분해 예시 (가상의 두 회사, ROE 동일 20%)\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e회사\u003c/th\u003e\n\u003cth\u003e순이익률\u003c/th\u003e\n\u003cth\u003e자산회전율\u003c/th\u003e\n\u003cth\u003e레버리지(자산/자본)\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eA (마진형)\u003c/td\u003e\n\u003ctd\u003e20%\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003ctd\u003e1.0 (무차입)\u003c/td\u003e\n\u003ctd\u003e20%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eB (레버리지형)\u003c/td\u003e\n\u003ctd\u003e5%\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003ctd\u003e4.0 (빚 많음)\u003c/td\u003e\n\u003ctd\u003e20%\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"둘 다 ROE 20%다. 하지만 A는 마진으로, B는 \u003cstrong\u003e부채 4배 레버리지\u003c/strong\u003e로 만들었어. 불황이 오면? B는 이자 부담에 휘청이지만 A는 멀쩡하다. \u003cstrong\u003e같은 ROE도 출처를 봐야 하는\u003c/strong\u003e 이유다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 재무제표 3종 — 3줄만 봐도 절반\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"처음엔 이 세 줄이면 충분하다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e재무제표\u003c/th\u003e\n\u003cth\u003e핵심 한 줄 체크\u003c/th\u003e\n\u003cth\u003e위험 신호\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e손익계산서\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e매출·영업이익 3년 연속 ↑?\u003c/td\u003e\n\u003ctd\u003e매출 정체·이익 급감\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e재무상태표\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e부채비율 100% 이하?\u003c/td\u003e\n\u003ctd\u003e200% 초과\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e현금흐름표\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e영업현금흐름 (+)?\u003c/td\u003e\n\u003ctd\u003e영업이익 +인데 현금 −\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"특히 마지막. \u003cstrong\u003e영업이익은 느는데 영업현금흐름이 마이너스\u003c/strong\u003e면 외상매출만 쌓이거나 분식 가능성을 의심해라. 이익은 조정할 수 있어도 현금은 거짓말을 못 한다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. PER·PBR·ROE의 삼각관계\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"세 지표는 따로 노는 게 아니다. 이렇게 연결돼.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003ePBR = PER × (ROE ÷ 100)\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003eROE가 높으면 → 같은 PER이라도 PBR이 높게 정당화됨\u003c/li\u003e\n\u003cli\u003e삼성전자: PER 28.21 × ROE 0.189 ≈ PBR 5.3 (실제 4.85, 근사 일치)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e좋은 회사 = 높은 ROE를 오래 유지\u003c/strong\u003e → 시장이 높은 PBR을 허락\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그러니 결국 핵심은 \u003cstrong\u003eROE를 꾸준히 높게 유지하는 회사\u003c/strong\u003e를 찾는 거다. 워런 버핏이 ROE를 가장 본 이유지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 호두의 우량주 체크리스트\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"FnGuide·DART로 직접 채워봐라.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eROE 5년 추이\u003c/strong\u003e 15% 이상 꾸준? (한 해 반짝 ❌) — FnGuide Snapshot\u003c/li\u003e\n\u003cli\u003e그 ROE가 \u003cstrong\u003e부채 아닌 마진·효율\u003c/strong\u003e로 나왔나? (부채비율 100% 이하)\u003c/li\u003e\n\u003cli\u003e매출·영업이익 \u003cstrong\u003e3년 연속 증가\u003c/strong\u003e? — DART 손익계산서\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e영업현금흐름 (+)\u003c/strong\u003e 지속? — DART 현금흐름표\u003c/li\u003e\n\u003cli\u003ePER이 업종 평균 이하 + 위 4개 충족 → \u003cstrong\u003e관심 종목\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"ROE 61% 숫자 하나에 안 속고, 추이랑 부채까지 보는 거군요!\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e경로\u003c/th\u003e\n\u003cth\u003e확인할 것\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eFnGuide\u003c/strong\u003e (comp.fnguide.com)\u003c/td\u003e\n\u003ctd\u003eSnapshot \u003e 재무비율\u003c/td\u003e\n\u003ctd\u003eROE 5년 추이, 부채비율, 듀퐁\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eDART\u003c/strong\u003e (dart.fss.or.kr)\u003c/td\u003e\n\u003ctd\u003e사업보고서 \u003e III. 재무\u003c/td\u003e\n\u003ctd\u003e손익·재무상태·현금흐름 원본\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e종목분석 \u003e 기업현황\u003c/td\u003e\n\u003ctd\u003e요약 재무·컨센서스\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e SK하이닉스 ROE 61%가 \"지속 가능\"한가?\r\n→ 아님. 반도체 \u003cstrong\u003e호황기 일시적\u003c/strong\u003e 수치. 5년 추이로 봐야 함.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 부채를 늘리면 ROE는 오른다. 왜 위험한가?\r\n→ 호황엔 좋아 보여도 \u003cstrong\u003e불황에 이자·상환 부담\u003c/strong\u003e으로 무너질 수 있음 (레버리지 양날의 검).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 영업이익은 +인데 영업현금흐름이 −면?\r\n→ 외상매출 누적·분식 가능성 \u003cstrong\u003e의심 신호\u003c/strong\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 시장\u003c/strong\u003e: 🇺🇸 미장! 잭이글이 애플 ROE \u003cstrong\u003e141%\u003c/strong\u003e, 엔비디아 forward PER \u003cstrong\u003e17.6\u003c/strong\u003e의 비밀을 푼다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 종목은 개념 설명용 예시이며 매수 추천이 아닙니다. 수치는 2026-06-02 기준이며 분기마다 변합니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-09\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-
