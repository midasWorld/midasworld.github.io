n\u003cblockquote\u003e\n\u003cp\u003e📅 \u003cstrong\u003e기준일: 2026-06-02 종가\u003c/strong\u003e. 모든 수치는 매일 변하니 Finviz·Yahoo에서 오늘 값을 확인해.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. Trailing PER vs Forward PER\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e구분\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eTrailing PER\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e과거 12개월 \u003cstrong\u003e실제 이익\u003c/strong\u003e 기준\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eForward PER\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e향후 12개월 \u003cstrong\u003e예상 이익\u003c/strong\u003e 기준\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e엔비디아 (2026-06-02):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTrailing PER \u003cstrong\u003e34.18\u003c/strong\u003e (지난 1년 이익 기준 → 비싸 보임)\u003c/li\u003e\n\u003cli\u003eForward PER \u003cstrong\u003e17.61\u003c/strong\u003e (예상 이익 기준 → 절반으로 뚝)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"Forward가 Trailing의 절반이라는 건, 시장이 \u003cstrong\u003e앞으로 이익이 約 2배로 늘 것\u003c/strong\u003e으로 본다는 뜻이야. 그래서 trailing PER 34가 '비싸다'고 단정하면 안 돼.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"아! 미래 이익이 급증하면 지금 PER이 높아도 정당화되는 거군요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"Exactly. 단, \u003cstrong\u003e그 예상이 빗나가면\u003c/strong\u003e forward PER은 허상이 되고 주가는 무너져. 매 분기 실적(earnings)을 확인해야 하는 이유지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. PEG — 성장을 반영한 밸류에이션\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003ePEG = PER ÷ 연이익성장률(%)\u003c/strong\u003e, 1.0 이하면 성장 대비 합리적.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e엔비디아 trailing PER 34, 이익성장률이 연 40%대라면 → PEG ≈ 0.8 → 비싸지 않을 수 있음\u003c/li\u003e\n\u003cli\u003e반대로 성장률 10%인데 PER 34면 → PEG 3.4 → 과열\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"미장 성장주는 PER 숫자만 보면 다 비싸 보여. \u003cstrong\u003ePEG로 성장 대비\u003c/strong\u003e를 봐야 진짜가 보여.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 성장주 vs 가치주 — 실제 비교 (2026-06-02)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003eTrailing PER\u003c/th\u003e\n\u003cth\u003eForward PER\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003e유형\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e엔비디아(NVDA)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e34.18\u003c/td\u003e\n\u003ctd\u003e17.61\u003c/td\u003e\n\u003ctd\u003e114.3%\u003c/td\u003e\n\u003ctd\u003e초고성장\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e마이크로소프트(MSFT)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e27.33\u003c/td\u003e\n\u003ctd\u003e23.73\u003c/td\u003e\n\u003ctd\u003e34.0%\u003c/td\u003e\n\u003ctd\u003e안정 성장\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e알파벳(GOOGL)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e28.76\u003c/td\u003e\n\u003ctd\u003e26.04\u003c/td\u003e\n\u003ctd\u003e38.9%\u003c/td\u003e\n\u003ctd\u003e성장\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e코카콜라(KO)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e24.76\u003c/td\u003e\n\u003ctd\u003e22.60\u003c/td\u003e\n\u003ctd\u003e43.4%\u003c/td\u003e\n\u003ctd\u003e배당/소비재\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e버크셔(BRK.B)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e13.96\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e10.5%\u003c/td\u003e\n\u003ctd\u003e가치/지주\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/per_trailing_forward_us.png\" alt=\"Trailing vs Forward PER 차트\"\u003e\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"엔비디아만 trailing-forward 갭이 크지(34→17.6)? 그만큼 \u003cstrong\u003e성장 기대가 폭발적\u003c/strong\u003e이라는 뜻. 반면 코카콜라는 24→22로 갭이 작아 — 안정적이지만 성장은 느리다는 신호야.\"\u003c/p\u003e\n\u003cp\u003e🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"코카콜라 PER이 24배면... 소비재치곤 좀 비싼 거 아니에요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"Sharp! 맞아. KO는 '싼 가치주'가 아니라 \u003cstrong\u003e비싸도 사는 안정 배당주\u003c/strong\u003e야. 버핏이 보유한다고 싸다는 뜻은 아니라고. 가격은 별개야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 역사가 준 교훈 — 닷컴버블 (2000)\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"고PER이 항상 정당화되는 건 아니야. 2000년 닷컴버블 때를 봐.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e1999~2000년, 인터넷 기업들이 \u003cstrong\u003e이익도 없이 PER 수백 배\u003c/strong\u003e에 거래됨\u003c/li\u003e\n\u003cli\u003e\"이번엔 다르다(This time is different)\"는 말이 유행\u003c/li\u003e\n\u003cli\u003e2000년 3월 나스닥 정점 → 2002년까지 \u003cstrong\u003e약 −78% 폭락\u003c/strong\u003e, 수많은 닷컴 기업 상장폐지\u003c/li\u003e\n\u003cli\u003e살아남은 건 \u003cstrong\u003e실제 이익·현금흐름이 있던\u003c/strong\u003e 아마존·이베이 등 소수\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"교훈? 성장 스토리가 아무리 좋아도 \u003cstrong\u003e결국 이익·현금흐름이 받쳐줘야\u003c/strong\u003e 한다는 거야. forward PER이 낮아 보여도 그 '예상 이익'이 진짜 올지 의심해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 호두의 미장 실습\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"Finviz로 1분이면 끝나.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eFinviz\u003c/strong\u003e (finviz.com) → 티커(NVDA) 입력 → P/E, Forward P/E, PEG, ROE 한 줄에 다 나옴\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eYahoo Finance\u003c/strong\u003e → NVDA \u003e Statistics → Forward P/E, PEG Ratio 확인\u003c/li\u003e\n\u003cli\u003e같은 방식 MSFT·KO 비교 → trailing-forward 갭으로 성장성 가늠\u003c/li\u003e\n\u003cli\u003e판단: 고PER이면 \u003cstrong\u003eforward PER + PEG\u003c/strong\u003e로 성장 검증, 갭 작으면 안정주\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"PER 하나가 아니라 forward PER이랑 PEG까지! 이제 'NVDA 비싸다'고 단정 안 할래요.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e경로\u003c/th\u003e\n\u003cth\u003e확인할 것\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eFinviz\u003c/strong\u003e (finviz.com)\u003c/td\u003e\n\u003ctd\u003e티커 검색\u003c/td\u003e\n\u003ctd\u003eP/E·Forward P/E·PEG·ROE 한눈에 ⭐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eYahoo Finance\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e티커 \u003e Statistics\u003c/td\u003e\n\u003ctd\u003eForward P/E, PEG, EPS 추정\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eMacrotrends\u003c/strong\u003e (macrotrends.net)\u003c/td\u003e\n\u003ctd\u003e티커 \u003e PE Ratio\u003c/td\u003e\n\u003ctd\u003e10년 PER 추이\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 엔비디아 trailing PER 34, forward PER 17.6이 뜻하는 것은?\r\n→ 시장이 향후 이익이 \u003cstrong\u003e약 2배 증가\u003c/strong\u003e할 것으로 기대 (그래서 trailing이 비싸 보이는 것)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e PER 30, 이익성장률 연 30%면 PEG는? 해석은?\r\n→ PEG = 30÷30 = \u003cstrong\u003e1.0\u003c/strong\u003e → 성장 대비 합리적\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 코카콜라 PER 24가 \"싸다\"는 뜻인가?\r\n→ 아님. 소비재치곤 \u003cstrong\u003e비싼 편\u003c/strong\u003e. 안정·배당 때문에 비싸도 사는 종목 (버핏 보유 ≠ 저가)\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음\u003c/strong\u003e: 잭이글이 \"애플 ROE가 왜 141%나 되는지\" — 자사주 매입의 마법(과 함정)을 10-K로 파헤친다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 종목은 개념 설명용 예시이며 매수 추천이 아닙니다. 수치는 2026-06-02 종가 기준이며 매일 변합니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-08\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🇺🇸 [미장 재무 1] 엔비디아 PER 34 vs Forward 17 — 성장의 비밀\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"🇺🇸 [미장 재무 1] 엔비디아 PER 34 vs Forward 17 — 성장의 비밀 | midasworld (Private)\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"서버 개발 학습 블로그\"}],[\"$\",\"link\
