\u003cstrong\u003e자사주 매입(buyback)의 마법\u003c/strong\u003e이야. 한국에선 보기 힘든 숫자지.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📅 \u003cstrong\u003e기준일: 2026-06-02\u003c/strong\u003e. 애플 ROE 141.5%, PBR 42.32, PER 37.15 (Yahoo Finance 기준).\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 왜 애플 ROE가 141%인가?\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eROE = 순이익 ÷ 자기자본\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"분자(순이익)가 큰 것도 있지만, 핵심은 \u003cstrong\u003e분모(자기자본)가 작아진\u003c/strong\u003e 거야.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e애플은 매년 \u003cstrong\u003e수백억 달러로 자사주를 사서 소각\u003c/strong\u003e함\u003c/li\u003e\n\u003cli\u003e자사주 매입 → 자본(equity)이 줄어듦 → ROE 분모 ↓ → \u003cstrong\u003eROE 폭등\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e같은 이유로 순자산이 작아지니 \u003cstrong\u003ePBR(주가÷순자산)도 42배로 치솟음\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/aapl_buyback.png\" alt=\"애플 발행주식수 감소 차트\"\u003e\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"차트 봐. 애플 주식 수가 2022년 15.9억 주에서 계속 줄지? 매년 자사주를 사서 소각한 거야. 주식 수가 줄면 분모(자본)도 줄어 ROE가 치솟는 거지. ROE 141%를 '한국 회사 ROE 10%보다 14배 좋다'고 단순 비교하면 안 돼. \u003cstrong\u003e자본 구조가 다른\u003c/strong\u003e 거야.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"아하... 빚이 아니라 자사주로 자본을 줄여서 ROE가 높아 보이는 거네요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"Exactly. 그래서 미장은 ROE만 보지 말고 \u003cstrong\u003e자사주 매입 추이 + FCF\u003c/strong\u003e를 같이 봐야 해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 자사주 매입 = 미국식 주주환원\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e주주환원\u003c/th\u003e\n\u003cth\u003e한국\u003c/th\u003e\n\u003cth\u003e미국\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e배당\u003c/td\u003e\n\u003ctd\u003e활발\u003c/td\u003e\n\u003ctd\u003e활발\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e자사주 매입·소각\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e적음(점차 증가)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e매우 활발\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"자사주를 사서 소각하면 \u003cstrong\u003e주식 수가 줄어\u003c/strong\u003e → 1주당 가치(EPS)가 올라 → 주주 이익. 애플·메타·구글이 매년 수백억 달러를 여기 써. 미장 분석에선 \u003cstrong\u003ebuyback이 배당만큼 중요\u003c/strong\u003e해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 진짜 분석은 10-K — 핵심 4섹션\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"SEC EDGAR에서 애플 10-K 열고 이것만 봐.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e섹션\u003c/th\u003e\n\u003cth\u003e내용\u003c/th\u003e\n\u003cth\u003e왜\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eItem 1A. Risk Factors\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e회사가 밝힌 위험\u003c/td\u003e\n\u003ctd\u003e매출의 아이폰 의존도, 중국 리스크 등 ⭐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eItem 7. MD\u0026#x26;A\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e경영진 실적 설명\u003c/td\u003e\n\u003ctd\u003e매출 증감 이유\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eItem 8. Financials\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e재무제표 원본\u003c/td\u003e\n\u003ctd\u003e숫자 검증\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eCash Flow \u003e Financing\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e'Repurchase of common stock'\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e자사주 매입 규모\u003c/strong\u003e ⭐\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"현금흐름표의 Financing 항목에서 자사주 매입액을 보면, 애플이 자본을 얼마나 줄이는지 바로 보여. 그게 ROE 141%의 출처야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 미국 재무용어 (한국과 매칭)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e10-K 용어\u003c/th\u003e\n\u003cth\u003e한국\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eRevenue\u003c/td\u003e\n\u003ctd\u003e매출액\u003c/td\u003e\n\u003ctd\u003e총 판매\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNet Income\u003c/td\u003e\n\u003ctd\u003e당기순이익\u003c/td\u003e\n\u003ctd\u003e최종 이익\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDiluted EPS\u003c/td\u003e\n\u003ctd\u003e희석 EPS\u003c/td\u003e\n\u003ctd\u003e주당 이익\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eFree Cash Flow\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e잉여현금흐름\u003c/td\u003e\n\u003ctd\u003e영업현금 − 설비투자 ⭐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShareholders' Equity\u003c/td\u003e\n\u003ctd\u003e자기자본\u003c/td\u003e\n\u003ctd\u003e순자산 (자사주로 작아질 수 있음)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eBuyback / Repurchase\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e자사주 매입\u003c/td\u003e\n\u003ctd\u003e주식 수 감소\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"\u003cstrong\u003eFCF\u003c/strong\u003e가 미장 투자자들의 최애 숫자야. 회계이익은 조정 가능하지만 현금은 못 속여. 애플처럼 FCF가 꾸준하니 자사주도 살 수 있는 거지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 함정 — 미국 특유의 주의점\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"조심할 건요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"셋이야.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eNon-GAAP 이익\u003c/strong\u003e: 회사가 유리하게 '조정한' 이익. 공식(GAAP)과 비교\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSBC(주식보상비용)\u003c/strong\u003e: 테크 기업이 이 비용을 빼고 이익을 부풀림\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ebuyback의 그림자\u003c/strong\u003e: 자사주를 \u003cstrong\u003e고점에 무리하게 빚내서 사면\u003c/strong\u003e 오히려 독. 자사주 매입이 항상 선은 아님\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"ROE 141% 보고 '와 최고 기업' 하지 말고, \u003cstrong\u003e그게 어떻게 나온 숫자인지\u003c/strong\u003e 분해하는 게 고수야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e경로\u003c/th\u003e\n\u003cth\u003e확인할 것\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSEC EDGAR\u003c/strong\u003e (sec.gov/edgar)\u003c/td\u003e\n\u003ctd\u003e티커 \u003e 10-K\u003c/td\u003e\n\u003ctd\u003eRisk Factors·MD\u0026#x26;A·자사주 매입액 ⭐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eMacrotrends\u003c/strong\u003e (macrotrends.net)\u003c/td\u003e\n\u003ctd\u003e티커 \u003e Shares Outstanding\u003c/td\u003e\n\u003ctd\u003e주식 수 감소 추이(buyback 효과)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003estockanalysis.com\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e티커\u003c/td\u003e\n\u003ctd\u003eFCF·자사주·ROE 깔끔 요약(무료)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 애플 ROE가 141%나 되는 주된 이유는?\r\n→ \u003cstrong\u003e자사주 매입·소각\u003c/strong\u003e으로 자기자본(ROE 분모)이 작아져서\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 애플 PBR이 42배인 것과 ROE 141%는 같은 원인인가?\r\n→ 그렇다. 둘 다 \u003cstrong\u003e순자산(자본)이 자사주 매입으로 작아진\u003c/strong\u003e 결과\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 미장 투자자가 회계이익보다 신뢰하는 현금 지표는?\r\n→ \u003cstrong\u003eFCF\u003c/strong\u003e(잉여현금흐름) = 영업현금흐름 − 설비투자\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 사이클 예고\u003c/strong\u003e: 기술적 분석(차트)도 국장/미장으로! 한국은 빨강=상승, 미국은 초록=상승 — 캔들 색부터 거꾸로다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 종목은 개념 설명용 예시이며 매수 추천이 아닙니다. 수치는 2026-06-02 기준이며 매일 변합니다. 자사주·ROE 해석은 자본구조에 따라 달라집니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-07\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🇺🇸 [미장 재무 2] 애플 ROE 141%·PBR 42의 비밀 — 자사주의 마법\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"🇺🇸 [미장 재무 2] 애플 ROE 141%·PBR 42의 비밀 —
