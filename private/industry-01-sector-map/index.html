d\u003e은행·보험·증권\u003c/td\u003e\n\u003ctd\u003e금리수혜·경기민감\u003c/td\u003e\n\u003ctd\u003eKB·신한·삼성화재\u003c/td\u003e\n\u003ctd\u003eJPM·BofA·비자\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e산업재\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e기계·항공·건설·방산\u003c/td\u003e\n\u003ctd\u003e경기민감\u003c/td\u003e\n\u003ctd\u003e한화에어로·HD현대\u003c/td\u003e\n\u003ctd\u003e보잉·캐터필러\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e소재\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e화학·철강·비철\u003c/td\u003e\n\u003ctd\u003e경기민감·원자재\u003c/td\u003e\n\u003ctd\u003ePOSCO·LG화학\u003c/td\u003e\n\u003ctd\u003e다우·프리포트\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e에너지\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e정유·가스\u003c/td\u003e\n\u003ctd\u003e유가연동\u003c/td\u003e\n\u003ctd\u003eS-Oil·SK이노베이션\u003c/td\u003e\n\u003ctd\u003e엑슨·셰브론\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e유틸리티\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e전기·가스·수도\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e방어·고배당\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e한국전력\u003c/td\u003e\n\u003ctd\u003e넥스트에라\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e부동산\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e리츠·개발\u003c/td\u003e\n\u003ctd\u003e금리민감\u003c/td\u003e\n\u003ctd\u003e상장리츠\u003c/td\u003e\n\u003ctd\u003e프로로지스\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"11개다. 다 외울 필욘 없어. 일단 \u003cstrong\u003e'경기민감이냐 방어냐'\u003c/strong\u003e, **'금리에 민감하냐'**만 색칠해도 절반은 먹고 들어간다. 이건 다음 편에서 깊이 판다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 섹터를 알면 무엇이 좋은가\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"세 가지 무기가 생긴다.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e성격 짐작\u003c/strong\u003e: 처음 본 종목도 섹터로 대략의 위험·성격을 안다\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e분산 점검\u003c/strong\u003e: 내 포트폴리오가 한 섹터에 쏠렸는지 보인다 (반도체만 5종목? 위험!)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e국면 대응\u003c/strong\u003e: 경기·금리 국면에 맞는 섹터로 무게중심을 옮긴다(로테이션)\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"제 계좌가 다 IT주였는데... 그게 분산이 아니었네요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"바로 그거다. 종목 수가 10개라도 \u003cstrong\u003e전부 한 섹터면 분산이 아니다.\u003c/strong\u003e 섹터 지도가 그걸 잡아줘.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 섹터마다 보는 핵심 지표가 다르다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"같은 PER 잣대를 모든 섹터에 들이대면 틀린다. 동네마다 룰이 달라.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e섹터\u003c/th\u003e\n\u003cth\u003e핵심으로 보는 것\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e은행/금융\u003c/td\u003e\n\u003ctd\u003ePBR·순이자마진(NIM)·연체율\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e기술/성장\u003c/td\u003e\n\u003ctd\u003e매출성장률·선행PER·점유율\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e정유/에너지\u003c/td\u003e\n\u003ctd\u003e유가·정제마진\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e유틸리티/리츠\u003c/td\u003e\n\u003ctd\u003e배당수익률·금리\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e바이오\u003c/td\u003e\n\u003ctd\u003e파이프라인·임상 단계 (PER 무의미할 때多)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e경기소비재\u003c/td\u003e\n\u003ctd\u003e소비경기·재고\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"재무편에서 'PER만 보지 마라' 했지? \u003cstrong\u003e섹터마다 적정 PER과 핵심 지표가 다르다.\u003c/strong\u003e 은행은 PBR로, 바이오는 파이프라인으로 본다. 동네 룰을 따라라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"종목 수만 많으면 분산\"\u003c/strong\u003e ❌ → 전부 한 섹터면 \u003cstrong\u003e섹터 리스크에 통째로 노출\u003c/strong\u003e. 섹터 분산이 진짜 분산.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"PER로 모든 섹터 비교\"\u003c/strong\u003e ❌ → 섹터마다 적정 밸류·핵심지표가 다르다. \u003cstrong\u003e같은 섹터끼리\u003c/strong\u003e 비교해라.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"섹터는 고정\"\u003c/strong\u003e ❌ → 분류가 바뀌기도(예: 일부 인터넷주 → 커뮤니케이션). 큰 성격만 기억.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e섹터/업종 분류\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권 '업종'\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e업종별 등락·종목\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e미국 섹터\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003efinviz.com 'Maps'\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e섹터 히트맵 한눈에\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e섹터 ETF\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX / etf.com\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e섹터별 ETF로 분산\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 종목 10개를 보유해도 분산이 안 될 수 있는 이유는?\r\n→ **전부 한 섹터(예: 반도체)**면 섹터 리스크에 통째로 노출. 종목 수가 아니라 \u003cstrong\u003e섹터 분산\u003c/strong\u003e이 핵심.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 은행주를 PER로만 비교하면 안 되는 이유는?\r\n→ 은행은 \u003cstrong\u003ePBR·순이자마진·연체율\u003c/strong\u003e이 핵심. 섹터마다 적정 지표가 다름.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 필수소비재와 경기소비재의 성격 차이는?\r\n→ 필수(음식료·생활용품)는 \u003cstrong\u003e방어적\u003c/strong\u003e, 경기(자동차·여행)는 \u003cstrong\u003e경기민감\u003c/strong\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [산업 2] 경기민감 vs 방어 — 경기 사계절에 맞춰 섹터를 갈아타는 법(로테이션).\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목·섹터 추천이 아닙니다. 분류·예시는 참고용입니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-06\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🏭 [산업 1] 섹터 지도 — 시장은 11개 동네로 나뉜다\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"🏭 [산업 1] 섹터 지도 — 시장은 11개 동네로 나뉜다 | midasworld (Private)\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"서버 개발 학습 블로그\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon
