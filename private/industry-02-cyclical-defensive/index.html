03e호두\u003c/strong\u003e: \"계절마다 잘 나가는 섹터가 정해져 있어요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"경향이 있다. 100%는 아니지만, 큰 그림을 잡는 데 강력해. 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 경기민감주 vs 방어주\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e구분\u003c/th\u003e\n\u003cth\u003e성격\u003c/th\u003e\n\u003cth\u003e섹터\u003c/th\u003e\n\u003cth\u003e비유\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e경기민감(cyclical)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e경기 좋으면 폭발, 나쁘면 급락\u003c/td\u003e\n\u003ctd\u003e경기소비재·산업재·소재·에너지·금융\u003c/td\u003e\n\u003ctd\u003e맑은 날 잘 파는 아이스크림\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e방어(defensive)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e경기와 무관하게 꾸준\u003c/td\u003e\n\u003ctd\u003e필수소비재·헬스케어·유틸리티·통신\u003c/td\u003e\n\u003ctd\u003e비 오나 맑으나 사는 생필품\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"사람은 불황에도 \u003cstrong\u003e밥 먹고(필수소비), 약 먹고(헬스케어), 전기 쓴다(유틸리티).\u003c/strong\u003e 그래서 방어주는 덜 흔들려. 반대로 차·여행·명품(경기소비)은 불황에 가장 먼저 줄이지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 섹터 로테이션 — 사계절 지도\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"경기 국면(경제 3편)에 섹터를 얹으면 이렇게 된다. \u003cstrong\u003e일반적 경향\u003c/strong\u003e이다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e국면\u003c/th\u003e\n\u003cth\u003e금리·경기\u003c/th\u003e\n\u003cth\u003e유리한 섹터(경향)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e회복(봄)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e저금리·바닥 반등\u003c/td\u003e\n\u003ctd\u003e경기소비재·금융·\u003cstrong\u003e기술/성장\u003c/strong\u003e·중소형\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e확장(여름)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e성장·물가↑\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e산업재·소재·에너지\u003c/strong\u003e(원자재 수혜)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e둔화(가을)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e고금리·과열 식음\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e필수소비재·헬스케어\u003c/strong\u003e(방어 전환)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e침체(겨울)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e인하 시작·역성장\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e유틸리티·통신·배당주\u003c/strong\u003e·국채\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"오늘(고금리·급락)은 '가을~겨울' 느낌이니 방어주가 유리하겠네요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그 추론이 맞다. 실제로 06-02→06-05 국장 폭락에서 \u003cstrong\u003e은행(금융)·배당주가 선방\u003c/strong\u003e하고 성장주가 빠졌지(국장 특별편 복기). 경기·금리 국면과 섹터를 연결하는 눈, 그게 핵심이다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. ⚠️ 로테이션의 진실 — 만능 아니다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"여기서 자만하면 안 된다. 로테이션은 \u003cstrong\u003e참고 지도지 마법 공식이 아니야.\u003c/strong\u003e\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e시장은 선행한다(경제 3편)\u003c/strong\u003e → 가을이 '확인'되면 방어주는 이미 올라 있다. 뒤늦게 따라가면 상투.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e국면 구분이 칼같지 않다\u003c/strong\u003e → 봄인지 여름인지 실시간엔 모호하다. 사후에야 명확.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e개별 종목 \u003e 섹터일 때도\u003c/strong\u003e → 방어 섹터라도 부실 기업은 빠지고, 경기민감이라도 1등은 다르다.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 로테이션은 \u003cstrong\u003e'무게중심을 약간 옮기는'\u003c/strong\u003e 도구지, '몰빵 갈아타기'가 아니다. \u003cstrong\u003e분산을 유지\u003c/strong\u003e하면서 비중을 조절하는 거야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 실전 — 내 포트폴리오에 적용\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"거창하게 갈아타지 말고, 이렇게 점검만 해도 충분하다.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-swift\"\u003e① 지금 국면 추정: 금리(오름\u003cspan class=\"hljs-regexp\"\u003e/내림) + 경기(확장/\u003c/span\u003e둔화) \u003cspan class=\"hljs-operator\"\u003e→\u003c/span\u003e 사계절 어디쯤\u003cspan class=\"hljs-operator\"\u003e?\u003c/span\u003e\r\n② 내 보유 점검: 경기민감 vs 방어 비중이 한쪽으로 쏠렸나\u003cspan class=\"hljs-operator\"\u003e?\u003c/span\u003e\r\n③ 미세조정: 둔화·고금리 신호 짙으면 방어 비중 \u003cspan class=\"hljs-operator\"\u003e↑\u003c/span\u003e (전량 교체 \u003cspan class=\"hljs-type\"\u003eX\u003c/span\u003e, 비중만)\r\n④ 분산 유지: 어떤 국면이든 한 섹터 몰빵은 금지\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"갈아타는 게 아니라 \u003cstrong\u003e무게중심만 살짝\u003c/strong\u003e 옮기는 거군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래. 그게 어른의 투자다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 함정 정리\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"가을이니 방어주 몰빵\"\u003c/strong\u003e ❌ → 확인됐을 땐 이미 올랐다(선행). 분산 속 \u003cstrong\u003e비중 조절\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"경기민감주는 나쁘다\"\u003c/strong\u003e ❌ → 봄·여름엔 최고 수익. \u003cstrong\u003e타이밍과 국면\u003c/strong\u003e의 문제지 우열이 아님.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"섹터만 맞추면 된다\"\u003c/strong\u003e ❌ → 같은 섹터도 \u003cstrong\u003e1등 기업 vs 부실 기업\u003c/strong\u003e 차이 큼. 종목 검증(재무편)은 별개.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e섹터별 등락\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003efinviz Maps / 네이버 업종\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e어느 섹터로 돈이 도나\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e경기국면\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFRED·OECD CLI\u003c/strong\u003e(경제 3편)\u003c/td\u003e\n\u003ctd\u003e선행지수로 계절 추정\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e섹터 ETF\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX / etf.com\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e비중 조절을 ETF로\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 불황에도 방어주(필수소비·유틸리티)가 덜 흔들리는 이유는?\r\n→ 경기와 무관하게 \u003cstrong\u003e밥·약·전기\u003c/strong\u003e처럼 꾸준히 소비되는 필수재라서.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 고금리·경기둔화 국면에서 경향적으로 유리한 섹터는?\r\n→ \u003cstrong\u003e필수소비재·헬스케어·유틸리티·배당주\u003c/strong\u003e 등 방어·고배당 섹터.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 섹터 로테이션을 '몰빵 갈아타기'로 하면 안 되는 이유는?\r\n→ 시장은 \u003cstrong\u003e선행\u003c/strong\u003e해 확인 시 이미 반영됐고 국면 구분도 모호 → \u003cstrong\u003e분산 유지 + 비중만 조절\u003c/strong\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [산업 3] 경제적 해자(Moat) — 버핏이 평생 찾은 '무너지지 않는 성벽'.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 섹터 추천이 아닙니다. 로테이션은 경향일 뿐 보장이 아닙니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark
