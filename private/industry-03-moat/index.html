에요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"아니다. \u003cstrong\u003e'지금 잘 버는 것'과 '앞으로도 잘 벌 것'은 달라.\u003c/strong\u003e 해자는 그 차이를 만든다. 5가지 유형을 알려주마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 왜 해자가 중요한가 — ROE를 지키는 힘\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"재무편에서 **'높은 ROE를 오래 유지하는 회사'**가 좋다 했지? 문제는 — 돈을 잘 벌면 \u003cstrong\u003e경쟁자가 몰려들어\u003c/strong\u003e ROE를 깎아내린다는 거다. \u003cstrong\u003e해자가 그 경쟁을 막아줘.\u003c/strong\u003e\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e해자 없는 고수익 = 곧 경쟁자가 와서 사라질 수익\r\n해자 있는 고수익 = 오래 지속되는 수익 → 높은 PBR 정당화(재무편 PBR=PER×ROE)\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 버핏은 '해자가 넓고 깊은 성'을 산다. 한 해 실적이 아니라 \u003cstrong\u003e10년 뒤에도 이 회사가 1등일까\u003c/strong\u003e를 묻는 거지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 해자의 5가지 유형\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e해자\u003c/th\u003e\n\u003cth\u003e원리\u003c/th\u003e\n\u003cth\u003e예\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e① 무형자산\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e브랜드·특허·면허\u003c/td\u003e\n\u003ctd\u003e코카콜라(브랜드), 제약 특허, 카지노 면허\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e② 전환비용\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e바꾸기 번거롭고 비쌈\u003c/td\u003e\n\u003ctd\u003e기업용 SW(ERP), 은행 주거래\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e③ 네트워크 효과\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e쓸수록 가치↑\u003c/td\u003e\n\u003ctd\u003e카카오톡, 비자/마스터카드, 플랫폼\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e④ 원가우위\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e남보다 싸게 만듦\u003c/td\u003e\n\u003ctd\u003e대규모 생산, 독점 광산, 물류망\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e⑤ 효율적 규모\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시장이 작아 신규진입 무의미\u003c/td\u003e\n\u003ctd\u003e지역 독점 인프라·유틸리티\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"카카오톡은 친구가 다 쓰니까 못 떠나고(③), 회사 ERP는 바꾸기 무서워서 계속 쓰고(②)... 이런 게 해자군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다! 너도 모르게 그 해자에 갇혀 돈을 쓰고 있지. \u003cstrong\u003e소비자를 가두는 그 힘\u003c/strong\u003e이 곧 기업의 해자야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 해자를 확인하는 '증거' — 말 말고 숫자로\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"회사가 '우린 브랜드가 강합니다' 떠드는 건 의미 없다. \u003cstrong\u003e숫자에 해자가 찍힌다.\u003c/strong\u003e\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e높고 안정적인 ROE/영업이익률\u003c/strong\u003e (5~10년 추이) → 경쟁을 막아낸 증거\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e가격 결정력\u003c/strong\u003e → 원가 올라도 값을 올려 마진 유지(인플레편 '가격전가력')\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e점유율 유지·확대\u003c/strong\u003e → 1등을 오래 지키나\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e꾸준한 이익·현금흐름\u003c/strong\u003e → 변동성 적은 수익\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"특히 ①번. \u003cstrong\u003e마진이 10년째 높게 유지\u003c/strong\u003e되는데도 경쟁자가 못 깬다면, 거기엔 반드시 해자가 있다. 숫자가 말해주는 거야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. ⚠️ 해자는 영원하지 않다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"여기서 방심하면 안 된다. \u003cstrong\u003e해자도 메워진다.\u003c/strong\u003e\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e노키아·코닥: 한때 난공불락 → 기술 변화에 해자가 증발\u003c/li\u003e\n\u003cli\u003e신문·방송: 인터넷이 네트워크 효과를 깸\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e기술 변화·규제·소비자 이동\u003c/strong\u003e이 해자를 침식한다\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그럼 해자가 있어도 계속 지켜봐야 하는 거네요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇다. **'해자가 넓어지고 있나, 좁아지고 있나'**를 묻는 거다. AI·플랫폼 시대엔 해자가 더 빨리 바뀌어. 산 이유(해자)가 깨지면 매도(실전편) — 그게 원칙이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 실전 — 해자 점검 질문 5개\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"종목을 볼 때 이 다섯을 물어라.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e① 이 회사가 사라지면 고객이 정말 불편한가? (대체 가능성)\r\n② 경쟁자가 돈을 쏟으면 따라잡을 수 있나? (진입장벽)\r\n③ 가격을 올려도 고객이 떠나지 않나? (가격결정력)\r\n④ 마진·ROE가 \u003cspan class=\"hljs-number\"\u003e5\u003c/span\u003e년 넘게 높게 유지되나? (숫자 증거)\r\n⑤ 그 해자가 넓어지나 좁아지나? (방향)\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"지금 ROE 높으니 좋은 기업\"\u003c/strong\u003e ❌ → 해자 없으면 \u003cstrong\u003e경쟁자가 와서 깎는다.\u003c/strong\u003e 지속성이 핵심.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"유명하면 해자 있다\"\u003c/strong\u003e ❌ → 인지도 ≠ 해자. \u003cstrong\u003e마진·점유율 지속\u003c/strong\u003e이라는 숫자로 확인.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"한번 해자면 영원\"\u003c/strong\u003e ❌ → 기술·규제로 \u003cstrong\u003e침식\u003c/strong\u003e된다. 방향을 계속 점검.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e마진·ROE 추이\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eFnGuide / DART\u003c/strong\u003e(재무편)\u003c/td\u003e\n\u003ctd\u003e5~10년 영업이익률·ROE\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e점유율·경쟁\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e사업보고서 '사업의 내용'\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시장지위·경쟁 서술\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e해자 등급(미국)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eMorningstar\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eWide/Narrow/No Moat 평가\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 경제적 해자가 'ROE의 지속성'과 연결되는 이유는?\r\n→ 고수익엔 경쟁자가 몰려 ROE를 깎는데, \u003cstrong\u003e해자가 그 경쟁을 막아\u003c/strong\u003e 높은 ROE를 오래 유지시킴.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 카카오톡·비자가 가진 해자 유형은?\r\n→ \u003cstrong\u003e네트워크 효과\u003c/strong\u003e(쓰는 사람이 많을수록 가치↑, 떠나기 어려움).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e \"유명한 브랜드면 해자가 있다\"가 위험한 판단인 이유는?\r\n→ 인지도가 곧 해자는 아님. \u003cstrong\u003e가격결정력·마진·점유율 지속\u003c/strong\u003e이라는 숫자로 확인해야 하고, 해자는 침식될 수 있음.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [산업 4] 산업분석 실전 — 밸류체인·경쟁구조로 '돈이 어디서 나는지' 읽기.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 종목 추천이 아닙니다. 해자는 변하므로 지속 점검이 필요합니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-04\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🏭 [산업 3] 경제적 해자(Moat) — 무너지지 않는 성벽\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"🏭 [산업 3] 경제적 해자(Moat) — 무너지지 않는 성벽 | midasworld (Private)\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"서버 개발 학습 블로그\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L16\",\"3\",{}]]\n"])</script></body></html>
