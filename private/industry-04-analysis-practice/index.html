inking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"산업을 해부한다고요? 어떻게요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"두 개의 도구를 줄게. \u003cstrong\u003e밸류체인\u003c/strong\u003e과 \u003cstrong\u003e경쟁구조\u003c/strong\u003e다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 밸류체인 — 돈이 흐르는 강줄기\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"어떤 제품이든 \u003cstrong\u003e원료 → 부품 → 완제품 → 유통 → 소비자\u003c/strong\u003e로 흐른다. 이 강줄기에서 \u003cstrong\u003e어느 길목이 돈을 가장 많이 먹나\u003c/strong\u003e를 봐야 해.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e예: 반도체 밸류체인\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e설계(팹리스) → 장비·소재 → 제조(파운드리) → 패키징 → 세트(스마트폰)\r\n   엔비디아      ASML·소재     TSMC           OSAT      애플·삼성\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"같은 '반도체 호황'이라도 \u003cstrong\u003e누가 제일 남기나\u003c/strong\u003e가 다르다. 장비 독점(ASML)·설계 독점(엔비디아)은 마진이 어마어마하지만, 단순 조립은 박하다. \u003cstrong\u003e'호황이면 다 좋다'가 아니라 길목을 봐라.\u003c/strong\u003e\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"AI 붐이라고 다 같이 버는 게 아니라, **목 좋은 길목(엔비디아·ASML)**이 다 가져가는 거군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그게 밸류체인 분석이다. \u003cstrong\u003e병목(독과점) 길목\u003c/strong\u003e이 해자(3편)와 만나면 최고의 자리지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 경쟁구조 — 5가지 힘 (포터의 5 Forces)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"산업의 매력은 \u003cstrong\u003e경쟁의 5가지 힘\u003c/strong\u003e으로 판단한다. 힘이 셀수록 그 산업은 돈 벌기 어려워.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e힘\u003c/th\u003e\n\u003cth\u003e질문\u003c/th\u003e\n\u003cth\u003e약하면(좋음)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e기존 경쟁\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e출혈 경쟁 중인가?\u003c/td\u003e\n\u003ctd\u003e과점·점잖은 경쟁\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e신규 진입\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e새 경쟁자가 쉽게 오나?\u003c/td\u003e\n\u003ctd\u003e진입장벽 높음(해자)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e대체재\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e대체 상품이 있나?\u003c/td\u003e\n\u003ctd\u003e대체 어려움\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e공급자 힘\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e원료 공급자가 갑인가?\u003c/td\u003e\n\u003ctd\u003e공급자 약함\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e구매자 힘\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e고객이 갑이라 값 후려치나?\u003c/td\u003e\n\u003ctd\u003e고객 분산·약함\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"치킨게임 중인 산업(예: 한때 LCD·해운)은 1등도 피를 흘린다. 반대로 \u003cstrong\u003e과점이고 진입장벽 높은\u003c/strong\u003e 산업(예: 신용카드망)은 다들 편하게 벌지. \u003cstrong\u003e산업 자체의 매력\u003c/strong\u003e부터 봐야 해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 톱다운 vs 보텀업 — 두 방향의 접근\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"분석엔 두 방향이 있다. 둘을 \u003cstrong\u003e합쳐야\u003c/strong\u003e 강하다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e방식\u003c/th\u003e\n\u003cth\u003e순서\u003c/th\u003e\n\u003cth\u003e강점\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e톱다운(하향식)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e경제→섹터→산업→종목\u003c/td\u003e\n\u003ctd\u003e큰 흐름·국면 포착(경제 트랙)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e보텀업(상향식)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e종목(재무·해자)→위로\u003c/td\u003e\n\u003ctd\u003e좋은 기업 발굴(재무편)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"톱다운으로 **'지금 어느 산업에 순풍이 부나'**를 고르고, 보텀업으로 **'그 산업에서 가장 튼튼한 기업'**을 고른다. 위에서 한 번, 아래서 한 번 — \u003cstrong\u003e양쪽에서 만나면\u003c/strong\u003e 확신이 커지지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 산업 라이프사이클 — 성장 단계도 본다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"산업도 사람처럼 \u003cstrong\u003e유년기→성장기→성숙기→쇠퇴기\u003c/strong\u003e가 있다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e단계\u003c/th\u003e\n\u003cth\u003e특징\u003c/th\u003e\n\u003cth\u003e투자 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e태동/성장\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e고성장·적자도 많음\u003c/td\u003e\n\u003ctd\u003e점유율 1등 후보, 변동성 큼\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e성숙\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e성장 둔화·안정 이익\u003c/td\u003e\n\u003ctd\u003e배당·현금흐름, 1등의 해자\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e쇠퇴\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시장 축소\u003c/td\u003e\n\u003ctd\u003e구조조정·배당 회수, 가치함정 주의\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"성숙·쇠퇴 산업의 저PER은 **'가치함정'**일 수 있다(재무편 '싼 데는 이유'). 반대로 성장산업은 PER이 높아도 정당화되기도 해. \u003cstrong\u003e단계에 맞는 잣대\u003c/strong\u003e를 써라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 실전 — 산업 한 장 분석 템플릿\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-yaml\"\u003e\u003cspan class=\"hljs-string\"\u003e①\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e밸류체인:\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e이\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e산업의\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e돈은\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e어느\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e길목에\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e몰리나?\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e(병목=기회)\u003c/span\u003e\r\n\u003cspan class=\"hljs-string\"\u003e②\u003c/span\u003e \u003cspan class=\"hljs-attr\"\u003e5 Forces:\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e산업\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e자체가\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e돈\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e벌기\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e좋은\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e구조인가?\u003c/span\u003e\r\n\u003cspan class=\"hljs-string\"\u003e③\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e라이프사이클:\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e성장기인가\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e성숙·쇠퇴기인가?\u003c/span\u003e\r\n\u003cspan class=\"hljs-string\"\u003e④\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e순풍/역풍:\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e경제·금리·정책이\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e이\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e산업에\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e우호적인가?\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e(톱다운)\u003c/span\u003e\r\n\u003cspan class=\"hljs-string\"\u003e⑤\u003c/span\u003e \u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e\u003cspan class=\"hljs-string\"\u003e등\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e후보:\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e그\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e안에서\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e해자·재무\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e튼튼한\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e기업은?\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e(보텀업)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이 다섯 줄이면 처음 보는 산업도 \u003cstrong\u003e30분이면 뼈대\u003c/strong\u003e를 잡는다. 유튜버 말 듣기 전에 \u003cstrong\u003e스스로\u003c/strong\u003e 이걸 채워봐.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"호황 산업이면 아무 종목이나\"\u003c/strong\u003e ❌ → \u003cstrong\u003e밸류체인 길목\u003c/strong\u003e이 다 가른다. 병목을 쥔 회사가 남긴다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"경쟁 심한 줄 모르고 1등이라 매수\"\u003c/strong\u003e ❌ → 치킨게임 산업은 1등도 피흘림. \u003cstrong\u003e산업 구조\u003c/strong\u003e부터.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"저PER이면 무조건 싸다\"\u003c/strong\u003e ❌ → \u003cstrong\u003e쇠퇴 산업의 가치함정\u003c/strong\u003e일 수 있음. 라이프사이클 확인.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e산업 구조·밸류체인\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 산업분석 리포트\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e무료 리서치\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e사업 내용·경쟁\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eDART 사업보고서\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e'사업의 내용'\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e글로벌 산업 동향\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e업종 ETF 구성·뉴스\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e밸류체인 종목 파악\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 같은 'AI 붐'에도 종목별 수익이 갈리는 이유를 밸류체인으로 설명하면?\r\n→ \u003cstrong\u003e병목(독과점) 길목\u003c/strong\u003e(설계·장비)이 마진을 독식. 단순 조립 길목은 박함.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 톱다운과 보텀업을 합치면 좋은 이유는?\r\n→ 톱다운으로 \u003cstrong\u003e순풍 부는 산업\u003c/strong\u003e을, 보텀업으로 \u003cstrong\u003e그 안의 튼튼한 1등\u003c/strong\u003e을 골라 양쪽에서 검증.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 쇠퇴 산업의 저PER을 조심해야 하는 이유는?\r\n→ 시장이 줄어드는 \u003cstrong\u003e가치함정\u003c/strong\u003e일 수 있음. 라이프사이클 단계에 맞는 잣대 필요.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🎓 산업·섹터 트랙 졸업\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"섹터 지도·로테이션·해자·산업분석까지 왔다. 이제 너는 **'어느 동네가 따뜻하고, 그 동네 누가 성벽이 튼튼한지'**를 읽는다. 다음은 이걸로 \u003cstrong\u003e배당\u003c/strong\u003e과 \u003cstrong\u003e포트폴리오\u003c/strong\u003e를 짜는 단계다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 산업·종목 추천이 아닙니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-03\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🏭 [산업 4] 산업분석 실전 — 돈이 어디서 나는지 읽기\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\
