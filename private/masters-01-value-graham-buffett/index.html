aracters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"오래된 방법이 지금도 통해요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e원칙은 유행을 안 탄다.\u003c/strong\u003e 핵심 4가지를 새겨라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 미스터 마켓 — 시장은 변덕쟁이 동업자\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그레이엄의 가장 유명한 비유다. 시장을 \u003cstrong\u003e'미스터 마켓'이라는 조울증 동업자\u003c/strong\u003e로 상상해라.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e매일 찾아와 \u003cstrong\u003e가격을 부른다\u003c/strong\u003e — 어떤 날은 들떠서 비싸게, 어떤 날은 우울해서 헐값에\u003c/li\u003e\n\u003cli\u003e너는 그의 호가에 \u003cstrong\u003e응할 의무가 없다\u003c/strong\u003e — 유리할 때만 거래하면 돼\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e시장은 너의 주인이 아니라 하인\u003c/strong\u003e — 가격을 알려줄 뿐, 가치를 정하는 건 너\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그러니까 시장이 패닉해서 싸게 팔 때(오늘 같은 폭락) 오히려 기회일 수 있는 거군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"바로 그거다. **'남들이 공포에 떨 때 욕심내고, 남들이 욕심낼 때 두려워하라'**는 버핏의 말이 여기서 나와. 군중과 반대로 생각하는 힘이지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 안전마진(Margin of Safety) — 가치투자의 핵심\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그레이엄 사상의 \u003cstrong\u003e한 단어 요약\u003c/strong\u003e이 안전마진이다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e안전마진 = 내재가치(재무심화 DCF) − 가격\u003c/strong\u003e. 가치보다 \u003cstrong\u003e충분히 싸게\u003c/strong\u003e 사서 오차에 대비.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e1만원 가치를 \u003cstrong\u003e7천원에\u003c/strong\u003e 사면 → 3천원의 \u003cstrong\u003e안전 쿠션\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e내 분석이 틀려도, 악재가 와도 \u003cstrong\u003e버틸 여유\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\"싸게 사는 것\"이 곧 \u003cstrong\u003e위험 관리\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"투자는 미래를 다루니 \u003cstrong\u003e반드시 틀린다.\u003c/strong\u003e 그 틀림을 \u003cstrong\u003e싸게 사서\u003c/strong\u003e 견디는 거다. **'잃지 않는 것이 첫째'**라는 버핏 1원칙이 안전마진이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 능력 범위(Circle of Competence)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"버핏의 또 한 축. \u003cstrong\u003e'네가 이해하는 것만 사라.'\u003c/strong\u003e\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e사업 모델·돈 버는 구조를 \u003cstrong\u003e설명할 수 있는\u003c/strong\u003e 기업만\u003c/li\u003e\n\u003cli\u003e모르는 분야(못 이해하는 기술·복잡한 파생)는 \u003cstrong\u003e패스해도 된다\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e원의 크기보다 \u003cstrong\u003e원의 경계를 아는 것\u003c/strong\u003e이 중요\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"버핏이 닷컴버블 때 IT를 피한 게 '몰라서'였어. 손해 본 듯했지만 버블 붕괴를 피했지. **'모르면 안 한다'**는 게 약점이 아니라 강점이다. 남의 텐배거를 부러워 말고 \u003cstrong\u003e네가 아는 것\u003c/strong\u003e에 집중해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 좋은 기업을 적정가에 — 버핏의 진화\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그레이엄은 '싸구려(담배꽁초)'를 샀다면, 버핏은 파트너 멍거의 영향으로 진화했다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e\"적당한 기업을 훌륭한 가격에 사는 것보다, 훌륭한 기업을 적당한 가격에 사는 게 낫다.\"\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e해자(산업 3편)\u003c/strong\u003e 있는 위대한 기업을 + \u003cstrong\u003e합리적 가격\u003c/strong\u003e에 + \u003cstrong\u003e오래 보유\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e단기 차익이 아니라 \u003cstrong\u003e기업의 성장에 동행\u003c/strong\u003e(복리)\u003c/li\u003e\n\u003cli\u003e\"내가 가장 좋아하는 보유 기간은 \u003cstrong\u003e영원히\u003c/strong\u003e\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이게 가치투자의 완성형이다. \u003cstrong\u003e싼 것 + 좋은 것 + 오래.\u003c/strong\u003e 재무(해자·ROE 지속)와 안전마진과 인내가 하나로 묶이지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 한 장 요약 — 그레이엄·버핏 체크\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs\"\u003e① 미스터 마켓: 공포로 싸질 때가 기회, 시장은 하인\r\n② 안전마진: 가치보다 충분히 싸게 (오차·악재 대비)\r\n③ 능력 범위: 이해하는 것만, 모르면 패스\r\n④ 좋은 기업 + 적정가 + 장기보유 (해자·복리)\r\n⑤ 제1원칙: 돈을 잃지 마라 / 제2원칙: 1원칙을 잊지 마라\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정 — 가치투자의 오해\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"싸면 무조건 가치투자\"\u003c/strong\u003e ❌ → \u003cstrong\u003e가치함정\u003c/strong\u003e(재무편 '싼 데는 이유')과 구분. 싼 데다 \u003cstrong\u003e좋아야\u003c/strong\u003e 함.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"가치투자는 영원히 존버\"\u003c/strong\u003e ❌ → \u003cstrong\u003e산 이유(가치·해자)가 깨지면 매도.\u003c/strong\u003e 무조건 버티기 아님.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"안전마진은 겁쟁이\"\u003c/strong\u003e ❌ → 미래는 틀리기 마련 → \u003cstrong\u003e싸게 사는 것이 최고의 위험관리.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e '미스터 마켓' 비유가 주는 교훈은?\r\n→ 시장은 변덕스러운 \u003cstrong\u003e하인\u003c/strong\u003e이니, 그가 공포로 \u003cstrong\u003e싸게 부를 때만\u003c/strong\u003e 유리하게 거래하면 됨.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 안전마진이 '최고의 위험관리'인 이유는?\r\n→ 미래 분석은 틀리기 마련인데, \u003cstrong\u003e가치보다 싸게 사두면\u003c/strong\u003e 오차·악재를 견딜 쿠션이 생김.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e '능력 범위'를 지키는 게 강점인 이유는?\r\n→ 이해 못 하는 곳(버블·복잡 상품)을 피해 \u003cstrong\u003e큰 실수를 면함\u003c/strong\u003e. 모르면 안 하는 것도 실력.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [대가 2] 피터 린치 \u0026#x26; 필립 피셔 — 성장주 발굴과 텐배거.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 d
