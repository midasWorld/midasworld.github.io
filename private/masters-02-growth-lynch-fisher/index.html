acters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"성장주는 비싸서 위험하다면서요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"비싼 값을 \u003cstrong\u003e성장이 정당화\u003c/strong\u003e하면 다르다. 그 판단법을 린치가 알려줬어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 텐배거(Ten-bagger) — 10배 오르는 주식\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"린치가 만든 말, \u003cstrong\u003e텐배거 = 10배 주식\u003c/strong\u003e이다. 그는 말했지 — \u003cstrong\u003e'한 종목이 10배 오르면, 9개가 반토막 나도 전체는 이긴다.'\u003c/strong\u003e\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e큰 수익은 \u003cstrong\u003e소수의 대박\u003c/strong\u003e에서 나온다 → 좋은 성장주는 \u003cstrong\u003e섣불리 팔지 마라\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\"꽃을 뽑고 잡초에 물 주지 마라\" — \u003cstrong\u003e오르는 좋은 주식을 너무 빨리 팔고, 물린 부실주를 붙잡는\u003c/strong\u003e 실수를 경계\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"초보는 10% 오르면 팔아 '익절'하고 좋아해. 그러다 텐배거를 놓치지. \u003cstrong\u003e이기는 주식을 오래 들고 가는 인내\u003c/strong\u003e가 성장투자의 핵심이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 생활 속에서 발견하라 — \"Invest in what you know\"\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"린치의 가장 유명한 가르침. \u003cstrong\u003e'네 주변에서 미래의 대박을 먼저 본다.'\u003c/strong\u003e\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e사람들이 줄 서는 매장, 모두 쓰는 앱, 안 끊는 서비스 → \u003cstrong\u003e소비자가 전문가보다 먼저\u003c/strong\u003e 안다\u003c/li\u003e\n\u003cli\u003e단, \u003cstrong\u003e발견은 시작일 뿐\u003c/strong\u003e — 반드시 \u003cstrong\u003e재무·실적 확인\u003c/strong\u003e(재무 트랙)으로 검증해야\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"내가 즐겨 쓰는 게 투자 아이디어가 될 수 있군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇다. 단, \u003cstrong\u003e'좋아 보인다'에서 멈추면 안 돼.\u003c/strong\u003e 린치도 '이야기(스토리)만 사지 말고 \u003cstrong\u003e숫자로 확인\u003c/strong\u003e하라' 했어. 좋은 제품 ≠ 좋은 주식. \u003cstrong\u003e사업이 돈을 버는지\u003c/strong\u003e 봐야지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 린치의 종목 분류 — 같은 잣대 금지\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"린치는 종목을 \u003cstrong\u003e유형별로 나눠\u003c/strong\u003e 다르게 봤다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e유형\u003c/th\u003e\n\u003cth\u003e특징\u003c/th\u003e\n\u003cth\u003e보는 법\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e고성장주\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e빠르게 크는 작은 기업\u003c/td\u003e\n\u003ctd\u003e성장 지속·PEG(재무편)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e대형우량주\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e느리지만 튼튼\u003c/td\u003e\n\u003ctd\u003e적정가·배당\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e경기순환주\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e경기 타는 업종(산업편)\u003c/td\u003e\n\u003ctd\u003e사이클 타이밍\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e자산주/회생주\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e숨은 자산·턴어라운드\u003c/td\u003e\n\u003ctd\u003e자산가치·회복 근거\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"산업·재무 트랙에서 배운 게 여기 다 녹지? \u003cstrong\u003e유형마다 사는 이유와 잣대가 다르다.\u003c/strong\u003e 고성장주를 배당주 잣대로 보면 틀려.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 필립 피셔 — 질적 분석과 '스캐틀벗'\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"피셔는 숫자 너머 **질(質)**을 봤다. 그의 방법이 **'스캐틀벗(scuttlebutt, 발로 뛰는 탐문)'**이다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e경쟁사·고객·직원·납품업체에게 \u003cstrong\u003e물어보며\u003c/strong\u003e 회사의 진짜 경쟁력을 파악\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e경영진의 정직성·R\u0026#x26;D·이익률의 지속성\u003c/strong\u003e을 중시 → 버핏의 '해자'에 영향\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e위대한 기업은 오래 보유\u003c/strong\u003e (피셔 역시 장기보유론자)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"피셔는 '훌륭한 회사를 찾으면 어지간해선 팔지 말라' 했어. 버핏이 그레이엄(싸게)과 피셔(좋은 기업)를 \u003cstrong\u003e합쳐\u003c/strong\u003e 완성한 거지. \u003cstrong\u003e'성장'과 '가치'는 적이 아니라 한 몸\u003c/strong\u003e이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 한 장 요약 — 성장투자 체크\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-swift\"\u003e① 텐배거 사고: 이기는 주식은 오래, 부실주는 빨리 정리 (꽃에 물 주기)\r\n② 생활 속 발견 \u003cspan class=\"hljs-operator\"\u003e→\u003c/span\u003e 반드시 재무로 검증 (스토리 \u003cspan class=\"hljs-operator\"\u003e+\u003c/span\u003e 숫자)\r\n③ 종목 유형별 다른 잣대 (고성장\u003cspan class=\"hljs-regexp\"\u003e/우량/\u003c/span\u003e순환\u003cspan class=\"hljs-operator\"\u003e/\u003c/span\u003e자산)\r\n④ 질적 분석: 경영진·경쟁력·이익 지속성 (피셔 스캐틀벗)\r\n⑤ 좋은 기업은 인내로 장기보유\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"좋은 제품이면 좋은 주식\"\u003c/strong\u003e ❌ → \u003cstrong\u003e숫자로 검증\u003c/strong\u003e 필수. 인기 ≠ 수익성.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"성장주니 비싸도 OK\"\u003c/strong\u003e ❌ → 성장이 \u003cstrong\u003e꺾이면\u003c/strong\u003e 고PER이 폭락(PEG·기대치 점검).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"조금 올랐으니 익절\"\u003c/strong\u003e ❌ → \u003cstrong\u003e텐배거를 놓치는\u003c/strong\u003e 전형. 이기는 종목엔 인내.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 린치의 \"꽃을 뽑고 잡초에 물 준다\"가 경계하는 실수는?\r\n→ \u003cstrong\u003e오르는 좋은 주식을 너무 빨리 팔고\u003c/strong\u003e, 물린 부실주를 붙잡는 것.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e '생활 속 발견'을 그대로 매수하면 안 되는 이유는?\r\n→ 발견은 시작일 뿐, \u003cstrong\u003e재무·실적(숫자)로 검증\u003c/strong\u003e 안 하면 좋은 제품≠좋은 주식.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 피셔의 '스캐틀벗'이란?\r\n→ 경쟁사·고객·직원 등을 \u003cstrong\u003e발로 뛰며 탐문\u003c/strong\u003e해 회사의 질적 경쟁력을 파악하는 것.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [대가 3] 존 보글 \u0026#x26; 레이 달리오 — 인덱스와 전천후 포트폴리오.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-05-01\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🎓 [대가 2] 피터 린치 \u0026 필립 피셔 — 성장주와 텐배거\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"🎓 [대가 2] 피터 린치 \u0026 필립 피셔 — 성장주와 텐배거 | midasworld (Private)\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"서버 개발 학습 블로그\"}],[\"$\",\"link\"
