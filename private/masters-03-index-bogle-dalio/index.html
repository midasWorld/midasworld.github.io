tock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"종목을 고르지 말라고요? 지금까지 고르는 법 배웠는데?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"알아야 \u003cstrong\u003e안 고르는 것도 선택\u003c/strong\u003e할 수 있는 거다. 보글의 충격적인 진실을 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 존 보글 — 인덱스 펀드의 아버지\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"보글은 세계 최초의 인덱스 펀드를 만들고 뱅가드를 세웠다. 그의 메시지는 단순하고 강력해.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e\"건초더미에서 바늘을 찾지 마라. 그냥 건초더미를 통째로 사라.\"\u003c/strong\u003e (= 시장 전체를 인덱스로)\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e진실\u003c/strong\u003e: 장기적으로 \u003cstrong\u003e액티브 펀드 대다수가 인덱스(시장평균)를 못 이긴다\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e이유: ① \u003cstrong\u003e비용\u003c/strong\u003e(수수료·세금)이 복리를 갉아먹음 ② 시장을 꾸준히 이기긴 지극히 어려움\u003c/li\u003e\n\u003cli\u003e해법: **저비용 인덱스 ETF(상품 1편)**를 \u003cstrong\u003e장기 적립\u003c/strong\u003e → 시장 수익을 \u003cstrong\u003e그대로\u003c/strong\u003e 가져감\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"버핏조차 '내 아내 돈은 S\u0026#x26;P500 인덱스에 넣으라' 했지(상품편). \u003cstrong\u003e천재 종목선정가도 비용과 확률 앞에선\u003c/strong\u003e 인덱스를 권한 거야. 겸손한 진실이지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 보글의 4원칙\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs\"\u003e① 비용 최소화: 수수료 1%가 30년이면 수익의 1/4을 먹는다\r\n② 분산: 시장 전체를 사서 개별주 위험 제거\r\n③ 장기보유: 사고팔지 마라(타이밍은 대부분 실패)\r\n④ 감정 통제: 폭락에 팔지 말고 꾸준히 적립\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"경제·기술 트랙을 배운 너라도, **'대부분의 돈은 인덱스 적립'**을 코어로 두는 게 현명하다. 개별주는 그 위에 얹는 '양념'으로. 이게 \u003cstrong\u003e코어-새틀라이트\u003c/strong\u003e 전략이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 레이 달리오 — 전천후(All Weather) 포트폴리오\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"달리오는 세계 최대 헤지펀드를 세웠다. 그의 핵심 질문 — \u003cstrong\u003e'어떤 경제 날씨가 와도 버티려면?'\u003c/strong\u003e\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e경제엔 4가지 '날씨'가 있다: \u003cstrong\u003e성장↑/성장↓ × 물가↑/물가↓\u003c/strong\u003e (경제 트랙!)\u003c/li\u003e\n\u003cli\u003e각 국면에 \u003cstrong\u003e유리한 자산이 다르다\u003c/strong\u003e → 한쪽에 몰면 특정 날씨에 박살\u003c/li\u003e\n\u003cli\u003e그래서 \u003cstrong\u003e자산을 분산\u003c/strong\u003e: 주식·장기채·단기채·금·원자재를 섞어 \u003cstrong\u003e어느 날씨에도 견디게\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"경제 트랙에서 배운 금리·물가·경기가 자산배분으로 이어지는군요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다! **'예측하지 말고 대비하라(준비 \u003e 예측)'**가 달리오 철학이다. 미래를 못 맞히니, \u003cstrong\u003e어떤 미래에도 안 죽는 배분\u003c/strong\u003e을 짜는 거지. 리스크 패리티(위험 균형)라고도 해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 달리오의 교훈 — 분산과 상관관계\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e\"성배(holy grail)는 서로 다르게 움직이는 10~15개 자산으로 분산하는 것.\"\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e핵심은 종목 수가 아니라 \u003cstrong\u003e상관관계가 낮은(따로 노는)\u003c/strong\u003e 자산을 섞는 것 (포트폴리오 편)\u003c/li\u003e\n\u003cli\u003e주식만 20개 = 같이 빠짐(분산 효과 작음). 주식+채권+금 = 서로 상쇄\u003c/li\u003e\n\u003cli\u003e**'잃지 않는 분산'**으로 복리를 지킨다\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"산업 1편에서 '한 섹터 몰빵은 분산 아니다' 했지? 달리오는 그걸 \u003cstrong\u003e자산군 차원\u003c/strong\u003e으로 확장한 거다. \u003cstrong\u003e상관 낮은 것들의 조합\u003c/strong\u003e — 이게 진짜 분산이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 한 장 요약 — 보글·달리오\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs\"\u003e① 보글: 저비용 인덱스를 장기 적립 (대부분 액티브는 시장을 못 이김)\r\n② 코어-새틀라이트: 인덱스(코어) + 개별주(양념)\r\n③ 달리오: 예측 말고 대비 — 어떤 경제 날씨에도 버티는 자산배분\r\n④ 진짜 분산 = 상관관계 낮은 자산들의 조합 (주식+채권+금…)\r\n⑤ 비용·감정 통제가 장기 수익을 지킨다\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"인덱스는 시시하다\"\u003c/strong\u003e ❌ → 장기적으로 \u003cstrong\u003e대다수 전문가를 이기는\u003c/strong\u003e 강력한 전략.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"종목 많으면 분산\"\u003c/strong\u003e ❌ → 다 주식이면 같이 빠짐. \u003cstrong\u003e상관 낮은 자산군\u003c/strong\u003e 분산이 핵심.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"좋은 자산배분 짜면 끝\"\u003c/strong\u003e ❌ → \u003cstrong\u003e리밸런싱\u003c/strong\u003e(주기적 비중 복원)과 감정 통제가 필요(실무편).\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 보글이 \"건초더미를 통째로 사라\"고 한 근거는?\r\n→ 장기적으로 \u003cstrong\u003e대다수 액티브 펀드가 비용·확률 탓에 시장(인덱스)을 못 이김\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 달리오 '전천후'의 핵심 사고는?\r\n→ 미래를 \u003cstrong\u003e예측하지 말고 대비\u003c/strong\u003e — 성장×물가 4국면 \u003cstrong\u003e어디서도 버티는 자산배분\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e '진짜 분산'이 종목 수가 아니라 무엇이라고 했나?\r\n→ \u003cstrong\u003e상관관계가 낮은(따로 움직이는) 자산들의 조합\u003c/strong\u003e(주식+채권+금 등).\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [대가 4] 실무 — 투자 원칙·매매일지·복기로 나만의 시스템 만들기.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"chil
