nking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"지식은 배웠는데 막상 실전에선 자신이 없어요...\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"당연하다. **투자의 적은 시장이 아니라 너 자신(감정)**이거든. 시스템이 그 감정을 막아준다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 투자 원칙 — 흔들리지 않을 나의 헌법\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"먼저 \u003cstrong\u003e글로 적은 원칙\u003c/strong\u003e을 만들어라. 머릿속 다짐은 폭락장에 증발해.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e원칙 예시 (너만의 버전으로)\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e· 한 종목 최대 비중 \u003cspan class=\"hljs-number\"\u003e20%\u003c/span\u003e, 한 섹터 최대 \u003cspan class=\"hljs-number\"\u003e40%\u003c/span\u003e (분산)\r\n· 매수 전 '왜 사는지' \u003cspan class=\"hljs-number\"\u003e3\u003c/span\u003e줄 + 손절가·목표가를 적는다\r\n· 손절선 −\u003cspan class=\"hljs-number\"\u003e10%\u003c/span\u003e 도달 시 기계적 매도 (예외 없음)\r\n· 빚(신용·미수)·레버리지로 투자하지 않는다\r\n· 큰 이벤트(FOMC·실적) 직전 풀매수 금지\r\n· 모르는 것엔 투자하지 않는다 (능력 범위)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이게 너의 \u003cstrong\u003e헌법\u003c/strong\u003e이다. 시장이 너를 유혹할 때, \u003cstrong\u003e'내 원칙에 맞나?'\u003c/strong\u003e 한 줄이 너를 구한다. 버핏의 '제1원칙: 잃지 마라'를 네 언어로 적어둬.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 매매일지 — 모든 거래의 근거를 남겨라\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"프로와 아마추어를 가르는 게 \u003cstrong\u003e매매일지\u003c/strong\u003e다. 사고팔 때마다 적어.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e기록 항목\u003c/th\u003e\n\u003cth\u003e왜\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e매수 이유\u003c/strong\u003e (3줄)\u003c/td\u003e\n\u003ctd\u003e나중에 '왜 샀지?'를 막음\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e매수가·손절가·목표가\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e계획 없는 매매 방지\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e그때의 감정\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e공포·탐욕 패턴 파악\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e매도 이유·결과\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e복기의 재료\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"특히 **'그때의 감정'**을 적어라. 나중에 보면 \u003cstrong\u003e'아, 나는 공포에 항상 바닥에서 팔았구나'\u003c/strong\u003e 같은 \u003cstrong\u003e내 약점의 패턴\u003c/strong\u003e이 보인다. 그걸 알아야 고치지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 복기 — 맞아도 틀려도 되돌아본다 (국장 특별편처럼!)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"기억하나? 국장 특별편에서 06-02 콜을 06-05에 \u003cstrong\u003e복기\u003c/strong\u003e했지. 그게 바로 이거다.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-arduino\"\u003e① 결과만 보지 말고 \u003cspan class=\"hljs-string\"\u003e'과정(판단)'\u003c/span\u003e을 평가\r\n② 맞았어도 \u003cspan class=\"hljs-string\"\u003e'운인가 실력인가'\u003c/span\u003e 구분\r\n③ 틀렸으면 \u003cspan class=\"hljs-string\"\u003e'판단 오류인가, 불운인가, 원칙 위반인가'\u003c/span\u003e\r\n④ 다음에 바꿀 것 \u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e가지를 적는다\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"맞아도 복기해요? 번 거면 좋은 거 아니에요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e운으로 번 건 다음에 운으로 잃는다.\u003c/strong\u003e 좋은 판단으로 졌을 수도, 나쁜 판단으로 이겼을 수도 있어. \u003cstrong\u003e과정을 평가\u003c/strong\u003e해야 진짜 실력이 쌓여. 복기 없는 경험은 그냥 도박 횟수일 뿐이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 백테스트 — 과거로 전략을 시험하되 겸손하게\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e백테스트\u003c/strong\u003e는 '이 전략을 과거에 썼다면?'을 검증하는 거다. 유용하지만 \u003cstrong\u003e함정\u003c/strong\u003e투성이야.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e함정\u003c/th\u003e\n\u003cth\u003e설명\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e과최적화\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e과거에만 딱 맞게 꾸민 전략 → 미래엔 실패\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e생존 편향\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e망한 종목 빼고 살아남은 것만 테스트 → 착시\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e미래 정보 사용\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e그때 몰랐을 정보를 슬쩍 사용\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"백테스트가 화려할수록 \u003cstrong\u003e과최적화\u003c/strong\u003e를 의심해라. '과거에 연 50%!'는 대개 \u003cstrong\u003e미래엔 안 통하는\u003c/strong\u003e 꾸민 곡선이야. 단순하고 견고한 게 낫다. \u003cstrong\u003e과거 ≠ 미래\u003c/strong\u003e를 새겨라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 감정 통제 — 투자의 마지막 8할\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"지식이 2할이면 \u003cstrong\u003e감정 통제가 8할\u003c/strong\u003e이다. 대표적 함정들이다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e심리 함정\u003c/th\u003e\n\u003cth\u003e증상\u003c/th\u003e\n\u003cth\u003e처방\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eFOMO\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e남들 벌 때 급히 추격매수\u003c/td\u003e\n\u003ctd\u003e원칙·체크리스트로 멈춤\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e손실회피\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e손절 못 하고 물타기\u003c/td\u003e\n\u003ctd\u003e손절선 사전 약속\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e확증편향\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e내 종목 호재만 봄\u003c/td\u003e\n\u003ctd\u003e반대 의견 일부러 찾기\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e처분효과\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e오른 건 빨리 팔고 손실은 방치\u003c/td\u003e\n\u003ctd\u003e린치 '꽃에 물 주기'\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e군중심리\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e공포에 팔고 탐욕에 삼\u003c/td\u003e\n\u003ctd\u003e미스터 마켓 기억\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이걸 막는 게 **시스템(원칙+일지+복기)**이다. 감정은 못 없애. 대신 \u003cstrong\u003e'미리 정한 규칙'으로 감정의 손발을 묶는\u003c/strong\u003e 거지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 나만의 투자 시스템 — 통합\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs\"\u003e① 코어: 저비용 인덱스 적립 (보글) — 절세계좌에서\r\n② 새틀라이트: 능력 범위 내 개별주 (가치·성장 분석)\r\n③ 자산배분: 상관 낮은 자산 분산 + 주기적 리밸런싱 (달리오)\r\n④ 원칙: 글로 적은 헌법 (비중·손절·금지사항)\r\n⑤ 기록·복기: 매매일지 + 정기 복기 (운/실력 구분)\r\n⑥ 감정 통제: 규칙으로 심리 함정 차단\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이 여섯 개가 돌아가면, 너는 \u003cstrong\u003e유튜버·테마·소문에 휘둘리지 않는 독립적 투자자\u003c/strong\u003e다. 그게 이 모든 공부의 목적이었어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🎓🎓 주식 커리큘럼 전체 졸업\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/gosabu_happy.png\" alt=\"거사부\"\u003e 🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"호두야, 정말 멀리 왔다. \u003cstrong\u003e경제(금리·물가·경기) → 상품(ETF·리츠·채권) → 산업·섹터 → 배당 → 재무심화 → 기술심화 → 파생 → 대가 철학·실무.\u003c/strong\u003e 이제 너는 \u003cstrong\u003e경제 상식을 갖춘, 스스로 판단하는 투자자\u003c/strong\u003e다.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"뉴스가 들리고, 차트가 읽히고, 회사의 체력이 보여요. 무엇보다 **'모르면 안 한다'**는 걸 배웠어요!\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/jake_explaining.png\" alt=\"잭이글\"\u003e 🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"국장이든 미장이든, 이제 네 무기는 충분해. 마지막 한마디 — \u003cstrong\u003e'시장은 인내심 없는 자의 돈을 인내심 있는 자에게 옮기는 기계'\u003c/strong\u003e(버핏). 천천히, 꾸준히, 원칙대로. Good luck!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"공부는 끝이 없다. 하지만 \u003cstrong\u003e뼈대는 다 세웠어.\u003c/strong\u003e 이젠 실전에서 \u003cstrong\u003e작게 시작해, 기록하고, 복기하며\u003c/strong\u003e 너만의 길을 만들어라. 잃지 않는 것부터 — 그게 시작이자 전부다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 투자 권유가 아닙니다. 어떤 전략도 수익을 보장하지 않으며, 모든 투자 판단과 책임은 본인에게 있습니다. 작게 시작하고, 잃어도 되는 돈으로, 천천히.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-29\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🎓 [대가 4] 실무 — 나만의 투자 시스템 만들기\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":
