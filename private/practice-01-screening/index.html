003e1. 스크리닝 = 조건으로 거르기\u003c/h2\u003e\n\u003cp\u003e수천 종목을 \u003cstrong\u003e재무·가격 조건\u003c/strong\u003e으로 한 번에 필터링.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e가치주 발굴 예시 조건:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eROE 12% 이상 (자본 효율 좋은 회사)\u003c/li\u003e\n\u003cli\u003e부채비율 100% 이하 (재무 안정)\u003c/li\u003e\n\u003cli\u003ePER 업종 평균 이하 (저평가)\u003c/li\u003e\n\u003cli\u003e최근 3년 매출·이익 성장 (+)\u003c/li\u003e\n\u003cli\u003e배당수익률 2% 이상 (선택)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이 조건만 걸어도 수천 개가 수십 개로 줄어든다. 거기서부터 재무·차트를 보는 거지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 시장별 스크리너 (실전)\u003c/h2\u003e\n\u003ch3\u003e🇺🇸 미장 — Finviz (가장 강력)\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003efinviz.com\u003c/strong\u003e → Screener\u003c/li\u003e\n\u003cli\u003eFundamental 탭: P/E \u003ccode\u003eUnder 20\u003c/code\u003e, ROE \u003ccode\u003eOver 15%\u003c/code\u003e, Debt/Eq \u003ccode\u003eUnder 0.5\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eDescriptive 탭: Market Cap \u003ccode\u003e+Mid (over $2bln)\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e결과를 Overview/Valuation 탭으로 비교\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3\u003e🇰🇷 국장 — 네이버 + 증권사 조건검색\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e네이버페이 증권\u003c/strong\u003e → 국내증시 \u003e \u003cstrong\u003e종목별 시세\u003c/strong\u003e / 또는 증권사 앱의 \u003cstrong\u003e조건검색(스크리너)\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e키움 영웅문 등 HTS의 \u003cstrong\u003e조건검색식\u003c/strong\u003e이 가장 강력 (재무+기술 조합)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDART\u003c/strong\u003e의 정기보고서로 후보 재무 확인\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"국장은 Finviz 같은 무료 통합 스크리너가 약하다. 증권사 앱의 조건검색을 익히는 게 실전이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 발굴 → 검증 4단계\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"후보를 추렸으면 그다음은요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이 순서로 압축한다.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e스크리닝\u003c/strong\u003e (조건) → 후보 20~30개\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e사업 이해\u003c/strong\u003e — 뭘로 돈 버나? 진입장벽 있나? (DART 사업보고서 Item 1 / 10-K Business)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e재무 검증\u003c/strong\u003e — ROE 추이, 부채, 영업현금흐름 (앞서 배운 재무편)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e가격·타이밍\u003c/strong\u003e — PER 업종 비교, 차트 추세 (기술편)\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e→ 최종 \u003cstrong\u003e3~5개 관심종목\u003c/strong\u003e으로 압축\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 흔한 실수\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"초보가 종목 고를 때 자주 하는 실수다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e❌ 유튜버·단톡방 추천만 보고 매수 (남의 매도 물량 받기)\u003c/li\u003e\n\u003cli\u003e❌ 주가가 많이 \u003cstrong\u003e떨어졌다는 이유만으로\u003c/strong\u003e 매수 (\"싼 데는 이유가 있다\")\u003c/li\u003e\n\u003cli\u003e❌ 테마·뉴스만 보고 재무 안 봄\u003c/li\u003e\n\u003cli\u003e✅ \u003cstrong\u003e스스로 조건을 세우고 → 검증하고 → 기록\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e시장\u003c/th\u003e\n\u003cth\u003e스크리너\u003c/th\u003e\n\u003cth\u003e검증\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e🇰🇷\u003c/td\u003e\n\u003ctd\u003e증권사 앱 조건검색, 네이버 시세\u003c/td\u003e\n\u003ctd\u003eDART, FnGuide\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🇺🇸\u003c/td\u003e\n\u003ctd\u003eFinviz Screener ⭐\u003c/td\u003e\n\u003ctd\u003eSEC EDGAR, Yahoo\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 수천 종목을 조건으로 거르는 첫 단계를 뭐라 하나?\r\n→ \u003cstrong\u003e스크리닝\u003c/strong\u003e(조건 검색)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 미장에서 가장 강력한 무료 스크리너는?\r\n→ \u003cstrong\u003eFinviz\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e \"주가가 많이 떨어졌으니 산다\"가 위험한 이유는?\r\n→ 하락엔 \u003cstrong\u003e이유\u003c/strong\u003e(실적 악화 등)가 있을 수 있음. 가격이 아닌 \u003cstrong\u003e가치\u003c/strong\u003e로 판단\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음\u003c/strong\u003e: 후보를 골랐으면 '언제 사고 언제 파나' — 매수·매도와 손절 원칙.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 예시 조건은 학습용이며 매수 추천이 아닙니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-28\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🎯 [실전 1] 종목 발굴 — 수천 종목에서 후보 거르기\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}
