003e\n\u003ch2\u003e1. 분할 매수 — 한 번에 다 사지 마라\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"아무리 확신해도 타이밍은 못 맞춘다. 그래서 \u003cstrong\u003e나눠 산다.\u003c/strong\u003e\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e사고 싶은 금액을 \u003cstrong\u003e3~4번에 나눠\u003c/strong\u003e 매수\u003c/li\u003e\n\u003cli\u003e예: 목표 300만원 → 100만 × 3회 (가격 빠지면 추가)\u003c/li\u003e\n\u003cli\u003e장점: 평균 단가 안정, 한 번에 고점 매수 위험 ↓\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"단, '물타기'(떨어질 때 추가매수)는 \u003cstrong\u003e종목이 여전히 좋을 때만\u003c/strong\u003e. 망해가는 회사에 물타기는 같이 가라앉는 길이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 손절 — 가장 중요한데 가장 안 지키는 것\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"손절이요? 오를 때까지 기다리면 안 돼요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그 '기다림'이 계좌를 녹인다. \u003cstrong\u003e손실은 비대칭\u003c/strong\u003e이야.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e손실\u003c/th\u003e\n\u003cth\u003e회복에 필요한 수익\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e−10%\u003c/td\u003e\n\u003ctd\u003e+11%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e−20%\u003c/td\u003e\n\u003ctd\u003e+25%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e−50%\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+100%\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e−90%\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+900%\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"−50% 맞으면 +100% 나야 본전이다. 그래서 \u003cstrong\u003e작을 때 자른다.\u003c/strong\u003e 매수 전에 '−○%면 판다'를 \u003cstrong\u003e미리\u003c/strong\u003e 정해두는 게 손절선이야.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e손절 원칙 예시:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e매수가 대비 \u003cstrong\u003e−7~10%\u003c/strong\u003e 도달 시 기계적 매도 (단기)\u003c/li\u003e\n\u003cli\u003e또는 \u003cstrong\u003e주요 지지선·이평선 이탈\u003c/strong\u003e 시 (기술적)\u003c/li\u003e\n\u003cli\u003e손절선은 \u003cstrong\u003e매수 전에\u003c/strong\u003e 정하고, 감정으로 바꾸지 않는다\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 포지션 사이징 — 한 종목에 얼마?\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"한 종목에 전 재산? 절대 안 된다. \u003cstrong\u003e한 번의 실수로 끝나지 않을 만큼만\u003c/strong\u003e 건다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e한 종목 비중 \u003cstrong\u003e전체의 10~20% 이내\u003c/strong\u003e (집중해도 25% 상한)\u003c/li\u003e\n\u003cli\u003e\"이 종목이 −50% 나도 내 전체 자산은 −○%\"를 계산해두기\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e2% 룰\u003c/strong\u003e: 한 번의 손절로 전체 자산의 2% 이상 잃지 않게 매수량 조절\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e예시\u003c/strong\u003e: 자산 1,000만원, 2% 룰 → 한 거래 최대 손실 20만원.\r\n손절선 −10%라면 → 한 종목 매수액 = 20만 ÷ 0.10 = \u003cstrong\u003e200만원\u003c/strong\u003e까지.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 매도 — 언제 파나\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"사는 것보다 파는 게 어렵다. 매도 기준은 셋이다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e매도 사유\u003c/th\u003e\n\u003cth\u003e설명\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e목표 도달(익절)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e미리 정한 목표가/밸류에이션 도달\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e손절선 도달\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e미리 정한 손실 한도\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e이유 소멸\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e살 때의 근거(실적·성장)가 깨짐\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"'더 오를 것 같아서' 안 팔고, '오르면 본전 찾고 팔려고' 손절 안 하고 — 이 둘이 가장 흔한 패망 패턴이다. \u003cstrong\u003e계획대로\u003c/strong\u003e 판다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 매매일지 — 고수의 비밀\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"기록을 남기라구요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇다. 매수마다 \u003cstrong\u003e왜 샀는지, 손절선·목표가, 결과\u003c/strong\u003e를 적어라. 나중에 보면 네 실수 패턴이 보인다. 이게 실력을 늘리는 가장 빠른 길이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e −50% 손실을 회복하려면 몇 % 수익이 필요한가?\r\n→ \u003cstrong\u003e+100%\u003c/strong\u003e (손실은 비대칭 → 작을 때 손절)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 2% 룰에서 자산 1,000만·손절선 −10%면 한 종목 최대 매수액은?\r\n→ 20만 ÷ 0.10 = \u003cstrong\u003e200만원\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 가장 흔한 패망 패턴 두 가지는?\r\n→ 손절 안 하고 버티기 + \"더 오를 것 같아\" 익절 미루기 (계획대로 X)\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음\u003c/strong\u003e: 한 종목이 아니라 '바구니 전체'를 보는 법 — 포트폴리오와 분산.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 손절선·비중은 예시이며 개인 위험성향에 따라 다릅니다. 매매 권유가 아닙니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\
