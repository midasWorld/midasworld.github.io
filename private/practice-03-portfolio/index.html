u003e 숫자로 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 분산투자 효과 — 위험이 줄어든다\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/diversification.png\" alt=\"분산투자 효과\"\u003e\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"차트를 봐라. 종목 수가 늘수록 변동성(위험)이 뚝 떨어지다가, \u003cstrong\u003e10~20종목\u003c/strong\u003e에서 거의 바닥에 닿는다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e비체계적 위험(개별 위험)\u003c/strong\u003e: 분산으로 제거 가능 (특정 회사 사고)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e체계적 위험(시장 위험)\u003c/strong\u003e: 분산으로도 못 없앰 (시장 전체 폭락)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"즉 10~20종목이면 개별 회사 리스크는 거의 없앤다. 너무 많이(50종목+) 담으면 관리만 힘들고 효과는 미미해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 무엇으로 분산하나\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e분산 축\u003c/th\u003e\n\u003cth\u003e예시\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e종목\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e10~20개\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e섹터\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e반도체·금융·소비재·헬스케어 등 분산 (한 섹터 몰빵 X)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e지역\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e국장 + 미장 (환·경기 사이클 분산)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e자산\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e주식 + 채권 + 현금 + (금)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e시간\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e적립식(분할 매수)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"특히 \u003cstrong\u003e섹터 분산\u003c/strong\u003e이 중요하다. 반도체만 10종목 = 분산이 아니야. 반도체 폭락하면 다 같이 죽어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 현금도 포지션이다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"100% 주식은 위험하다. \u003cstrong\u003e현금 비중\u003c/strong\u003e을 둬라.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e현금 = 폭락 시 \u003cstrong\u003e싸게 살 실탄\u003c/strong\u003e + 심리적 안정\u003c/li\u003e\n\u003cli\u003e시장 과열 땐 현금 ↑, 폭락 후엔 현금으로 매수\u003c/li\u003e\n\u003cli\u003e초보 권장: 현금 20~30% 유지\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e4. ETF — 가장 쉬운 분산\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"종목 20개 고르고 관리하기 너무 어려운데요...\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그럼 \u003cstrong\u003eETF\u003c/strong\u003e가 답이다. ETF 한 주 = 수백 종목에 동시 투자.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eETF\u003c/th\u003e\n\u003cth\u003e내용\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eS\u0026#x26;P500 ETF\u003c/strong\u003e (SPY/VOO, 국내 상장 TIGER 미국S\u0026#x26;P500)\u003c/td\u003e\n\u003ctd\u003e미국 대표 500종목\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e나스닥100\u003c/strong\u003e (QQQ, TIGER 미국나스닥100)\u003c/td\u003e\n\u003ctd\u003e미국 기술주 100\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKODEX 200\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e한국 대표 200종목\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"워런 버핏도 '대부분의 사람에겐 S\u0026#x26;P500 인덱스펀드 적립이 최선'이라 했다. 종목 고를 자신 없으면 ETF 적립이 정답에 가까워.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 복리 — 시간이 최고의 무기\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/compound.png\" alt=\"복리 효과\"\u003e\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"분산해서 \u003cstrong\u003e오래\u003c/strong\u003e 들고 가면 복리가 일한다. 차트를 봐라. 연 10%로 30년이면 원금의 \u003cstrong\u003e약 17배\u003c/strong\u003e다. 단리(4배)와 비교하면 시간이 만든 차이지.\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 '잃지 않고 + 분산하고 + 오래' 가 핵심이다. 한 방을 노리다 −50% 맞으면 복리 시계가 처음으로 돌아가.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 초보 포트폴리오 예시 (참고)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정답은 없지만, 초보라면 이런 틀에서 시작해도 좋다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e핵심(50~60%): S\u0026#x26;P500/KODEX200 같은 \u003cstrong\u003e인덱스 ETF\u003c/strong\u003e (적립식)\u003c/li\u003e\n\u003cli\u003e위성(20\u003cdel\u003e30%): 직접 분석한 **개별 우량주 5\u003c/del\u003e10개**\u003c/li\u003e\n\u003cli\u003e현금(20%): 기회·방어용\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 분산으로 \u003cstrong\u003e없앨 수 없는\u003c/strong\u003e 위험은?\r\n→ \u003cstrong\u003e체계적 위험(시장 위험)\u003c/strong\u003e — 시장 전체 폭락\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 개별위험을 대부분 없애는 적정 종목 수는?\r\n→ \u003cstrong\u003e10~20종목\u003c/strong\u003e (그 이상은 효과 미미)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 종목 고를 자신이 없을 때 가장 쉬운 분산 방법은?\r\n→ \u003cstrong\u003e인덱스 ETF\u003c/strong\u003e(S\u0026#x26;P500 등) 적립\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음\u003c/strong\u003e: 모든 걸 무너뜨리는 마지막 적 — 투자 심리(FOMO·공포·탐욕).\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 포트폴리오 예시는 학습용이며 투자 권유가 아닙니다. 개인 상황에 맞게 조정하세요.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"
