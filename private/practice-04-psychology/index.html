003cstrong\u003e거사부\u003c/strong\u003e: \"그게 함정이다. 인간의 뇌는 투자에 \u003cstrong\u003e반대로\u003c/strong\u003e 설계돼 있어.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 손실 회피 — 손실이 2배 아프다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"사람은 100만원 벌 때 기쁨보다 100만원 잃을 때 고통을 \u003cstrong\u003e약 2배\u003c/strong\u003e 크게 느낀다(전망이론).\"\u003c/p\u003e\n\u003cp\u003e그 결과 나타나는 행동:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e손실 난 종목은 **'본전 오면 팔자'**며 끝까지 안 판다 → 손실 키움\u003c/li\u003e\n\u003cli\u003e수익 난 종목은 \u003cstrong\u003e'떨어질까 봐'\u003c/strong\u003e 빨리 판다 → 수익 줄임\u003c/li\u003e\n\u003cli\u003e→ \u003cstrong\u003e손실은 키우고 수익은 자르는\u003c/strong\u003e 정반대 행동\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이걸 이기려면 \u003cstrong\u003e규칙\u003c/strong\u003e으로 거래해야 한다. 감정이 아니라 미리 정한 손절·익절선대로.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. FOMO — 놓칠까 봐 추격매수\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003eFOMO\u003c/strong\u003e(Fear Of Missing Out). 남들 다 버는데 나만 못 버는 것 같은 공포.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e급등하는 종목을 \u003cstrong\u003e고점에 추격매수\u003c/strong\u003e → 직후 하락\u003c/li\u003e\n\u003cli\u003e테마·뉴스에 휩쓸려 검증 없이 매수\u003c/li\u003e\n\u003cli\u003e\"이번엔 다르다\"는 말이 나오면 보통 거품의 정점\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"기회는 또 온다. \u003cstrong\u003e놓친 돈은 잃은 돈이 아니다.\u003c/strong\u003e 추격하다 잃은 돈이 진짜 손실이지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 공포와 탐욕 — 대중과 반대로\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"버핏의 명언: '남들이 탐욕스러울 때 두려워하고, 남들이 두려워할 때 탐욕스러워라.'\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e시장 심리\u003c/th\u003e\n\u003cth\u003e대중 행동\u003c/th\u003e\n\u003cth\u003e현명한 행동\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e폭등·과열 (탐욕)\u003c/td\u003e\n\u003ctd\u003e추격매수·몰빵\u003c/td\u003e\n\u003ctd\u003e비중 줄이기·현금 확보\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e폭락·공포\u003c/td\u003e\n\u003ctd\u003e투매·손절\u003c/td\u003e\n\u003ctd\u003e우량주 분할 매수\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e참고 지표: \u003cstrong\u003e공포탐욕지수\u003c/strong\u003e(CNN Fear \u0026#x26; Greed Index), VIX(변동성지수)\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 확증 편향 — 보고 싶은 것만 본다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"한 번 산 종목은 \u003cstrong\u003e좋은 뉴스만\u003c/strong\u003e 찾아보게 된다. 나쁜 신호는 무시하고.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e매수 후엔 객관성을 잃기 쉬움\u003c/li\u003e\n\u003cli\u003e대응: \u003cstrong\u003e매수 전에\u003c/strong\u003e 손절선·매도 조건을 정해두기 (감정 개입 전에)\u003c/li\u003e\n\u003cli\u003e\"내가 틀렸다면 무엇이 보일까?\"를 일부러 질문\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 거사부의 심리 방어 수칙\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그럼 심리를 어떻게 이겨요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"감정을 이기려 하지 말고, \u003cstrong\u003e감정이 끼어들 틈을 없애라.\u003c/strong\u003e\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e규칙 기반 매매\u003c/strong\u003e — 손절·익절·비중을 미리 정하고 지킨다\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e매매일지\u003c/strong\u003e — 감정 상태까지 기록하면 패턴이 보인다\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e분할 매수·적립식\u003c/strong\u003e — 타이밍 스트레스 제거\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e잃어도 되는 돈으로만\u003c/strong\u003e — 생활비·빚으로 투자 금지\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e시장에서 멀어지기\u003c/strong\u003e — 매일 호가 보면 단타 충동. 장기투자자는 덜 본다\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"지식은 입장권일 뿐이다. **규율(discipline)**이 진짜 실력이야. 이걸 갖추면 너는 이미 상위 10%다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 손실 회피 심리가 만드는 잘못된 행동은?\r\n→ \u003cstrong\u003e손실은 키우고\u003c/strong\u003e(본전 집착) \u003cstrong\u003e수익은 일찍 자르는\u003c/strong\u003e 것\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 급등주를 놓칠까 봐 고점 추격매수하는 심리는?\r\n→ \u003cstrong\u003eFOMO\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 심리를 이기는 가장 현실적인 방법은?\r\n→ 감정이 끼기 전에 \u003cstrong\u003e규칙(손절·익절·비중)을 미리 정하고 지키기\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 사이클 예고\u003c/strong\u003e: 기초·기술·재무·실전을 다 뗀 호두. 이제 \u003cstrong\u003e한 종목을 처음부터 끝까지\u003c/strong\u003e 분석하는 종단 캡스톤에 도전한다!\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 내용은 투자 교육용이며 매매 권유가 아닙니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-25\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🎯 [실전 4] 투자 심리 — 대부분 여기서 망한다\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self._
