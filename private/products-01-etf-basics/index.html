3c/strong\u003e: \"ETF요? 펀드랑 뭐가 달라요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"오늘 그걸 뿌리부터 잡아주마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. ETF = 주식처럼 사고파는 '묶음 상품'\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eETF(상장지수펀드)\u003c/strong\u003e = 여러 종목을 묶은 펀드를 \u003cstrong\u003e주식처럼 거래소에 상장\u003c/strong\u003e시킨 것.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eETF 한 주 = 수십~수백 종목을 \u003cstrong\u003e조금씩 다 담은\u003c/strong\u003e 바구니\u003c/li\u003e\n\u003cli\u003e예: \u003cstrong\u003eKODEX 200\u003c/strong\u003e 한 주 = 코스피 200대 기업을 통째로\u003c/li\u003e\n\u003cli\u003e예: \u003cstrong\u003eS\u0026#x26;P500 ETF\u003c/strong\u003e 한 주 = 미국 500대 기업을 통째로\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"계란을 한 바구니에 담지 말랬지? ETF는 \u003cstrong\u003e이미 여러 바구니에 나눠 담아둔\u003c/strong\u003e 상품이야. 한 주만 사도 자동 분산이 되는 거지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. ETF의 3대 장점\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e장점\u003c/th\u003e\n\u003cth\u003e설명\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e분산\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e한 주로 수십~수백 종목 → 한 회사 망해도 타격 작음\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e저비용\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e운용보수 연 0.05~0.5%로 일반 펀드보다 쌈\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e편의성\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e주식처럼 \u003cstrong\u003e실시간 매매\u003c/strong\u003e, HTS/MTS에서 바로\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"수수료가 그렇게 싸요? 펀드는 비싸다던데.\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그게 핵심이다. 장기투자에선 \u003cstrong\u003e비용 0.5% 차이가 20년 뒤 수백만원 차이\u003c/strong\u003e를 만든다(복리). 그래서 인덱스 ETF가 강력한 거야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 펀드 vs ETF — 한눈 비교\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e항목\u003c/th\u003e\n\u003cth\u003e일반 펀드\u003c/th\u003e\n\u003cth\u003eETF\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e거래\u003c/td\u003e\n\u003ctd\u003e하루 1번 기준가\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e실시간\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e비용\u003c/td\u003e\n\u003ctd\u003e보수 높음(1~2%)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e낮음(0.05~0.5%)\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e투명성\u003c/td\u003e\n\u003ctd\u003e구성 늦게 공개\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e구성 종목 매일 공개\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e최소금액\u003c/td\u003e\n\u003ctd\u003e펀드별\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e1주 가격\u003c/strong\u003e이면 시작\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"ETF는 펀드의 장점(분산·전문운용)에 주식의 장점(실시간·저비용)을 합친 거다. 그래서 요즘 대세야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 대표 인덱스 ETF — 시장을 통째로\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"초보가 가장 먼저 보는 건 \u003cstrong\u003e시장 전체를 따라가는 인덱스 ETF\u003c/strong\u003e다.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🇰🇷 국장\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eKODEX 200 / TIGER 200\u003c/strong\u003e: 코스피 200 추종\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKODEX 코스닥150\u003c/strong\u003e: 코스닥 대표주\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🇺🇸 미장\u003c/strong\u003e (잭이글 추천)\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/jake_explaining.png\" alt=\"잭이글\"\u003e 🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"미장 인덱스는 이 셋이 국룰이야. \u003cstrong\u003eSPY/VOO/IVV\u003c/strong\u003e(S\u0026#x26;P500), \u003cstrong\u003eQQQ\u003c/strong\u003e(나스닥100 기술주), \u003cstrong\u003eVTI\u003c/strong\u003e(미국 전체시장). 특히 \u003cstrong\u003eVOO\u003c/strong\u003e는 보수가 0.03%로 거의 공짜 수준. 버핏이 말한 게 바로 이거야. 한국 상장 버전으론 \u003cstrong\u003eTIGER 미국S\u0026#x26;P500\u003c/strong\u003e, \u003cstrong\u003eKODEX 미국S\u0026#x26;P500\u003c/strong\u003e 같은 게 있어 — 연금계좌에서 사기 좋지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 분배금(배당) — ETF도 돈을 준다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"ETF가 담은 종목들이 배당을 주면, ETF도 그걸 모아 \u003cstrong\u003e분배금\u003c/strong\u003e으로 준다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e분배금 지급형\u003c/strong\u003e: 배당을 현금으로 줌\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTR(Total Return)형\u003c/strong\u003e: 배당을 \u003cstrong\u003e자동 재투자\u003c/strong\u003e → 복리 효과, 세금 이연\u003c/li\u003e\n\u003cli\u003e장기 적립엔 \u003cstrong\u003eTR형이 유리\u003c/strong\u003e할 때가 많다(재투자 복리)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이름에 'TR'이 붙으면 배당 재투자형이다. 복리(실전편)를 기억하면 왜 좋은지 알겠지?\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"ETF는 무조건 안전\"\u003c/strong\u003e ❌ → 분산일 뿐, \u003cstrong\u003e시장 전체가 빠지면 ETF도 빠진다.\u003c/strong\u003e 무위험이 아님.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"이름이 비슷하면 같은 ETF\"\u003c/strong\u003e ❌ → 추종지수·보수·분배방식이 다르다. **'무슨 지수를 추종하나'**를 꼭 확인.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"보수는 사소하다\"\u003c/strong\u003e ❌ → 장기 복리에선 \u003cstrong\u003e연 0.1% 차이도 크다.\u003c/strong\u003e 같은 지수면 \u003cstrong\u003e싼 ETF\u003c/strong\u003e를 골라라.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e국내 ETF 정보\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권 / KRX ETF\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e추종지수·보수·구성종목\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e미국 ETF 정보\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eetf.com / 발행사(Vanguard 등)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e보수(expense ratio)·AUM\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eETF 비교\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 HTS/MTS\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e보수·괴리율·거래량\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e ETF가 일반 펀드보다 장기투자에 유리한 대표적 이유는?\r\n→ \u003cstrong\u003e낮은 보수(비용)\u003c/strong\u003e. 장기 복리에서 비용 차이가 수익을 크게 가른다. + 실시간 매매·투명성.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e ETF 이름의 'TR'은 무슨 뜻인가?\r\n→ \u003cstrong\u003eTotal Return, 배당 재투자형\u003c/strong\u003e. 분배금을 자동 재투자해 복리·세금 이연 효과.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e \"ETF니까 안전하다\"가 틀릴 수 있는 이유는?\r\n→ 분산일 뿐 \u003cstrong\u003e시장 전체 하락엔 같이 빠진다.\u003c/strong\u003e 무위험 자산이 아님.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [상품 2] ETF 심화 — 섹터·테마·레버리지·인버스, 그리고 괴리율의 함정.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 ETF 추천이 아닙니다. 상품명은 예시이며 보수·구성은 변경될 수 있으니 직접 확인하세요. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",
