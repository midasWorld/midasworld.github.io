e: \"함정이요? ETF가 안전한 거 아니었어요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"인덱스는 그렇지. 근데 \u003cstrong\u003e레버리지·인버스\u003c/strong\u003e는 전혀 다른 물건이다. 끝까지 들어라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. ETF의 종류 — 무엇을 담느냐\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종류\u003c/th\u003e\n\u003cth\u003e담는 것\u003c/th\u003e\n\u003cth\u003e예\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e인덱스\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시장 전체\u003c/td\u003e\n\u003ctd\u003eS\u0026#x26;P500, KODEX 200\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e섹터\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e특정 산업\u003c/td\u003e\n\u003ctd\u003e반도체·은행·헬스케어 ETF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e테마\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e특정 트렌드\u003c/td\u003e\n\u003ctd\u003e2차전지·AI·로봇 ETF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e배당\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e고배당주 묶음\u003c/td\u003e\n\u003ctd\u003e배당성장·고배당 ETF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e채권/원자재\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e국채·금·원유\u003c/td\u003e\n\u003ctd\u003e국채 ETF, 금 ETF\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"섹터·테마 ETF는 **'이 분야는 좋은데 어느 종목이 이길진 모르겠다'**할 때 쓴다. 예컨대 반도체가 오를 것 같지만 삼성이냐 하이닉스냐 모르겠으면 \u003cstrong\u003e반도체 ETF\u003c/strong\u003e로 분야에 베팅하는 거지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 레버리지 ETF — 2배의 유혹과 독\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e레버리지 ETF\u003c/strong\u003e는 지수가 1% 오르면 \u003cstrong\u003e2%\u003c/strong\u003e 오르게 설계됐다. 달콤하지? 근데 \u003cstrong\u003e'하루' 기준\u003c/strong\u003e이라는 게 핵심이다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ 레버리지는 \u003cstrong\u003e'일일' 수익률의 2배\u003c/strong\u003e를 추종한다. 며칠 이상이면 결과가 2배가 \u003cstrong\u003e아니다.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003e변동성 끌림(volatility decay) 예시\u003c/strong\u003e — 지수가 100에서 출발\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e날\u003c/th\u003e\n\u003cth\u003e지수\u003c/th\u003e\n\u003cth\u003e지수 누적\u003c/th\u003e\n\u003cth\u003e2배 레버리지\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e1일\u003c/td\u003e\n\u003ctd\u003e−10% → 90\u003c/td\u003e\n\u003ctd\u003e−10%\u003c/td\u003e\n\u003ctd\u003e−20% → 80\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2일\u003c/td\u003e\n\u003ctd\u003e+11.1% → 100\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e0%\u003c/strong\u003e (제자리)\u003c/td\u003e\n\u003ctd\u003e+22.2% → 97.8\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"어? 지수는 제자리로 돌아왔는데 레버리지는 −2.2%네요?!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그게 \u003cstrong\u003e변동성 끌림\u003c/strong\u003e이다. 오르락내리락만 해도 레버리지는 \u003cstrong\u003e녹아내려.\u003c/strong\u003e 그래서 레버리지는 \u003cstrong\u003e단기(하루이틀) 전용\u003c/strong\u003e이지 장기 보유하면 안 되는 물건이다. 횡보장에서 특히 치명적이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 인버스 ETF — 떨어지면 버는 상품\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003e인버스\u003c/strong\u003e는 지수가 떨어지면 오르게 설계됐다(반대). 하락에 베팅하거나 헤지용이지.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e인버스\u003c/strong\u003e: 지수 −1% → +1%\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e곱버스(인버스 2X)\u003c/strong\u003e: 지수 −1% → +2% (레버리지 + 인버스, 가장 위험)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ 인버스도 \u003cstrong\u003e일일 기준\u003c/strong\u003e → 장기 보유 시 변동성 끌림으로 손실 누적. \u003cstrong\u003e단기·헤지 전용.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"'곱버스'에 장기 묻어두고 물려 있는 사람이 정말 많다. \u003cstrong\u003e레버리지·인버스는 트레이더의 단기 도구\u003c/strong\u003e지, 투자자의 장기 자산이 아니다. 명심해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 괴리율 \u0026#x26; 추적오차 — 보이지 않는 비용\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"ETF엔 두 가지 '숨은 어긋남'이 있다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용어\u003c/th\u003e\n\u003cth\u003e뜻\u003c/th\u003e\n\u003cth\u003e주의\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e추적오차\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eETF가 추종지수를 \u003cstrong\u003e못 따라간\u003c/strong\u003e 정도\u003c/td\u003e\n\u003ctd\u003e보수·운용 미스로 발생\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e괴리율(NAV 대비)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시장가격이 **순자산가치(NAV)**에서 벗어난 정도\u003c/td\u003e\n\u003ctd\u003e거래량 적은 ETF·해외시장 휴장 시 큼\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"특히 \u003cstrong\u003e거래량 적은 ETF\u003c/strong\u003e나 **해외지수 ETF(밤에 본장 휴장)**는 괴리율이 커질 수 있다. \u003cstrong\u003e거래량 많고 추적오차 작은\u003c/strong\u003e ETF를 골라라. LP(유동성공급자)가 잘 받쳐주는 대형 ETF가 안전하지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. ETF 고를 때 체크리스트\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"같은 'S\u0026#x26;P500 ETF'도 여러 개다. 이렇게 골라라.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e추종지수\u003c/strong\u003e가 내가 원하는 게 맞나\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e총보수(TER)\u003c/strong\u003e 낮은가 (같은 지수면 싼 것)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e거래량·순자산(AUM)\u003c/strong\u003e 충분한가 (괴리·상폐 위험↓)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e분배방식\u003c/strong\u003e(분배형 vs TR) 내 목적에 맞나\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e레버리지/인버스 아닌지\u003c/strong\u003e 확인 (장기면 절대 회피)\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정 정리\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"레버리지 장기 들면 2배 먹는다\"\u003c/strong\u003e ❌ → \u003cstrong\u003e변동성 끌림\u003c/strong\u003e으로 녹는다. 단기 전용.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"인버스로 하락장 존버\"\u003c/strong\u003e ❌ → 곱버스 장기 보유는 손실 누적의 지름길.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"거래량 적어도 같은 지수면 OK\"\u003c/strong\u003e ❌ → \u003cstrong\u003e괴리율·상장폐지\u003c/strong\u003e 위험. 대형·거래활발 ETF로.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e보수·추적오차\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX ETF / 발행사 페이지\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eTER, 추적오차 공시\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e괴리율·NAV\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권 ETF 탭\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e실시간 NAV 대비\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e구성종목\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e발행사(삼성·미래에셋 등)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003ePDF(구성내역)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 레버리지 ETF를 장기 보유하면 안 되는 이유는?\r\n→ \u003cstrong\u003e일일 수익률 2배\u003c/strong\u003e를 추종해, 등락만 반복해도 \u003cstrong\u003e변동성 끌림\u003c/strong\u003e으로 가치가 녹음.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 섹터·테마 ETF는 어떤 상황에 쓰나?\r\n→ \u003cstrong\u003e분야는 유망한데 그 안에서 어느 종목이 이길지 모를 때\u003c/strong\u003e 분야 전체에 분산 베팅.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 거래량 적은 ETF의 위험 두 가지는?\r\n→ \u003cstrong\u003e괴리율 확대\u003c/strong\u003e(시장가가 NAV에서 벗어남)와 \u003cstrong\u003e상장폐지\u003c/strong\u003e 가능성.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [상품 3] 리츠(REITs) — 소액으로 건물주 되기, 그리고 금리와의 관계.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 상품 추천이 아닙니다. 레버리지·인버스는 고위험 상품입니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-23\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"📦 [상품 2] ETF 심화 — 섹터·테마·레버리지, 그리고 함정\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_ne
