\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"원리만 알면 가능하다. 단, \u003cstrong\u003e금리와의 관계\u003c/strong\u003e라는 함정도 같이 알아야 해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 리츠 = 부동산에 투자하는 회사의 주식\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eREITs(부동산투자회사)\u003c/strong\u003e = 투자자 돈을 모아 \u003cstrong\u003e빌딩·물류센터·데이터센터 등을 사서 임대\u003c/strong\u003e하고, 그 임대수익을 투자자에게 나눠주는 회사. 거래소에 상장돼 \u003cstrong\u003e주식처럼 거래\u003c/strong\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e리츠 한 주 = 그 회사가 가진 \u003cstrong\u003e부동산의 지분 조각\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e임대료 받아서 → \u003cstrong\u003e배당\u003c/strong\u003e으로 분배\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"즉 리츠를 사면 너는 \u003cstrong\u003e간접 건물주\u003c/strong\u003e가 되는 거다. 관리·세입자 걱정 없이 임대수익(배당)만 받는 거지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 리츠의 최대 매력 — 의무 배당\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"리츠가 배당주로 사랑받는 이유가 있다. \u003cstrong\u003e법으로 이익의 대부분(보통 90% 이상)을 배당하게\u003c/strong\u003e 돼 있어.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e그래서 리츠는 \u003cstrong\u003e배당수익률이 높은\u003c/strong\u003e 편(연 4~7%대도 흔함)\u003c/li\u003e\n\u003cli\u003e안정적 \u003cstrong\u003e현금흐름(임대료)\u003c/strong\u003e 기반 → 꾸준한 배당\u003c/li\u003e\n\u003cli\u003e주식의 성장성과 부동산의 안정성 \u003cstrong\u003e중간\u003c/strong\u003e 성격\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"배당을 의무적으로 많이 준다니, 배당 좋아하는 사람한텐 딱이네요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇지. 단, \u003cstrong\u003e높은 배당엔 이유와 리스크\u003c/strong\u003e가 따른다. 다음을 봐라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. ⚠️ 핵심 함정 — 리츠는 금리에 약하다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"리츠 투자에서 \u003cstrong\u003e이거 하나만 기억하면 절반은 성공\u003c/strong\u003e이다. \u003cstrong\u003e리츠는 금리가 오르면 약해진다.\u003c/strong\u003e 왜일까?\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e빚으로 건물을 산다\u003c/strong\u003e → 금리↑면 \u003cstrong\u003e이자 비용↑\u003c/strong\u003e → 이익↓\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e배당 매력 감소\u003c/strong\u003e → 금리 5%면 안전한 예금·채권이 리츠 배당과 경쟁 → 리츠 인기↓\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e부동산 가치 하락\u003c/strong\u003e → 고금리는 부동산 시세에도 악재\u003c/li\u003e\n\u003c/ol\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📌 \u003cstrong\u003e금리↑ → 리츠 약세 / 금리↓ → 리츠 강세\u003c/strong\u003e (경제 5편 채권과 비슷한 성격)\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"아! 그래서 오늘처럼 금리 4.54%로 높은 국면엔 리츠가 힘들겠네요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확하다. 경제 트랙을 배우니 바로 연결되지? \u003cstrong\u003e리츠는 금리의 자식\u003c/strong\u003e이야. 살 때 반드시 금리 방향을 같이 봐라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 리츠의 종류\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e유형\u003c/th\u003e\n\u003cth\u003e담는 부동산\u003c/th\u003e\n\u003cth\u003e특징\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e오피스/리테일\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e빌딩·쇼핑몰\u003c/td\u003e\n\u003ctd\u003e경기·공실률 민감\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e물류\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e물류센터\u003c/td\u003e\n\u003ctd\u003e이커머스 성장 수혜\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e데이터센터\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e서버 건물\u003c/td\u003e\n\u003ctd\u003eAI·클라우드 성장 테마\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e주거/인프라\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e임대주택·통신탑\u003c/td\u003e\n\u003ctd\u003e상대적 방어적\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"같은 리츠라도 \u003cstrong\u003e무슨 부동산을 담았나\u003c/strong\u003e가 중요하다. 쇼핑몰 리츠는 경기 타고, 데이터센터 리츠는 AI 붐을 타지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 리츠 체크리스트\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"리츠는 일반 주식과 보는 지표가 좀 다르다.\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e배당수익률\u003c/strong\u003e과 \u003cstrong\u003e배당의 지속성\u003c/strong\u003e(임대료가 안정적인가)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e금리 환경\u003c/strong\u003e (지금이 금리 상승기인가 하락기인가)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e공실률·임대율\u003c/strong\u003e (건물이 비어 있나)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e부채비율(LTV)\u003c/strong\u003e (빚이 과하면 금리 상승에 취약)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e편입 부동산의 종류\u003c/strong\u003e와 입지\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정 정리\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"배당 높으니 무조건 좋다\"\u003c/strong\u003e ❌ → \u003cstrong\u003e고금리기엔 주가 하락\u003c/strong\u003e이 배당수익을 까먹을 수 있다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"리츠는 부동산이라 안전\"\u003c/strong\u003e ❌ → 상장 리츠는 \u003cstrong\u003e주가 변동\u003c/strong\u003e이 있고 금리에 민감.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"공실·부채 안 봐도 된다\"\u003c/strong\u003e ❌ → 건물이 비거나 빚이 많으면 배당이 깎인다.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e국내 리츠\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX / 네이버페이 증권\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e상장리츠 배당·LTV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e미국 리츠\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eetf.com(리츠 ETF) / 발행사\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eVNQ 등 리츠 ETF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e배당이력\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 HTS\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e배당수익률·지급주기\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 리츠가 배당수익률이 높은 구조적 이유는?\r\n→ 법적으로 \u003cstrong\u003e이익의 대부분(약 90%+)을 배당\u003c/strong\u003e하도록 의무화돼 있어서.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 금리가 오르면 리츠가 약해지는 이유 두 가지는?\r\n→ ①빚으로 산 부동산의 \u003cstrong\u003e이자 비용↑\u003c/strong\u003e ②안전한 예금·채권과 경쟁해 \u003cstrong\u003e배당 매력↓\u003c/strong\u003e(+부동산 가치 하락).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 같은 리츠라도 꼭 확인할 것은?\r\n→ \u003cstrong\u003e편입 부동산 종류\u003c/strong\u003e(오피스/물류/데이터센터 등)와 \u003cstrong\u003e공실률·부채비율(LTV)\u003c/strong\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 편\u003c/strong\u003e: [상품 4] 채권·펀드·ETN \u0026#x26; 절세계좌 — 안전자산과 세금 아끼는 그릇.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 상품 추천이 아닙니다. 리츠는 금리·부동산 경기에 따라 손실이 날 수 있습니다. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-22\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold te
