mg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"수익이 같은데 계좌 때문에 돈이 달라져요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"세금 때문이다. 부자들이 가장 신경 쓰는 게 바로 이거야. 차근차근 가자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 채권 직접투자 — 나라·기업에 돈 빌려주기\u003c/h2\u003e\n\u003cp\u003e경제 5편에서 채권을 배웠지(가격↔금리 역관계). 개인도 채권을 \u003cstrong\u003e직접 살 수 있다.\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종류\u003c/th\u003e\n\u003cth\u003e발행\u003c/th\u003e\n\u003cth\u003e안전도\u003c/th\u003e\n\u003cth\u003e수익\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e국채\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e정부\u003c/td\u003e\n\u003ctd\u003e매우 높음\u003c/td\u003e\n\u003ctd\u003e낮음\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e회사채\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e기업\u003c/td\u003e\n\u003ctd\u003e신용등급별\u003c/td\u003e\n\u003ctd\u003e중간\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e하이일드\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e저신용 기업\u003c/td\u003e\n\u003ctd\u003e낮음\u003c/td\u003e\n\u003ctd\u003e높음(위험)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e만기까지 들면 \u003cstrong\u003e약속된 이자 + 원금\u003c/strong\u003e (발행사 부도만 없으면)\u003c/li\u003e\n\u003cli\u003e중간에 팔면 \u003cstrong\u003e금리 변동에 따라 손익\u003c/strong\u003e(금리↑→채권값↓)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"채권은 '안전자산'의 대표지만 \u003cstrong\u003e무위험은 아니다.\u003c/strong\u003e 금리 오르면 평가손, 회사채는 부도 위험이 있어. **신용등급(AAA~)**을 꼭 봐라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 채권 ETF — 채권을 주식처럼 간편하게\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"개별 채권은 단위가 크고 거래가 불편해. 그래서 보통 \u003cstrong\u003e채권 ETF\u003c/strong\u003e로 접근한다.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e단기채 ETF\u003c/strong\u003e: 금리 변동에 둔감, 안정적(파킹용)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e장기채 ETF\u003c/strong\u003e: 금리 하락기 차익 노림, 단 변동성 큼(듀레이션↑)\u003c/li\u003e\n\u003cli\u003e금리 \u003cstrong\u003e하락\u003c/strong\u003e이 예상되면 장기채 ETF가 유리(채권값↑)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"주의! \u003cstrong\u003e장기채 ETF는 금리에 민감\u003c/strong\u003e하다. '안전한 채권'이라며 장기채를 샀다가 금리 급등에 크게 물리는 초보가 많아. 만기(듀레이션)를 꼭 확인해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 펀드 · ETN — ETF와 사촌들\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e상품\u003c/th\u003e\n\u003cth\u003e무엇\u003c/th\u003e\n\u003cth\u003eETF와 차이\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e공모펀드\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e운용사가 굴리는 묶음상품\u003c/td\u003e\n\u003ctd\u003e실시간 매매 X, 보수 높음\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eETF\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e상장된 펀드\u003c/td\u003e\n\u003ctd\u003e실시간·저비용 (상품1편)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eETN\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e증권사가 발행한 \u003cstrong\u003e약속증서\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e발행사 신용위험\u003c/strong\u003e 존재\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"ETN은 ETF랑 비슷해 보이는데 뭐가 달라요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"ETF는 \u003cstrong\u003e실제 자산을 담은\u003c/strong\u003e 바구니다. ETN은 증권사가 \u003cstrong\u003e'이 지수 수익률을 줄게'라고 약속한 증서\u003c/strong\u003e야. 그래서 \u003cstrong\u003e그 증권사가 망하면 위험\u003c/strong\u003e해(신용위험). 추적은 정확하지만 발행사를 봐야 하지. 원자재·변동성 같은 특수지수에 ETN이 많아.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. ⭐ 절세계좌 — 같은 수익, 다른 세금\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"여기가 진짜 중요하다. 한국엔 \u003cstrong\u003e세금을 아껴주는 계좌\u003c/strong\u003e가 있어. 일반계좌로만 하면 손해야.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e계좌\u003c/th\u003e\n\u003cth\u003e핵심 혜택\u003c/th\u003e\n\u003cth\u003e누구에게\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eISA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e수익 200만원(서민형 400만)까지 비과세, 초과분 9.9% 분리과세\u003c/td\u003e\n\u003ctd\u003e누구나(만19세+)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e연금저축펀드\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e납입액 세액공제(연 최대 600만), 수익 과세이연\u003c/td\u003e\n\u003ctd\u003e노후·장기\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eIRP\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e연금저축과 합산 900만까지 세액공제\u003c/td\u003e\n\u003ctd\u003e직장인·노후\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e미장 투자\u003c/strong\u003e는 일반계좌에서 양도세 22%(경제·기초편). 하지만 **연금계좌에서 미국 ETF(국내상장)**를 사면 \u003cstrong\u003e과세이연 + 저율과세\u003c/strong\u003e로 크게 절세\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e세액공제\u003c/strong\u003e: 연금저축·IRP에 넣으면 \u003cstrong\u003e연말정산에서 13.2~16.5% 돌려받음\u003c/strong\u003e → 즉시 수익이나 마찬가지\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"납입만 해도 13% 넘게 돌려받아요? 그럼 일반계좌보다 훨씬 유리하잖아요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래서 **'계좌부터 만들라'**는 거다. 장기·노후 자금은 \u003cstrong\u003e연금계좌\u003c/strong\u003e, 중기 목돈은 \u003cstrong\u003eISA\u003c/strong\u003e, 그 위에 일반계좌. \u003cstrong\u003e순서가 곧 절세\u003c/strong\u003e다. 단, 연금은 \u003cstrong\u003e중도인출 시 불이익\u003c/strong\u003e이 있으니 '오래 둘 돈'만 넣어라.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 그릇 정하기 — 우선순위 가이드\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"돈의 성격에 맞게 그릇을 나눠라.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e① 노후·아주 장기 자금  → 연금저축펀드 + IRP (세액공제 \u003cspan class=\"hljs-number\"\u003e900\u003c/span\u003e만 채우기)\r\n② 중기 목돈(\u003cspan class=\"hljs-number\"\u003e3\u003c/span\u003e~\u003cspan class=\"hljs-number\"\u003e5\u003c/span\u003e년+)    → ISA (비과세 한도 활용)\r\n③ 단기·유동성 필요 자금 → 일반계좌 (언제든 인출)\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e6. 함정\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\"장기채 ETF는 안전\"\u003c/strong\u003e ❌ → 금리 상승기엔 \u003cstrong\u003e크게 손실\u003c/strong\u003e(듀레이션). 안전≠무변동.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"ETN도 ETF랑 같다\"\u003c/strong\u003e ❌ → ETN은 \u003cstrong\u003e발행사 신용위험\u003c/strong\u003e. 발행 증권사를 확인.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"계좌는 아무거나\"\u003c/strong\u003e ❌ → **절세계좌(연금·ISA)**를 안 쓰면 같은 수익에 세금만 더 낸다.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e용도\u003c/th\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e메모\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e채권/채권ETF\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eKRX / 증권사\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e신용등급·듀레이션\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e절세계좌 안내\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e금융감독원 / 증권사\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eISA·연금저축·IRP 비교\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e세액공제 한도\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e국세청 홈택스\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e연말정산 모의계산\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e ETF와 ETN의 가장 큰 차이는?\r\n→ ETF는 \u003cstrong\u003e실물 자산을 담음\u003c/strong\u003e, ETN은 증권사의 \u003cstrong\u003e약속증서라 발행사 신용위험\u003c/strong\u003e이 있음.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e '안전한' 장기채 ETF가 큰 손실을 낼 수 있는 상황은?\r\n→ \u003cstrong\u003e금리 급등기\u003c/strong\u003e. 만기(듀레이션)가 길수록 채권값이 크게 하락.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 노후·장기 자금을 일반계좌 대신 연금저축·IRP에 넣는 이유는?\r\n→ \u003cstrong\u003e세액공제(13~16.5% 환급) + 과세이연\u003c/strong\u003e으로 같은 수익에도 세후 수익이 훨씬 큼.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🎓 상품 트랙 졸업\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"ETF(기초·심화)·리츠·채권·펀드·ETN, 그리고 절세계좌까지 왔다. 이제 너는 **개별주를 넘어 '자산의 도구함'**을 갖췄어. 다음은 이 도구로 \u003cstrong\u003e산업·섹터\u003c/strong\u003e를 읽고 \u003cstrong\u003e포트폴리오\u003c/strong\u003e를 짜는 단계다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 본 자료는 교육 목적이며 특정 상품·계좌 추천이 아닙니다. 세제는 변경될 수 있으니 가입 전 최신 규정을 확인하세요. 투자 책임은 본인에게 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-21\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"📦 [상품 4] 채권·펀드·ETN \u0026 절세계좌 — 안전자산과 '
