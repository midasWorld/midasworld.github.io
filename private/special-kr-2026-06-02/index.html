이 아니며, 미래 수익을 보장하지 않습니다. 모든 수치는 매일 변하니 직접 확인하세요. 투자 책임은 본인에게 있습니다.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 오늘의 시황 (실데이터)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e값 (2026-06-02)\u003c/th\u003e\n\u003cth\u003e전일대비\u003c/th\u003e\n\u003cth\u003e읽는 법\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKOSPI\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e8,801.49\u003c/td\u003e\n\u003ctd\u003e+0.15%\u003c/td\u003e\n\u003ctd\u003e대형주 시장\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKOSDAQ\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e1,026.03\u003c/td\u003e\n\u003ctd\u003e−2.29%\u003c/td\u003e\n\u003ctd\u003e중소·성장주 (이날 약세)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e원/달러 환율\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e1,516.4\u003c/td\u003e\n\u003ctd\u003e+0.63%\u003c/td\u003e\n\u003ctd\u003e높음 → 외국인 부담·수출주 유리\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e미국 10년물 금리\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e4.47%\u003c/td\u003e\n\u003ctd\u003e+0.49%\u003c/td\u003e\n\u003ctd\u003e높음 → 성장주에 부담\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"환율 1,516원이면 높은 거죠? 금리도 4.47%로 높고...\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇다. \u003cstrong\u003e고환율 + 고금리\u003c/strong\u003e 환경에선 빚 많은 성장주가 불리하고, \u003cstrong\u003e현금흐름 좋은 가치주·수출주\u003c/strong\u003e가 상대적으로 견딜 만하다. 이게 시황을 '읽는다'는 거야. 예측이 아니라 \u003cstrong\u003e현재 조건 파악\u003c/strong\u003e이지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 가이드 에이전트 — 5단계 분석 프레임워크\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"'에이전트'란 거창한 게 아니다. \u003cstrong\u003e매번 같은 순서로 판단하는 체계\u003c/strong\u003e다. 감정을 빼는 거지.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e① 시황 파악   → 금리·환율·지수 (위 표)\r\n② 스크리닝    → 객관적 조건으로 후보 거르기 (아래 \u003cspan class=\"hljs-number\"\u003e3\u003c/span\u003e장)\r\n③ 검증       → 왜 싼지/좋은지 재무·사업 확인 (재무편)\r\n④ 매수 계획   → \u003cspan class=\"hljs-number\"\u003e2%\u003c/span\u003e 룰·분할매수로 금액 산정 (아래 \u003cspan class=\"hljs-number\"\u003e5\u003c/span\u003e장)\r\n⑤ 기록·관리   → 손절선·매도조건 적어두고 지키기 (실전편)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이 다섯 단계를 \u003cstrong\u003e빠짐없이\u003c/strong\u003e 거치면, 유튜버 말에 휘둘리지 않는다. 이게 너만의 가이드 에이전트야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 오늘의 객관적 스크리닝 (참고용 — 추천 아님)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"25개 대형주를 \u003cstrong\u003e기계적 조건\u003c/strong\u003e으로 걸러봤다. 이건 '관심 후보'일 뿐, \u003cstrong\u003e사라는 게 절대 아니다.\u003c/strong\u003e 왜 그 조건에 걸렸는지 직접 검증해야 해.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/kr_per_roe_map.png\" alt=\"국장 PER-ROE 지도\"\u003e\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"지도를 봐라. **왼쪽 위(저PER+고ROE)**가 이론상 매력 구간이다. 빨간 점들이지.\"\u003c/p\u003e\n\u003ch3\u003e조건 A: 저PER(\u0026#x3C;12) + 저PBR(\u0026#x3C;1.2) — 가치주 후보\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003ePBR\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003e⚠️ 검증 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국전력\u003c/td\u003e\n\u003ctd\u003e2.78\u003c/td\u003e\n\u003ctd\u003e0.48\u003c/td\u003e\n\u003ctd\u003e18.7%\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e규제 산업·막대한 부채\u003c/strong\u003e. 싼 데는 이유가\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e우리금융\u003c/td\u003e\n\u003ctd\u003e7.08\u003c/td\u003e\n\u003ctd\u003e0.61\u003c/td\u003e\n\u003ctd\u003e8.5%\u003c/td\u003e\n\u003ctd\u003e은행 디스카운트. 금리 영향\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e하나금융\u003c/td\u003e\n\u003ctd\u003e8.29\u003c/td\u003e\n\u003ctd\u003e0.71\u003c/td\u003e\n\u003ctd\u003e9.1%\u003c/td\u003e\n\u003ctd\u003e은행\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e기아\u003c/td\u003e\n\u003ctd\u003e9.50\u003c/td\u003e\n\u003ctd\u003e1.06\u003c/td\u003e\n\u003ctd\u003e11.9%\u003c/td\u003e\n\u003ctd\u003e자동차 경기민감. 환율 수혜\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e신한지주\u003c/td\u003e\n\u003ctd\u003e9.56\u003c/td\u003e\n\u003ctd\u003e0.79\u003c/td\u003e\n\u003ctd\u003e8.6%\u003c/td\u003e\n\u003ctd\u003e은행\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKB금융\u003c/td\u003e\n\u003ctd\u003e10.36\u003c/td\u003e\n\u003ctd\u003e0.95\u003c/td\u003e\n\u003ctd\u003e10.0%\u003c/td\u003e\n\u003ctd\u003e은행\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e조건 B: 고ROE(≥12%) + PER\u0026#x3C;25 — 우량주 후보\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003e⚠️ 검증 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eSK하이닉스\u003c/td\u003e\n\u003ctd\u003e61.2%\u003c/td\u003e\n\u003ctd\u003e22.8\u003c/td\u003e\n\u003ctd\u003e반도체 \u003cstrong\u003e호황 정점\u003c/strong\u003e일 수 있음 (사이클!)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국전력\u003c/td\u003e\n\u003ctd\u003e18.7%\u003c/td\u003e\n\u003ctd\u003e2.78\u003c/td\u003e\n\u003ctd\u003e부채·규제 리스크\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKT\u0026#x26;G\u003c/td\u003e\n\u003ctd\u003e13.2%\u003c/td\u003e\n\u003ctd\u003e18.2\u003c/td\u003e\n\u003ctd\u003e안정 배당, 저성장\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"봐라. \u003cstrong\u003e한국전력\u003c/strong\u003e이 PER 2.78·PBR 0.48로 제일 싸 보이지? 하지만 \u003cstrong\u003e규제로 요금을 마음대로 못 올리고 부채가 천문학적\u003c/strong\u003e이야. 스크리너는 그걸 모른다. 그래서 ③ 검증이 필수인 거다. '싼 데는 이유가 있다'를 잊지 마.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 같은 시황을 두 관점으로\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그럼 지금 뭘 사야 정답이에요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정답은 없다. \u003cstrong\u003e관점\u003c/strong\u003e이 있을 뿐이야.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e가치 관점\u003c/strong\u003e: 고금리엔 은행·배당주가 견딜 만 → 단, 디스카운트가 풀릴 촉매가 있나?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e사이클 관점\u003c/strong\u003e: 반도체 ROE 정점이면 오히려 조심 (PER 낮아 보여도)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e방어 관점\u003c/strong\u003e: 불확실하면 \u003cstrong\u003e현금 비중↑ + 인덱스 ETF 적립\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"어느 관점을 택하든 \u003cstrong\u003e②③④⑤를 거쳐 스스로 결론\u003c/strong\u003e내야 한다. 내가 '사라'고 하면 그건 사기꾼이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 매수 계획 세우는 법 (예시 — 특정 종목 아님)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"만약 네가 검증을 마치고 어떤 종목 X를 사기로 했다 치자. \u003cstrong\u003e얼마를, 어떻게\u003c/strong\u003e 살지는 이렇게 계산한다.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e전제\u003c/strong\u003e: 투자금 1,000만원, 한 거래 최대손실 2% 룰(=20만원), 손절선 −10%\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e한 종목 최대 매수액\u003c/strong\u003e = 20만 ÷ 0.10 = \u003cstrong\u003e200만원\u003c/strong\u003e (전체의 20%)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e분할 매수\u003c/strong\u003e: 200만을 3회로 → 1차 70만, 2차 70만, 3차 60만 (빠지면 추가)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e손절선\u003c/strong\u003e: 평균단가 −10% 도달 시 \u003cstrong\u003e기계적 매도\u003c/strong\u003e (미리 못박기)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e목표·매도조건\u003c/strong\u003e: PER이 업종 평균 회복 / 산 이유가 깨지면 매도\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e기록\u003c/strong\u003e: 산 이유·손절가·목표가를 매매일지에\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"봤지? \u003cstrong\u003e금액은 종목이 아니라 '내 위험 한도'에서 나온다.\u003c/strong\u003e '한전을 300만원어치 사라' 같은 건 가이드가 아니라 도박 부추김이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. AI 튜터를 에이전트로 쓰기\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"더 궁금하면요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"문제 풀이 화면의 \u003cstrong\u003eAI 튜터\u003c/strong\u003e(로컬 LLM)에게 물어봐라. '한국전력 PER이 왜 낮은지 설명해줘' 같은 \u003cstrong\u003e개념·해석 질문\u003c/strong\u003e에 답해줄 거다. 단, 튜터도 \u003cstrong\u003e미래 예측은 못 한다.\u003c/strong\u003e 판단은 늘 네 몫이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 고환율·고금리 환경에서 상대적으로 불리한 종목군은?\r\n→ \u003cstrong\u003e빚 많은 성장주\u003c/strong\u003e(고PER 기술주). 금리 부담↑\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 한국전력이 PER 2.78로 싸 보이는데 그대로 사면 안 되는 이유는?\r\n→ \u003cstrong\u003e규제·막대한 부채\u003c/strong\u003e 등 싼 이유가 있음. 스크리너는 못 잡음 → 직접 검증 필수\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 한 종목 매수 금액은 무엇에서 결정되나?\r\n→ 종목이 아니라 **내 위험 한도(2% 룰·손절선)**에서 역산\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🔄 이 특별편을 최신으로\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이 수치는 2026-06-02 것이다. 시간이 지나면 낡아. 같은 방법(\u003ccode\u003e.tmp/fetch_kr_special.py\u003c/code\u003e 재실행)으로 \u003cstrong\u003e최신 데이터로 갱신\u003c/strong\u003e할 수 있다. 중요한 건 숫자가 아니라 \u003cstrong\u003e'시황 읽기 → 스크리닝 → 검증 → 계획'의 순서\u003c/strong\u003e다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003e면책\u003c/strong\u003e: 본 자료는 교육 목적이며 투자 권유·종목 추천이 아닙니다. 스크리닝 결과는 객관적 조건 통과일 뿐 매수 신호가 아닙니다. 모든 투자
