u003e\n\u003cp\u003e⚠️ \u003cstrong\u003e본 특별편은 2026-06-06 기준(장 마감 데이터는 직전 거래일 06-05) 실제 데이터로 만든 학습 자료입니다. 특정 종목 매수 추천이 아니며, 미래 수익을 보장하지 않습니다. 모든 수치는 매일 변하니 직접 확인하세요. 투자 책임은 본인에게 있습니다.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e0. 지난 편(06-02) 복기 — \"콜\"은 맞았나? ✅\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"06-02에 내가 뭐라 했지? **'고환율 + 고금리 환경에선 빚 많은 성장주가 불리하고, 현금흐름 좋은 가치주·은행·배당주가 견딜 만하다'**고 했다. 그리고 SK하이닉스는 **'반도체 호황 정점일 수 있으니 주의(사이클!)'**라 콕 집었지. 그 사이 \u003cstrong\u003e4일 만에 KOSPI가 8,801 → 8,160으로 −7.3% 급락\u003c/strong\u003e했다. 위기에서 진짜가 드러나는 법. 결과를 보자.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e06-02 → 06-05 실제 수익률 (KOSPI −7.3%인 구간)\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e06-02 분류\u003c/th\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003e수익률\u003c/th\u003e\n\u003cth\u003e평가\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟢 가치/은행 후보\u003c/td\u003e\n\u003ctd\u003e신한지주\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+11.5%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시장 폭락에도 상승\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟢 가치/은행 후보\u003c/td\u003e\n\u003ctd\u003eKB금융\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+9.6%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e상승\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟢 가치/은행 후보\u003c/td\u003e\n\u003ctd\u003e하나금융\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+5.6%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e상승\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟢 가치/은행 후보\u003c/td\u003e\n\u003ctd\u003e우리금융\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+4.4%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e상승\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟢 가치/은행 후보\u003c/td\u003e\n\u003ctd\u003e한국전력\u003c/td\u003e\n\u003ctd\u003e+0.9%\u003c/td\u003e\n\u003ctd\u003e방어\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟡 가치 후보(경기민감)\u003c/td\u003e\n\u003ctd\u003e기아\u003c/td\u003e\n\u003ctd\u003e−4.6%\u003c/td\u003e\n\u003ctd\u003e시장보단 선방, 그래도 하락\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🔴 성장주 대조군\u003c/td\u003e\n\u003ctd\u003e삼성전자\u003c/td\u003e\n\u003ctd\u003e−8.7%\u003c/td\u003e\n\u003ctd\u003e하락\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🔴 성장주 대조군\u003c/td\u003e\n\u003ctd\u003eNAVER\u003c/td\u003e\n\u003ctd\u003e−8.9%\u003c/td\u003e\n\u003ctd\u003e하락\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e⚠️ \"사이클 주의\" 콕 집음\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eSK하이닉스\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−12.3%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e경고대로 최악권\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e그룹 평균: 가치·은행 후보 +4.6% · 성장주 대조군 −6.1% · 지수(KOSPI) −7.3%\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"헐... 시장이 −7%인데 은행 후보들은 \u003cstrong\u003e플러스\u003c/strong\u003e예요?! 그리고 하이닉스 경고도 진짜 −12% 빠졌네요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래. **'고금리엔 은행·배당주가 견딜 만'**이라는 조건 읽기가 이번엔 맞았다. 그런데 — \u003cstrong\u003e호두야, 여기서 자만하면 끝이다.\u003c/strong\u003e 세 가지를 같이 새겨라.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e🧠 \u003cstrong\u003e복기에서 배울 점 (자만 금지)\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e이건 '예측 적중'이 아니라 '조건 읽기'가 통한 거다.\u003c/strong\u003e 시장이 마침 위험회피(risk-off) 국면이라 방어 포지션이 빛났을 뿐. 만약 반대로 폭등장이었다면 은행주는 성장주에 뒤처졌을 거다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e모든 후보가 이긴 게 아니다.\u003c/strong\u003e 같은 가치 후보라도 **기아(−4.6%)**는 경기민감주라 하락했다. 스크린은 만능이 아니다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e고작 3거래일, 표본이 너무 작다.\u003c/strong\u003e 한 번 맞았다고 방법이 증명된 게 아냐. \u003cstrong\u003e계속 복기\u003c/strong\u003e해야 진짜 실력이 된다.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이게 복기의 핵심이다. \u003cstrong\u003e맞아도 왜 맞았는지, 틀려도 왜 틀렸는지\u003c/strong\u003e를 적어두는 것. 이제 오늘을 보자.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 오늘의 시황 (실데이터)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e값 (기준 06-05~06)\u003c/th\u003e\n\u003cth\u003e전일대비\u003c/th\u003e\n\u003cth\u003e읽는 법\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKOSPI\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e8,160.59\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−5.54%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e대형주 (급락 지속)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKOSDAQ\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e1,002.44\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−4.50%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e중소·성장주 (더 약세)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e원/달러 환율\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e1,558.8\u003c/td\u003e\n\u003ctd\u003e+1.68%\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e더 높아짐\u003c/strong\u003e → 외국인 부담·환차손\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e미국 10년물 금리\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e4.54%\u003c/td\u003e\n\u003ctd\u003e+1.32%\u003c/td\u003e\n\u003ctd\u003e높음 → 성장주에 부담\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"06-02엔 환율 1,516이었는데 지금 1,559로 더 올랐어요. 금리도 여전히 높고...\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇다. \u003cstrong\u003e고환율은 더 심해졌고 고금리는 그대로\u003c/strong\u003e다. 게다가 KOSDAQ(성장주)이 KOSPI보다 더 빠졌어 — 06-02의 구도가 \u003cstrong\u003e더 강해진\u003c/strong\u003e 셈이다. 단, 이미 −7% 빠진 뒤라 \u003cstrong\u003e'무조건 더 빠진다'고 단정하면 안 돼.\u003c/strong\u003e 조건은 같아도 가격은 이미 많이 내려왔으니까.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 가이드 에이전트 — 5단계 분석 프레임워크\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"'에이전트'란 거창한 게 아니다. \u003cstrong\u003e매번 같은 순서로 판단하는 체계\u003c/strong\u003e다. 감정을 빼는 거지. 폭락장일수록 더 필요해.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e① 시황 파악   → 금리·환율·지수 (위 표)\r\n② 스크리닝    → 객관적 조건으로 후보 거르기 (아래 \u003cspan class=\"hljs-number\"\u003e3\u003c/span\u003e장)\r\n③ 검증       → 왜 싼지/좋은지 재무·사업 확인 (재무편)\r\n④ 매수 계획   → \u003cspan class=\"hljs-number\"\u003e2%\u003c/span\u003e 룰·분할매수로 금액 산정 (아래 \u003cspan class=\"hljs-number\"\u003e5\u003c/span\u003e장)\r\n⑤ 기록·관리   → 손절선·매도조건 + 다음에 복기 (\u003cspan class=\"hljs-number\"\u003e0\u003c/span\u003e장처럼!)\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 오늘의 객관적 스크리닝 (참고용 — 추천 아님)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"25개 대형주를 오늘 수치로 다시 걸러봤다. \u003cstrong\u003e관심 후보\u003c/strong\u003e일 뿐, 사라는 게 절대 아니다. 왜 걸렸는지 ③검증은 네 몫이야.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/kr_per_roe_map.png\" alt=\"국장 PER-ROE 지도\"\u003e\u003c/p\u003e\n\u003ch3\u003e조건 A: 저PER(\u0026#x3C;12) + 저PBR(\u0026#x3C;1.2) — 가치주 후보\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003ePBR\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003e⚠️ 검증 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국전력\u003c/td\u003e\n\u003ctd\u003e2.81\u003c/td\u003e\n\u003ctd\u003e0.49\u003c/td\u003e\n\u003ctd\u003e18.7%\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e규제 산업·막대한 부채\u003c/strong\u003e. 싼 데는 이유가\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e우리금융\u003c/td\u003e\n\u003ctd\u003e7.39\u003c/td\u003e\n\u003ctd\u003e0.64\u003c/td\u003e\n\u003ctd\u003e8.5%\u003c/td\u003e\n\u003ctd\u003e은행. 금리 영향\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e하나금융\u003c/td\u003e\n\u003ctd\u003e8.76\u003c/td\u003e\n\u003ctd\u003e0.75\u003c/td\u003e\n\u003ctd\u003e9.1%\u003c/td\u003e\n\u003ctd\u003e은행\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e기아\u003c/td\u003e\n\u003ctd\u003e9.06\u003c/td\u003e\n\u003ctd\u003e1.02\u003c/td\u003e\n\u003ctd\u003e11.9%\u003c/td\u003e\n\u003ctd\u003e자동차 경기민감 (지난주 −4.6% 하락 경험)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e신한지주\u003c/td\u003e\n\u003ctd\u003e10.66\u003c/td\u003e\n\u003ctd\u003e0.89\u003c/td\u003e\n\u003ctd\u003e8.6%\u003c/td\u003e\n\u003ctd\u003e은행. 지난주 +11.5%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKB금융\u003c/td\u003e\n\u003ctd\u003e11.35\u003c/td\u003e\n\u003ctd\u003e1.04\u003c/td\u003e\n\u003ctd\u003e10.0%\u003c/td\u003e\n\u003ctd\u003e은행\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e조건 B: 고ROE(≥12%) + PER\u0026#x3C;25 — 우량주 후보\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003e⚠️ 검증 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eSK하이닉스\u003c/td\u003e\n\u003ctd\u003e61.2%\u003c/td\u003e\n\u003ctd\u003e20.0\u003c/td\u003e\n\u003ctd\u003e반도체 \u003cstrong\u003e호황 정점 주의\u003c/strong\u003e. 지난주 −12.3% (경고 적중)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국전력\u003c/td\u003e\n\u003ctd\u003e18.7%\u003c/td\u003e\n\u003ctd\u003e2.81\u003c/td\u003e\n\u003ctd\u003e부채·규제 리스크\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKT\u0026#x26;G\u003c/td\u003e\n\u003ctd\u003e13.2%\u003c/td\u003e\n\u003ctd\u003e17.66\u003c/td\u003e\n\u003ctd\u003e안정 배당, 저성장\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"봐라. 후보는 06-02와 \u003cstrong\u003e거의 그대로\u003c/strong\u003e다 — 은행·한전·KT\u0026#x26;G. 하지만 \u003cstrong\u003e신한은 이미 +11% 오른 뒤\u003c/strong\u003e라 매력이 줄었고, \u003cstrong\u003e하이닉스는 −12% 빠졌어도 여전히 '사이클 정점' 경고가 유효\u003c/strong\u003e하다. 같은 이름이라도 \u003cstrong\u003e상황이 바뀌면 판단도 바뀐다.\u003c/strong\u003e\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 같은 시황을 두 관점으로\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그럼 −7% 빠진 지금, 뭘 사야 정답이에요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정답은 없다. \u003cstrong\u003e관점\u003c/strong\u003e이 있을 뿐이야.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e가치 관점\u003c/strong\u003e: 고금리·고환율 지속 → 은행·배당주가 여전히 견딜 만. 단, 은행주는 이미 많이 올랐다 → \u003cstrong\u003e추격은 신중히\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e역발상 관점\u003c/strong\u003e: −7% 급락으로 \u003cstrong\u003e싸진 우량주\u003c/strong\u003e가 생겼나? 단, '싼 데는 이유'가 있는지 ③검증 필수\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e방어 관점\u003c/strong\u003e: 환율 1,559·VIX 불안 → \u003cstrong\u003e현금 비중↑ + 분할 적립\u003c/strong\u003e, 폭락장에 한 번에 베팅 금지\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"어느 관점이든 \u003cstrong\u003e②③④⑤를 거쳐 스스로 결론\u003c/strong\u003e내야 한다. 특히 \u003cstrong\u003e폭락장에선 '한 방에 풀매수'하는 게 제일 위험\u003c/strong\u003e해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 매수 계획 세우는 법 (예시 — 특정 종목 아님)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"네가 검증을 마치고 종목 X를 사기로 했다 치자. \u003cstrong\u003e얼마를, 어떻게\u003c/strong\u003e 살지는 이렇게 계산한다. 폭락장일수록 \u003cstrong\u003e분할\u003c/strong\u003e이 생명이야.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e전제\u003c/strong\u003e: 투자금 1,000만원, 한 거래 최대손실 2% 룰(=20만원), 손절선 −10%\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e한 종목 최대 매수액\u003c/strong\u003e = 20만 ÷ 0.10 = \u003cstrong\u003e200만원\u003c/strong\u003e (전체의 20%)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e분할 매수\u003c/strong\u003e: 200만을 3~4회로 → 1차 50만, 2차 50만, 3차 50만, 4차 50만 (더 빠지면 추가). 폭락장엔 \u003cstrong\u003e회차를 더 잘게\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e손절선\u003c/strong\u003e: 평균단가 −10% 도달 시 \u003cstrong\u003e기계적 매도\u003c/strong\u003e (미리 못박기)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e목표·매도조건\u003c/strong\u003e: 산 이유가 깨지면 매도\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e기록·복기\u003c/strong\u003e: 산 이유·손절가·목표가를 매매일지에 → 다음 특별편처럼 \u003cstrong\u003e반드시 복기\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"봤지? \u003cstrong\u003e금액은 종목이 아니라 '내 위험 한도'에서 나온다.\u003c/strong\u003e '은행주가 올랐으니 지금 몰빵해라' 같은 건 가이드가 아니라 도박 부추김이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. AI 튜터를 에이전트로 쓰기\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"더 궁금하면요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"문제 풀이 화면의 \u003cstrong\u003eAI 튜터\u003c/strong\u003e(로컬 LLM)에게 물어봐라. '은행주가 왜 고금리에 견디는지 설명해줘' 같은 \u003cstrong\u003e개념·해석 질문\u003c/strong\u003e에 답해줄 거다. 단, 튜터도 \u003cstrong\u003e미래 예측은 못 한다.\u003c/strong\u003e 판단은 늘 네 몫이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 06-02 복기에서 은행 후보가 시장(−7%) 대비 선방한 건 '예측 적중'인가?\r\n→ 아님. \u003cstrong\u003e위험회피 국면에서 방어 조건 읽기\u003c/strong\u003e가 통한 것. 폭등장이었다면 반대였을 수 있음. \u003cstrong\u003e자만 금지.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 같은 '가치 후보'인데 기아는 왜 떨어졌나?\r\n→ 은행과 달리 **경기민감(자동차)**이라 시장 하락에 동조. \u003cstrong\u003e스크린은 만능이 아니다.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e −7% 급락 후, 같은 종목이라도 판단이 바뀔 수 있는 이유는?\r\n→ 가격이 변하면 밸류에이션·기대수익이 변함. 신한은 +11% 올라 매력↓. \u003cstrong\u003e상황이 바뀌면 결론도 바뀐다.\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🔄 이 특별편을 최신으로\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이 수치는 06-05~06 것이다. 시간이 지나면 낡아. 같은 방법(\u003ccode\u003e.tmp/refresh_kr_special.py\u003c/code\u003e 재실행)으로 \u003cstrong\u003e최신 데이터로 갱신 + 지난 편 자동 복기\u003c/strong\u003e가 된다. 중요한 건 숫자가 아니라 \u003cstrong\u003e'시황 읽기 → 스크리닝 → 검증 → 계획 → 복기'의 순환\u003c/strong\u003e이다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003e면책\u003c/strong\u003e: 본 자료는 교육 목적이며 투자 권유·종목 추천이 아닙니다. 복기 수익률은 약 3거래일의 매우 짧은 표본으로, 방법의 우수성을 증명하지 않습니다. 스크리닝 결과는 객관적 조건 통과일 뿐 매수 신호가 아닙니다. 모든 투자 판단과 책임은 투자자 본인에게 있습니다. 데이터는 2026-06-05~06 기준이며 실제와 차이가 있을 수 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-18\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🔥 [특별편] 오늘의 국장 시황 \u0026 분석 가이드 (2026-06-06 기준)\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre
