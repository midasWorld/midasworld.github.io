\u003cstrong\u003e본 특별편은 2026-06-08 기준 실제 데이터로 만든 학습 자료입니다. 특정 종목 매수 추천이 아니며, 미래 수익을 보장하지 않습니다. 모든 수치는 매일 변하니 직접 확인하세요. 투자 책임은 본인에게 있습니다.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e0. 지난 편(06-06) 복기 — 이번엔 \"콜\"이 빗나갔다 ❌\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"06-06에 내가 뭐라 했지? **'고환율·고금리 지속이니 은행·배당주가 견딜 만하다'**고 했다. 06-02→06-05 구간에선 그게 맞았지(은행 +4.6%). 그래서 자칫 자만할 뻔했어. 그런데 \u003cstrong\u003e06-05 → 06-08, KOSPI가 또 −8.3% 빠지는 동안\u003c/strong\u003e 결과는 정반대였다.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e06-05 → 06-08 실제 수익률 (KOSPI 8,160 → 7,484, −8.3% 구간)\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e06-06 분류\u003c/th\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003e수익률\u003c/th\u003e\n\u003cth\u003e평가\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e🔴 가치/은행 후보\u003c/td\u003e\n\u003ctd\u003eKB금융\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−11.7%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e시장보다 더 빠짐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🔴 가치/은행 후보\u003c/td\u003e\n\u003ctd\u003e신한지주\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−9.7%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e급락\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🔴 가치/은행 후보\u003c/td\u003e\n\u003ctd\u003e하나금융\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−9.1%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e급락\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🔴 가치/은행 후보\u003c/td\u003e\n\u003ctd\u003e우리금융\u003c/td\u003e\n\u003ctd\u003e−7.5%\u003c/td\u003e\n\u003ctd\u003e하락\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟡 가치 후보\u003c/td\u003e\n\u003ctd\u003e기아\u003c/td\u003e\n\u003ctd\u003e−6.0%\u003c/td\u003e\n\u003ctd\u003e시장보단 선방\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟢 가치 후보\u003c/td\u003e\n\u003ctd\u003e한국전력\u003c/td\u003e\n\u003ctd\u003e−5.5%\u003c/td\u003e\n\u003ctd\u003e상대적 방어\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟢 우량 후보\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eKT\u0026#x26;G\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−1.2%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e진짜 방어주답게 최선방\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟡 우량 후보\u003c/td\u003e\n\u003ctd\u003eSK하이닉스\u003c/td\u003e\n\u003ctd\u003e−7.7%\u003c/td\u003e\n\u003ctd\u003e\"사이클 주의\" 여전히 유효\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🟡 성장주\u003c/td\u003e\n\u003ctd\u003eNAVER\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+9.2%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e혼자 급반등\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e그룹 평균: 가치·은행 후보 −8.25% · 우량 후보 −4.4% · 성장 대조군 −4.9% · 지수 −8.3%\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"어?! 지난번엔 은행이 시장 폭락에도 플러스였는데, 이번엔 은행이 \u003cstrong\u003e제일 많이\u003c/strong\u003e 빠졌어요. 거사부가 견딜 만하다던 그 은행들이…\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그래. \u003cstrong\u003e틀렸다.\u003c/strong\u003e 그리고 이게 바로 06-06에 내가 너한테 신신당부한 \u003cstrong\u003e'자만 금지'\u003c/strong\u003e 그 자체다. 왜 틀렸는지 뜯어보자.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e🧠 \u003cstrong\u003e틀린 복기에서 배울 점\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e'위험회피=은행 강세'는 항상 참이 아니다.\u003c/strong\u003e 06-02 국면은 외국인이 성장주를 던지는 risk-off였지만, 06-08은 \u003cstrong\u003e은행·대형주가 매도를 주도\u003c/strong\u003e한 다른 성격의 하락이었다. 같은 '하락장'이라도 \u003cstrong\u003e누가 파느냐가 다르면 결과도 다르다.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e환율이 힌트였다.\u003c/strong\u003e 06-08은 원/달러가 오히려 \u003cstrong\u003e내렸다(원화 강세, 1,559→1,528)\u003c/strong\u003e. 환율 위기가 아니라 \u003cstrong\u003e국내 주식만 던지는\u003c/strong\u003e 국지적 디레버리징 — 이런 날엔 '고환율 방어주' 논리 자체가 안 맞는다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e06-06에 깔아둔 안전장치가 그나마 통했다.\u003c/strong\u003e 그때 \"신한은 이미 +11% 올라 매력↓, \u003cstrong\u003e추격은 신중히\u003c/strong\u003e\"라고 못박았지. 그 신한이 이번에 −9.7%. \u003cstrong\u003e추격 자제\u003c/strong\u003e가 결과적으로 옳았다. 한 줄의 경고가 손실을 줄인다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e진짜 방어는 KT\u0026#x26;G(−1.2%)였다.\u003c/strong\u003e 경기·금리 안 타는 필수소비재. '은행=방어'라는 고정관념보다 \u003cstrong\u003e사업의 성격\u003c/strong\u003e을 봐야 한다.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"봤지? \u003cstrong\u003e맞은 날보다 틀린 날 복기가 열 배 값지다.\u003c/strong\u003e '조건 읽기'는 도구일 뿐, 시장 성격이 바뀌면 같은 도구도 빗나가. 그래서 \u003cstrong\u003e매번 새로 읽는\u003c/strong\u003e 거다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 오늘의 시황 (실데이터)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e값 (2026-06-08)\u003c/th\u003e\n\u003cth\u003e전일대비\u003c/th\u003e\n\u003cth\u003e읽는 법\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKOSPI\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e7,484.41\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−8.29%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e대형주 (하루 만에 폭락)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eKOSDAQ\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e911.39\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−9.08%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e중소·성장주 (더 약세)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e원/달러 환율\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e1,528.4\u003c/td\u003e\n\u003ctd\u003e−0.31%\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e소폭 하락\u003c/strong\u003e(원화 강세) → 환율發 아님\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e미국 10년물 금리\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e4.54%\u003c/td\u003e\n\u003ctd\u003e0.00%\u003c/td\u003e\n\u003ctd\u003e변동 없음\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"어라? 주가는 −8%인데 환율은 오히려 내렸고 미국 금리는 그대로네요. 06-06이랑 분위기가 달라요.\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정확히 봤다. \u003cstrong\u003e이게 오늘의 핵심\u003c/strong\u003e이다. 환율·금리가 그대로인데 \u003cstrong\u003e국장만 −8%\u003c/strong\u003e 빠졌다는 건, '글로벌 매크로 충격'이 아니라 \u003cstrong\u003e한국 증시 고유의 매물\u003c/strong\u003e이라는 뜻이야. 실제로 같은 날 미장은 오히려 반등했다(아래 미장 특별편 참고). \u003cstrong\u003e이런 디커플링은 원인을 따로 찾아야\u003c/strong\u003e 한다 — 수급, 정책, 특정 섹터發인지. 매크로 표만 보면 놓친다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📌 \u003cstrong\u003e국장 vs 미장 (2026-06-08)\u003c/strong\u003e: KOSPI −8.3% / S\u0026#x26;P500 \u003cstrong\u003e+0.55%\u003c/strong\u003e · VIX 21.5→\u003cstrong\u003e18.9로 하락\u003c/strong\u003e. 같은 날 미국은 공포가 가라앉았는데 한국만 급락 — \u003cstrong\u003e한국 고유 리스크\u003c/strong\u003e 신호.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 가이드 에이전트 — 5단계 분석 프레임워크\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"'에이전트'란 거창한 게 아니다. \u003cstrong\u003e매번 같은 순서로 판단하는 체계\u003c/strong\u003e다. 감정을 빼는 거지. 오늘처럼 틀린 다음 날일수록 더 필요해.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e① 시황 파악   → 금리·환율·지수 + '왜 빠졌나' (위 표)\r\n② 스크리닝    → 객관적 조건으로 후보 거르기 (아래 \u003cspan class=\"hljs-number\"\u003e3\u003c/span\u003e장)\r\n③ 검증       → 왜 싼지/좋은지 재무·사업 확인 (재무편)\r\n④ 매수 계획   → \u003cspan class=\"hljs-number\"\u003e2%\u003c/span\u003e 룰·분할매수로 금액 산정 (아래 \u003cspan class=\"hljs-number\"\u003e5\u003c/span\u003e장)\r\n⑤ 기록·관리   → 손절선·매도조건 + 다음에 복기 (\u003cspan class=\"hljs-number\"\u003e0\u003c/span\u003e장처럼!)\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 오늘의 객관적 스크리닝 (참고용 — 추천 아님)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"25개 대형주를 \u003cstrong\u003e오늘(06-08) 수치\u003c/strong\u003e로 다시 걸러봤다. 어제 틀렸다고 스크린을 버리는 게 아니야 — \u003cstrong\u003e조건은 유지하되, 결과를 의심하며\u003c/strong\u003e 쓰는 거다. 사라는 게 절대 아니다.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/kr_per_roe_map.png\" alt=\"국장 PER-ROE 지도\"\u003e\u003c/p\u003e\n\u003ch3\u003e조건 A: 저PER(\u0026#x3C;12) + 저PBR(\u0026#x3C;1.2) — 가치주 후보\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003ePBR\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003e⚠️ 검증 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국전력\u003c/td\u003e\n\u003ctd\u003e2.65\u003c/td\u003e\n\u003ctd\u003e0.46\u003c/td\u003e\n\u003ctd\u003e18.7%\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e규제 산업·막대한 부채\u003c/strong\u003e. 싼 데는 이유가\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e우리금융\u003c/td\u003e\n\u003ctd\u003e6.83\u003c/td\u003e\n\u003ctd\u003e0.59\u003c/td\u003e\n\u003ctd\u003e8.5%\u003c/td\u003e\n\u003ctd\u003e은행. 어제 −7.5% (은행 약세 주도)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e하나금융\u003c/td\u003e\n\u003ctd\u003e7.97\u003c/td\u003e\n\u003ctd\u003e0.68\u003c/td\u003e\n\u003ctd\u003e9.1%\u003c/td\u003e\n\u003ctd\u003e은행. 어제 −9.1%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e기아\u003c/td\u003e\n\u003ctd\u003e8.52\u003c/td\u003e\n\u003ctd\u003e0.95\u003c/td\u003e\n\u003ctd\u003e11.9%\u003c/td\u003e\n\u003ctd\u003e자동차 경기민감\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e신한지주\u003c/td\u003e\n\u003ctd\u003e9.63\u003c/td\u003e\n\u003ctd\u003e0.80\u003c/td\u003e\n\u003ctd\u003e8.6%\u003c/td\u003e\n\u003ctd\u003e은행. 어제 −9.7% (추격 자제가 옳았음)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKB금융\u003c/td\u003e\n\u003ctd\u003e10.02\u003c/td\u003e\n\u003ctd\u003e0.92\u003c/td\u003e\n\u003ctd\u003e10.0%\u003c/td\u003e\n\u003ctd\u003e은행. 어제 −11.7%\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"은행이 잔뜩 또 걸렸지? 더 빠져서 \u003cstrong\u003ePER가 더 낮아졌으니\u003c/strong\u003e 당연하다. 하지만 **'어제 제일 많이 빠진 게 은행'**이라는 사실을 같이 봐라. 스크린이 '싸다'고 말해도, 왜 매도가 은행에 몰렸는지 ③검증 없이는 손대면 안 돼.\"\u003c/p\u003e\n\u003ch3\u003e조건 B: 고ROE(≥12%) + PER\u0026#x3C;25 — 우량주 후보\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003ePBR\u003c/th\u003e\n\u003cth\u003e⚠️ 검증 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eSK하이닉스\u003c/td\u003e\n\u003ctd\u003e61.2%\u003c/td\u003e\n\u003ctd\u003e18.46\u003c/td\u003e\n\u003ctd\u003e8.04\u003c/td\u003e\n\u003ctd\u003e반도체 \u003cstrong\u003e호황 정점 주의\u003c/strong\u003e. PBR 8배로 비쌈\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e삼성전자\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e18.9%\u003c/td\u003e\n\u003ctd\u003e23.88\u003c/td\u003e\n\u003ctd\u003e4.11\u003c/td\u003e\n\u003ctd\u003e어제 −10% 빠지며 \u003cstrong\u003ePER\u0026#x3C;25로 진입\u003c/strong\u003e(신규 후보)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e한국전력\u003c/td\u003e\n\u003ctd\u003e18.7%\u003c/td\u003e\n\u003ctd\u003e2.65\u003c/td\u003e\n\u003ctd\u003e0.46\u003c/td\u003e\n\u003ctd\u003e부채·규제 리스크\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKT\u0026#x26;G\u003c/td\u003e\n\u003ctd\u003e13.2%\u003c/td\u003e\n\u003ctd\u003e17.45\u003c/td\u003e\n\u003ctd\u003e1.98\u003c/td\u003e\n\u003ctd\u003e어제 −1.2%, \u003cstrong\u003e이번 폭락의 진짜 방어주\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"어제와 달라진 점이 보이냐? \u003cstrong\u003e삼성전자가 −10% 빠지면서 우량 후보로 새로 들어왔다.\u003c/strong\u003e 가격이 내려가면 PER도 내려가니까. 이래서 \u003cstrong\u003e같은 종목도 매일 자리가 바뀐다.\u003c/strong\u003e 그리고 KT\u0026#x26;G — 말로만 '방어주'가 아니라 \u003cstrong\u003e−1.2%로 진짜 증명\u003c/strong\u003e했지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 같은 시황을 두 관점으로\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"이틀 연속 −8%씩 빠졌는데, 지금 뭘 해야 정답이에요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"정답은 없다. \u003cstrong\u003e관점\u003c/strong\u003e이 있을 뿐이야. 특히 어제 우리가 틀렸으니 더 겸손하게.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e역발상 관점\u003c/strong\u003e: 이틀 −16% 급락으로 \u003cstrong\u003e진짜 싸진\u003c/strong\u003e 우량주가 생겼나? 단, 국장만 빠진 이유(③검증)를 모르면 '떨어지는 칼날'일 수 있다\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e방어 관점\u003c/strong\u003e: 원인 불명의 국지적 급락 → \u003cstrong\u003e현금 비중↑ + 아주 잘게 분할\u003c/strong\u003e. 'KT\u0026#x26;G형' 경기·금리 무관 사업 위주\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e관망 관점\u003c/strong\u003e: 디커플링의 원인이 안 밝혀졌으면 \u003cstrong\u003e사지 않는 것도 전략\u003c/strong\u003e이다. 모를 땐 쉬어라\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"어느 관점이든 \u003cstrong\u003e②③④⑤를 거쳐 스스로 결론\u003c/strong\u003e내라. 어제 은행에서 데인 걸 기억해 — \u003cstrong\u003e'싸 보인다'는 이유 하나로 사면 또 당한다.\u003c/strong\u003e\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 매수 계획 세우는 법 (예시 — 특정 종목 아님)\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"네가 검증을 마치고 종목 X를 사기로 했다 치자. \u003cstrong\u003e얼마를, 어떻게\u003c/strong\u003e 살지는 이렇게 계산한다. 원인 불명 급락장일수록 \u003cstrong\u003e분할이 생명\u003c/strong\u003e이야.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e전제\u003c/strong\u003e: 투자금 1,000만원, 한 거래 최대손실 2% 룰(=20만원), 손절선 −10%\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e한 종목 최대 매수액\u003c/strong\u003e = 20만 ÷ 0.10 = \u003cstrong\u003e200만원\u003c/strong\u003e (전체의 20%)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e분할 매수\u003c/strong\u003e: 200만을 4~5회로 더 잘게 → 이런 변동성엔 한 번에 들어가지 않는다\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e손절선\u003c/strong\u003e: 평균단가 −10% 도달 시 \u003cstrong\u003e기계적 매도\u003c/strong\u003e (어제 은행처럼 '믿었던 종목'도 예외 없이)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e목표·매도조건\u003c/strong\u003e: 산 이유가 깨지면 매도\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e기록·복기\u003c/strong\u003e: 산 이유·손절가를 매매일지에 → 다음 특별편처럼 \u003cstrong\u003e반드시 복기\u003c/strong\u003e(틀려도!)\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"봤지? \u003cstrong\u003e금액은 종목이 아니라 '내 위험 한도'에서 나온다.\u003c/strong\u003e 어제처럼 틀릴 수 있으니 \u003cstrong\u003e한 방 베팅은 절대 금지\u003c/strong\u003e다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. AI 튜터를 에이전트로 쓰기\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"왜 국장만 빠졌는지 더 알고 싶어요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"문제 풀이 화면의 \u003cstrong\u003eAI 튜터\u003c/strong\u003e(로컬 LLM)에게 '한국 증시만 미국과 디커플링되는 이유에 어떤 게 있나' 같은 \u003cstrong\u003e개념·해석 질문\u003c/strong\u003e을 던져봐라. 단, 튜터도 \u003cstrong\u003e그날의 진짜 원인이나 미래는 모른다.\u003c/strong\u003e 판단은 늘 네 몫이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 06-06의 '은행·배당주 견딜 만' 콜은 이번(06-05→06-08)에 맞았나?\r\n→ \u003cstrong\u003e아니다.\u003c/strong\u003e 은행 후보가 −8~−12%로 오히려 하락을 주도. \u003cstrong\u003e같은 도구도 시장 성격이 바뀌면 빗나간다 — 자만 금지.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 주가 −8%인데 환율이 내리고(원화 강세) 미국은 반등한 날, 이 하락의 성격은?\r\n→ 글로벌 매크로 충격이 아니라 \u003cstrong\u003e한국 증시 고유의 매물(디커플링)\u003c/strong\u003e. 매크로 표만으론 못 읽는다.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 삼성전자가 어제 우량 스크린에 새로 들어온 이유는?\r\n→ 주가가 −10% 빠지며 \u003cstrong\u003ePER가 25 아래로\u003c/strong\u003e 내려왔기 때문. 가격이 변하면 종목의 자리도 바뀐다.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🔄 이 특별편을 최신으로\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"이 수치는 06-08 것이다. 같은 방법(\u003ccode\u003e.tmp/refresh_kr_special_0608.py\u003c/code\u003e 식으로 재실행)으로 \u003cstrong\u003e최신 데이터 갱신 + 지난 편 자동 복기\u003c/strong\u003e가 된다. 중요한 건 숫자가 아니라 \u003cstrong\u003e'시황 읽기 → 스크리닝 → 검증 → 계획 → 복기'의 순환\u003c/strong\u003e이다. 그리고 오늘 배운 것 — \u003cstrong\u003e틀린 날의 복기가 제일 값지다.\u003c/strong\u003e\"\u003c/p\u003e\n\u003chr\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003e면책\u003c/strong\u003e: 본 자료는 교육 목적이며 투자 권유·종목 추천이 아닙니다. 복기 수익률은 약 1~3거래일의 매우 짧은 표본으로, 방법의 우열을 증명하지 않습니다(이번 편이 그 증거 — 직전엔 맞고 이번엔 틀림). 스크리닝 결과는 객관적 조건 통과일 뿐 매수 신호가 아닙니다. 모든 투자 판단과 책임은 투자자 본인에게 있습니다. 데이터는 2026-06-08 기준이며 실제와 차이가 있을 수 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-17\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🔥 [특별편] 오늘의 국장 시황 \u0026 분석 가이드 (2026-06-08 기준)\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\
