 특별편은 2026-06-06 기준 실제 데이터(yfinance)로 만든 학습 자료입니다. 특정 종목 매수 추천이 아니며, 미래 수익을 보장하지 않습니다. 미장은 양도세·환율이 추가로 붙으니 실수익은 더 줄어듭니다. 모든 수치는 매일 변하니 직접 확인하세요. 투자 책임은 본인에게 있습니다.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 오늘의 시황 (실데이터)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e값 (2026-06-06)\u003c/th\u003e\n\u003cth\u003e전일대비\u003c/th\u003e\n\u003cth\u003e읽는 법\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eS\u0026#x26;P 500\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e7,383.74\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−2.64%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e미국 대형주 500\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e나스닥\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e25,709.43\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−4.18%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e기술·성장주 (오늘 급락)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e다우\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e50,866.78\u003c/td\u003e\n\u003ctd\u003e−1.35%\u003c/td\u003e\n\u003ctd\u003e전통 대형주 (상대적 선방)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eVIX (공포지수)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e21.51\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+39.68%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e급등 → 시장 공포↑\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e미국 10년물 금리\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e4.54%\u003c/td\u003e\n\u003ctd\u003e+1.32%\u003c/td\u003e\n\u003ctd\u003e높음 → 성장주에 부담\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e달러인덱스(DXY)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e100.07\u003c/td\u003e\n\u003ctd\u003e+0.66%\u003c/td\u003e\n\u003ctd\u003e달러 강세 → 환전 부담\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"나스닥이 −4%가 넘고 VIX가 40%나 뛰었어요! 다 팔아야 하나요?!\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"워워. \u003cstrong\u003e시황을 읽어봐.\u003c/strong\u003e 오늘은 ①금리 4.54%로 높고 ②나스닥(기술주)이 다우보다 훨씬 더 빠졌어. 이건 **'고금리에 눌린 성장주 중심 매도'**라는 뜻이야. VIX 급등은 공포가 커졌다는 거고. 이런 날 **defensive(생필품·통신)**가 덜 빠지고, \u003cstrong\u003e빚 많고 PER 높은 기술주\u003c/strong\u003e가 더 빠져. 이게 '읽는다'는 거다. 예측이 아니라 \u003cstrong\u003e현재 조건 파악\u003c/strong\u003e.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 가이드 에이전트 — 5단계 분석 프레임워크 (국장과 동일)\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"'에이전트'는 거창한 게 아냐. \u003cstrong\u003e매번 같은 순서로 판단하는 체계\u003c/strong\u003e지. 감정을 빼는 거야. 빨간 날일수록 더 필요해.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e① 시황 파악   → 금리·VIX·지수 (위 표)\r\n② 스크리닝    → 객관적 조건으로 후보 거르기 (아래 \u003cspan class=\"hljs-number\"\u003e3\u003c/span\u003e장)\r\n③ 검증       → 왜 싼지/좋은지 재무·사업 확인 (재무편)\r\n④ 매수 계획   → \u003cspan class=\"hljs-number\"\u003e2%\u003c/span\u003e 룰·분할매수 + 환율·세금 (아래 \u003cspan class=\"hljs-number\"\u003e5\u003c/span\u003e장)\r\n⑤ 기록·관리   → 손절선·매도조건 적어두고 지키기 (실전편)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"특히 미장은 ④에 \u003cstrong\u003e환전·양도세\u003c/strong\u003e가 끼어든다. 국장보다 한 겹 더 복잡해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 오늘의 객관적 스크리닝 (참고용 — 추천 아님)\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"미국 대형주 30개를 \u003cstrong\u003e기계적 조건\u003c/strong\u003e으로 걸러봤어. 이건 '관심 후보'일 뿐, \u003cstrong\u003e사라는 게 절대 아냐.\u003c/strong\u003e 왜 그 조건에 걸렸는지 직접 검증해야 해.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/per_trailing_forward_us.png\" alt=\"미장 PER 추세\"\u003e\u003c/p\u003e\n\u003ch3\u003e조건 A: 저PER(\u0026#x3C;18) + 저PBR(\u0026#x3C;3) — 가치주 후보\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003e선행PER\u003c/th\u003e\n\u003cth\u003ePBR\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003e⚠️ 검증 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eVerizon\u003c/td\u003e\n\u003ctd\u003e11.07\u003c/td\u003e\n\u003ctd\u003e8.61\u003c/td\u003e\n\u003ctd\u003e1.83\u003c/td\u003e\n\u003ctd\u003e17.2%\u003c/td\u003e\n\u003ctd\u003e통신, 고배당. \u003cstrong\u003e부채 많고 저성장\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWells Fargo\u003c/td\u003e\n\u003ctd\u003e12.66\u003c/td\u003e\n\u003ctd\u003e10.37\u003c/td\u003e\n\u003ctd\u003e1.54\u003c/td\u003e\n\u003ctd\u003e12.0%\u003c/td\u003e\n\u003ctd\u003e은행. 금리·경기 민감\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBank of America\u003c/td\u003e\n\u003ctd\u003e13.36\u003c/td\u003e\n\u003ctd\u003e10.66\u003c/td\u003e\n\u003ctd\u003e1.39\u003c/td\u003e\n\u003ctd\u003e10.6%\u003c/td\u003e\n\u003ctd\u003e은행\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJPMorgan\u003c/td\u003e\n\u003ctd\u003e14.95\u003c/td\u003e\n\u003ctd\u003e13.26\u003c/td\u003e\n\u003ctd\u003e2.43\u003c/td\u003e\n\u003ctd\u003e16.5%\u003c/td\u003e\n\u003ctd\u003e미국 1등 은행. 상대적 우량\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDisney\u003c/td\u003e\n\u003ctd\u003e15.95\u003c/td\u003e\n\u003ctd\u003e13.31\u003c/td\u003e\n\u003ctd\u003e1.60\u003c/td\u003e\n\u003ctd\u003e11.0%\u003c/td\u003e\n\u003ctd\u003e미디어. 스트리밍 전환 비용\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e조건 B: 고ROE(≥25%) + PER\u0026#x3C;40 — 우량주 후보\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003e선행PER\u003c/th\u003e\n\u003cth\u003e⚠️ 검증 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eMastercard\u003c/td\u003e\n\u003ctd\u003e232.1%\u003c/td\u003e\n\u003ctd\u003e28.4\u003c/td\u003e\n\u003ctd\u003e21.6\u003c/td\u003e\n\u003ctd\u003eROE가 비정상적으로 높음 → \u003cstrong\u003e자사주 매입\u003c/strong\u003e으로 자본 축소 효과\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eApple\u003c/td\u003e\n\u003ctd\u003e141.5%\u003c/td\u003e\n\u003ctd\u003e37.2\u003c/td\u003e\n\u003ctd\u003e32.0\u003c/td\u003e\n\u003ctd\u003e막대한 자사주 매입. PBR 42로 비쌈\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHome Depot\u003c/td\u003e\n\u003ctd\u003e128.4%\u003c/td\u003e\n\u003ctd\u003e22.1\u003c/td\u003e\n\u003ctd\u003e19.3\u003c/td\u003e\n\u003ctd\u003e역시 자사주. 경기소비재\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNVIDIA\u003c/td\u003e\n\u003ctd\u003e114.3%\u003c/td\u003e\n\u003ctd\u003e31.5\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e16.2\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e선행PER 반토막 → \u003cstrong\u003e시장이 이익 급성장 기대\u003c/strong\u003e (사이클 주의)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVisa\u003c/td\u003e\n\u003ctd\u003e60.3%\u003c/td\u003e\n\u003ctd\u003e28.3\u003c/td\u003e\n\u003ctd\u003e21.8\u003c/td\u003e\n\u003ctd\u003e결제 과점. 꾸준한 고ROE\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"Mastercard ROE가 232%? 말이 돼요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"바로 그거야. \u003cstrong\u003e미장의 함정.\u003c/strong\u003e 미국 우량주는 \u003cstrong\u003e자사주를 엄청 사서 소각\u003c/strong\u003e해. 그러면 분모(자기자본)가 쪼그라들어 ROE가 폭등하지. Mastercard PBR이 64배인 거 봐 — 장부가가 거의 없어. \u003cstrong\u003e'ROE 높다=무조건 좋다'가 아니라, 자사주·부채 때문인지 ③검증\u003c/strong\u003e해야 해. 국장이랑 다른 점이지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 같은 시황을 두 관점으로\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"그래서 오늘 급락에 뭘 사요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"정답은 없어. \u003cstrong\u003e관점\u003c/strong\u003e이 있을 뿐이야.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e가치 관점\u003c/strong\u003e: 고금리엔 은행·통신이 견딜 만 → 단, 디스카운트가 풀릴 촉매가 있나?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e성장 관점\u003c/strong\u003e: NVIDIA처럼 선행PER이 확 낮으면 '이익 성장 기대' → 단, 기대가 깨지면 급락 (오늘 같은 날)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e방어 관점\u003c/strong\u003e: VIX 급등·불확실하면 \u003cstrong\u003e현금 비중↑ + S\u0026#x26;P500 ETF(VOO/SPY) 적립\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"어느 관점이든 \u003cstrong\u003e②③④⑤를 거쳐 스스로 결론\u003c/strong\u003e내. 빨간 날 패닉셀이나 '존버'나, 둘 다 계획 없으면 도박이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 매수 계획 세우는 법 (예시 — 특정 종목 아님)\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"네가 검증을 마치고 어떤 종목 X를 사기로 했다 치자. \u003cstrong\u003e얼마를, 어떻게\u003c/strong\u003e 살지는 이렇게 계산해. 미장은 여기에 \u003cstrong\u003e환율·세금\u003c/strong\u003e이 붙어.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e전제\u003c/strong\u003e: 투자금 $10,000, 한 거래 최대손실 2% 룰(=$200), 손절선 −10%\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e한 종목 최대 매수액\u003c/strong\u003e = $200 ÷ 0.10 = \u003cstrong\u003e$2,000\u003c/strong\u003e (전체의 20%)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e분할 매수\u003c/strong\u003e: $2,000을 3회로 → 1차 $700, 2차 $700, 3차 $600 (빠지면 추가)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e손절선\u003c/strong\u003e: 평균단가 −10% 도달 시 \u003cstrong\u003e기계적 매도\u003c/strong\u003e (미리 못박기)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e환율 체크\u003c/strong\u003e: 오늘 DXY 100·원달러 강세면 환전 비용↑ → 분할 환전 고려\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e세금\u003c/strong\u003e: 미장 매매차익은 \u003cstrong\u003e양도세 22%\u003c/strong\u003e(연 250만원 공제). 실수익 = 명목수익 × 0.78 (공제 후)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e기록\u003c/strong\u003e: 산 이유·손절가·목표가·환율을 매매일지에\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"봤지? \u003cstrong\u003e금액은 종목이 아니라 '내 위험 한도'에서 나와.\u003c/strong\u003e 그리고 미장은 환율·세금 빼고 진짜 수익을 계산해야 해. 'NVDA 올인' 같은 건 가이드가 아니라 도박 부추김이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. AI 튜터를 에이전트로 쓰기\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"더 궁금하면요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"문제 풀이 화면의 \u003cstrong\u003eAI 튜터\u003c/strong\u003e(로컬 LLM)에게 물어봐. 'NVIDIA 선행PER이 왜 후행보다 낮은지 설명해줘' 같은 \u003cstrong\u003e개념·해석 질문\u003c/strong\u003e에 답해줄 거야. 단, 튜터도 \u003cstrong\u003e미래 예측은 못 해.\u003c/strong\u003e 판단은 늘 네 몫이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 나스닥이 다우보다 더 크게 빠지고 금리가 높은 날, 이 매도의 성격은?\r\n→ \u003cstrong\u003e고금리에 눌린 성장·기술주 중심 매도\u003c/strong\u003e. 빚 많고 PER 높은 종목이 더 약함\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e Mastercard ROE가 232%인데 그대로 '초우량'이라 믿으면 안 되는 이유는?\r\n→ \u003cstrong\u003e자사주 매입으로 자기자본(분모)이 축소\u003c/strong\u003e된 효과. PBR 64배가 증거 → 직접 검증 필수\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 미장에서 명목수익 100만원이 났을 때 손에 쥐는 실수익에 영향을 주는 두 가지는?\r\n→ \u003cstrong\u003e환율\u003c/strong\u003e(환전 손익)과 \u003cstrong\u003e양도세 22%\u003c/strong\u003e(250만원 공제 후)\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🔄 이 특별편을 최신으로\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"이 수치는 2026-06-06 거야. 시간이 지나면 낡아. 같은 방법(\u003ccode\u003e.tmp/fetch_us_special.py\u003c/code\u003e 재실행)으로 \u003cstrong\u003e최신 데이터로 갱신\u003c/strong\u003e할 수 있어. 중요한 건 숫자가 아니라 \u003cstrong\u003e'시황 읽기 → 스크리닝 → 검증 → 계획(+환율·세금)'의 순서\u003c/strong\u003e야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003e면책\u003c/strong\u003e: 본 자료는 교육 목적이며 투자 권유·종목 추천이 아닙니다. 스크리닝 결과는 객관적 조건 통과일 뿐 매수 신호가 아닙니다. 미장은 양도세·환율로 실수익이 달라집니다. 모든 투자 판단과 책임은 투자자 본인에게 있습니다. 데이터는 2026-06-06 기준이며 실제와 차이가 있을 수 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-16\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🔥 [특별편] 오늘의 미장 시황 \u0026 분석 가이드 (2026-06-06 기준)\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"🔥 [특별편] 오늘의 미장 시황 \u0026 분석 가이드 (2026-06-06 기준) | midasworld (Private)\"}],[\"$\",\"meta\",\"1\",{\"
