 \u003cstrong\u003e본 특별편은 2026-06-08 기준 실제 데이터(yfinance)로 만든 학습 자료입니다. 특정 종목 매수 추천이 아니며, 미래 수익을 보장하지 않습니다. 미장은 양도세·환율이 추가로 붙으니 실수익은 더 줄어듭니다. 모든 수치는 매일 변하니 직접 확인하세요. 투자 책임은 본인에게 있습니다.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e0. 지난 편(06-06) 복기 — 첫 검증: 패닉은 가라앉았다\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"06-06은 \u003cstrong\u003e빨간 날\u003c/strong\u003e이었지 — 나스닥 −4.2%, VIX가 하루 만에 +40% 튀어 21.5까지. 그때 내가 뭐랬어? \u003cstrong\u003e'패닉셀 하지 마라, 시황을 먼저 읽어라'\u003c/strong\u003e. 그 뒤 06-08까지 어떻게 됐나 보자.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e06-05 → 06-08 실제 수익률 (그 사이 S\u0026#x26;P +0.55%, VIX 21.5 → 18.9)\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e06-06 분류\u003c/th\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003e수익률\u003c/th\u003e\n\u003cth\u003e평가\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e가치 후보(은행)\u003c/td\u003e\n\u003ctd\u003eBank of America\u003c/td\u003e\n\u003ctd\u003e+0.6%\u003c/td\u003e\n\u003ctd\u003e보합\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e가치 후보(은행)\u003c/td\u003e\n\u003ctd\u003eJPMorgan\u003c/td\u003e\n\u003ctd\u003e+0.2%\u003c/td\u003e\n\u003ctd\u003e보합\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e가치 후보(은행)\u003c/td\u003e\n\u003ctd\u003eWells Fargo\u003c/td\u003e\n\u003ctd\u003e+0.1%\u003c/td\u003e\n\u003ctd\u003e보합\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e가치 후보(통신)\u003c/td\u003e\n\u003ctd\u003eVerizon\u003c/td\u003e\n\u003ctd\u003e−0.5%\u003c/td\u003e\n\u003ctd\u003e보합\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e우량 후보\u003c/td\u003e\n\u003ctd\u003eApple\u003c/td\u003e\n\u003ctd\u003e+1.0%\u003c/td\u003e\n\u003ctd\u003e소폭 반등\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e우량 후보\u003c/td\u003e\n\u003ctd\u003eNVIDIA\u003c/td\u003e\n\u003ctd\u003e+0.8%\u003c/td\u003e\n\u003ctd\u003e소폭 반등\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e우량 후보\u003c/td\u003e\n\u003ctd\u003eAlphabet\u003c/td\u003e\n\u003ctd\u003e−2.1%\u003c/td\u003e\n\u003ctd\u003e약세\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e반도체(비후보)\u003c/td\u003e\n\u003ctd\u003eIntel\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+8.3%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e급반등\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e반도체(비후보)\u003c/td\u003e\n\u003ctd\u003eAMD\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+3.8%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e반등\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e그룹 평균: 가치 후보 +0.04% · 우량 후보 −0.21% · S\u0026#x26;P500 +0.55% (VIX −12%)\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"어… 거의 다 보합이네요? 06-06에 그렇게 무서웠는데 이틀 만에 잠잠해졌어요. 패닉셀 했으면 손해 봤겠다.\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"그게 핵심이야. \u003cstrong\u003eVIX +40% 같은 공포 급등은 종종 단기에 되돌려져.\u003c/strong\u003e 06-06에 다 던졌으면 바닥에 팔고 반등을 놓쳤겠지. 그렇다고 **'공포 땐 무조건 사라'**는 것도 아니야 — 이번엔 마침 되돌려졌을 뿐. 배울 건 하나다.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e🧠 \u003cstrong\u003e복기에서 배울 점\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e공포지수(VIX) 급등 ≠ 즉시 매도 신호.\u003c/strong\u003e 단기 공포는 자주 과장되고 되돌려진다. 그날 패닉셀이 가장 나쁜 선택일 때가 많다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e3거래일 보합은 '아무 일도 없었다'가 아니다.\u003c/strong\u003e 표본이 짧다. 가치·우량 스크린의 우열을 가리기엔 변동이 너무 작았다 — \u003cstrong\u003e결론 보류\u003c/strong\u003e가 정직하다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e진짜 움직인 건 스크린 밖이었다.\u003c/strong\u003e Intel +8%, AMD +4% — 06-06에 제일 많이 빠졌던 반도체가 제일 크게 튀었다. \u003cstrong\u003e빠진 게 튄다\u003c/strong\u003e(평균회귀)는 흔한 단기 패턴.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 오늘의 시황 (실데이터)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e값 (2026-06-08)\u003c/th\u003e\n\u003cth\u003e전일대비\u003c/th\u003e\n\u003cth\u003e읽는 법\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eS\u0026#x26;P 500\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e7,424.01\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+0.55%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e미국 대형주 (반등)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e나스닥\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e25,933.94\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e+0.87%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e기술·성장주 (반등 주도)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e다우\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e50,990.09\u003c/td\u003e\n\u003ctd\u003e+0.24%\u003c/td\u003e\n\u003ctd\u003e전통 대형주\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eVIX (공포지수)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e18.94\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e−11.95%\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e급락 → 공포 진정\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e미국 10년물 금리\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e4.54%\u003c/td\u003e\n\u003ctd\u003e0.00%\u003c/td\u003e\n\u003ctd\u003e변동 없음\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e달러인덱스(DXY)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e99.93\u003c/td\u003e\n\u003ctd\u003e−0.14%\u003c/td\u003e\n\u003ctd\u003e소폭 약세\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"미국은 다 초록색이고 공포도 가라앉았어요. 근데 같은 날 한국은 −8%였다면서요?!\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"맞아. \u003cstrong\u003e오늘의 진짜 이야기는 디커플링\u003c/strong\u003e이야. 06-06엔 미국·한국이 같이 빠졌어(글로벌 risk-off). 그런데 06-08엔 \u003cstrong\u003e미국은 회복(VIX 18.9로 진정), 한국만 −8.3% 단독 폭락\u003c/strong\u003e. 게다가 원/달러는 오히려 내렸어(원화 강세). 이건 \u003cstrong\u003e'글로벌 충격'이 아니라 한국 고유 문제\u003c/strong\u003e라는 신호야. 미장 투자자한테도 중요해 — \u003cstrong\u003e'한국이 빠지니 미국도 위험'이라는 단순 연결이 틀릴 때가 있다\u003c/strong\u003e는 거지.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📌 \u003cstrong\u003e디커플링 읽기\u003c/strong\u003e: 한 나라만 지수가 크게 벗어나면, 글로벌 매크로(금리·달러)보다 \u003cstrong\u003e그 나라 고유 요인\u003c/strong\u003e(수급·정책·섹터)을 의심하라. 06-08 미국 VIX 하락 + 한국 단독 급락이 교과서적 사례.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 가이드 에이전트 — 5단계 분석 프레임워크 (국장과 동일)\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"'에이전트'는 거창한 게 아냐. \u003cstrong\u003e매번 같은 순서로 판단하는 체계\u003c/strong\u003e지. 감정을 빼는 거야. 어제 패닉, 오늘 반등 — 이런 변동에 휘둘리지 않으려고 쓰는 거다.\"\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e① 시황 파악   → 금리·VIX·지수 + 디커플링 여부 (위 표)\r\n② 스크리닝    → 객관적 조건으로 후보 거르기 (아래 \u003cspan class=\"hljs-number\"\u003e3\u003c/span\u003e장)\r\n③ 검증       → 왜 싼지/좋은지 재무·사업 확인 (재무편)\r\n④ 매수 계획   → \u003cspan class=\"hljs-number\"\u003e2%\u003c/span\u003e 룰·분할매수 + 환율·세금 (아래 \u003cspan class=\"hljs-number\"\u003e5\u003c/span\u003e장)\r\n⑤ 기록·관리   → 손절선·매도조건 적어두고 복기 (\u003cspan class=\"hljs-number\"\u003e0\u003c/span\u003e장처럼!)\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 오늘의 객관적 스크리닝 (참고용 — 추천 아님)\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"미국 대형주 30개를 \u003cstrong\u003e오늘(06-08) 조건\u003c/strong\u003e으로 다시 걸러봤어. '관심 후보'일 뿐, \u003cstrong\u003e사라는 게 절대 아냐.\u003c/strong\u003e 왜 걸렸는지 직접 검증해.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/per_trailing_forward_us.png\" alt=\"미장 PER 추세\"\u003e\u003c/p\u003e\n\u003ch3\u003e조건 A: 저PER(\u0026#x3C;18) + 저PBR(\u0026#x3C;3) — 가치주 후보\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003e선행PER\u003c/th\u003e\n\u003cth\u003ePBR\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003e⚠️ 검증 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eVerizon\u003c/td\u003e\n\u003ctd\u003e11.02\u003c/td\u003e\n\u003ctd\u003e8.57\u003c/td\u003e\n\u003ctd\u003e1.82\u003c/td\u003e\n\u003ctd\u003e17.2%\u003c/td\u003e\n\u003ctd\u003e통신, 고배당. \u003cstrong\u003e부채 많고 저성장\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWells Fargo\u003c/td\u003e\n\u003ctd\u003e12.67\u003c/td\u003e\n\u003ctd\u003e10.38\u003c/td\u003e\n\u003ctd\u003e1.54\u003c/td\u003e\n\u003ctd\u003e12.0%\u003c/td\u003e\n\u003ctd\u003e은행. 금리·경기 민감\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBank of America\u003c/td\u003e\n\u003ctd\u003e13.44\u003c/td\u003e\n\u003ctd\u003e10.73\u003c/td\u003e\n\u003ctd\u003e1.40\u003c/td\u003e\n\u003ctd\u003e10.6%\u003c/td\u003e\n\u003ctd\u003e은행\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJPMorgan\u003c/td\u003e\n\u003ctd\u003e14.97\u003c/td\u003e\n\u003ctd\u003e13.29\u003c/td\u003e\n\u003ctd\u003e2.44\u003c/td\u003e\n\u003ctd\u003e16.5%\u003c/td\u003e\n\u003ctd\u003e미국 1등 은행. 상대적 우량\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDisney\u003c/td\u003e\n\u003ctd\u003e15.92\u003c/td\u003e\n\u003ctd\u003e13.28\u003c/td\u003e\n\u003ctd\u003e1.60\u003c/td\u003e\n\u003ctd\u003e11.0%\u003c/td\u003e\n\u003ctd\u003e미디어. 스트리밍 전환 비용\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e조건 B: 고ROE(≥25%) + PER\u0026#x3C;40 — 우량주 후보\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e종목\u003c/th\u003e\n\u003cth\u003eROE\u003c/th\u003e\n\u003cth\u003ePER\u003c/th\u003e\n\u003cth\u003e선행PER\u003c/th\u003e\n\u003cth\u003e⚠️ 검증 포인트\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eMastercard\u003c/td\u003e\n\u003ctd\u003e232.1%\u003c/td\u003e\n\u003ctd\u003e28.2\u003c/td\u003e\n\u003ctd\u003e21.4\u003c/td\u003e\n\u003ctd\u003eROE 비정상적 → \u003cstrong\u003e자사주 매입\u003c/strong\u003e으로 자본 축소 (PBR 64배!)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eApple\u003c/td\u003e\n\u003ctd\u003e141.5%\u003c/td\u003e\n\u003ctd\u003e37.5\u003c/td\u003e\n\u003ctd\u003e32.3\u003c/td\u003e\n\u003ctd\u003e막대한 자사주. PBR 43으로 비쌈\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHome Depot\u003c/td\u003e\n\u003ctd\u003e128.4%\u003c/td\u003e\n\u003ctd\u003e22.2\u003c/td\u003e\n\u003ctd\u003e19.4\u003c/td\u003e\n\u003ctd\u003e자사주. 경기소비재\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNVIDIA\u003c/td\u003e\n\u003ctd\u003e114.3%\u003c/td\u003e\n\u003ctd\u003e31.7\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e16.3\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e선행PER 반토막 → \u003cstrong\u003e이익 급성장 기대\u003c/strong\u003e(사이클 주의)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVisa\u003c/td\u003e\n\u003ctd\u003e60.3%\u003c/td\u003e\n\u003ctd\u003e28.0\u003c/td\u003e\n\u003ctd\u003e21.6\u003c/td\u003e\n\u003ctd\u003e결제 과점. 꾸준한 고ROE\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"후보가 06-06이랑 거의 똑같아요. Mastercard ROE 232%도 그대로네요.\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"그래, 이틀 보합이라 밸류에이션이 거의 안 변했어. 그러니 \u003cstrong\u003e함정도 그대로\u003c/strong\u003e야 — Mastercard PBR 64배는 \u003cstrong\u003e자사주로 자기자본(분모)을 깎아 ROE가 폭등\u003c/strong\u003e한 거지, '232% 초우량'이 아니야. \u003cstrong\u003e'ROE 높다=좋다'가 아니라 왜 높은지 ③검증.\u003c/strong\u003e 이건 국장이랑 다른 미장 특유의 함정이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 같은 시황을 두 관점으로\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"미국은 반등했는데, 지금 들어가요 말아요?\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"정답은 없어. \u003cstrong\u003e관점\u003c/strong\u003e이 있을 뿐이야.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e반등 추종 관점\u003c/strong\u003e: VIX 진정·지수 회복 → 위험선호 복귀? 단, \u003cstrong\u003e이틀 반등에 추격\u003c/strong\u003e하다 다시 빠지면 당한다\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e디커플링 관점\u003c/strong\u003e: 한국發 리스크가 미국으로 옮겨올 가능성은? → 글로벌 비중·노출 점검 (단정 금지, 확인)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e방어 관점\u003c/strong\u003e: 여전히 불확실하면 \u003cstrong\u003e현금 + S\u0026#x26;P500 ETF(VOO/SPY) 적립\u003c/strong\u003e으로 개별주 리스크 회피\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"어느 관점이든 \u003cstrong\u003e②③④⑤를 거쳐 스스로 결론\u003c/strong\u003e내. 어제 패닉셀도, 오늘 반등 추격도, 계획 없으면 둘 다 도박이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 매수 계획 세우는 법 (예시 — 특정 종목 아님)\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"검증을 마치고 종목 X를 사기로 했다 치자. \u003cstrong\u003e얼마를, 어떻게\u003c/strong\u003e 살지는 이렇게. 미장은 \u003cstrong\u003e환율·세금\u003c/strong\u003e이 붙는다.\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e전제\u003c/strong\u003e: 투자금 $10,000, 한 거래 최대손실 2% 룰(=$200), 손절선 −10%\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e한 종목 최대 매수액\u003c/strong\u003e = $200 ÷ 0.10 = \u003cstrong\u003e$2,000\u003c/strong\u003e (전체의 20%)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e분할 매수\u003c/strong\u003e: $2,000을 3회로 → 1차 $700, 2차 $700, 3차 $600 (빠지면 추가)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e손절선\u003c/strong\u003e: 평균단가 −10% 도달 시 \u003cstrong\u003e기계적 매도\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e환율 체크\u003c/strong\u003e: 오늘 DXY 99.9·원화 강세면 환전 타이밍 상대적 유리 → 그래도 분할 환전\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e세금\u003c/strong\u003e: 미장 매매차익은 \u003cstrong\u003e양도세 22%\u003c/strong\u003e(연 250만원 공제). 실수익 = 명목수익 × 0.78 (공제 후)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e기록\u003c/strong\u003e: 산 이유·손절가·목표가·환율을 매매일지에\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"\u003cstrong\u003e금액은 종목이 아니라 '내 위험 한도'에서 나와.\u003c/strong\u003e 어제 VIX +40%, 오늘 −12% — 이런 변동에 휘둘리지 않는 유일한 방법은 \u003cstrong\u003e미리 정한 규칙\u003c/strong\u003e이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6. AI 튜터를 에이전트로 쓰기\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"디커플링이 왜 생기는지 더 알고 싶어요!\"\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"AI 튜터(로컬 LLM)에게 '한 나라 증시만 글로벌과 디커플링되는 원인엔 뭐가 있나' 같은 \u003cstrong\u003e개념 질문\u003c/strong\u003e을 던져봐. 단, 튜터도 \u003cstrong\u003e오늘 한국이 왜 빠졌는지 그 진짜 이유나 미래는 몰라.\u003c/strong\u003e 판단은 늘 네 몫이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 06-06 VIX +40% 급등에 전량 패닉셀 했다면 그 뒤(06-08) 결과는?\r\n→ 손해. \u003cstrong\u003eVIX는 이틀 만에 18.9로 진정, 지수는 반등.\u003c/strong\u003e 단기 공포 급등은 자주 되돌려진다 — 패닉셀이 최악일 때가 많다.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 같은 06-08에 미국은 +0.55%인데 한국은 −8.3%였다. 무엇을 의심해야 하나?\r\n→ 글로벌 매크로(금리·달러)가 아니라 \u003cstrong\u003e한국 고유 요인\u003c/strong\u003e(수급·정책·섹터). 한 나라만 크게 벗어나면 디커플링을 의심.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e Mastercard ROE 232%를 '초우량'으로 곧이곧대로 믿으면 안 되는 이유는?\r\n→ \u003cstrong\u003e자사주 매입으로 자기자본(분모)이 축소\u003c/strong\u003e된 효과. PBR 64배가 증거 → 직접 검증 필수.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e🔄 이 특별편을 최신으로\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"이 수치는 2026-06-08 거야. 같은 방법(\u003ccode\u003e.tmp/refresh_us_special_0608.py\u003c/code\u003e 식 재실행)으로 \u003cstrong\u003e최신 갱신 + 지난 편 자동 복기\u003c/strong\u003e가 돼. 중요한 건 숫자가 아니라 \u003cstrong\u003e'시황 읽기(+디커플링 점검) → 스크리닝 → 검증 → 계획(+환율·세금) → 복기'의 순환\u003c/strong\u003e이야.\"\u003c/p\u003e\n\u003chr\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003e면책\u003c/strong\u003e: 본 자료는 교육 목적이며 투자 권유·종목 추천이 아닙니다. 복기 수익률은 약 3거래일의 매우 짧은 표본으로, 방법의 우열을 증명하지 않습니다. 스크리닝 결과는 객관적 조건 통과일 뿐 매수 신호가 아닙니다. 미장은 양도세·환율로 실수익이 달라집니다. 모든 투자 판단과 책임은 투자자 본인에게 있습니다. 데이터는 2026-06-08 기준이며 실제와 차이가 있을 수 있습니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-15\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🔥 [특별편] 오늘의 미장 시황 \u0026 분석 가이드 (2026-06-08 기준)\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMar
