r\u003e\n\u003ctd\u003e관점\u003c/td\u003e\n\u003ctd\u003e블로그에 무슨 글을 쓸까\u003c/td\u003e\n\u003ctd\u003e각 전형을 어떻게 통과할까\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e근거\u003c/td\u003e\n\u003ctd\u003e공고 4개\u003c/td\u003e\n\u003ctd\u003e공고 4개 + 공식 FAQ + 후기 6건 + 토스 기술 발표\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e전형\u003c/td\u003e\n\u003ctd\u003e반영 안 함\u003c/td\u003e\n\u003ctd\u003e서류 / 직무 / 문화적합성 / 사전과제 트랙 분리\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e글 구성\u003c/td\u003e\n\u003ctd\u003e\"X란 무엇인가\"\u003c/td\u003e\n\u003ctd\u003e\"왜 X를 골랐고, 대안은 뭐였고, 무엇을 포기했나\"\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e이력서 연계\u003c/td\u003e\n\u003ctd\u003e없음\u003c/td\u003e\n\u003ctd\u003e이력서 = 면접 범위 = 블로그 주제로 일치\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e컬처 인터뷰\u003c/td\u003e\n\u003ctd\u003e없음\u003c/td\u003e\n\u003ctd\u003e핵심가치 3.1 기반 사례 매핑\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e조사하며 바로잡은 것\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e경력 채용에는 코딩테스트가 없다.\u003c/strong\u003e 공식 FAQ에 따르면 토스는 코딩테스트를 의도적으로 뺐다. \"알고리즘처럼 요구사항이 명확하지 않은 경우가 많고, 불명확한 요구사항을 분석해 코드 레벨로 명확하게 표현해 내는 역량이 매우 중요\"하기 때문이다.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\"서류 통과자 전원 과제\"는 3년 이하 공채(NEXT 챌린지) 이야기다.\u003c/strong\u003e 대상 공고 4개는 경력 채용이라 사전과제는 \"포지션에 따라\" 추가된다.\u003c/li\u003e\n\u003cli\u003e따라서 \u003cstrong\u003e알고리즘 준비는 우선순위가 낮다.\u003c/strong\u003e 단, 총 경력이 3년 이하라서 NEXT 챌린지 경로로 지원한다면 과제·코딩테스트가 있으니 이 판단은 뒤집힌다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 대상 공고\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e회사\u003c/th\u003e\n\u003cth\u003e포지션\u003c/th\u003e\n\u003cth\u003e도메인 키워드\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e토스플레이스\u003c/td\u003e\n\u003ctd\u003eServer Developer 3~6년차\u003c/td\u003e\n\u003ctd\u003ePOS·KIOSK, CRM, B2B 연동, 결제 단말\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e토스증권\u003c/td\u003e\n\u003ctd\u003eServer Developer (Product)\u003c/td\u003e\n\u003ctd\u003e계좌, 주식 매매, 실시간 데이터, 커뮤니티·알림\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e토스증권\u003c/td\u003e\n\u003ctd\u003eServer Developer (Platform)\u003c/td\u003e\n\u003ctd\u003e공통화, 프로파일링, 성능 개선\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e토스인컴\u003c/td\u003e\n\u003ctd\u003eServer Developer (Product)\u003c/td\u003e\n\u003ctd\u003e초기 조직, 소득·세무, 정책 로직·정산·상태 관리\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e공고 교집합\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e요구사항\u003c/th\u003e\n\u003cth align=\"center\"\u003e플레이스\u003c/th\u003e\n\u003cth align=\"center\"\u003e증권-P\u003c/th\u003e\n\u003cth align=\"center\"\u003e증권-Pl\u003c/th\u003e\n\u003cth align=\"center\"\u003e인컴\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eJava/Kotlin + Spring\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJPA/Hibernate\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRedis / Kafka\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e대용량 트래픽·고가용성\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align=\"center\"\u003e●\u003c/td\u003e\n\u003ctd align 전화 인터뷰 / 사전과제 추가)\n\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e후기로 확인한 실제 형식:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e전형\u003c/th\u003e\n\u003cth\u003e형식\u003c/th\u003e\n\u003cth\u003e출처\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e서류\u003c/td\u003e\n\u003ctd\u003e요약 이력서 1~1.5장 + 상세 업무기술서 3장 이상이 결과가 가장 좋았음. 자소서 불필요\u003c/td\u003e\n\u003ctd\u003e합격 후기\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e사전 인터뷰\u003c/td\u003e\n\u003ctd\u003e서류 이해도 확인, 짧게 진행 (일부 계열사)\u003c/td\u003e\n\u003ctd\u003e토스뱅크 합격 후기\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e직무 인터뷰\u003c/td\u003e\n\u003ctd\u003e화상, \u003cstrong\u003e2시간 이상\u003c/strong\u003e, 면접관 3명. \u003cstrong\u003eExcalidraw로 아키텍처를 그리며\u003c/strong\u003e 설명\u003c/td\u003e\n\u003ctd\u003e합격 후기 2건\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e문화적합성\u003c/td\u003e\n\u003ctd\u003e1:1, 약 1시간 반\u003c/td\u003e\n\u003ctd\u003e토스뱅크 합격 후기\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e직무 인터뷰가 보는 것 (공식 FAQ)\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e이력서 기반 프로젝트 경험과 기술적 접근 방식\u003c/li\u003e\n\u003cli\u003e코드 품질의 유지보수성\u003c/li\u003e\n\u003cli\u003e장애 대응 경험과 서비스 운영 역량\u003c/li\u003e\n\u003cli\u003e대용량 트래픽 경험, 서버 설계 구조, 기술 스택 선택 능력\u003c/li\u003e\n\u003cli\u003e\"일에 대한 이해도\" — 조직 목표와 업무의 연관성 파악\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3\u003e질문이 흘러가는 패턴 (합격 후기)\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"해당 업무를 진행한 이유는 무엇인지?\"\n→ \"A 방식으로 업무를 진행한 근거는 무엇인지?\"\n→ \"다른 방식은 검토해보았는지? 왜 A를 선택했는지?\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e이력서 \u003cstrong\u003e주요 주제 3개\u003c/strong\u003e + 시스템 설계 심화로 진행되고, \u003cstrong\u003e블로그 글의 세부 데이터까지 검토\u003c/strong\u003e하며 논의했다는 후기가 있다.\u003c/p\u003e\n\u003ch3\u003e탈락 후기가 공통으로 꼽은 원인\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\"기능 구현에만 집중하여 \u003cstrong\u003e왜(Why) 이 기술이어야만 하는가\u003c/strong\u003e에 대한 기술적 검증과 고민이 부족\"\u003c/li\u003e\n\u003cli\u003e\"라이브러리 사용만 했고 내부 동작 원리와 트레이드오프 미검토\"\u003c/li\u003e\n\u003cli\u003e이력서에 적은 Redis를 단순 캐싱으로만 썼는데 \u003cstrong\u003e초반부터 집요하게\u003c/strong\u003e 파고듦. 반면 준비했던 Kafka·MSA는 안 나옴\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e3. 핵심 전략\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e이력서에 쓴 것 = 면접 범위 = 블로그로 증명할 것.\u003c/strong\u003e 세 개를 일치시킨다.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e이력서에 적는 기술은 전부 \"왜 / 대안 / 트레이드오프 / 내부 동작\"까지 방어할 수 있어야 한다. 방어 못 하면 빼는 게 낫다.\u003c/li\u003e\n\u003cli\u003e블로그 글은 면접관이 읽는다. 글에 쓴 수치와 결론을 전부 설명할 수 있어야 한다.\u003c/li\u003e\n\u003cli\u003e준비 안 한 기술을 예상 질문으로 파는 것보다, \u003cstrong\u003e이력서 주요 주제 3개를 바닥까지\u003c/strong\u003e 파는 게 효율이 높다.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e트랙 A — 서류\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e할 일\u003c/th\u003e\n\u003cth\u003e기준\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eA1\u003c/td\u003e\n\u003ctd\u003e요약 이력서 1~1.5장\u003c/td\u003e\n\u003ctd\u003e프로젝트마다 문제 → 선택 → 결과(수치) 한 줄씩\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA2\u003c/td\u003e\n\u003ctd\u003e상세 업무기술서 3장 이상\u003c/td\u003e\n\u003ctd\u003e이력서 주요 주제 3개를 각 1장씩 깊게\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA3\u003c/td\u003e\n\u003ctd\u003e회사별 버전 분리\u003c/td\u003e\n\u003ctd\u003e플레이스: 결제·연동·추상화 / 증권: 정합성·실시간·성능 / 인컴: 정책 로직·상태 관리\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA4\u003c/td\u003e\n\u003ctd\u003e기술 스택 목록 검증\u003c/td\u003e\n\u003ctd\u003e트랙 B1 꼬리질문 5단계를 통과 못 하는 항목은 삭제\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA5\u003c/td\u003e\n\u003ctd\u003e블로그 링크 선별\u003c/td\u003e\n\u003ctd\u003e방어 가능한 글만 링크. 개념 요약 글은 링크하지 않음\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2\u003e트랙 B — 직무 인터뷰\u003c/h2\u003e\n\u003ch3\u003eB1. 이력서 기술 꼬리질문 지도\u003c/h3\u003e\n\u003cp\u003e이력서에 적은 기술마다 아래 5단계를 채운다. 한 칸이라도 비면 그 기술은 아직 이력서에 올릴 준비가 안 된 것이다.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e단계\u003c/th\u003e\n\u003cth\u003e질문\u003c/th\u003e\n\u003cth\u003e예: Redis\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e1. 왜\u003c/td\u003e\n\u003ctd\u003e이 문제에 왜 이 기술이 필요했나\u003c/td\u003e\n\u003ctd\u003eDB 조회 부하 / 응답 지연 수치\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2. 대안\u003c/td\u003e\n\u003ctd\u003e다른 선택지는 뭐였나\u003c/td\u003e\n\u003ctd\u003e로컬 캐시(Caffeine), DB 튜닝, 읽기 복제본\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3. 선택 근거\u003c/td\u003e\n\u003ctd\u003e왜 이걸 골랐나\u003c/td\u003e\n\u003ctd\u003e다중 인스턴스 간 일관성, TTL 관리\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4. 포기한 것\u003c/td\u003e\n\u003ctd\u003e트레이드오프는\u003c/td\u003e\n\u003ctd\u003e네트워크 홉, 캐시 정합성, 장애 지점 추가\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e5. 내부 동작\u003c/td\u003e\n\u003ctd\u003e어떻게 동작하나, 장애 시 어떻게 되나\u003c/td\u003e\n\u003ctd\u003e싱글 스레드 이벤트 루프, eviction, 장애 시 폴백\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003eB2. 시스템 설계 — Excalidraw로 그리며 말하기\u003c/h3\u003e\n\u003cp\u003e직무 인터뷰에서 아키텍처를 실시간으로 그린다. 주 1회, 한 주제를 45분 안에 그리며 소리 내 설명하고 녹화한다.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e설계 주제\u003c/th\u003e\n\u003cth\u003e연관 공고\u003c/th\u003e\n\u003cth\u003e참고할 토스 사례\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eD1\u003c/td\u003e\n\u003ctd\u003e매장 결제 단말 → 서버 결제 승인 흐름 (중복 결제 방지 포함)\u003c/td\u003e\n\u003ctd\u003e플레이스\u003c/td\u003e\n\u003ctd\u003eSLASH 24 오프라인 결제\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eD2\u003c/td\u003e\n\u003ctd\u003e제휴사가 늘어도 코드가 안 늘어나는 연동 구조\u003c/td\u003e\n\u003ctd\u003e플레이스\u003c/td\u003e\n\u003ctd\u003ePOS 플러그인 (플러그인 주문 규격, 장애 격리)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eD3\u003c/td\u003e\n\u003ctd\u003e해외주식 주문 — 외부 브로커 장애와 지연을 격리하는 구조\u003c/td\u003e\n\u003ctd\u003e증권-P\u003c/td\u003e\n\u003ctd\u003eSLASH 22 \"애플 한 주가 고객에게 전달되기까지\"\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eD4\u003c/td\u003e\n\u003ctd\u003e실시간 시세를 수십만 사용자에게 푸시\u003c/td\u003e\n\u003ctd\u003e증권-P\u003c/td\u003e\n\u003ctd\u003eSLASH 22 \"토스증권 실시간 시세 적용기\"\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eD5\u003c/td\u003e\n\u003ctd\u003e오픈런 트래픽을 받아내는 유량 제어·대기열\u003c/td\u003e\n\u003ctd\u003e공통\u003c/td\u003e\n\u003ctd\u003eSLASH 22 \"토스뱅크의 완전히 새로운 대출 시스템\"\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eD6\u003c/td\u003e\n\u003ctd\u003e세금 계산·환급 신청 상태 머신과 정산\u003c/td\u003e\n\u003ctd\u003e인컴\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eD7\u003c/td\u003e\n\u003ctd\u003e사내 공통 라이브러리 설계 (로깅·트레이싱·에러 규격)\u003c/td\u003e\n\u003ctd\u003e증권-Pl\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e그릴 때마다 반드시 말할 것: \u003cstrong\u003e요구사항 가정 → 트래픽 추정 → 핵심 흐름 → 장애 지점 → 정합성 보장 방법 → 모니터링 지표.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3\u003eB3. 장애 경험 스토리\u003c/h3\u003e\n\u003cp\u003e4개 공고 전부 자격요건에 장애 경험이 있다. 공식 FAQ도 \"장애 대응 경험과 서비스 운영 역량\"을 본다.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e실제 겪은 장애 2~3건을 아래 형식으로 정리한다\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e상황 → 탐지(어떻게 알았나) → 원인 분석(무엇을 봤나) → 조치 → 재발 방지 → 지금이라면 다르게 할 것\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e장애 경험이 부족하면 트랙 E 글 중 \"재현 실험\"을 스토리로 쓸 수 있다. 단 실무 장애인 척하면 안 된다\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eB4. CS 기반 — 블로그 개정판 34선\u003c/h3\u003e\n\u003cp\u003e아래 트랙 E 참고.\u003c/p\u003e\n\u003ch2\u003e트랙 C — 문화적합성 인터뷰\u003c/h2\u003e\n\u003ch3\u003e핵심 가치 3.1 사례 매핑\u003c/h3\u003e\n\u003cp\u003e각 가치마다 \u003cstrong\u003e내 실제 사례 1개\u003c/strong\u003e를 준비한다. \"스크립트처럼 준비한 내용이 진심인지 되묻는\" 질문이 나온다는 후기가 있으니, 사례는 구체적인 숫자와 내 판단이 들어간 것이어야 한다.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e가치\u003c/th\u003e\n\u003cth\u003e뜻 (원문 요약)\u003c/th\u003e\n\u003cth\u003e내 사례\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eMission over Individual\u003c/td\u003e\n\u003ctd\u003e개인보다 팀, 팀보다 토스팀의 미션 달성을 우선\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAim Higher\u003c/td\u003e\n\u003ctd\u003e주어진 일을 잘하는 데 그치지 않고 새로운 기준을 만든다\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFocus on Impact\u003c/td\u003e\n\u003ctd\u003e하면 좋을 10가지를 하지 말 일로 정하고, 가장 중요한 하나에 집중\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQuestion Every Assumption\u003c/td\u003e\n\u003ctd\u003e이미 실행 중인 안이라도 바꾸면 어떨지 끊임없이 묻는다\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eExecution over Perfection\u003c/td\u003e\n\u003ctd\u003e빠른 실행과 실험이 많은 회의와 완벽한 전략을 이긴다\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLearn Proactively\u003c/td\u003e\n\u003ctd\u003e모르는 것을 명확히 파악하고 드러내며 격차를 채울 수단을 찾는다\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMove with Urgency\u003c/td\u003e\n\u003ctd\u003e실패하더라도 신속하게 시도하는 것이 낫다\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAsk for Feedback\u003c/td\u003e\n\u003ctd\u003e동료의 솔직한 피드백을 자주, 주기적으로 구하고 받아들인다\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e후기에 나온 질문\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e어디에서, 어떨 때 동기부여가 되는가\u003c/li\u003e\n\u003cli\u003e어떤 임팩트를 만들어왔는가\u003c/li\u003e\n\u003cli\u003e러닝커브가 어떨 것 같은가\u003c/li\u003e\n\u003cli\u003e같은 직군 100명 중 본인은 몇 등이라고 생각하는가\u003c/li\u003e\n\u003cli\u003e일에 대해 어떻게 생각하는가\u003c/li\u003e\n\u003cli\u003e회복탄력성 검증 질문 (실패 후 어떻게 했나)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e준비 방법\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e토스 유튜브, 토스피드, THE TEaM 영상 시청 — 직군 무관하게 PO·디자이너 콘텐츠까지\u003c/li\u003e\n\u003cli\u003e경험들을 추상화해 \u003cstrong\u003e내 가치관의 일관성\u003c/strong\u003e을 한 문장으로 정리\u003c/li\u003e\n\u003cli\u003e매 답변에 실제 사례를 붙인다\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e트랙 D — 사전과제 (포지션에 따라)\u003c/h2\u003e\n\u003cp\u003e경력 채용에서는 포지션에 따라 추가된다. 후기로 확인한 특징:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eKotlin 템플릿\u003c/strong\u003e 제공, Spring Boot 기반 백엔드 구현\u003c/li\u003e\n\u003cli\u003e시간 제한 있음, \"현업에서 일어날 수 있는 상황\" 중심, 문제 이해에 시간이 걸림\u003c/li\u003e\n\u003cli\u003eNDA가 있어 문제 내용은 공개된 게 없다\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e대비:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e할 일\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eT1\u003c/td\u003e\n\u003ctd\u003eKotlin + Spring Boot로 작은 API를 제한 시간(3~4시간) 안에 구현하는 연습 3회\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eT2\u003c/td\u003e\n\u003ctd\u003e테스트 코드를 습관적으로 작성 — 후기에서 공통으로 강조\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eT3\u003c/td\u003e\n\u003ctd\u003e요구사항이 모호하면 가정을 README에 명시하고 진행하는 습관\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eT4\u003c/td\u003e\n\u003ctd\u003e동시성·트랜잭션·외부 API 실패를 기본 고려사항으로 체크\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e트랙 E — 블로그 개정판 34선\u003c/h2\u003e\n\u003ch3\u003e모든 글에 들어갈 구성\u003c/h3\u003e\n\u003cp\u003ev1은 개념 설명 위주였다. 면접관이 블로그를 읽고 세부 데이터까지 묻는다는 후기가 있으니, 모든 글은 아래 구조로 쓴다.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e문제\u003c/strong\u003e — 어떤 상황에서 무엇이 문제였나 (재현 코드·수치)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e선택지\u003c/strong\u003e — 가능한 방법 2~3개\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e비교\u003c/strong\u003e — 직접 측정한 결과 (벤치마크, 쿼리 로그, 그래프)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e선택과 포기\u003c/strong\u003e — 왜 이걸 골랐고 무엇을 포기했나\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e내부 동작\u003c/strong\u003e — 선택한 방법이 내부에서 어떻게 동작하나\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e한계\u003c/strong\u003e — 이 방법이 깨지는 조건\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3\u003e우선순위\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e1순위 (지원 전)\u003c/strong\u003e — 이력서 주요 주제와 겹치는 글. 서류에 링크할 글\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e2순위 (면접 전)\u003c/strong\u003e — 공고 교집합 핵심\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e3순위 (장기)\u003c/strong\u003e — 입사 후에도 쓸 깊이 확장\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e1단계 — 언어와 JVM\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e제목\u003c/th\u003e\n\u003cth\u003e핵심 질문\u003c/th\u003e\n\u003cth align=\"center\"\u003e순위\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eJava 프로젝트를 Kotlin으로 옮기며 선택한 것들\u003c/td\u003e\n\u003ctd\u003enull 안정성·data class·확장 함수, 무엇이 실제로 좋아지고 무엇이 불편해졌나\u003c/td\u003e\n\u003ctd align=\"center\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2\u003c/td\u003e\n\u003ctd\u003e코루틴 vs 스레드 풀 — 같은 작업을 둘로 구현해 비교\u003c/td\u003e\n\u003ctd\u003e경량 스레드의 이점이 실제 수치로 나오는 조건\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3\u003c/td\u003e\n\u003ctd\u003eGC를 바꾸면 무엇이 달라지나 — G1 vs ZGC 측정\u003c/td\u003e\n\u003ctd\u003e지연 시간 vs 처리량 트레이드오프\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4\u003c/td\u003e\n\u003ctd\u003e힙 OOM과 Native 메모리 누수 추적하기\u003c/td\u003e\n\u003ctd\u003e힙 덤프·NMT로 원인 찾기 (SLASH 22 토스페이먼츠 발표 참고)\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e2단계 — Spring / JPA\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e제목\u003c/th\u003e\n\u003cth\u003e핵심 질문\u003c/th\u003e\n\u003cth align=\"center\"\u003e순위\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e5\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e@Transactional\u003c/code\u003e이 동작하지 않는 경우들\u003c/td\u003e\n\u003ctd\u003e프록시 AOP의 한계, self-invocation, 체크 예외 롤백\u003c/td\u003e\n\u003ctd align=\"center\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e6\u003c/td\u003e\n\u003ctd\u003e트랜잭션 전파 — REQUIRES_NEW를 쓰면 안 되는 순간\u003c/td\u003e\n\u003ctd\u003e커넥션 추가 점유, 데드락 가능성\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e7\u003c/td\u003e\n\u003ctd\u003eJPA N+1 해결책 3가지 측정 비교\u003c/td\u003e\n\u003ctd\u003efetch join vs \u003ccode\u003e@EntityGraph\u003c/code\u003e vs batch size, 페이징과의 충돌\u003c/td\u003e\n\u003ctd align=\"center\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e8\u003c/td\u003e\n\u003ctd\u003e영속성 컨텍스트와 flush 시점이 만드는 버그\u003c/td\u003e\n\u003ctd\u003e더티 체킹, 벌크 연산 후 정합성\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9\u003c/td\u003e\n\u003ctd\u003eMVC vs WebFlux — 우리 서비스는 무엇이 맞나\u003c/td\u003e\n\u003ctd\u003e블로킹 I/O 비중에 따른 판단 기준\u003c/td\u003e\n\u003ctd align=\"center\"\u003e3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd\u003eSpring Bean 생명주기와 순환 참조\u003c/td\u003e\n\u003ctd\u003e생성자 주입이 순환 참조를 드러내는 이유\u003c/td\u003e\n\u003ctd align=\"center\"\u003e3\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e3단계 — 동시성과 정합성\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e제목\u003c/th\u003e\n\u003cth\u003e핵심 질문\u003c/th\u003e\n\u003cth align=\"center\"\u003e순위\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e11\u003c/td\u003e\n\u003ctd\u003e동시 요청이 재고를 깨뜨리는 과정 재현\u003c/td\u003e\n\u003ctd\u003e부하 테스트로 race condition 발생시키기\u003c/td\u003e\n\u003ctd align=\"center\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12\u003c/td\u003e\n\u003ctd\u003e낙관적 락 vs 비관적 락 vs 분산 락 — 측정 비교\u003c/td\u003e\n\u003ctd\u003e충돌률에 따라 달라지는 최적해\u003c/td\u003e\n\u003ctd align=\"center\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13\u003c/td\u003e\n\u003ctd\u003eMySQL 갭 락·넥스트 키 락과 데드락 로그 읽기\u003c/td\u003e\n\u003ctd\u003e기존 격리 수준 글 확장\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14\u003c/td\u003e\n\u003ctd\u003e결제 API가 두 번 호출되면 — 멱등성 설계\u003c/td\u003e\n\u003ctd\u003e멱등키 저장 위치, 만료, 동시 요청 처리\u003c/td\u003e\n\u003ctd align=\"center\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15\u003c/td\u003e\n\u003ctd\u003e외부 시스템이 느리거나 죽을 때 — 타임아웃, 서킷 브레이커, 벌크헤드\u003c/td\u003e\n\u003ctd\u003e해외주식 브로커 장애 격리 사례(SLASH 22) 참고\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16\u003c/td\u003e\n\u003ctd\u003e분산 트랜잭션 없이 정합성 맞추기 — Saga와 보상 트랜잭션\u003c/td\u003e\n\u003ctd\u003e2PC를 안 쓰는 이유\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e17\u003c/td\u003e\n\u003ctd\u003e정산 흐름을 상태 머신으로 모델링하기\u003c/td\u003e\n\u003ctd\u003e상태 전이 규칙, 잘못된 전이 차단 (인컴 \"상태 관리\")\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e18\u003c/td\u003e\n\u003ctd\u003e금액 계산 정밀도 — BigDecimal과 반올림 정책\u003c/td\u003e\n\u003ctd\u003e세금·수수료 계산의 오차 누적 (인컴 \"계산\")\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e4단계 — 대용량 트래픽과 메시징\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e제목\u003c/th\u003e\n\u003cth\u003e핵심 질문\u003c/th\u003e\n\u003cth align=\"center\"\u003e순위\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e19\u003c/td\u003e\n\u003ctd\u003e캐시를 붙였더니 생긴 문제들\u003c/td\u003e\n\u003ctd\u003e스탬피드·관통·핫키, TTL 지터, 정합성\u003c/td\u003e\n\u003ctd align=\"center\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e20\u003c/td\u003e\n\u003ctd\u003eRedis를 캐시 말고 쓰기 — 랭킹, 분산 락, 유량 제어\u003c/td\u003e\n\u003ctd\u003e자료구조 선택 근거\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e21\u003c/td\u003e\n\u003ctd\u003e오픈런 트래픽을 받아내는 유량 제어와 대기열\u003c/td\u003e\n\u003ctd\u003e기존 \"Rate Limit 란?\" 글 확장. 토스뱅크 대출 사례 참고\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e22\u003c/td\u003e\n\u003ctd\u003eKafka 파티션과 컨슈머 그룹 — 순서 보장은 어디까지 되나\u003c/td\u003e\n\u003ctd\u003e키 설계, 리밸런싱\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e23\u003c/td\u003e\n\u003ctd\u003eKafka 메시지 유실·중복 없이 처리하기\u003c/td\u003e\n\u003ctd\u003eacks, 오프셋 커밋 시점, 멱등 컨슈머\u003c/td\u003e\n\u003ctd align=\"center\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e24\u003c/td\u003e\n\u003ctd\u003eOutbox 패턴과 CDC — DB와 메시지의 이중 쓰기 문제\u003c/td\u003e\n\u003ctd\u003e폴링 vs Debezium (토스증권 CDC 글 참고)\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e25\u003c/td\u003e\n\u003ctd\u003e이벤트 기반으로 주문·결제 흐름 나누기\u003c/td\u003e\n\u003ctd\u003e동기 호출 대비 얻는 것과 잃는 것\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e26\u003c/td\u003e\n\u003ctd\u003eElasticsearch 역색인과 검색 튜닝\u003c/td\u003e\n\u003ctd\u003eMySQL LIKE 검색 대비 선택 근거\u003c/td\u003e\n\u003ctd align=\"center\"\u003e3\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e5단계 — 운영·장애·관측\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e제목\u003c/th\u003e\n\u003cth\u003e핵심 질문\u003c/th\u003e\n\u003cth align=\"center\"\u003e순위\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e27\u003c/td\u003e\n\u003ctd\u003eTomcat 스레드 풀과 HikariCP 사이징 근거\u003c/td\u003e\n\u003ctd\u003e기준 수치를 어떻게 정했나\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e28\u003c/td\u003e\n\u003ctd\u003e응답이 느려졌을 때 병목 찾는 순서\u003c/td\u003e\n\u003ctd\u003e메트릭 → 트레이스 → 스레드 덤프 → 슬로우 쿼리\u003c/td\u003e\n\u003ctd align=\"center\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e29\u003c/td\u003e\n\u003ctd\u003ePrometheus + Grafana로 Spring 앱 관측하기\u003c/td\u003e\n\u003ctd\u003e어떤 지표로 알람을 걸었나\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e30\u003c/td\u003e\n\u003ctd\u003e프로파일러로 성능 병목 찾기 (async-profiler)\u003c/td\u003e\n\u003ctd\u003e증권 Platform \"프로파일링 툴 활용\" 직결\u003c/td\u003e\n\u003ctd align=\"center\"\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e31\u003c/td\u003e\n\u003ctd\u003e쿠버네티스 배포와 graceful shutdown\u003c/td\u003e\n\u003ctd\u003e기존 Docker 글 확장, 요청 유실 없는 종료\u003c/td\u003e\n\u003ctd align=\"center\"\u003e3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e32\u003c/td\u003e\n\u003ctd\u003eIstio 서비스 메시가 대신해주는 것\u003c/td\u003e\n\u003ctd\u003e재시도·타임아웃·mTLS (플레이스·인컴 스택)\u003c/td\u003e\n\u003ctd align=\"center\"\u003e3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e33\u003c/td\u003e\n\u003ctd\u003e무중단 배포 — 롤링, 블루/그린, 카나리 선택 기준\u003c/td\u003e\n\u003ctd\u003ereadiness probe, DB 마이그레이션 호환성\u003c/t
