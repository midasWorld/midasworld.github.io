cblockquote\u003e\n\u003cp\u003e📅 차트는 2026-06-02 시점 실제 데이터입니다. 패턴 학습용이며 매수 신호가 아닙니다.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 캔들 하나에 담긴 4가지\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e시가 · 종가 · 고가 · 저가\u003c/strong\u003e (OHLC)\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e몸통\u003c/strong\u003e: 시가와 종가 사이\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e꼬리(심지)\u003c/strong\u003e: 고가·저가까지\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e양봉(빨강)\u003c/strong\u003e: 종가 \u003e 시가 (상승 마감)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e음봉(파랑)\u003c/strong\u003e: 종가 \u0026#x3C; 시가 (하락 마감)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"⚠️ 명심해라. \u003cstrong\u003e한국은 빨강=상승, 파랑=하락\u003c/strong\u003e이다. 미국은 정반대(초록=상승)야. 시장 바꿀 때 헷갈리면 큰일 난다.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/candle_color_diff.png\" alt=\"캔들 색 차이\"\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 실제 삼성전자 캔들\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/candle_samsung.png\" alt=\"삼성전자 캔들\"\u003e\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"삼성전자 일봉이다. 빨강 막대가 많고 우상향하지? \u003cstrong\u003e상승 추세\u003c/strong\u003e라는 뜻이다. 막대가 길수록 그날 매수세(또는 매도세)가 강했다는 거야.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"긴 빨강 막대(장대양봉)는 강한 매수네요!\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"그렇지. 반대로 위에 꼬리만 길게 달린 캔들은 '올랐다가 다시 밀린' 거라 매도 압력 신호일 수 있다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 알아둘 캔들 패턴\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e패턴\u003c/th\u003e\n\u003cth\u003e모양\u003c/th\u003e\n\u003cth\u003e신호\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e장대양봉\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e긴 빨강 몸통\u003c/td\u003e\n\u003ctd\u003e강한 매수, 추세 시작/강화\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e도지\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e십자가(몸통 거의 없음)\u003c/td\u003e\n\u003ctd\u003e매수·매도 균형, 추세 약화\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e망치형\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e아래꼬리 긴 작은 몸통\u003c/td\u003e\n\u003ctd\u003e하락 끝 반등 신호\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e유성형\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e위꼬리 긴 작은 몸통\u003c/td\u003e\n\u003ctd\u003e상승 끝 하락 신호\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"단, 캔들 하나로 판단하지 마라. \u003cstrong\u003e거래량\u003c/strong\u003e과 \u003cstrong\u003e추세\u003c/strong\u003e 속에서 봐야 의미가 있단다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 한국 특유 — 가격제한폭\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"국장은 하루 **±30%**까지만 움직인다(상한가/하한가). 그래서 장대양봉도 최대 +30%에서 멈춰. 미장은 제한이 없어 하루 +50%도 가능하지.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e경로\u003c/th\u003e\n\u003cth\u003e확인할 것\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e종목 \u003e 차트\u003c/td\u003e\n\u003ctd\u003e일봉·주봉 캔들, 거래량\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 앱(HTS/MTS)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e차트\u003c/td\u003e\n\u003ctd\u003e캔들 + 보조지표 겹쳐보기\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eTradingView\u003c/strong\u003e (kr.tradingview.com)\u003c/td\u003e\n\u003ctd\u003e종목 검색\u003c/td\u003e\n\u003ctd\u003e전문가용 차트 도구\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 한국 차트에서 빨간 캔들의 의미는?\r\n→ \u003cstrong\u003e상승\u003c/strong\u003e(종가 \u003e 시가). 미국은 정반대(초록=상승)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 위꼬리가 긴 유성형 캔들이 고점에서 나오면?\r\n→ 상승 끝 \u003cstrong\u003e하락 전환\u003c/strong\u003e 신호 가능성\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 국장의 하루 최대 상승폭은?\r\n→ \u003cstrong\u003e+30%\u003c/strong\u003e (상한가)\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음\u003c/strong\u003e: 거사부가 이동평균선과 RSI로 \"언제 사고 파는지\" 타이밍을 본다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 차트 패턴은 보조 판단 도구이며 미래를 보장하지 않습니다. 매수 추천이 아닙니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-14\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🇰🇷 [국장 기술 1] 캔들 읽기 — 삼성전자 차트로\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])
