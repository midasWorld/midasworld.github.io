 마법이 아니야.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📅 2026-06-02 시점 실제 데이터. 학습용이며 매매 신호가 아닙니다.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 이동평균선(MA) — 추세의 길잡이\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e이동평균선 = 최근 N일 종가의 평균\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e20일선(단기)\u003c/strong\u003e: 한 달 추세\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e60일선(중기)\u003c/strong\u003e: 분기 추세\u003c/li\u003e\n\u003cli\u003e주가가 이평선 \u003cstrong\u003e위\u003c/strong\u003e면 상승 추세, \u003cstrong\u003e아래\u003c/strong\u003e면 하락 추세\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/ma_rsi_samsung.png\" alt=\"삼성전자 이평선+RSI\"\u003e\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"위 차트를 봐라. 주황(20일선)이 파랑(60일선) \u003cstrong\u003e위로 올라설 때\u003c/strong\u003e = 상승 전환 신호다. 이걸 \u003cstrong\u003e골든크로스\u003c/strong\u003e라 한다.\"\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e신호\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e골든크로스\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e단기선(20)이 장기선(60)을 \u003cstrong\u003e상향\u003c/strong\u003e 돌파 → 매수 관점\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e데드크로스\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e단기선이 장기선을 \u003cstrong\u003e하향\u003c/strong\u003e 돌파 → 매도 관점\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e정배열\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e주가 \u003e 20일 \u003e 60일 → 강한 상승\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e역배열\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e주가 \u0026#x3C; 20일 \u0026#x3C; 60일 → 하락 추세\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e2. RSI — 과열/침체 측정\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_surprised.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"아래 보라색 선은요?\"\u003c/p\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"\u003cstrong\u003eRSI\u003c/strong\u003e다. 0~100 사이로, 최근 상승·하락의 강도를 재지.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e70 이상\u003c/strong\u003e = 과매수 (너무 올라 단기 조정 가능) — 빨간 점선\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e30 이하\u003c/strong\u003e = 과매도 (너무 빠져 반등 가능) — 초록 점선\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"RSI가 70을 넘었다고 무조건 팔라는 건 아니다. 강한 상승장에선 70 위에 한참 머물기도 해. \u003cstrong\u003e추세와 함께\u003c/strong\u003e 봐야 한다.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 다이버전스 — 고급 신호\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"주가는 신고가인데 RSI는 전고점보다 낮다? 이걸 \u003cstrong\u003e약세 다이버전스\u003c/strong\u003e라 한다. 상승 동력이 약해진다는 경고지.\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e가격 ↑ + RSI ↓ = 약세 다이버전스 (하락 주의)\u003c/li\u003e\n\u003cli\u003e가격 ↓ + RSI ↑ = 강세 다이버전스 (반등 기대)\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 거사부의 경고 — 지표는 후행한다\u003c/h2\u003e\n\u003cp\u003e🐢 \u003cstrong\u003e거사부\u003c/strong\u003e: \"명심해라. \u003cstrong\u003e모든 보조지표는 과거 데이터로 만든 후행 지표\u003c/strong\u003e다. 미래를 보장하지 않아. 박스권(횡보장)에선 골든크로스가 자주 속임수(휩쏘)가 되지. 그래서:\"\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e여러 지표를 \u003cstrong\u003e함께\u003c/strong\u003e 본다 (이평선 + RSI + 거래량)\u003c/li\u003e\n\u003cli\u003e**기본적 분석(재무)**과 병행한다 — 좋은 회사를 좋은 타이밍에\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e손절선\u003c/strong\u003e을 정해둔다 (지표가 틀릴 때 대비)\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_happy.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"지표 하나만 믿지 말고, 재무랑 거래량이랑 같이 보라는 거군요!\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e경로\u003c/th\u003e\n\u003cth\u003e확인할 것\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e네이버페이 증권\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e종목 \u003e 차트 \u003e 보조지표\u003c/td\u003e\n\u003ctd\u003e이평선·RSI·MACD 추가\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e증권사 앱\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e차트 설정\u003c/td\u003e\n\u003ctd\u003e지표 조합·기간 설정\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eTradingView\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e종목 \u003e Indicators\u003c/td\u003e\n\u003ctd\u003e전문 지표 + 백테스트\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 20일선이 60일선을 위로 뚫으면?\r\n→ \u003cstrong\u003e골든크로스\u003c/strong\u003e (매수 관점)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e RSI 75는 어떤 상태?\r\n→ \u003cstrong\u003e과매수\u003c/strong\u003e (단기 조정 가능, 단 강세장에선 지속될 수도)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 보조지표의 근본적 한계는?\r\n→ \u003cstrong\u003e후행 지표\u003c/strong\u003e (과거 데이터 기반, 미래 보장 X) → 재무·거래량과 병행\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음 시장\u003c/strong\u003e: 🇺🇸 미장! 잭이글이 애플 차트로 \"미국은 초록이 상승\"부터 다시 짚는다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 보조지표는 참고 도구이며 매매를 보장하지 않습니다. 매수 추천이 아닙니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",nul
