 이거 안 외우면 차트 거꾸로 읽어.\"\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📅 차트는 2026-06-02 시점 실제 데이터. 학습용이며 매수 신호가 아닙니다.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 한국 vs 미국 — 색이 반대\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/candle_color_diff.png\" alt=\"캔들 색 차이\"\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003e상승\u003c/th\u003e\n\u003cth\u003e하락\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e🇰🇷 국장\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e빨강\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e파랑\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e🇺🇸 미장\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e초록(green)\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e빨강(red)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"미국 뉴스에서 'the market is in the red(시장이 빨강)'이라고 하면 \u003cstrong\u003e하락\u003c/strong\u003e이라는 뜻이야. 한국식으로 생각하면 정반대로 알아듣게 돼. 조심해.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 실제 애플 캔들\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/charts/candle_apple.png\" alt=\"애플 캔들\"\u003e\u003c/p\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"애플 일봉이야. 초록이 많고 우상향이지? 상승 추세라는 뜻. 캔들 구조(시가·종가·고가·저가)는 한국과 똑같아 — \u003cstrong\u003e색깔만 반대\u003c/strong\u003e일 뿐이야.\"\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/static/images/stock/characters/hodu_thinking.png\" alt=\"호두\"\u003e 🐯 \u003cstrong\u003e호두\u003c/strong\u003e: \"구조는 같고 색만 반대! 외우기 쉽네요.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 미장 특유 — 가격제한이 없다\u003c/h2\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"여기가 진짜 중요해. \u003cstrong\u003e미장은 상한가/하한가가 없어.\u003c/strong\u003e\"\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e국장: 하루 ±30% 제한\u003c/li\u003e\n\u003cli\u003e미장: \u003cstrong\u003e제한 없음\u003c/strong\u003e → 실적 쇼크 시 하루 −40%, 호재 시 +50%도 가능\u003c/li\u003e\n\u003cli\u003e폭락 방지: \u003cstrong\u003e서킷브레이커\u003c/strong\u003e(시장 전체) + \u003cstrong\u003eLULD\u003c/strong\u003e(개별 종목 일시정지)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"그래서 미장 캔들엔 \u003cstrong\u003e엄청 긴 장대 캔들\u003c/strong\u003e이 자주 나와. 실적 발표(earnings) 다음 날 갭(gap)이 크게 뜨는 것도 특징이지. 변동성이 한국보다 훨씬 커.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 갭(Gap) — 미장에서 특히 중요\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e상승 갭\u003c/strong\u003e: 전일 종가보다 훨씬 높게 시작 (호재·실적 서프라이즈)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e하락 갭\u003c/strong\u003e: 훨씬 낮게 시작 (악재)\u003c/li\u003e\n\u003cli\u003e미장은 \u003cstrong\u003e프리마켓/애프터마켓\u003c/strong\u003e에서 실적이 나와 정규장 시작 시 갭이 큼\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e🦅 \u003cstrong\u003e잭이글\u003c/strong\u003e: \"실적 발표 시즌(earnings season)엔 하룻밤 새 캔들이 폭발해. 실적일을 모르고 들고 있다가 갭 하락 맞으면 아파.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch3\u003e📍 어디서 보나\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e사이트\u003c/th\u003e\n\u003cth\u003e경로\u003c/th\u003e\n\u003cth\u003e확인할 것\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eTradingView\u003c/strong\u003e (tradingview.com)\u003c/td\u003e\n\u003ctd\u003e티커 검색\u003c/td\u003e\n\u003ctd\u003e캔들·갭·전문 차트 ⭐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eYahoo Finance\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e티커 \u003e Chart\u003c/td\u003e\n\u003ctd\u003e캔들 + 실적일 표시\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eFinviz\u003c/strong\u003e (finviz.com)\u003c/td\u003e\n\u003ctd\u003e티커 \u003e 차트\u003c/td\u003e\n\u003ctd\u003e패턴·기술적 신호 요약\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e💡 미니 체크\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eQ1.\u003c/strong\u003e 미국 차트에서 초록 캔들의 의미는?\r\n→ \u003cstrong\u003e상승\u003c/strong\u003e(한국과 반대! 한국은 빨강=상승)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2.\u003c/strong\u003e 미장에 상한가/하한가가 있나?\r\n→ \u003cstrong\u003e없음\u003c/strong\u003e. 하루 변동 제한이 없어 변동성이 큼 (서킷브레이커·LULD만)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3.\u003c/strong\u003e 실적 발표 후 자주 나타나는 현상은?\r\n→ \u003cstrong\u003e갭(Gap)\u003c/strong\u003e — 큰 폭의 시가 점프 (프리/애프터마켓 실적 반영)\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e🎬 \u003cstrong\u003e다음\u003c/strong\u003e: 잭이글이 애플 이동평균선·RSI로 미장 타이밍을 본다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e※ 차트 패턴은 보조 도구이며 미래를 보장하지 않습니다. 매수 추천이 아닙니다.\u003c/p\u003e\n\u003c/blockquote\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-04-12\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"🇺🇸 [미장 기술 1] 캔들 읽기 — 미국은 초록이 상승!\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\
