e\u003cstrong\u003e1\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e치명적 격차\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ejavascript\u003c/td\u003e\n\u003ctd align=\"right\"\u003e1\u003c/td\u003e\n\u003ctd\u003e-\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eetc\u003c/td\u003e\n\u003ctd align=\"right\"\u003e1\u003c/td\u003e\n\u003ctd\u003e-\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eKotlin, JPA, Redis, Kafka, Kubernetes, JVM 관련 글은 0개다.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e가장 많이 요구되는 영역이 가장 비어 있다. 아래 순서는 이 격차를 메우는 순서다.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e1단계 — 언어 기반 (Java/Kotlin/JVM)\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e4개 공고 전부 필수인데 현재 java 1개뿐. 최우선 구간.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e제목\u003c/th\u003e\n\u003cth\u003e주제\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eJava 개발자가 Kotlin으로 넘어가며 겪은 것들\u003c/td\u003e\n\u003ctd\u003enull 안정성, data class, 확장 함수 — Java 코드를 Kotlin으로 바꿔가며 비교\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2\u003c/td\u003e\n\u003ctd\u003eKotlin의 \u003ccode\u003eval\u003c/code\u003e은 정말 불변인가\u003c/td\u003e\n\u003ctd\u003eimmutable/read-only 차이, \u003ccode\u003eList\u003c/code\u003e vs \u003ccode\u003eMutableList\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3\u003c/td\u003e\n\u003ctd\u003e코틀린 코루틴 기초 — 스레드와 뭐가 다른가\u003c/td\u003e\n\u003ctd\u003e경량 스레드, suspend, 구조적 동시성\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4\u003c/td\u003e\n\u003ctd\u003eJVM 메모리 구조와 GC 동작 원리\u003c/td\u003e\n\u003ctd\u003eHeap/Metaspace, G1GC vs ZGC\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e5\u003c/td\u003e\n\u003ctd\u003eOOM이 났을 때 힙 덤프로 원인 찾기\u003c/td\u003e\n\u003ctd\u003eOOM 재현 → 힙 덤프 → MAT 분석\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e6\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eequals\u003c/code\u003e와 \u003ccode\u003ehashCode\u003c/code\u003e를 잘못 구현하면 생기는 일\u003c/td\u003e\n\u003ctd\u003eHashMap 동작. 기존 일급 컬렉션 글과 연결\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2\u003e2단계 — Spring / JPA 심화\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e4/4 필수. 현재 이메일 인증 2개뿐이라 실질적으로 백지 상태.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e제목\u003c/th\u003e\n\u003cth\u003e주제\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e7\u003c/td\u003e\n\u003ctd\u003eSpring Bean 생명주기와 의존성 주입 내부 동작\u003c/td\u003e\n\u003ctd\u003eBeanFactory, 순환 참조가 나는 이유\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e8\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e@Transactional\u003c/code\u003e이 동작하지 않는 6가지 경우\u003c/td\u003e\n\u003ctd\u003e프록시 기반 AOP의 한계 — self-invocation 등\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9\u003c/td\u003e\n\u003ctd\u003e트랜잭션 전파 속성 정리 (REQUIRED vs REQUIRES_NEW)\u003c/td\u003e\n\u003ctd\u003e롤백 전파, 실제 예제로 검증\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd\u003eJPA N+1 문제와 해결책 비교\u003c/td\u003e\n\u003ctd\u003efetch join, \u003ccode\u003e@EntityGraph\u003c/code\u003e, batch size — 쿼리 로그로 확인\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11\u003c/td\u003e\n\u003ctd\u003eJPA 영속성 컨텍스트와 더티 체킹\u003c/td\u003e\n\u003ctd\u003e1차 캐시, flush 시점\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12\u003c/td\u003e\n\u003ctd\u003e낙관적 락 vs 비관적 락 — 언제 무엇을 쓸까\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e@Version\u003c/code\u003e, 재고 차감 시나리오\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13\u003c/td\u003e\n\u003ctd\u003eSpring WebFlux는 언제 써야 하나\u003c/td\u003e\n\u003ctd\u003eMVC와 스레드 모델 비교 (인컴 스택에 명시)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2\u003e3단계 — 동시성과 데이터 정합성\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e증권 \"유실없는 데이터 정합성\", 인컴 \"정산·계산·상태 관리\"에 직결.\n기존 database 글 10개라는 자산을 확장하는 구간.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e제목\u003c/th\u003e\n\u003cth\u003e주제\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e14\u003c/td\u003e\n\u003ctd\u003e동시에 요청이 들어오면 재고가 깨진다 — 재현부터\u003c/td\u003e\n\u003ctd\u003e부하 테스트로 race condition 실제 발생시키기\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15\u003c/td\u003e\n\u003ctd\u003e분산 락 구현 비교 — DB, Redis, Redisson\u003c/td\u003e\n\u003ctd\u003e각 방식의 트레이드오프\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16\u003c/td\u003e\n\u003ctd\u003eMySQL 갭 락과 넥스트 키 락\u003c/td\u003e\n\u003ctd\u003e데드락 로그 읽는 법. 기존 격리 수준 글과 연결\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e17\u003c/td\u003e\n\u003ctd\u003e멱등성(Idempotency) 설계 — 결제 API가 두 번 호출되면\u003c/td\u003e\n\u003ctd\u003e멱등키, 중복 방지 (플레이스·인컴 모두 결제/정산 도메인)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e18\u003c/td\u003e\n\u003ctd\u003e분산 트랜잭션과 Saga 패턴\u003c/td\u003e\n\u003ctd\u003e2PC의 한계, 보상 트랜잭션\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2\u003e4단계 — 대용량 트래픽과 분산 시스템\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e4/4 \"고가용성·확장성\". Redis/Kafka는 전 공고 스택인데 글이 0개.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e제목\u003c/th\u003e\n\u003cth\u003e주제\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e19\u003c/td\u003e\n\u003ctd\u003eRedis 자료구조별 실전 활용\u003c/td\u003e\n\u003ctd\u003eString/Hash/Sorted Set — 랭킹, 세션\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e20\u003c/td\u003e\n\u003ctd\u003e캐시 전략과 3대 장애 (스탬피드·관통·쏠림)\u003c/td\u003e\n\u003ctd\u003eLook-aside, Write-through, TTL 지터\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e21\u003c/td\u003e\n\u003ctd\u003eKafka 기초 — 토픽, 파티션, 컨슈머 그룹\u003c/td\u003e\n\u003ctd\u003e로컬 클러스터 띄워서 실습\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e22\u003c/td\u003e\n\u003ctd\u003eKafka 메시지 유실 없이 처리하기\u003c/td\u003e\n\u003ctd\u003eacks, at-least-once, 컨슈머 오프셋 커밋 시점\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e23\u003c/td\u003e\n\u003ctd\u003e이벤트 기반 아키텍처로 결제 흐름 설계하기\u003c/td\u003e\n\u003ctd\u003e플레이스 공고의 \"이벤트 기반 아키텍처\" 직결\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e24\u003c/td\u003e\n\u003ctd\u003eOutbox 패턴 — DB와 메시지 브로커의 정합성\u003c/td\u003e\n\u003ctd\u003e이중 쓰기 문제\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e25\u003c/td\u003e\n\u003ctd\u003eElasticsearch 역색인 원리와 검색 튜닝\u003c/td\u003e\n\u003ctd\u003e4/4 공고 스택\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2\u003e5단계 — 운영·장애·모니터링\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e증권 2개 공고의 \"JVM/Tomcat/OS/네트워크 레이어 트러블슈팅\", 플레이스의 Prometheus/Grafana.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003e제목\u003c/th\u003e\n\u003cth\u003e주제\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e26\u003c/td\u003e\n\u003ctd\u003eTomcat 스레드 풀과 커넥션 풀 튜닝\u003c/td\u003e\n\u003ctd\u003emaxThreads, HikariCP 사이징\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e27\u003c/td\u003e\n\u003ctd\u003e응답이 느려졌을 때 병목 찾는 순서\u003c/td\u003e\n\u003ctd\u003eAPM, 스레드 덤프, 슬로우 쿼리\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e28\u003c/td\u003e\n\u003ctd\u003ePrometheus + Grafana로 Spring 앱 관측하기\u003c/td\u003e\n\u003ctd\u003eMicrometer, 커스텀 메트릭\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e29\u003c/td\u003e\n\u003ctd\u003e쿠버네티스 기본 개념과 파드 배포 실습\u003c/td\u003e\n\u003ctd\u003e기존 Docker 4개 글에서 확장\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e30\u003c/td\u003e\n\u003ctd\u003e무중단 배포 전략 — 롤링, 블루/그린, 카나리\u003c/td\u003e\n\u003ctd\u003ereadiness probe, graceful shutdown\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e31\u003c/td\u003e\n\u003ctd\u003e장애 회고 — 원인 분석부터 재발 방지까지\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e4개 공고 전부가 요구하는 \"장애 경험\"\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e순서를 이렇게 잡은 이유\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e1~2단계를 먼저\u003c/strong\u003e 쓰는 건 나머지 글의 전제이기도 하지만, 서류에서 가장 먼저 확인하는 게 언어와 프레임워크 깊이여서다. 현재 Spring 글 2개가 둘 다 이메일 인증이라 \"Spring Boot 서버 개발자\"라는 정체성이 블로그에서 증명되지 않는다.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3단계를 중반에\u003c/strong\u003e 둔 이유는 증권·인컴 두 곳이 명시적으로 정합성을 요구하고, 마침 database 글 10개라는 기존 자산이 있어서다. 격리 수준·인덱스 글에서 이어지는 흐름이라 가장 빠르게 깊이를 만들 수 있는 구간이다.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5단계를 마지막에\u003c/strong\u003e 두는 건 실습 환경 구축 비용이 커서다. 다만 \u003cstrong\u003e31번은 예외다.\u003c/strong\u003e 4개 공고 모두 \"장애 상황을 경험하고 해결한 경험\"을 자격 요건에 넣었는데, 이건 개념 정리로 대체가 안 된다. 작은 사고라도 겪는 즉시 쓰는 게 맞다.\u003c/p\u003e\n\u003ch2\u003e글 쓸 때 지킬 것\u003c/h2\u003e\n\u003cp\u003e공고들이 반복해서 요구하는 건 지식이 아니라 \u003cstrong\u003e경험\u003c/strong\u003e이다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"장애 상황을 경험하며, 문제 해결을 통해 제품과 시스템을 성장시켜본\" — 토스플레이스\u003c/p\u003e\n\u003cp\u003e\"어려운 문제를 끈기있게 해결한 경험\" — 토스증권\u003c/p\u003e\n\u003cp\u003e\"적극적인 개선 사례 보유\" — 토스인컴\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e그래서 각 글은 \u003cstrong\u003e개념 요약이 아니라 재현 기록\u003c/strong\u003e이어야 한다.\u003c/p\u003e\n\u003cp\u003e14번을 예로 들면 — 낙관적 락 개념 설명이 아니라, 부하 테스트로 재고가 깨지는 걸 실제로 만들고, 로그와 쿼리를 보여주고, 해결책 3개를 벤치마크해서 수치로 비교하는 글이다.\u003c/p\u003e\n\u003cp\u003e이런 글 5개가 개념 정리 20개보다 낫다.\u003c/p\u003e\n\u003cp\u003e기존 글 중에는 아래 3개가 이미 그 결에 가깝다. 새 글의 기준선으로 삼는다.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eMySQL 아키텍쳐\u003c/code\u003e (12,951자)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e트랜잭션 격리 수준\u003c/code\u003e (7,518자)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNode - Cluster\u003c/code\u003e (6,486자)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e진행 체크리스트\u003c/h2\u003e\n\u003ch3\u003e1단계 — 언어 기반\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 1. Java 개발자가 Kotlin으로 넘어가며 겪은 것들\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 2. Kotlin의 \u003ccode\u003eval\u003c/code\u003e은 정말 불변인가\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 3. 코틀린 코루틴 기초 — 스레드와 뭐가 다른가\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 4. JVM 메모리 구조와 GC 동작 원리\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 5. OOM이 났을 때 힙 덤프로 원인 찾기\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 6. \u003ccode\u003eequals\u003c/code\u003e와 \u003ccode\u003ehashCode\u003c/code\u003e를 잘못 구현하면 생기는 일\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e2단계 — Spring / JPA\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 7. Spring Bean 생명주기와 의존성 주입 내부 동작\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 8. \u003ccode\u003e@Transactional\u003c/code\u003e이 동작하지 않는 6가지 경우\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 9. 트랜잭션 전파 속성 정리\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003 checkbox\" disabled\u003e 25. Elasticsearch 역색인 원리와 검색 튜닝\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e5단계 — 운영·장애·모니터링\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 26. Tomcat 스레드 풀과 커넥션 풀 튜닝\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 27. 응답이 느려졌을 때 병목 찾는 순서\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 28. Prometheus + Grafana로 Spring 앱 관측하기\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 29. 쿠버네티스 기본 개념과 파드 배포 실습\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 30. 무중단 배포 전략\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 31. 장애 회고 — 원인 분석부터 재발 방지까지\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e부수적으로 정리할 것\u003c/h2\u003e\n\u003cp\u003e로드맵과 별개로, 블로그 구성상 손볼 부분이다.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e알고리즘 21개\u003c/strong\u003e — 공개 67개 중 31%. 별도 카테고리 분리나 목록 접기 검토\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e스프링 이메일 인증 2개 중복\u003c/strong\u003e (2022-10-15, 2023-04-06) — 2023년 글로 병합 후보\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e팁성 단문 5개\u003c/strong\u003e — gitignore(429자), SELECT 순서(469자), Rebase 해제(518자), dotenv cli(588자), 인증 정보 초기화(774자). git 관련 3개는 하나로 묶으면 쓸 만해진다\u003c/li\u003e\n\u003c/ul\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-
