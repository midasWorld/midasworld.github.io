 (Balance Sheet)  (Cash Flow Statement)\n        │                 │                  │\n   얼마 벌었나?    지금 얼마 갖고      실제 현금은\n   (수익성)         있나? (안전성)      얼마인가?\n                                      (현금창출력)\n─────────────────────────────────────────────────────────\n세 가지 모두 함께 봐야 기업의 진짜 상태가 보인다\n\u003c/code\u003e\u003c/pre\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e💡 핵심 원칙\u003c/strong\u003e: 순이익이 높아도 현금이 없으면 위험하다. 3가지 재무제표를 반드시 함께 봐야 한다.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e1. 손익계산서 (Income Statement)\u003c/h2\u003e\n\u003cp\u003e손익계산서는 \u003cstrong\u003e일정 기간 동안 얼마를 벌고 얼마를 썼는지\u003c/strong\u003e 보여주는 성적표다. 보통 분기(3개월), 연간 기준으로 발표된다.\u003c/p\u003e\n\u003ch3\u003e1-1. 손익계산서 구조\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e손익계산서 흐름 (폭포 차트)\n────────────────────────────────────────────────────────\n매출액 (Revenue)                          $\u003cspan class=\"hljs-number\"\u003e100\u003c/span\u003e\n  └─ 매출원가 (Cost of Goods Sold)         -$\u003cspan class=\"hljs-number\"\u003e40\u003c/span\u003e\n       ────────────────────────────────────────\n매출총이익 (Gross Profit)                  $\u003cspan class=\"hljs-number\"\u003e60\u003c/span\u003e   → Gross \u003cspan class=\"hljs-attribute\"\u003eMargin\u003c/span\u003e \u003cspan class=\"hljs-number\"\u003e60%\u003c/span\u003e\n  └─ 판매관리비 (Operating Expenses)       -$\u003cspan class=\"hljs-number\"\u003e20\u003c/span\u003e\n       ────────────────────────────────────────\n영업이익 (Operating Income)                $\u003cspan class=\"hljs-number\"\u003e40\u003c/span\u003e   → Operating \u003cspan class=\"hljs-attribute\"\u003eMargin\u003c/span\u003e \u003cspan class=\"hljs-number\"\u003e40%\u003c/span\u003e\n  └─ 이자/세금 등 (Interest, Tax)          -$\u003cspan class=\"hljs-number\"\u003e10\u003c/span\u003e\n       ────────────────────────────────────────\n순이익 (Net Income)                        $\u003cspan class=\"hljs-number\"\u003e30\u003c/span\u003e   → Net \u003cspan class=\"hljs-attribute\"\u003eMargin\u003c/span\u003e \u003cspan class=\"hljs-number\"\u003e30%\u003c/span\u003e\n────────────────────────────────────────────────────────\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e1-2. 핵심 수익성 지표\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e계산식\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003cth\u003e좋은 수준\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e매출총이익률 (Gross Margin)\u003c/td\u003e\n\u003ctd\u003e매출총이익 ÷ 매출\u003c/td\u003e\n\u003ctd\u003e제품/서비스 본연의 수익성\u003c/td\u003e\n\u003ctd\u003e소프트웨어 70%+, 소매 25%+\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e영업이익률 (Operating Margin)\u003c/td\u003e\n\u003ctd\u003e영업이익 ÷ 매출\u003c/td\u003e\n\u003ctd\u003e실제 사업 운영 효율성\u003c/td\u003e\n\u003ctd\u003e20%+ 양호\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e순이익률 (Net Margin)\u003c/td\u003e\n\u003ctd\u003e순이익 ÷ 매출\u003c/td\u003e\n\u003ctd\u003e세후 최종 수익성\u003c/td\u003e\n\u003ctd\u003e10%+ 양호\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e1-3. Apple 2023년 실제 수치 분석\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003eApple (AAPL) FY2023 손익계산서\n────────────────────────────────────────────────────────────────\n항목                              금액          비율\n────────────────────────────────────────────────────────────────\n매출액 (Revenue)               $\u003cspan class=\"hljs-number\"\u003e383.3\u003c/span\u003eB        \u003cspan class=\"hljs-number\"\u003e100.0%\u003c/span\u003e\n  ├─ 제품 (Products)           $\u003cspan class=\"hljs-number\"\u003e298.1\u003c/span\u003eB         \u003cspan class=\"hljs-number\"\u003e77.8%\u003c/span\u003e\n  └─ 서비스 (Services)          $\u003cspan class=\"hljs-number\"\u003e85.2\u003c/span\u003eB         \u003cspan class=\"hljs-number\"\u003e22.2%\u003c/span\u003e  ← 고수익\n────────────────────────────────────────────────────────────────\n매출원가 (COGS)               -$\u003cspan class=\"hljs-number\"\u003e214.1\u003c/span\u003eB        -\u003cspan class=\"hljs-number\"\u003e55.9%\u003c/span\u003e\n────────────────────────────────────────────────────────────────\n매출총이익 (Gross Profit)       $\u003cspan class=\"hljs-number\"\u003e169.1\u003c/span\u003eB         \u003cspan class=\"hljs-number\"\u003e44.1%\u003c/span\u003e  ← Gross \u003cspan class=\"hljs-attribute\"\u003eMargin\u003c/span\u003e\n────────────────────────────────────────────────────────────────\n영업비용 (Operating Expenses)  -$\u003cspan class=\"hljs-number\"\u003e54.8\u003c/span\u003eB         -\u003cspan class=\"hljs-number\"\u003e14.3%\u003c/span\u003e\n  ├─ 연구개발 (R\u0026#x26;D)             -$\u003cspan class=\"hljs-number\"\u003e29.9\u003c/span\u003eB         -\u003cspan class=\"hljs-number\"\u003e7.8%\u003c/span\u003e\n  └─ 판매관리 (SG\u0026#x26;A)            -$\u003cspan class=\"hljs-number\"\u003e24.9\u003c/span\u003eB         -\u003cspan class=\"hljs-number\"\u003e6.5%\u003c/span\u003e\n────────────────────────────────────────────────────────────────\n영업이익 (Operating Income)    $\u003cspan class=\"hljs-number\"\u003e114.3\u003c/span\u003eB          \u003cspan class=\"hljs-number\"\u003e29.8%\u003c/span\u003e  ← Operating \u003cspan class=\"hljs-attribute\"\u003eMargin\u003c/span\u003e\n세금 등                        -$\u003cspan class=\"hljs-number\"\u003e29.7\u003c/span\u003eB\n────────────────────────────────────────────────────────────────\n순이익 (Net Income)             $\u003cspan class=\"hljs-number\"\u003e96.9\u003c/span\u003eB          \u003cspan class=\"hljs-number\"\u003e25.3%\u003c/span\u003e  ← Net \u003cspan class=\"hljs-attribute\"\u003eMargin\u003c/span\u003e\n────────────────────────────────────────────────────────────────\n\u003c/code\u003e\u003c/pre\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e💡 분석 포인트\u003c/strong\u003e: Apple의 서비스 매출 비중이 22.2%에 불과하지만, 서비스 부문 Gross Margin은 70%+로 제품(37%)보다 훨씬 높다. 서비스 매출 성장이 전체 수익성 개선의 핵심 동력이다.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3\u003e1-4. 업종별 마진 비교\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e업종\u003c/th\u003e\n\u003cth\u003eGross Margin\u003c/th\u003e\n\u003cth\u003eOperating Margin\u003c/th\u003e\n\u003cth\u003e대표 기업\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e소프트웨어 SaaS\u003c/td\u003e\n\u003ctd\u003e70-80%\u003c/td\u003e\n\u003ctd\u003e20-30%\u003c/td\u003e\n\u003ctd\u003eMicrosoft, Salesforce\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e반도체\u003c/td\u003e\n\u003ctd\u003e50-65%\u003c/td\u003e\n\u003ctd\u003e25-40%\u003c/td\u003e\n\u003ctd\u003eNvidia, AMD\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e빅테크\u003c/td\u003e\n\u003ctd\u003e40-60%\u003c/td\u003e\n\u003ctd\u003e25-35%\u003c/td\u003e\n\u003ctd\u003eApple, Google\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e의약품\u003c/td\u003e\n\u003ctd\u003e60-80%\u003c/td\u003e\n\u003ctd\u003e20-35%\u003c/td\u003e\n\u003ctd\u003eJohnson \u0026#x26; Johnson\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e소매 (오프라인)\u003c/td\u003e\n\u003ctd\u003e25-35%\u003c/td\u003e\n\u003ctd\u003e3-8%\u003c/td\u003e\n\u003ctd\u003eWalmart, Target\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e자동차\u003c/td\u003e\n\u003ctd\u003e15-25%\u003c/td\u003e\n\u003ctd\u003e5-12%\u003c/td\u003e\n\u003ctd\u003eTesla, Ford\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e항공\u003c/td\u003e\n\u003ctd\u003e10-20%\u003c/td\u003e\n\u003ctd\u003e5-15%\u003c/td\u003e\n\u003ctd\u003eDelta, United\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003ch2\u003e2. 대차대조표 (Balance Sheet)\u003c/h2\u003e\n\u003cp\u003e대차대조표는 \u003cstrong\u003e특정 시점에 기업이 무엇을 갖고 있고, 무엇을 빚졌는지\u003c/strong\u003e 보여준다.\u003c/p\u003e\n\u003ch3\u003e2-1. 핵심 공식\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e┌─────────────────────────────────────────────────────┐\n│                                                     │\n│         자산 (Assets) = 부채 (Liabilities)          │\n│                       + 자본 (Equity)               │\n│                                                     │\n│   기업이 가진 것  =  남에게 빌린 것 + 내 것           │\n│                                                     │\n└─────────────────────────────────────────────────────┘\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e2-2. 대차대조표 구조\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e대차대조표 구조\n─────────────────────────────────────────────────────────────\n왼쪽 (자산)                     오른쪽 (부채 + 자본)\n─────────────────────────────────────────────────────────────\n유동자산 (\u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e년 내 현금화 가능)    유동부채 (\u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e년 내 갚아야 할 빚)\n  ├─ 현금 및 현금성 자산           ├─ 매입채무\n  ├─ 단기투자                      ├─ 단기차입금\n  ├─ 매출채권                      └─ 기타 유동부채\n  └─ 재고자산\n                                 비유동부채 (장기 부채)\n비유동자산 (장기 자산)             ├─ 장기차입금\n  ├─ 유형자산 (설비, 건물)         └─ 기타 장기부채\n  ├─ 무형자산 (특허, 브랜드)\n  └─ 장기투자                   자본 (Equity)\n                                 ├─ 자본금\n                                 ├─ 이익잉여금\n                                 └─ 자기주식 (-)\n─────────────────────────────────────────────────────────────\n왼쪽 합계 = 오른쪽 합계 (반드시 일치!)\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e2-3. 핵심 안전성 지표\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e계산식\u003c/th\u003e\n\u003cth\u003e의미\u003c/th\u003e\n\u003cth\u003e기준\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e현재비율 (Current Ratio)\u003c/td\u003e\n\u003ctd\u003e유동자산 ÷ 유동부채\u003c/td\u003e\n\u003ctd\u003e단기 부채 상환 능력\u003c/td\u003e\n\u003ctd\u003e1.5 이상 양호\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e부채비율 (D/E Ratio)\u003c/td\u003e\n\u003ctd\u003e총부채 ÷ 자본\u003c/td\u003e\n\u003ctd\u003e재무 레버리지 수준\u003c/td\u003e\n\u003ctd\u003e업종마다 다름\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e이자보상배율\u003c/td\u003e\n\u003ctd\u003e영업이익 ÷ 이자비용\u003c/td\u003e\n\u003ctd\u003e이자 감당 능력\u003c/td\u003e\n\u003ctd\u003e3 이상 안전\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e⚠️ 주의\u003c/strong\u003e: 부채비율은 업종마다 적정 수준이 다르다. 금융주는 본업이 돈을 빌려주는 것이라 부채비율이 당연히 높다. 제조업은 1 이하, IT 기업은 0.5 이하를 목표로 보는 것이 일반적이다.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3\u003e2-4. Apple vs 일반 기업 대차대조표 비교\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003eApple (AAPL) 2023 대차대조표 핵심\n────────────────────────────────────────────────────────\n총자산:    \u003cspan class=\"hljs-variable\"\u003e$352\u003c/span\u003e.6B\n총부채:    \u003cspan class=\"hljs-variable\"\u003e$290\u003c/span\u003e.4B\n자본:       \u003cspan class=\"hljs-variable\"\u003e$62\u003c/span\u003e.2B\n\n부채비율 (D/E): 290.4 ÷ 62.2 = 4.67배 → 매우 높아 보인다!\n\n하지만... 보유 현금/투자자산이 \u003cspan class=\"hljs-variable\"\u003e$166B\u003c/span\u003e+\n실질 순부채: \u003cspan class=\"hljs-variable\"\u003e$290\u003c/span\u003e.4B - \u003cspan class=\"hljs-variable\"\u003e$166B\u003c/span\u003e = \u003cspan class=\"hljs-variable\"\u003e$124B\u003c/span\u003e\n실질 부채비율: 훨씬 낮다\n────────────────────────────────────────────────────────\n\n💡 포인트: 단순 부채비율이 높아도 현금이 많으면 실질적으로 안전할 수 있다.\nApple처럼 현금을 많이 보유한 기업은 현금을 제외한 순부채(Net Debt)로 봐야 한다.\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e3. 현금흐름표 (Cash Flow Statement)\u003c/h2\u003e\n\u003cp\u003e현금흐름표는 \u003cstrong\u003e실제 현금이 어디서 들어오고 어디로 나갔는지\u003c/strong\u003e 보여준다. 이것이 가장 중요한 재무제표라는 전문가도 많다.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e💡 핵심\u003c/strong\u003e: 순이익은 회계 기준으로 조작 가능하지만, 현금은 거짓말하지 않는다.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3\u003e3-1. 현금흐름 3가지 유형\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003e현금흐름표 구분\n─────────────────────────────────────────────────────────────────\n영업활동 현금흐름 (Operating Cash Flow, OCF)\n  → 본업에서 실제로 들어온 현금\n  → \"이 기업은 장사로 돈을 버는가?\"\n  → 항상 (+) 이어야 한다 (지속적 (-) 이면 적신호)\n\n투자활동 현금흐름 (Investing Cash Flow)\n  → 설비 투자, 자산 매각, 인수합병 등\n  → 성장하는 기업은 보통 (-) (미래를 위해 투자 중)\n  → 너무 공격적인 투자는 현금 부담 위험\n\n재무활동 현금흐름 (Financing Cash Flow)\n  → 주식 발행, 배당 지급, 차입/상환\n  → 성숙 기업은 보통 (-) (자사주 매입, 배당 지급)\n─────────────────────────────────────────────────────────────────\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e3-2. FCF (잉여현금흐름) — 가장 중요한 지표\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-swift\"\u003e\u003cspan class=\"hljs-type\"\u003eFree\u003c/span\u003e \u003cspan class=\"hljs-type\"\u003eCash\u003c/span\u003e \u003cspan class=\"hljs-type\"\u003eFlow\u003c/span\u003e (\u003cspan class=\"hljs-type\"\u003eFCF\u003c/span\u003e) 계산\n\u003cspan class=\"hljs-operator\"\u003e────────────────────────────────────────────────\u003c/span\u003e\n\u003cspan class=\"hljs-type\"\u003eFCF\u003c/span\u003e \u003cspan class=\"hljs-operator\"\u003e=\u003c/span\u003e 영업활동 현금흐름 \u003cspan class=\"hljs-operator\"\u003e-\u003c/span\u003e 자본적 지출(\u003cspan class=\"hljs-type\"\u003eCAPEX\u003c/span\u003e)\n\n예시:\n  영업활동 현금흐름:  \u003cspan class=\"hljs-operator\"\u003e+\u003c/span\u003e\u003cspan class=\"hljs-variable\"\u003e$110\u003c/span\u003eB\n  \u003cspan class=\"hljs-type\"\u003eCAPEX\u003c/span\u003e (설비투자):   \u003cspan class=\"hljs-operator\"\u003e-\u003c/span\u003e\u003cspan class=\"hljs-variable\"\u003e$10\u003c/span\u003eB\n  \u003cspan class=\"hljs-operator\"\u003e─────────────────────────\u003c/span\u003e\n  \u003cspan class=\"hljs-type\"\u003eFCF\u003c/span\u003e:               \u003cspan class=\"hljs-operator\"\u003e+\u003c/span\u003e\u003cspan class=\"hljs-variable\"\u003e$100\u003c/span\u003eB  \u003cspan class=\"hljs-operator\"\u003e←\u003c/span\u003e 이 돈이 실제 여유 현금\n\n이 \u003cspan class=\"hljs-type\"\u003eFCF로\u003c/span\u003e 기업은:\n  \u003cspan class=\"hljs-operator\"\u003e✓\u003c/span\u003e 자사주 매입 (주주 환원)\n  \u003cspan class=\"hljs-operator\"\u003e✓\u003c/span\u003e 배당 지급\n  \u003cspan class=\"hljs-operator\"\u003e✓\u003c/span\u003e 빚 갚기\n  \u003cspan class=\"hljs-operator\"\u003e✓\u003c/span\u003e 인수합병\n  \u003cspan class=\"hljs-operator\"\u003e✓\u003c/span\u003e 현금 보유\n\u003cspan class=\"hljs-operator\"\u003e────────────────────────────────────────────────\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e3-3. Apple vs 고성장 적자기업 비교\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003eApple (AAPL)\u003c/th\u003e\n\u003cth\u003eUber (초기 2019)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e순이익\u003c/td\u003e\n\u003ctd\u003e+$57B\u003c/td\u003e\n\u003ctd\u003e-$8.5B\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e영업 현금흐름\u003c/td\u003e\n\u003ctd\u003e+$104B\u003c/td\u003e\n\u003ctd\u003e-$1.7B\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFCF\u003c/td\u003e\n\u003ctd\u003e+$100B\u003c/td\u003e\n\u003ctd\u003e-$2.1B\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e평가\u003c/td\u003e\n\u003ctd\u003e현금 창출 최강\u003c/td\u003e\n\u003ctd\u003e성장 투자 중\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e💡 투자 관점\u003c/strong\u003e: 순이익이 적자여도 현금흐름이 개선 추세라면 투자 가치가 있을 수 있다 (Uber, Amazon 초기). 하지만 순이익도 현금흐름도 모두 부정적이면 위험 신호다.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3\u003e3-4. Microsoft 현금흐름 분석\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-swift\"\u003e\u003cspan class=\"hljs-type\"\u003eMicrosoft\u003c/span\u003e (\u003cspan class=\"hljs-type\"\u003eMSFT\u003c/span\u003e) \u003cspan class=\"hljs-type\"\u003eFY2023\u003c/span\u003e 현금흐름\n\u003cspan class=\"hljs-operator\"\u003e────────────────────────────────────────────────────\u003c/span\u003e\n영업활동 현금흐름:   \u003cspan class=\"hljs-operator\"\u003e+\u003c/span\u003e\u003cspan class=\"hljs-variable\"\u003e$87\u003c/span\u003e.6B   \u003cspan class=\"hljs-operator\"\u003e←\u003c/span\u003e 사업 본업 강력\n투자활동 현금흐름:   \u003cspan class=\"hljs-operator\"\u003e-\u003c/span\u003e\u003cspan class=\"hljs-variable\"\u003e$22\u003c/span\u003e.7B   \u003cspan class=\"hljs-operator\"\u003e←\u003c/span\u003e \u003cspan class=\"hljs-type\"\u003eAI\u003c/span\u003e\u003cspan class=\"hljs-operator\"\u003e/\u003c/span\u003e클라우드 투자\n재무활동 현금흐름:   \u003cspan class=\"hljs-operator\"\u003e-\u003c/span\u003e\u003cspan class=\"hljs-variable\"\u003e$43\u003c/span\u003e.9B   \u003cspan class=\"hljs-operator\"\u003e←\u003c/span\u003e 자사주 매입 \u003cspan class=\"hljs-operator\"\u003e+\u003c/span\u003e 배당\n\n잉여현금흐름 (\u003cspan class=\"hljs-type\"\u003eFCF\u003c/span\u003e): \u003cspan class=\"hljs-number\"\u003e87.6\u003c/span\u003e \u003cspan class=\"hljs-operator\"\u003e-\u003c/span\u003e \u003cspan class=\"hljs-number\"\u003e20.1\u003c/span\u003e(\u003cspan class=\"hljs-type\"\u003eCAPEX\u003c/span\u003e) \u003cspan class=\"hljs-operator\"\u003e=\u003c/span\u003e \u003cspan class=\"hljs-variable\"\u003e$67\u003c/span\u003e.5B\n\u003cspan class=\"hljs-operator\"\u003e────────────────────────────────────────────────────\u003c/span\u003e\n영업 현금흐름이 강하고, 투자와 주주환원이 균형 잡혀 있다.\n이것이 \u003cspan class=\"hljs-string\"\u003e\"캐시 카우\"\u003c/span\u003e의 전형적인 모습이다.\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e4. 실전: SEC EDGAR와 Yahoo Finance 활용법\u003c/h2\u003e\n\u003ch3\u003e4-1. SEC EDGAR — 공식 재무제표 원본\u003c/h3\u003e\n\u003cp\u003e미국 상장 기업은 SEC(증권거래위원회)에 정기적으로 보고서를 제출한다.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-yaml\"\u003e\u003cspan class=\"hljs-string\"\u003eSEC\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003eEDGAR\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e보고서\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e종류\u003c/span\u003e\n\u003cspan class=\"hljs-string\"\u003e────────────────────────────────────────────────────\u003c/span\u003e\n\u003cspan class=\"hljs-attr\"\u003e10-K :\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e연간\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e보고서\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e(가장\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e상세,\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e연\u003c/span\u003e \u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e\u003cspan class=\"hljs-string\"\u003e회)\u003c/span\u003e\n        \u003cspan class=\"hljs-string\"\u003e→\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e사업\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e개요,\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e리스크\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e요인,\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e전체\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e재무제표\u003c/span\u003e\n\u003cspan class=\"hljs-attr\"\u003e10-Q :\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e분기\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e보고서\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e(연\u003c/span\u003e \u003cspan class=\"hljs-number\"\u003e3\u003c/span\u003e\u003cspan class=\"hljs-string\"\u003e회)\u003c/span\u003e\n        \u003cspan class=\"hljs-string\"\u003e→\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e분기\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e실적,\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e간략한\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e재무제표\u003c/span\u003e\n\u003cspan class=\"hljs-attr\"\u003e8-K  :\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e수시\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e공시\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e(중요\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e사건\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e발생\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e시)\u003c/span\u003e\n        \u003cspan class=\"hljs-string\"\u003e→\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e실적\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e발표,\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e인수합병,\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003eCEO\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e교체\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e등\u003c/span\u003e\n\u003cspan class=\"hljs-attr\"\u003eDEF14A:\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e주주총회\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e안건\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e+\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e임원\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e보수\u003c/span\u003e\n\u003cspan class=\"hljs-string\"\u003e────────────────────────────────────────────────────\u003c/span\u003e\n\u003cspan class=\"hljs-string\"\u003e접속:\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003ehttps://www.sec.gov/edgar/search/\u003c/span\u003e\n\u003cspan class=\"hljs-string\"\u003e검색:\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e회사명\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e또는\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e티커\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e→\u003c/span\u003e \u003cspan class=\"hljs-number\"\u003e10\u003c/span\u003e\u003cspan class=\"hljs-string\"\u003e-K\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e선택\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e4-2. Yahoo Finance — 빠른 분석\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-java\"\u003eYahoo Finance 활용 워크플로우\n────────────────────────────────────────────\n\u003cspan class=\"hljs-number\"\u003e1.\u003c/span\u003e finance.yahoo.com 접속\n\u003cspan class=\"hljs-number\"\u003e2.\u003c/span\u003e 검색창에 티커 입력 (예: AAPL)\n\u003cspan class=\"hljs-number\"\u003e3.\u003c/span\u003e 상단 메뉴에서 \u003cspan class=\"hljs-string\"\u003e\"Financials\"\u003c/span\u003e 클릭\n   ├─ Income \u003cspan class=\"hljs-title function_\"\u003eStatement\u003c/span\u003e \u003cspan class=\"hljs-params\"\u003e(손익계산서)\u003c/span\u003e\n   ├─ Balance \u003cspan class=\"hljs-title function_\"\u003eSheet\u003c/span\u003e \u003cspan class=\"hljs-params\"\u003e(대차대조표)\u003c/span\u003e\n   └─ Cash \u003cspan class=\"hljs-title function_\"\u003eFlow\u003c/span\u003e \u003cspan class=\"hljs-params\"\u003e(현금흐름표)\u003c/span\u003e\n\u003cspan class=\"hljs-number\"\u003e4.\u003c/span\u003e 오른쪽 상단: Annual / Quarterly 전환\n\u003cspan class=\"hljs-number\"\u003e5.\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003e\"5-Year\"\u003c/span\u003e 버튼으로 추세 확인\n────────────────────────────────────────────\n⭐ TIP: \u003cspan class=\"hljs-string\"\u003e\"TTM\"\u003c/span\u003e = Trailing Twelve \u003cspan class=\"hljs-title function_\"\u003eMonths\u003c/span\u003e \u003cspan class=\"hljs-params\"\u003e(최근 \u003cspan class=\"hljs-number\"\u003e12\u003c/span\u003e개월)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e4-3. 5년 추세가 왜 중요한가\u003c/h3\u003e\n\u003cp\u003e단순히 최근 1년 수치만 보면 안 된다. 5년 추세를 봐야 \"방향성\"이 보인다.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e지표\u003c/th\u003e\n\u003cth\u003e1년만 봤을 때\u003c/th\u003e\n\u003cth\u003e5년 추세로 봤을 때\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e매출 성장\u003c/td\u003e\n\u003ctd\u003e10% 성장\u003c/td\u003e\n\u003ctd\u003e매년 10-20% 꾸준한 성장\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e영업 마진\u003c/td\u003e\n\u003ctd\u003e25%\u003c/td\u003e\n\u003ctd\u003e15% → 20% → 25% (개선 중)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFCF\u003c/td\u003e\n\u003ctd\u003e$100B\u003c/td\u003e\n\u003ctd\u003e$50B → $75B → $100B (증가 추세)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e💡 핵심\u003c/strong\u003e: 단순한 수치보다 \u003cstrong\u003e방향성\u003c/strong\u003e이 중요하다. 마진이 개선되고 있는가? FCF가 꾸준히 성장하고 있는가?\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e5. 실전 재무 분석 체크리스트\u003c/h2\u003e\n\u003cp\u003e기업을 분석하기 전에 아래 10가지를 순서대로 확인하라.\u003c/p\u003e\n\u003ch3\u003e✅ 수익성 체크 (손익계산서)\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 매출이 꾸준히 성장하고 있는가? (연 10%+ 이상이면 양호)\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Gross Margin이 안정적이거나 개선 중인가?\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 영업이익률이 긍정적인가? (15%+ 양호)\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 순이익이 지속적으로 발생하는가?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e✅ 안전성 체크 (대차대조표)\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 현재비율이 1.5 이상인가?\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 부채가 통제 가능한 수준인가? (업종 평균 비교)\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 현금 및 유동성이 충분한가?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e✅ 현금창출력 체크 (현금흐름표)\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 영업 현금흐름이 항상 (+) 인가?\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e FCF가 꾸준히 증가 추세인가?\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e 주주 환원(자사주 매입/배당)을 하고 있는가?\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e6. Apple vs Palantir — 두 기업 재무 비교\u003c/h2\u003e\n\u003cp\u003e완전히 다른 두 기업을 비교하면 재무제표 해석 능력이 생긴다.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-scss\"\u003eApple (AAPL) vs Palantir (PLTR) 재무 비교\n────────────────────────────────────────────────────────────────────\n지표                    Apple (성숙기 캐시카우)    Palantir (성장주)\n────────────────────────────────────────────────────────────────────\n매출 성장률 (YoY)              -\u003cspan class=\"hljs-number\"\u003e3%\u003c/span\u003e (성숙기)          +\u003cspan class=\"hljs-number\"\u003e17%\u003c/span\u003e (성장 중)\nGross \u003cspan class=\"hljs-attribute\"\u003eMargin\u003c/span\u003e                   \u003cspan class=\"hljs-number\"\u003e44.1%\u003c/span\u003e                  \u003cspan class=\"hljs-number\"\u003e80%\u003c/span\u003e+ (소프트웨어)\nOperating \u003cspan class=\"hljs-attribute\"\u003eMargin\u003c/span\u003e               \u003cspan class=\"hljs-number\"\u003e29.8%\u003c/span\u003e                  \u003cspan class=\"hljs-number\"\u003e10%\u003c/span\u003e대 (흑자 전환)\n순이익                       +$\u003cspan class=\"hljs-number\"\u003e96.9\u003c/span\u003eB                   소규모 흑자\nFCF                          +$\u003cspan class=\"hljs-number\"\u003e100\u003c/span\u003eB                   +$\u003cspan class=\"hljs-number\"\u003e700\u003c/span\u003eM 수준\n부채                           높음 (현금으로 커버)     매우 낮음\n주주 환원                    자사주 매입 $\u003cspan class=\"hljs-number\"\u003e90\u003c/span\u003eB+         아직 없음\n────────────────────────────────────────────────────────────────────\n\n어떤 투자자에게?\nApple:    안정적 수익과 주주 환원을 원하는 보수적 투자자\nPalantir: AI/데이터 분야의 성장에 배팅하는 공격적 투자자\n────────────────────────────────────────────────────────────────────\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e7. 재무제표 함정 — 이런 기업 조심하라\u003c/h2\u003e\n\u003ch3\u003e🚨 레드 플래그 10가지\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-markdown\"\u003e\u003cspan class=\"hljs-bullet\"\u003e1.\u003c/span\u003e 순이익은 증가하는데 FCF는 감소\n   → 회계상 이익을 부풀릴 가능성 (수익 조기 인식 등)\n\n\u003cspan class=\"hljs-bullet\"\u003e2.\u003c/span\u003e 재고가 매출보다 빠르게 증가\n   → 물건이 안 팔리고 있는 신호\n\n\u003cspan class=\"hljs-bullet\"\u003e3.\u003c/span\u003e 매출채권이 매출보다 빠르게 증가\n   → 현금을 못 받고 있거나 공격적 회계 처리\n\n\u003cspan class=\"hljs-bullet\"\u003e4.\u003c/span\u003e 반복적인 \"일회성 비용\" 처리\n   → 매년 일회성 손실이 나오면 사실상 일상적 비용\n\n\u003cspan class=\"hljs-bullet\"\u003e5.\u003c/span\u003e 감사 의견에 \"계속기업 관련 중요한 불확실성\"\n   → 회사가 망할 수도 있다는 뜻\n\n\u003cspan class=\"hljs-bullet\"\u003e6.\u003c/span\u003e 임원의 지속적 주식 매도\n   → 내부자들이 미래를 부정적으로 본다는 신호\n\n\u003cspan class=\"hljs-bullet\"\u003e7.\u003c/span\u003e 부채가 급격히 증가하면서 FCF는 정체\n   → 빚으로 성장을 유지하는 구조\n\n\u003cspan class=\"hljs-bullet\"\u003e8.\u003c/span\u003e 여러 번의 CFO/CEO 교체\n   → 내부 문제가 있을 가능성\n\n\u003cspan class=\"hljs-bullet\"\u003e9.\u003c/span\u003e 감사법인 교체\n   → 이전 감사법인과 의견 충돌 가능성\n\n\u003cspan class=\"hljs-bullet\"\u003e10.\u003c/span\u003e 관련 당사자 거래가 많음 (Related Party Transactions)\n\u003cspan class=\"hljs-code\"\u003e    → 오너 일가와의 불투명한 거래 가능성\n\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e정리 — 재무제표 읽기 학습 로드맵\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-markdown\"\u003e재무제표 분석 역량 향상 단계\n────────────────────────────────────────────────────────\nStep 1: Yahoo Finance에서 관심 기업의 5년 매출/이익 추세 확인\n\u003cspan class=\"hljs-code\"\u003e        (30분 투자, 바로 시작 가능)\n\u003c/span\u003e\nStep 2: 해당 기업의 경쟁사 1-2개와 주요 지표 비교\n\u003cspan class=\"hljs-code\"\u003e        (누가 더 효율적인가?)\n\u003c/span\u003e\nStep 3: SEC EDGAR에서 10-K 개요 섹션 읽기\n\u003cspan class=\"hljs-code\"\u003e        (리스크 요인과 사업 모델 파악)\n\u003c/span\u003e\nStep 4: FCF 5년 추세 직접 계산해보기\n\u003cspan class=\"hljs-code\"\u003e        (영업현금흐름 - CAPEX)\n\u003c/span\u003e\nStep 5: 앞서 배운 밸류에이션 지표(5편)와 연결해서 분석\n\u003cspan class=\"hljs-code\"\u003e        (FCF 기반 DCF 계산)\n────────────────────────────────────────────────────────\n\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e다음 편에서는 이 재무 수치를 바탕으로 \u003cstrong\u003e주가가 비싼지 싼지 판단하는 가치평가 방법\u003c/strong\u003e을 다룬다.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L13\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-12\",\"children\":[[\"$\",\"$L14\",null,{\"href\":\"/private\",\"className\":\"text-sm text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition-colors mb-8 inline-block\",\"children\":\"← Private 목록으로\"}],[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 mb-3\",\"children\":[[\"$\",\"span\",null,{\"className\":\"text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400\",\"children\":\"stock\"}],[\"$\",\"span\",null,{\"className\":\"text-xs text-gray-400\",\"children\":\"2026-03-26\"}]]}],[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold text-gray-900 dark:text-gray-100\",\"children\":\"미국 주식 투자 입문 (4) — 재무제표 읽기: 이 기업이 건강한지 숫자로 확인하기\"}]]}],[\"$\",\"article\",null,{\"className\":\"prose prose-gray dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-red-600 dark:prose-a:text-red-400 prose-img:rounded-lg prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950\",\"dangerouslySetInnerHTML\":{\"__html\":\"$15\"}}]]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/2b423cf30d3964a3.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"미국 주식 투자 입문 (4) — 재무제표 읽기: 이 기업이 건강한지 숫자로 확인하기 | midasworld (Private)\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"서버 개발 학습 블로그\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3b
